# ============================================================
# Metrics Hub - CI/CD Pipeline
# ============================================================
# This workflow runs on every push and pull request to:
# - Build the project
# - Run tests
# - Build Docker image
# - Publish artifacts
# ============================================================

name: Metrics Hub CI

on:
  push:
    branches: [ main, dev, 'feat/**' ]
  pull_request:
    branches: [ main, dev ]

env:
  JAVA_VERSION: '17'
  MAVEN_OPTS: -Xmx1g

jobs:
  # ============================================================
  # Job 1: Build and Test
  # ============================================================
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build with Maven
        run: |
          cd hub
          mvn clean compile -B

      - name: Run tests
        run: |
          cd hub
          mvn test -B

      - name: Generate test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Maven Tests
          path: hub/target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: true

      - name: Package application
        run: |
          cd hub
          mvn package -DskipTests -B

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: metrics-hub-jar
          path: hub/target/*.jar
          retention-days: 7

  # ============================================================
  # Job 2: Code Quality
  # ============================================================
  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Run checkstyle
        run: |
          cd hub
          mvn checkstyle:check -B
        continue-on-error: true

      - name: Run SpotBugs
        run: |
          cd hub
          mvn spotbugs:check -B
        continue-on-error: true

  # ============================================================
  # Job 3: Docker Build
  # ============================================================
  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          cd hub
          docker build -t metrics-hub:${{ github.sha }} .
          docker tag metrics-hub:${{ github.sha }} metrics-hub:latest

      - name: Test Docker image
        run: |
          # Start container
          docker run -d --name metrics-hub-test \
            -p 8080:8080 -p 4317:4317 -p 4318:4318 \
            metrics-hub:${{ github.sha }}

          # Wait for service to start
          sleep 30

          # Check health endpoint
          curl -f http://localhost:8080/actuator/health || exit 1

          # Stop container
          docker stop metrics-hub-test
          docker rm metrics-hub-test

      - name: Save Docker image
        run: |
          docker save metrics-hub:${{ github.sha }} | gzip > metrics-hub-image.tar.gz

      - name: Upload Docker image
        uses: actions/upload-artifact@v3
        with:
          name: metrics-hub-docker-image
          path: metrics-hub-image.tar.gz
          retention-days: 7

  # ============================================================
  # Job 4: Integration Tests
  # ============================================================
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Run integration tests
        run: |
          cd hub
          mvn verify -P integration-tests -B

  # ============================================================
  # Job 5: Security Scan
  # ============================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'hub'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # ============================================================
  # Job 6: Publish (only on main branch)
  # ============================================================
  publish:
    name: Publish Artifacts
    runs-on: ubuntu-latest
    needs: [build, docker, integration-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v3
        with:
          name: metrics-hub-jar

      - name: Download Docker image
        uses: actions/download-artifact@v3
        with:
          name: metrics-hub-docker-image

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            *.jar
            metrics-hub-image.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # TODO: Add Docker registry push when configured
      # - name: Push to Docker Registry
      #   run: |
      #     docker load < metrics-hub-image.tar.gz
      #     docker tag metrics-hub:${{ github.sha }} registry.example.com/metrics-hub:latest
      #     docker push registry.example.com/metrics-hub:latest
