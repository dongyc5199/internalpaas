openapi: 3.0.3
info:
  title: Dev Debug Platform - Monitoring API
  description: |
    监控数据查询API，支持时间范围查询、字段过滤和智能数据源选择。

    **T4功能特性**:
    - 时间范围查询 (from, to, step)
    - 字段选择过滤 (fields)
    - 降采样支持 (step)
    - 批量查询所有服务器

  version: 1.0.0-T4
  contact:
    name: CMICT Internal PaaS Team

servers:
  - url: http://localhost:8080
    description: 本地开发环境
  - url: https://api.example.com
    description: 生产环境

tags:
  - name: Monitoring
    description: 监控数据查询API
  - name: Server Metrics
    description: 服务器指标查询

paths:
  /monitoring/server/{id}/metrics/query:
    get:
      tags:
        - Monitoring
      summary: 查询服务器监控数据（支持时间范围和字段过滤）
      description: |
        查询指定服务器的监控数据，支持：
        - 时间范围查询：通过 from 和 to 参数指定
        - 降采样：通过 step 参数控制数据点密度
        - 字段过滤：通过 fields 参数选择返回的指标字段

        **数据源路由策略**:
        - 最近5分钟数据：从内存/缓存读取（低延迟）
        - 历史数据：从数据库读取（完整历史）

      operationId: queryServerMetrics
      parameters:
        - name: id
          in: path
          description: 服务器ID
          required: true
          schema:
            type: integer
            format: int64
            example: 1

        - name: from
          in: query
          description: 开始时间（Unix毫秒时间戳）。默认为当前时间 - 1小时
          required: false
          schema:
            type: integer
            format: int64
            example: 1697529600000

        - name: to
          in: query
          description: 结束时间（Unix毫秒时间戳）。默认为当前时间
          required: false
          schema:
            type: integer
            format: int64
            example: 1697533200000

        - name: step
          in: query
          description: |
            降采样间隔（秒）。用于减少返回的数据点数量。
            - 不指定：返回所有原始数据点
            - 指定值：按指定间隔聚合数据（取平均值）
          required: false
          schema:
            type: integer
            minimum: 1
            example: 60

        - name: fields
          in: query
          description: |
            要返回的字段列表（逗号分隔）。
            可用字段: cpu, memory, disk, network, system
          required: false
          schema:
            type: string
            example: "cpu,memory,disk"

      responses:
        '200':
          description: 成功返回监控数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsQueryResponse'
              examples:
                fullData:
                  summary: 完整数据示例
                  value:
                    serverId: 1
                    from: 1697529600000
                    to: 1697533200000
                    step: null
                    fields: null
                    count: 120
                    data:
                      - id: 1001
                        serverId: 1
                        serverName: "dev-server-01"
                        hostname: "192.168.1.100"
                        cpuUsage: 45.2
                        memoryUsage: 62.8
                        diskUsage: 35.5
                        timestamp: "2023-10-17T10:00:00"

                filteredData:
                  summary: 字段过滤示例
                  value:
                    serverId: 1
                    from: null
                    to: null
                    step: null
                    fields: "cpu,memory"
                    count: 10
                    data:
                      - id: 1001
                        serverId: 1
                        serverName: "dev-server-01"
                        hostname: "192.168.1.100"
                        cpuUsage: 45.2
                        memoryUsage: 62.8
                        timestamp: "2023-10-17T10:00:00"

        '404':
          description: 服务器不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "服务器不存在"
                serverId: "999"

        '500':
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /monitoring/servers/metrics/query:
    get:
      tags:
        - Monitoring
      summary: 批量查询所有服务器的监控数据
      description: |
        一次性查询所有活跃服务器的最新监控数据。
        支持字段过滤以减少响应大小。

      operationId: queryAllServersMetrics
      parameters:
        - name: fields
          in: query
          description: |
            要返回的字段列表（逗号分隔）。
            可用字段: cpu, memory, disk, network, system
          required: false
          schema:
            type: string
            example: "cpu,memory"

      responses:
        '200':
          description: 成功返回所有服务器监控数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllServersMetricsResponse'
              example:
                count: 3
                fields: "cpu,memory"
                servers:
                  - serverId: 1
                    serverName: "dev-server-01"
                    hostname: "192.168.1.100"
                    metrics:
                      cpuUsage: 45.2
                      memoryUsage: 62.8
                  - serverId: 2
                    serverName: "dev-server-02"
                    hostname: "192.168.1.101"
                    metrics:
                      cpuUsage: 38.5
                      memoryUsage: 55.3

        '500':
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /monitoring/server/{id}/metrics:
    get:
      tags:
        - Monitoring
      summary: 获取服务器最新监控数据（兼容旧版本）
      description: |
        返回服务器的最新监控数据。此端点保持向后兼容。
        推荐使用 `/monitoring/server/{id}/metrics/query` 以获得更多功能。

      operationId: getServerMetrics
      parameters:
        - name: id
          in: path
          description: 服务器ID
          required: true
          schema:
            type: integer
            format: int64

      responses:
        '200':
          description: 成功返回最新监控数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerMetrics'

        '404':
          description: 服务器不存在或无监控数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /monitoring/servers/metrics:
    get:
      tags:
        - Monitoring
      summary: 获取所有服务器最新监控数据（兼容旧版本）
      description: |
        返回所有活跃服务器的最新监控数据。此端点保持向后兼容。
        推荐使用 `/monitoring/servers/metrics/query` 以获得更多功能。

      operationId: getAllServersMetrics
      responses:
        '200':
          description: 成功返回所有服务器监控数据
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/ServerMetrics'
              example:
                "dev-server-01":
                  id: 1001
                  serverId: 1
                  serverName: "dev-server-01"
                  cpuUsage: 45.2
                  memoryUsage: 62.8
                "dev-server-02":
                  id: 1002
                  serverId: 2
                  serverName: "dev-server-02"
                  cpuUsage: 38.5
                  memoryUsage: 55.3

components:
  schemas:
    ServerMetrics:
      type: object
      description: 服务器监控指标完整数据
      properties:
        id:
          type: integer
          format: int64
          description: 记录ID
        serverId:
          type: integer
          format: int64
          description: 服务器ID
        serverName:
          type: string
          description: 服务器名称
        hostname:
          type: string
          description: 主机名/IP地址
        timestamp:
          type: string
          format: date-time
          description: 采集时间戳

        # CPU指标
        cpuUsage:
          type: number
          format: double
          description: CPU使用率 (%)
          minimum: 0
          maximum: 100
        cpuCores:
          type: integer
          description: CPU核心数
        loadAverage:
          type: string
          description: 系统负载平均值

        # 内存指标
        memoryTotal:
          type: integer
          format: int64
          description: 总内存 (bytes)
        memoryUsed:
          type: integer
          format: int64
          description: 已用内存 (bytes)
        memoryAvailable:
          type: integer
          format: int64
          description: 可用内存 (bytes)
        memoryUsage:
          type: number
          format: double
          description: 内存使用率 (%)
          minimum: 0
          maximum: 100

        # 磁盘指标
        diskTotal:
          type: integer
          format: int64
          description: 总磁盘空间 (bytes)
        diskUsed:
          type: integer
          format: int64
          description: 已用磁盘空间 (bytes)
        diskAvailable:
          type: integer
          format: int64
          description: 可用磁盘空间 (bytes)
        diskUsage:
          type: number
          format: double
          description: 磁盘使用率 (%)
          minimum: 0
          maximum: 100

        # 网络指标
        networkInterface:
          type: string
          description: 网络接口名称
        networkReceivedBytes:
          type: integer
          format: int64
          description: 接收字节数
        networkTransmittedBytes:
          type: integer
          format: int64
          description: 发送字节数
        networkReceivedRate:
          type: number
          format: double
          description: 接收速率 (bytes/s)
        networkTransmittedRate:
          type: number
          format: double
          description: 发送速率 (bytes/s)

        # 系统信息
        uptime:
          type: string
          description: 系统运行时间
        osVersion:
          type: string
          description: 操作系统版本
        kernelVersion:
          type: string
          description: 内核版本

        collectionDurationMs:
          type: integer
          format: int64
          description: 数据采集耗时 (毫秒)

    MetricsQueryResponse:
      type: object
      description: 监控数据查询响应
      properties:
        serverId:
          type: integer
          format: int64
          description: 服务器ID
        from:
          type: integer
          format: int64
          nullable: true
          description: 查询开始时间（Unix毫秒时间戳）
        to:
          type: integer
          format: int64
          nullable: true
          description: 查询结束时间（Unix毫秒时间戳）
        step:
          type: integer
          nullable: true
          description: 降采样间隔（秒）
        fields:
          type: string
          nullable: true
          description: 查询的字段列表
        count:
          type: integer
          description: 返回的数据点数量
        data:
          type: array
          description: 监控数据列表
          items:
            $ref: '#/components/schemas/ServerMetrics'

    AllServersMetricsResponse:
      type: object
      description: 所有服务器监控数据响应
      properties:
        count:
          type: integer
          description: 服务器数量
        fields:
          type: string
          nullable: true
          description: 查询的字段列表
        servers:
          type: array
          description: 服务器监控数据列表
          items:
            type: object
            properties:
              serverId:
                type: integer
                format: int64
              serverName:
                type: string
              hostname:
                type: string
              metrics:
                $ref: '#/components/schemas/ServerMetrics'

    ErrorResponse:
      type: object
      description: 错误响应
      properties:
        error:
          type: string
          description: 错误消息
        serverId:
          type: string
          nullable: true
          description: 相关服务器ID（如适用）
