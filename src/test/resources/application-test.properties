# ========================================
# Test Environment Configuration
# Phase 4 - Step 4: Hub Migration Test Settings
# ========================================

# H2 In-Memory Database for Testing
# 用途: 支持非监控实体 (User, Server, Application, AgentDeployment)
# 注意: 仅用于测试环境,生产使用 PostgreSQL
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Metrics Hub 配置 (测试环境禁用)
metrics.hub.enabled=false
metrics.hub.base-url=http://localhost:8081

# SSH监控配置 (测试环境禁用)
monitoring.ssh.scheduler.enabled=false

# 日志配置 (测试环境)
logging.level.root=WARN
logging.level.com.cmict.internalpaas=INFO

# Agent 自动部署配置 (测试环境禁用)
agent.auto-deploy.enabled=false

# SSH密码加密配置
app.security.master-key=dongyc@1986
app.security.password-encryption.enabled=true
