# ==================================================
# Metrics Hub 集成配置示例 (Hub启用模式)
# ==================================================
# 使用方式: java -jar app.jar --spring.profiles.active=hub
#
# 此配置用于启用 Metrics Hub 集成，数据源优先级：
#   1. Metrics Hub (准实时，10-15秒延迟)
#   2. SSH监控 (降级，1-5分钟延迟)
# ==================================================

# 启用 Metrics Hub 集成
metrics.hub.enabled=true

# Metrics Hub 服务地址（根据实际部署环境修改）
metrics.hub.base-url=http://localhost:8081

# HTTP 连接超时配置（毫秒）
metrics.hub.timeout.connect-ms=5000
metrics.hub.timeout.read-ms=10000

# 降级策略配置
metrics.hub.fallback.enabled=true
metrics.hub.fallback.method=ssh

# 健康检查配置
# 健康检查结果缓存1分钟，避免频繁检查影响性能
metrics.hub.health-check.interval-ms=60000

# 重试策略配置
metrics.hub.retry.max-attempts=3
metrics.hub.retry.backoff-ms=1000

# 监控数据查询超时（如果Hub响应慢，可适当增加）
spring.mvc.async.request-timeout=120000

# 日志配置 - Hub集成相关日志
logging.level.com.cmict.internalpaas.client.MetricsHubClient=DEBUG
logging.level.com.cmict.internalpaas.controller.MonitoringController=INFO
