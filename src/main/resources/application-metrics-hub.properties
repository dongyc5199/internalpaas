# ========================================================
# Metrics Hub 集成配置 (示例)
# ========================================================
#
# 使用方法:
# 1. 将以下配置复制到 application.properties
# 2. 根据实际情况修改配置值
# 3. 重启应用生效
#
# 注意: 默认禁用，不影响现有SSH监控功能
#
# ========================================================

# ==================== Metrics Hub 基础配置 ====================

# 功能总开关 (默认: false)
# - false: 完全使用 SSH 轮询模式 (和现在一样)
# - true:  优先使用 Metrics Hub，失败时降级到 SSH
metrics.hub.enabled=false

# Metrics Hub 服务地址 (独立部署的 Hub 服务)
# 开发环境: http://localhost:8081
# 生产环境: http://metrics-hub.example.com
metrics.hub.base-url=http://localhost:8081

# 降级开关 (默认: true)
# - true:  Hub 故障时自动降级到 SSH
# - false: Hub 故障时直接返回错误 (不建议)
metrics.hub.fallback-to-ssh=true

# ==================== 超时配置 ====================

# 连接超时 (毫秒，默认: 5000)
metrics.hub.timeout.connect-ms=5000

# 读取超时 (毫秒，默认: 10000)
metrics.hub.timeout.read-ms=10000

# ==================== Agent 自动部署配置 (可选,Phase 2) ====================

# Agent 自动部署开关 (默认: false)
# - true: 添加服务器时自动部署 OpenTelemetry Collector
# - false: 手动部署
metrics.agent.auto-deploy=false

# OTLP 数据接收端点
# 格式: http://<metrics-hub-host>:4318/v1/metrics
metrics.agent.otlp-endpoint=http://localhost:4318/v1/metrics

# Agent 配置模板路径
metrics.agent.bootstrap-script=classpath:agent/bootstrap.sh
metrics.agent.otelcol-config=classpath:agent/otelcol.yaml.tmpl

# ==================== 高级配置 (可选) ====================

# 重试策略
metrics.hub.retry.enabled=true
metrics.hub.retry.max-attempts=3
metrics.hub.retry.backoff-ms=1000

# 熔断器配置
metrics.hub.circuit-breaker.enabled=true
metrics.hub.circuit-breaker.failure-rate-threshold=50
metrics.hub.circuit-breaker.wait-duration-ms=60000

# ==================== 日志配置 ====================

# Metrics Hub Client 日志级别
# DEBUG: 详细日志（开发环境）
# INFO:  基础日志（生产环境）
logging.level.com.cmict.internalpaas.client.MetricsHubClient=INFO

# ========================================================
# 配置说明结束
# ========================================================
