spring.application.name=internalpaas
server.port=9090

# H2 Database
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# HikariCP连接池优化
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# JPA性能优化
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.jdbc.fetch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false

# 关闭JPA open-in-view以提高性能
spring.jpa.open-in-view=false

# Application Configuration
# 应用端口范围
app.port.range.start=8000
app.port.range.end=9000

# 调试端口范围
app.debug.port.range.start=5000
app.debug.port.range.end=5999

# 文件上传配置
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# 日志配置 - 仅输出ERROR和DEBUG级别的日志信息
logging.level.com.cmict.internalpaas.service.SshConnectionService=ERROR
logging.level.com.cmict.internalpaas.service.RemoteCommandService=ERROR
logging.level.com.cmict.internalpaas=ERROR
logging.level.root=ERROR

# N+1查询优化验证日志配置 - 生产环境关闭详细日志
logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=ERROR
logging.level.com.cmict.internalpaas.test.N1QueryOptimizationTest=ERROR

# Web请求超时配置 (解决refresh接口超时)
spring.mvc.async.request-timeout=120000
server.connection-timeout=120000
spring.transaction.default-timeout=120

# SSH密码加密配置
app.security.master-key=dongyc@1986
app.security.password-encryption.enabled=true

# ========================================
# Metrics Hub 集成配置 (T4 API集成)
# ========================================
# 启用/禁用 Metrics Hub 集成
metrics.hub.enabled=true

# Metrics Hub 服务地址
metrics.hub.base-url=http://localhost:8081

# HTTP 连接超时配置
metrics.hub.timeout.connect-ms=5000
metrics.hub.timeout.read-ms=10000

# ========================================
# SSH监控调度器配置 (Phase4-Step2: 已停用)
# ========================================
# SSH监控定时任务开关 (2025-10-17已停用,使用Hub+OTLP替代)
# 如需临时恢复SSH监控,请:
# 1. 设置 monitoring.ssh.scheduler.enabled=true
# 2. 取消 MonitoringSchedulerService 中的 @Scheduled 注释
# 3. 重启应用
monitoring.ssh.scheduler.enabled=false

# 降级策略配置
# 当Hub不可用时，自动降级到SSH监控
metrics.hub.fallback.enabled=true
metrics.hub.fallback.method=ssh

# 健康检查配置
# 健康检查缓存时间（毫秒），避免频繁检查
metrics.hub.health-check.interval-ms=60000

# 重试策略配置
metrics.hub.retry.max-attempts=3
metrics.hub.retry.backoff-ms=1000

# 会话超时配置 (30分钟)
server.servlet.session.timeout=30m
server.servlet.session.cookie.max-age=1800
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false

# 开发环境模板缓存配置 - 禁用缓存以便实时看到更改
spring.thymeleaf.cache=false
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false

# ========================================
# Agent 自动部署配置 (阶段2)
# ========================================
# 启用/禁用Agent自动部署
agent.auto-deploy.enabled=true

# Agent版本
agent.version=0.91.0

# Agent二进制文件路径（相对于classpath，暂未实现文件上传）
agent.binary.path=agent/otelcol-linux-amd64.tar.gz

# 配置模板路径
agent.config.template=agent/otelcol.yaml.tmpl

# Bootstrap脚本路径
agent.bootstrap.script=agent/bootstrap.sh

# Hub OTLP端点（Agent数据上报地址）
agent.otlp.endpoint=http://localhost:4317

# Agent配置渲染参数
agent.config.tls-insecure=true
agent.config.log-level=info
agent.config.log-output-path=/opt/metrics-agent/logs/otelcol.log
agent.config.deployment-environment=development

# 部署超时（分钟）
agent.deploy.timeout-minutes=10

# 重试策略（暂未实现）
agent.deploy.retry.max-attempts=3
agent.deploy.retry.delay-minutes=1,5,15

# 健康检查配置
agent.health-check.timeout-seconds=30
agent.health-check.interval-seconds=5

# 预检配置
agent.pre-check.min-disk-mb=100
agent.pre-check.required-ports=4317,4318
