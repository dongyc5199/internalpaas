spring.application.name=internalpaas
server.port=9090
spring.config.import=optional:file:.env[.properties]

# ========================================
# H2 Database Configuration (开发/测试环境 - 默认内存模式)
# ========================================
# 用途: 存储非监控实体 (User, Server, Application, AgentDeployment等)
# 注意: 监控数据存储已迁移到 Metrics Hub (PostgreSQL/TimescaleDB)
# 迁移日期: 2025-10-17
# 
# 数据库模式选择 (符合轻量级定位):
# ┌────────────────┬──────────────┬─────────────┬──────────────┐
# │ 模式           │ Profile      │ 数据持久化  │ 适用场景     │
# ├────────────────┼──────────────┼─────────────┼──────────────┤
# │ H2内存模式     │ 默认(无)     │ ❌ 重启丢失 │ 开发/Demo    │
# │ H2文件模式     │ persistent   │ ✅ 文件存储 │ 小团队生产   │
# │ PostgreSQL     │ enterprise   │ ✅ 数据库   │ 大型团队     │
# └────────────────┴──────────────┴─────────────┴──────────────┘
#
# 模式1 (默认): H2内存模式 - 开发/Demo
#   优点: 零配置,快速启动,自动清理
#   缺点: 重启后数据丢失
#   启动: ./mvnw.cmd spring-boot:run
#
# 模式2 (推荐): H2文件持久化 - 小团队生产
#   优点: 数据持久化,零外部依赖,轻量级
#   缺点: 单机部署,数据量限制(<10GB)
#   启动: ./mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=persistent
#   配置: application-persistent.properties
#
# 模式3 (可选): PostgreSQL - 大型团队/企业
#   优点: 大数据量,高可用,企业特性
#   缺点: 需要外部数据库,部署复杂
#   启动: 需配置环境变量,见 application-enterprise.properties
#   配置: application-enterprise.properties
#
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# HikariCP连接池优化
# 注意: 由于H2已移除,这些配置仅在使用其他数据库时生效
# 当前主应用不再需要数据库存储监控数据
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# JPA性能优化
# 注意: 监控数据已迁移到Hub,本地H2数据库用于存储业务实体(Server, User, ServerGroup等17个表)
# ServerMetrics已转换为DTO,不再作为JPA实体持久化
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.jdbc.fetch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false

# 关闭JPA open-in-view以提高性能
spring.jpa.open-in-view=false

# Application Configuration
# 应用端口范围
app.port.range.start=8000
app.port.range.end=9000

# 调试端口范围
app.debug.port.range.start=5000
app.debug.port.range.end=5999

# 文件上传配置
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# SSH配置导入设置
# SSH配置文件大小限制（1MB，在Controller层验证）
app.ssh-config-import.max-file-size=1048576
# SSH配置文件允许的MIME类型
app.ssh-config-import.allowed-content-types=text/plain,application/octet-stream
# 最小有效Host数量
app.ssh-config-import.min-valid-hosts=1
# 启用路径安全验证（防止路径遍历攻击）- 生产环境必须启用
app.ssh-config-import.path-security-enabled=true

# 日志配置 - 仅输出ERROR和DEBUG级别的日志信息
logging.level.com.cmict.internalpaas.service.SshConnectionService=ERROR
logging.level.com.cmict.internalpaas.service.RemoteCommandService=ERROR
logging.level.com.cmict.internalpaas=ERROR
logging.level.root=ERROR

# N+1查询优化验证日志配置 - 生产环境关闭详细日志
logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=ERROR
logging.level.com.cmict.internalpaas.test.N1QueryOptimizationTest=ERROR

# Web请求超时配置 (解决refresh接口超时)
spring.mvc.async.request-timeout=120000
server.connection-timeout=120000
spring.transaction.default-timeout=120

# SSH密码加密配置
app.security.master-key=dongyc@1986
app.security.password-encryption.enabled=true

# ========================================
# Metrics Hub 集成配置 (T4 API集成)
# ========================================
# 启用/禁用 Metrics Hub 集成
metrics.hub.enabled=true

# Metrics Hub 服务地址
metrics.hub.base-url=http://localhost:8081

# HTTP 连接超时配置
metrics.hub.timeout.connect-ms=5000
metrics.hub.timeout.read-ms=10000

# ========================================
# SSH监控调度器配置 (Phase4-Step2: 已停用)
# ========================================
# SSH监控定时任务开关 (2025-10-17已停用,使用Hub+OTLP替代)
# 如需临时恢复SSH监控,请:
# 1. 设置 monitoring.ssh.scheduler.enabled=true
# 2. 取消 MonitoringSchedulerService 中的 @Scheduled 注释
# 3. 重启应用
monitoring.ssh.scheduler.enabled=false

# 降级策略配置
# 当Hub不可用时，自动降级到SSH监控
metrics.hub.fallback.enabled=true
metrics.hub.fallback.method=ssh

# 健康检查配置
# 健康检查缓存时间（毫秒），避免频繁检查
metrics.hub.health-check.interval-ms=60000

# 重试策略配置
metrics.hub.retry.max-attempts=3
metrics.hub.retry.backoff-ms=1000

# 会话超时配置 (30分钟)
server.servlet.session.timeout=30m
server.servlet.session.cookie.max-age=1800
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false

# 开发环境模板缓存配置 - 禁用缓存以便实时看到更改
spring.thymeleaf.cache=false
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false

# ========================================
# Agent 自动部署配置 (阶段2)
# ========================================
# 启用/禁用Agent自动部署
agent.auto-deploy.enabled=true

# Agent版本
agent.version=0.91.0

# Agent二进制文件路径（相对于classpath，暂未实现文件上传）
agent.binary.path=agent/otelcol-linux-amd64.tar.gz

# 配置模板路径
agent.config.template=agent/otelcol.yaml.tmpl

# Bootstrap脚本路径
agent.bootstrap.script=agent/bootstrap.sh

# Hub OTLP端点（Agent数据上报地址）
agent.otlp.endpoint=http://localhost:4317

# Agent配置渲染参数
agent.config.tls-insecure=true
agent.config.log-level=info
agent.config.log-output-path=/opt/metrics-agent/logs/otelcol.log
agent.config.deployment-environment=development

# 部署超时（分钟）
agent.deploy.timeout-minutes=10

# 重试策略（暂未实现）
agent.deploy.retry.max-attempts=3
agent.deploy.retry.delay-minutes=1,5,15

# 健康检查配置
agent.health-check.timeout-seconds=30
agent.health-check.interval-seconds=5

# 预检配置
agent.pre-check.min-disk-mb=100
agent.pre-check.required-ports=4317,4318

# ========================================
# WaveTerm AI 聊天配置（Demo）
# 默认使用 echo 客户端，可通过配置切换 Moonshot / Ollama 等模型
chat.default-client=echo
chat.request-timeout=PT30S
chat.max-retries=1
chat.cache-ttl=PT30S

# Moonshot / Kimi 模型配置（通过环境变量注入密钥）
moonshot.base-url=${MOONSHOT_BASE_URL:https://api.moonshot.cn/v1}
moonshot.model=${MOONSHOT_MODEL:kimi-k2-0905-preview}
moonshot.api-key=${MOONSHOT_API_KEY:}

# 本地 Ollama 配置（默认启用，可通过环境变量覆盖）
ollama.enabled=${OLLAMA_ENABLED:true}
ollama.host=${OLLAMA_HOST:http://127.0.0.1}
ollama.port=${OLLAMA_PORT:11434}
ollama.model=${OLLAMA_MODEL:gpt-oss:20b}
ollama.connect-timeout=${OLLAMA_CONNECT_TIMEOUT:PT5S}
ollama.read-timeout=${OLLAMA_READ_TIMEOUT:PT5M}
