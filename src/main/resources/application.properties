spring.application.name=internalpaas

# H2 Database
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.datasource.url=jdbc:h2:file:./data/devplatformdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# JPA
# 开发时使用update，会自动根据实体类更新表结构
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Application Configuration
# 应用端口范围
app.port.range.start=8000
app.port.range.end=9000

# 调试端口范围
app.debug.port.range.start=5000
app.debug.port.range.end=5999

# 文件上传配置
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# 日志配置
logging.level.com.cmict.internalpaas.service.SshConnectionService=INFO
logging.level.com.cmict.internalpaas.service.RemoteCommandService=INFO
logging.level.root=INFO
