spring.application.name=internalpaas
server.port=9090

# H2 Database
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# HikariCP连接池优化
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# JPA性能优化
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.jdbc.fetch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false

# 关闭JPA open-in-view以提高性能
spring.jpa.open-in-view=false

# Application Configuration
# 应用端口范围
app.port.range.start=8000
app.port.range.end=9000

# 调试端口范围
app.debug.port.range.start=5000
app.debug.port.range.end=5999

# 文件上传配置
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# 日志配置 - 仅输出ERROR和DEBUG级别的日志信息
logging.level.com.cmict.internalpaas.service.SshConnectionService=ERROR
logging.level.com.cmict.internalpaas.service.RemoteCommandService=ERROR
logging.level.com.cmict.internalpaas=ERROR
logging.level.root=ERROR

# N+1查询优化验证日志配置 - 生产环境关闭详细日志
logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=ERROR
logging.level.com.cmict.internalpaas.test.N1QueryOptimizationTest=ERROR

# Web请求超时配置 (解决refresh接口超时)
spring.mvc.async.request-timeout=120000
server.connection-timeout=120000
spring.transaction.default-timeout=120

# SSH密码加密配置
app.security.master-key=dongyc@1986
app.security.password-encryption.enabled=true

# 会话超时配置 (30分钟)
server.servlet.session.timeout=30m
server.servlet.session.cookie.max-age=1800
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false

# 开发环境模板缓存配置 - 禁用缓存以便实时看到更改
spring.thymeleaf.cache=false
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false
