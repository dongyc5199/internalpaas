spring.application.name=internalpaas

# H2 Database
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.datasource.url=jdbc:h2:file:./data/devplatformdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# HikariCP连接池优化
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# JPA性能优化
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.jdbc.fetch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false

# 关闭JPA open-in-view以提高性能
spring.jpa.open-in-view=false

# Application Configuration
# 应用端口范围
app.port.range.start=8000
app.port.range.end=9000

# 调试端口范围
app.debug.port.range.start=5000
app.debug.port.range.end=5999

# 文件上传配置
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# 日志配置
logging.level.com.cmict.internalpaas.service.SshConnectionService=INFO
logging.level.com.cmict.internalpaas.service.RemoteCommandService=INFO
logging.level.root=INFO

# Web请求超时配置 (解决refresh接口超时)
spring.mvc.async.request-timeout=120000
server.connection-timeout=120000
spring.transaction.default-timeout=120
