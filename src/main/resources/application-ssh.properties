# ==================================================
# SSH监控配置示例 (仅SSH模式)
# ==================================================
# 使用方式: java -jar app.jar --spring.profiles.active=ssh
#
# 此配置用于禁用 Metrics Hub 集成，仅使用传统SSH监控：
#   - SSH轮询监控 (1-5分钟延迟)
#   - 适用于未部署Hub服务的环境
# ==================================================

# 禁用 Metrics Hub 集成
metrics.hub.enabled=false

# SSH监控相关日志
logging.level.com.cmict.internalpaas.service.SshConnectionService=INFO
logging.level.com.cmict.internalpaas.service.RemoteCommandService=INFO
logging.level.com.cmict.internalpaas.controller.MonitoringController=INFO

# SSH连接池优化（SSH监控模式下可能需要更多连接）
# 如果服务器数量较多，可适当增加这些值
# app.ssh.pool.max-connections=50
# app.ssh.pool.max-wait-time=30000
