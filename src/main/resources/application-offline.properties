# 离线部署配置
# 用于内网环境部署

# 强制启用离线模式
app.offline.enabled=true

# CDN不可用
app.offline.cdn-available=false

# 本地vendor资源路径
app.offline.vendor-path=/static/vendor/

# CDN测试URL
app.offline.cdn-test-url=https://cdn.jsdelivr.net/

# 连接测试超时时间（毫秒）
app.offline.connection-timeout=3000

# Web服务器配置
server.port=8080

# 数据库配置（与主配置保持一致）
spring.datasource.url=jdbc:h2:file:./data/devplatformdb
spring.datasource.username=sa
spring.datasource.password=password
spring.h2.console.enabled=true

# JPA配置
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# 日志配置
logging.level.com.cmict.internalpaas.service.OfflineDeploymentService=INFO
logging.level.com.cmict.internalpaas.config.OfflineDeploymentConfig=INFO

# 静态资源缓存配置（内网环境可以设置长期缓存）
spring.web.resources.cache.cachecontrol.max-age=30d
spring.web.resources.cache.cachecontrol.cache-public=true

# 压缩配置
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=2048