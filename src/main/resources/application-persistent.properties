# ========================================
# H2持久化模式配置 (推荐用于小团队生产环境)
# ========================================
# 使用场景: 
# - 小团队生产环境(5-20人)
# - 需要数据持久化保存
# - 单机部署,无需高可用
# - 数据量 < 10GB
#
# 启用方式:
# 方式1: 启动参数
#   ./mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=persistent
# 
# 方式2: 环境变量
#   set SPRING_PROFILES_ACTIVE=persistent
#   ./mvnw.cmd spring-boot:run
#
# 方式3: JAR启动
#   java -jar -Dspring.profiles.active=persistent target/internalpaas.jar
#

# 轻量级原则保持:
# ✅ 零外部依赖 (H2内嵌)
# ✅ 快速启动 (< 5秒)
# ✅ 低资源占用 (~200MB内存)
# ✅ 一条命令启动

# H2数据库文件存储路径
# 默认: ./data/internalpaas (相对于应用工作目录)
spring.datasource.url=jdbc:h2:file:./data/internalpaas;AUTO_SERVER=TRUE

# AUTO_SERVER=TRUE 说明:
# - 允许多个进程同时访问同一数据库文件
# - 第一个连接作为服务器,后续连接作为客户端
# - 适合开发/测试场景,生产环境建议单实例

# H2 Console配置
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# 数据库驱动
spring.datasource.driverClassName=org.h2.Driver

# 数据库用户名密码 (生产环境请修改!)
spring.datasource.username=sa
spring.datasource.password=change_me_in_production

# 连接池配置 (持久化模式可适当增加连接数)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# JPA配置 (持久化模式使用update策略)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# 数据库文件位置说明:
# - 数据库文件: ./data/internalpaas.mv.db
# - 追踪文件: ./data/internalpaas.trace.db (仅在错误时生成)
# 
# 备份建议:
# - 定期备份 ./data 目录
# - 使用 tar -czf backup.tar.gz data/
# - 或使用H2的在线备份功能

# 数据持久化优势:
# ✅ 重启后数据保留
# ✅ 支持数据备份恢复
# ✅ 适合小团队生产使用
# ✅ 保持轻量级特性

# 性能调优建议:
# - 定期执行 ANALYZE 优化查询计划
# - 数据量 > 5GB 时考虑迁移到PostgreSQL
# - 避免长事务锁定数据库文件
