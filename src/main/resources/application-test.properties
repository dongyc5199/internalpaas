# 测试环境配置
# 继承主配置文件的所有设置

# 启用密码加密测试
app.test.password-encryption.enabled=true

# 启用SSH安全测试  
app.test.ssh-security.enabled=true

# 测试环境使用的主密钥（生产环境应使用不同的密钥）
app.security.master-key=TEST_MASTER_KEY_FOR_DEVELOPMENT_ONLY_2024

# 测试日志级别
logging.level.com.cmict.internalpaas.test=INFO
logging.level.com.cmict.internalpaas.service.PasswordEncryptionService=DEBUG
logging.level.com.cmict.internalpaas.service.PasswordMigrationService=DEBUG
logging.level.com.cmict.internalpaas.service.SshConnectionService=DEBUG

# 测试数据库配置（使用内存数据库避免影响开发数据）
spring.datasource.url=jdbc:h2:mem:testdb_security
spring.jpa.hibernate.ddl-auto=create-drop