<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stats Card 现代化设计 - Demo展示</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .demo-container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .demo-header {
            text-align: center;
            margin-bottom: 60px;
            color: white;
        }

        .demo-title {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #ffffff, #e0e7ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .demo-subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
            margin-bottom: 32px;
        }

        .demo-badges {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .badge {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            color: white;
            font-size: 0.9rem;
            font-weight: 500;
            backdrop-filter: blur(10px);
        }

        /* 管理员增强样式命名空间 */
        .admin-enhanced {
            --card-bg: rgba(255, 255, 255, 0.95);
            --primary-gradient: linear-gradient(135deg, #2F9BFF, #3BC6B8);
            --accent-color: #2F9BFF;
            --secondary-color: #3BC6B8;
            --success-color: #10B981;
            --warning-color: #F59E0B;
            --error-color: #EF4444;
            --text-primary: #0F172A;
            --text-secondary: #64748B;
            --border-color: rgba(226, 232, 240, 0.8);
        }

        .stats-overview {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 32px;
            margin-bottom: 60px;
        }

        /* 新卡片设计系统 */
        .admin-enhanced .stats-card {
            background: linear-gradient(135deg, var(--card-bg) 0%, rgba(255,255,255,0.98) 100%);
            border-radius: 20px !important;
            padding: 28px !important;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow:
                0 8px 32px rgba(15, 23, 42, 0.08),
                0 2px 8px rgba(15, 23, 42, 0.04),
                inset 0 1px 0 rgba(255, 255, 255, 0.9);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        /* 卡片悬停效果 */
        .admin-enhanced .stats-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow:
                0 20px 40px rgba(15, 23, 42, 0.15),
                0 8px 16px rgba(15, 23, 42, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 1);
            border-color: rgba(255, 255, 255, 0.4);
        }

        /* 卡片装饰渐变背景 */
        .admin-enhanced .stats-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--primary-gradient);
            opacity: 0.8;
            transition: all 0.3s ease;
        }

        .admin-enhanced .stats-card:hover::before {
            height: 6px;
            opacity: 1;
            box-shadow: 0 2px 8px rgba(47, 155, 255, 0.3);
        }

        /* 卡片光泽效果 */
        .admin-enhanced .stats-card::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent 40%, rgba(255, 255, 255, 0.1) 50%, transparent 60%);
            opacity: 0;
            transition: all 0.6s ease;
            pointer-events: none;
        }

        .admin-enhanced .stats-card:hover::after {
            opacity: 1;
            transform: rotate(45deg);
        }

        .admin-enhanced .stats-card .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            position: relative;
            z-index: 2;
        }

        .admin-enhanced .stats-card .card-icon {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--accent-color), var(--secondary-color));
            color: white;
            font-size: 24px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .admin-enhanced .stats-card .card-icon::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, transparent 50%);
            opacity: 0;
            transition: all 0.3s ease;
        }

        .admin-enhanced .stats-card:hover .card-icon::before {
            opacity: 1;
        }

        .admin-enhanced .stats-card .card-icon i {
            position: relative;
            z-index: 1;
            transition: all 0.3s ease;
        }

        .admin-enhanced .stats-card .card-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-secondary);
            margin: 0;
            letter-spacing: -0.025em;
        }

        .admin-enhanced .stats-card .main-stat {
            margin: 16px 0 20px 0;
            position: relative;
            z-index: 2;
        }

        .admin-enhanced .stats-card .stat-number {
            font-size: 36px;
            font-weight: 800;
            color: var(--text-primary);
            line-height: 1;
            margin-bottom: 4px;
            background: linear-gradient(135deg, var(--text-primary), var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .admin-enhanced .stats-card .stat-label {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .admin-enhanced .stats-card .sub-stats {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            position: relative;
            z-index: 2;
        }

        .admin-enhanced .stats-card .sub-stat {
            flex: 1;
            min-width: 80px;
            padding: 12px 16px;
            background: rgba(248, 250, 252, 0.8);
            border-radius: 12px;
            border: 1px solid rgba(226, 232, 240, 0.5);
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .admin-enhanced .stats-card .sub-stat:hover {
            background: rgba(240, 245, 255, 0.9);
            border-color: var(--accent-color);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(47, 155, 255, 0.15);
        }

        .admin-enhanced .stats-card .sub-stat .indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-bottom: 8px;
            position: relative;
        }

        .admin-enhanced .stats-card .sub-stat .indicator::before {
            content: '';
            position: absolute;
            top: -4px;
            left: -4px;
            right: -4px;
            bottom: -4px;
            border-radius: 50%;
            opacity: 0.3;
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(1.2); opacity: 0.1; }
        }

        .admin-enhanced .stats-card .sub-stat.online .indicator {
            background: var(--success-color);
        }

        .admin-enhanced .stats-card .sub-stat.online .indicator::before {
            background: var(--success-color);
        }

        .admin-enhanced .stats-card .sub-stat.warning .indicator {
            background: var(--warning-color);
        }

        .admin-enhanced .stats-card .sub-stat.warning .indicator::before {
            background: var(--warning-color);
        }

        .admin-enhanced .stats-card .sub-stat.offline .indicator,
        .admin-enhanced .stats-card .sub-stat.critical .indicator {
            background: var(--error-color);
        }

        .admin-enhanced .stats-card .sub-stat.offline .indicator::before,
        .admin-enhanced .stats-card .sub-stat.critical .indicator::before {
            background: var(--error-color);
        }

        .admin-enhanced .stats-card .sub-stat .value {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1;
        }

        .admin-enhanced .stats-card .sub-stat .label {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 500;
            margin-top: 4px;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .stats-overview {
                grid-template-columns: 1fr;
                gap: 24px;
            }

            .admin-enhanced .stats-card {
                padding: 20px !important;
            }

            .admin-enhanced .stats-card .stat-number {
                font-size: 28px;
            }

            .demo-title {
                font-size: 2.5rem;
            }
        }

        /* 加载动画 */
        .admin-enhanced .stats-card.loading {
            pointer-events: none;
        }

        .admin-enhanced .stats-card.loading .stat-number,
        .admin-enhanced .stats-card.loading .stat-label,
        .admin-enhanced .stats-card.loading .sub-stat .value {
            background: linear-gradient(90deg,
                rgba(226, 232, 240, 0.8) 25%,
                rgba(248, 250, 252, 0.8) 50%,
                rgba(226, 232, 240, 0.8) 75%);
            background-size: 200% 100%;
            animation: shimmer 2s infinite;
            color: transparent !important;
            -webkit-text-fill-color: transparent !important;
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        /* 演示控制面板 */
        .demo-controls {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 24px;
            margin-top: 40px;
            text-align: center;
        }

        .demo-controls h3 {
            color: white;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .control-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .control-btn {
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="demo-container">
        <!-- Demo Header -->
        <header class="demo-header">
            <h1 class="demo-title">Stats Card 现代化设计</h1>
            <p class="demo-subtitle">基于玻璃态设计语言的现代数据卡片组件</p>
            <div class="demo-badges">
                <span class="badge">🎨 Glassmorphism</span>
                <span class="badge">📱 Responsive</span>
                <span class="badge">🚀 Animations</span>
                <span class="badge">♿ Accessible</span>
            </div>
        </header>

        <!-- Stats Cards Demo -->
        <div class="admin-enhanced">
            <div class="stats-overview">
                <!-- 服务器状态卡片 -->
                <div class="stats-card server-stats">
                    <div class="card-header">
                        <div class="card-icon">
                            <i class="fas fa-server"></i>
                        </div>
                        <h3 class="card-title">服务器状态</h3>
                    </div>
                    <div class="main-stat">
                        <div class="stat-number">12</div>
                        <div class="stat-label">总服务器数</div>
                    </div>
                    <div class="sub-stats">
                        <div class="sub-stat online">
                            <div class="indicator"></div>
                            <div class="value">8</div>
                            <div class="label">在线</div>
                        </div>
                        <div class="sub-stat warning">
                            <div class="indicator"></div>
                            <div class="value">3</div>
                            <div class="label">警告</div>
                        </div>
                        <div class="sub-stat offline">
                            <div class="indicator"></div>
                            <div class="value">1</div>
                            <div class="label">离线</div>
                        </div>
                    </div>
                </div>

                <!-- 应用状态卡片 -->
                <div class="stats-card app-stats">
                    <div class="card-header">
                        <div class="card-icon">
                            <i class="fas fa-cube"></i>
                        </div>
                        <h3 class="card-title">应用状态</h3>
                    </div>
                    <div class="main-stat">
                        <div class="stat-number">45</div>
                        <div class="stat-label">运行中应用</div>
                    </div>
                    <div class="sub-stats">
                        <div class="sub-stat online">
                            <div class="indicator"></div>
                            <div class="value">38</div>
                            <div class="label">正常</div>
                        </div>
                        <div class="sub-stat warning">
                            <div class="indicator"></div>
                            <div class="value">5</div>
                            <div class="label">警告</div>
                        </div>
                        <div class="sub-stat critical">
                            <div class="indicator"></div>
                            <div class="value">2</div>
                            <div class="label">错误</div>
                        </div>
                    </div>
                </div>

                <!-- 用户活动卡片 -->
                <div class="stats-card user-stats">
                    <div class="card-header">
                        <div class="card-icon">
                            <i class="fas fa-users"></i>
                        </div>
                        <h3 class="card-title">用户活动</h3>
                    </div>
                    <div class="main-stat">
                        <div class="stat-number">1,247</div>
                        <div class="stat-label">活跃用户</div>
                    </div>
                    <div class="sub-stats">
                        <div class="sub-stat online">
                            <div class="indicator"></div>
                            <div class="value">156</div>
                            <div class="label">在线</div>
                        </div>
                        <div class="sub-stat">
                            <div class="indicator" style="background: #6366f1;"></div>
                            <div class="value">891</div>
                            <div class="label">今日访问</div>
                        </div>
                    </div>
                </div>

                <!-- 系统健康度卡片 -->
                <div class="stats-card health-stats">
                    <div class="card-header">
                        <div class="card-icon">
                            <i class="fas fa-heartbeat"></i>
                        </div>
                        <h3 class="card-title">系统健康度</h3>
                    </div>
                    <div class="main-stat">
                        <div class="stat-number">94%</div>
                        <div class="stat-label">整体健康度</div>
                    </div>
                    <div class="sub-stats">
                        <div class="sub-stat online">
                            <div class="indicator"></div>
                            <div class="value">98%</div>
                            <div class="label">CPU</div>
                        </div>
                        <div class="sub-stat warning">
                            <div class="indicator"></div>
                            <div class="value">89%</div>
                            <div class="label">内存</div>
                        </div>
                        <div class="sub-stat online">
                            <div class="indicator"></div>
                            <div class="value">95%</div>
                            <div class="label">存储</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Demo Controls -->
        <div class="demo-controls">
            <h3>演示控制</h3>
            <div class="control-buttons">
                <button class="control-btn" onclick="toggleLoading()">
                    <i class="fas fa-spinner"></i> 切换加载状态
                </button>
                <button class="control-btn" onclick="randomizeData()">
                    <i class="fas fa-dice"></i> 随机数据
                </button>
                <button class="control-btn" onclick="toggleTheme()">
                    <i class="fas fa-palette"></i> 切换主题
                </button>
                <button class="control-btn" onclick="showCode()">
                    <i class="fas fa-code"></i> 查看代码
                </button>
            </div>
        </div>
    </div>

    <script>
        // 演示控制功能
        let isLoading = false;
        let isDarkTheme = false;

        function toggleLoading() {
            isLoading = !isLoading;
            const cards = document.querySelectorAll('.stats-card');
            cards.forEach(card => {
                if (isLoading) {
                    card.classList.add('loading');
                } else {
                    card.classList.remove('loading');
                }
            });
        }

        function randomizeData() {
            const numbers = document.querySelectorAll('.stat-number');
            const values = document.querySelectorAll('.sub-stat .value');

            numbers.forEach(num => {
                const current = parseInt(num.textContent.replace(/[^\d]/g, ''));
                const random = Math.floor(Math.random() * current * 2);

                // 数字滚动动画
                animateNumber(num, current, random);
            });

            values.forEach(val => {
                const current = parseInt(val.textContent.replace(/[^\d]/g, ''));
                const random = Math.floor(Math.random() * current * 2);
                animateNumber(val, current, random);
            });
        }

        function animateNumber(element, start, end) {
            const duration = 1000;
            const startTime = performance.now();
            const isPercentage = element.textContent.includes('%');

            function update(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);

                // 使用easeOutCubic缓动函数
                const easeOutCubic = 1 - Math.pow(1 - progress, 3);
                const current = Math.floor(start + (end - start) * easeOutCubic);

                element.textContent = isPercentage ? `${current}%` : current.toLocaleString();

                if (progress < 1) {
                    requestAnimationFrame(update);
                }
            }

            requestAnimationFrame(update);
        }

        function toggleTheme() {
            isDarkTheme = !isDarkTheme;
            const root = document.documentElement;

            if (isDarkTheme) {
                // 深色主题
                document.body.style.background = 'linear-gradient(135deg, #1e293b 0%, #0f172a 100%)';
                root.style.setProperty('--card-bg', 'rgba(30, 41, 59, 0.95)');
                root.style.setProperty('--text-primary', '#f1f5f9');
                root.style.setProperty('--text-secondary', '#94a3b8');
            } else {
                // 恢复默认主题
                document.body.style.background = 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';
                root.style.setProperty('--card-bg', 'rgba(255, 255, 255, 0.95)');
                root.style.setProperty('--text-primary', '#0F172A');
                root.style.setProperty('--text-secondary', '#64748B');
            }
        }

        function showCode() {
            alert('代码已在浏览器开发者工具中展示，请查看页面源码！\n\n主要特性：\n• 玻璃态设计效果\n• 流畅的悬停动画\n• 响应式布局\n• 加载状态动画\n• 无障碍支持');
        }

        // 页面加载完成后的初始化动画
        document.addEventListener('DOMContentLoaded', function() {
            const cards = document.querySelectorAll('.stats-card');
            cards.forEach((card, index) => {
                card.style.opacity = '0';
                card.style.transform = 'translateY(40px)';

                setTimeout(() => {
                    card.style.transition = 'all 0.6s cubic-bezier(0.4, 0, 0.2, 1)';
                    card.style.opacity = '1';
                    card.style.transform = 'translateY(0)';
                }, index * 150);
            });
        });

        // 自动数据更新演示
        setInterval(() => {
            if (!isLoading && Math.random() > 0.7) {
                const indicators = document.querySelectorAll('.indicator');
                const randomIndicator = indicators[Math.floor(Math.random() * indicators.length)];

                // 闪烁效果
                randomIndicator.style.transform = 'scale(1.3)';
                setTimeout(() => {
                    randomIndicator.style.transform = 'scale(1)';
                }, 300);
            }
        }, 3000);
    </script>
</body>
</html>
