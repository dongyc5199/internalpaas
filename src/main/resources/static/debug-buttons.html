<!DOCTYPE html>
<html>
<head>
    <title>侧边栏收起测试</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; }
        
        .container { display: flex; min-height: 100vh; }
        
        .sidebar {
            width: 260px;
            background: #f8f9fa;
            border-right: 1px solid #dee2e6;
            transition: width 0.3s ease;
            position: fixed;
            height: 100vh;
            left: 0;
            top: 0;
        }
        
        .sidebar.collapsed { width: 60px; }
        
        .nav-item { margin: 0.5rem; }
        
        .nav-link {
            display: flex;
            align-items: center;
            padding: 0.75rem;
            text-decoration: none;
            color: #333;
            border-radius: 6px;
        }
        
        .nav-link:hover { background: #e9ecef; }
        
        .nav-icon {
            width: 24px;
            height: 24px;
            margin-right: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .sidebar.collapsed .nav-icon {
            margin-right: 0;
            background: #e9ecef;
            border-radius: 4px;
            font-weight: bold;
        }
        
        .sidebar.collapsed .nav-text { display: none; }
        
        .sidebar.collapsed .nav-link { justify-content: center; }
        
        .content {
            margin-left: 260px;
            padding: 2rem;
            transition: margin-left 0.3s ease;
            flex: 1;
        }
        
        .sidebar.collapsed ~ .content { margin-left: 60px; }
        
        .toggle-btn {
            position: fixed;
            top: 1rem;
            left: 1rem;
            z-index: 1000;
            padding: 0.5rem;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <button class="toggle-btn" onclick="toggleSidebar()">收起/展开</button>
    
    <div class="container">
        <aside class="sidebar" id="sidebar">
            <div class="nav-item">
                <a href="#" class="nav-link">
                    <span class="nav-icon" data-text="工">📊</span>
                    <span class="nav-text">工作台概览</span>
                </a>
            </div>
            <div class="nav-item">
                <a href="#" class="nav-link">
                    <span class="nav-icon" data-text="服">🖥️</span>
                    <span class="nav-text">服务器管理</span>
                </a>
            </div>
            <div class="nav-item">
                <a href="#" class="nav-link">
                    <span class="nav-icon" data-text="用">👥</span>
                    <span class="nav-text">用户管理</span>
                </a>
            </div>
        </aside>
        
        <main class="content">
            <h1>主要内容区域</h1>
            <p>这里是主要内容。侧边栏收起时，这个区域应该自动调整宽度。</p>
        </main>
    </div>
    
    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('collapsed');
            
            // 更新图标显示
            const icons = document.querySelectorAll('.nav-icon');
            icons.forEach(icon => {
                if (sidebar.classList.contains('collapsed')) {
                    icon.textContent = icon.getAttribute('data-text');
                } else {
                    // 恢复emoji图标
                    if (icon.getAttribute('data-text') === '工') icon.textContent = '📊';
                    if (icon.getAttribute('data-text') === '服') icon.textContent = '🖥️';
                    if (icon.getAttribute('data-text') === '用') icon.textContent = '👥';
                }
            });
        }
    </script>
</body>
</html>
