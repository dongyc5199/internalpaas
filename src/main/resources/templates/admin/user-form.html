<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${user.id != null} ? '编辑用户' : '添加用户'">用户管理 - Dev Debug Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            padding-top: 20px;
        }
        .form-container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
            padding: 2rem;
            margin-bottom: 2rem;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        .form-label {
            font-weight: 500;
        }
        .btn-primary {
            background-color: #0d6efd;
            border-color: #0d6efd;
        }
        .btn-secondary {
            background-color: #6c757d;
            border-color: #6c757d;
        }
    </style>
</head>
<body>
    <!-- 顶部导航 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/"><i class="fas fa-server"></i> 内部平台</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/apps">应用管理</a>
                <a class="nav-link" href="/admin/servers">服务器管理</a>
                <a class="nav-link active" href="/admin/users">用户管理</a>
                <a class="nav-link" href="/monitoring/dashboard">监控面板</a>
                <form th:action="@{/logout}" method="post" style="display: inline;">
                    <button type="submit" class="nav-link" style="background: none; border: none; cursor: pointer;">退出</button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <div class="row">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2><i class="fas fa-user-plus"></i> <span th:text="${user.id != null} ? '编辑用户' : '添加新用户'">添加新用户</span></h2>
                    <a href="/admin/users" class="btn btn-secondary">
                        <i class="fas fa-arrow-left"></i> 返回用户列表
                    </a>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div class="form-container">
                    <form th:action="${user.id != null} ? @{/admin/users/{id}/update(id=${user.id})} : @{/admin/users}" 
                          th:object="${user}" method="post">
                        
                        <!-- 消息显示 -->
                        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                            <i class="fas fa-check-circle me-2"></i>
                            <span th:text="${successMessage}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                            <i class="fas fa-exclamation-triangle me-2"></i>
                            <span th:text="${errorMessage}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>

                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="username" class="form-label">用户名 *</label>
                                    <input type="text" class="form-control" id="username" th:field="*{username}" required 
                                           placeholder="请输入用户名">
                                    <div class="form-text">用户登录时使用的唯一标识</div>
                                </div>
                            </div>

                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="email" class="form-label">邮箱 *</label>
                                    <input type="email" class="form-control" id="email" th:field="*{email}" required 
                                           placeholder="请输入邮箱地址">
                                    <div class="form-text">用户的联系邮箱</div>
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="password" class="form-label" th:text="${user.id != null} ? '新密码' : '密码 *'">密码</label>
                                    <input type="password" class="form-control" id="password" th:field="*{password}" 
                                           th:required="${user.id == null}" placeholder="请输入密码">
                                    <div class="form-text" th:if="${user.id != null}">留空则保持原密码不变</div>
                                    <div class="form-text" th:unless="${user.id != null}">用户登录密码</div>
                                </div>
                            </div>

                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="workDirectory" class="form-label">工作目录 *</label>
                                    <input type="text" class="form-control" id="workDirectory" th:field="*{workDirectory}" required 
                                           placeholder="例如：./workspaces/username">
                                    <div class="form-text">用户工作目录的路径</div>
                                </div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="form-label">用户角色</label>
                            <div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="checkbox" id="roleUser" 
                                           th:field="*{roles}" th:value="USER">
                                    <label class="form-check-label" for="roleUser">普通用户</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="checkbox" id="roleAdmin" 
                                           th:field="*{roles}" th:value="ADMIN">
                                    <label class="form-check-label" for="roleAdmin">管理员</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="checkbox" id="roleSuperAdmin" 
                                           th:field="*{roles}" th:value="SUPER_ADMIN">
                                    <label class="form-check-label" for="roleSuperAdmin">超级管理员</label>
                                </div>
                            </div>
                        </div>

                        <div class="form-group">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="isFirstLogin" th:field="*{isFirstLogin}">
                                <label class="form-check-label" for="isFirstLogin">首次登录</label>
                            </div>
                        </div>

                        <div class="d-flex gap-2 mt-4">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save"></i> 
                                <span th:text="${user.id != null} ? '更新用户' : '创建用户'">创建用户</span>
                            </button>
                            <a href="/admin/users" class="btn btn-secondary">
                                <i class="fas fa-times"></i> 取消
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
