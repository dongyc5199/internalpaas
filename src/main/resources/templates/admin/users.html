<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理 - Dev Debug Platform</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <h1>🚀 超级管理员控制台</h1>
        
        <!-- 消息显示 -->
        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>
        
        <nav class="admin-nav">
            <ul>
                <li><a href="/admin/servers">🖥️ 服务器管理</a></li>
                <li><a href="/admin/users" class="active">👥 用户管理</a></li>
                <li><a href="/">🏠 返回首页</a></li>
            </ul>
        </nav>
        
        <div class="page-header">
            <h2>👥 用户列表</h2>
        </div>
        
        <div th:if="${#lists.isEmpty(users)}" class="empty-state">
            <p>🎭 暂无用户数据</p>
            <small>系统中还没有注册的用户，等待用户注册后在此显示</small>
        </div>
        
        <table class="user-table" th:unless="${#lists.isEmpty(users)}">
            <thead>
                <tr>
                    <th>👤 用户名</th>
                    <th>📧 邮箱</th>
                    <th>🎭 角色</th>
                    <th>📁 工作目录</th>
                    <th>📅 注册时间</th>
                    <th>🆕 首次登录</th>
                    <th>⚙️ 操作</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="user : ${users}">
                    <td>
                        <strong th:text="${user.username}">username</strong>
                    </td>
                    <td th:text="${user.email}">user@example.com</td>
                    <td>
                        <span th:each="role : ${user.roles}" 
                              th:class="${'role-badge role-' + #strings.toLowerCase(#strings.replace(role.name(), '_', '-'))}" 
                              th:text="${role.name()}">USER</span>
                    </td>
                    <td>
                        <span class="work-directory" th:text="${user.workDirectory}">./workspaces/username</span>
                    </td>
                    <td th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd HH:mm')}">2024-01-01 12:00</td>
                    <td>
                        <span th:class="${user.isFirstLogin} ? 'status-active' : 'status-inactive'" 
                              th:text="${user.isFirstLogin} ? '是' : '否'">是</span>
                    </td>
                    <td>
                        <div class="action-buttons">
                            <!-- 超级管理员操作 -->
                            <form th:action="@{/admin/users/{id}/toggle-super-admin(id=${user.id})}" 
                                  method="post" style="display: inline;" sec:authorize="hasRole('SUPER_ADMIN')">
                                <button type="submit" class="btn-secondary"
                                        th:classappend="${#lists.contains(user.roles, T(com.cmict.internalpaas.model.User$Role).SUPER_ADMIN)} ? 'role-super-admin' : ''"
                                        th:text="${#lists.contains(user.roles, T(com.cmict.internalpaas.model.User$Role).SUPER_ADMIN)} ? '👑 取消超管' : '👑 设为超管'">
                                    👑 设为超管
                                </button>
                            </form>
                            
                            <!-- 管理员操作 -->
                            <form th:action="@{/admin/users/{id}/toggle-admin(id=${user.id})}" 
                                  method="post" style="display: inline;">
                                <button type="submit" class="btn-secondary"
                                        th:classappend="${#lists.contains(user.roles, T(com.cmict.internalpaas.model.User$Role).ADMIN)} ? 'role-admin' : ''"
                                        th:text="${#lists.contains(user.roles, T(com.cmict.internalpaas.model.User$Role).ADMIN)} ? '🛡️ 取消管理员' : '🛡️ 设为管理员'">
                                    🛡️ 设为管理员
                                </button>
                            </form>
                            
                            <!-- 删除用户 -->
                            <form th:action="@{/admin/users/{id}/delete(id=${user.id})}" 
                                  method="post" style="display: inline;" 
                                  onsubmit="return confirm('⚠️ 确定要删除用户 ' + '[[${user.username}]]' + ' 吗？ \n 此操作不可恢复，请谨慎操作！')">
                                <button type="submit" class="btn-danger"
                                        th:disabled="${#lists.contains(user.roles, T(com.cmict.internalpaas.model.User$Role).SUPER_ADMIN)}">
                                    🗑️ 删除
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
