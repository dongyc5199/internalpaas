<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <title>Deployment Platform</title>
</head>
<body>
<main class="content-framework admin-theme deploy-platform deploy-platform-page" role="main" th:fragment="deploy-platform-content">
    <div class="content-scrollable">
        <!-- React App Container (Full Height, No Padding) -->
        <div class="deploy-platform-react-container">
            <script>
                window.__DEPLOY_PLATFORM_DEFER_AUTO_MOUNT__ = false;
            </script>
            <div id="deploy-platform-root"
                 class="deploy-platform-host"
                 data-auth-endpoint="/api/deploy-platform/token"
                 data-summary-endpoint="/api/deploy-platform/dashboard/summary"
                 data-spring-context="true"
                 data-embedded="true"
                 data-i18n-zh="正在加载部署管理面板…"
                 data-i18n-en="Loading deployment console...">
                Loading deployment console...
            </div>
        </div>
    </div>
    <style>
        /* 部署管理平台页面特殊布局 */
        .deploy-platform-page.content-framework {
            padding: 0 !important;
            margin: 0 !important;
        }

        .deploy-platform-page .content-scrollable {
            padding: 0 !important;
            height: 100%;
        }

        /* React 应用容器占据整个空间 */
        .deploy-platform-react-container {
            width: 100%;
            height: 100%;
            min-height: 100%;
            overflow: hidden;
        }

        /* 加载状态的占位符样式 */
        .deploy-platform-host {
            width: 100%;
            height: 100%;
            min-height: 600px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgba(79, 70, 229, 0.05), rgba(14, 165, 233, 0.05));
            font-size: 16px;
            color: #64748b;
            font-weight: 500;
        }

        /* React 应用加载后移除加载样式 */
        .deploy-platform-host[data-react-mounted="true"] {
            background: none;
            color: inherit;
            display: block;
            min-height: unset;
        }

        /* 确保 React 应用占据整个空间 */
        #deploy-platform-root > .deploy-platform-app,
        #deploy-platform-root > .dp-shell {
            width: 100%;
            height: 100%;
            min-height: 100vh;
        }
    </style>
</main>
</body>
</html>
