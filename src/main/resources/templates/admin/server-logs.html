<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${server.name} + ' - 服务器日志'">服务器日志 - Dev Debug Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/fontawesome-local.css">
    <style>
        :root {
            --card-background: #ffffff;
            --card-shadow: rgba(0, 0, 0, 0.1);
            --border-color: #dee2e6;
            --primary-gradient: linear-gradient(135deg, #007bff 0%, #0056b3 100%);
        }
        
        .log-viewer {
            background-color: #1e1e1e;
            color: #d4d4d4;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.6;
            padding: 20px;
            border-radius: 8px;
            max-height: 600px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            border: 2px solid var(--border-color);
        }
        
        .log-controls {
            background: var(--card-background);
            border-radius: 12px;
            box-shadow: 0 4px 12px var(--card-shadow);
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }
        
        .panel-header {
            background: var(--primary-gradient);
            color: white;
            padding: 15px 20px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 12px 12px 0 0;
        }
        
        .panel-body {
            padding: 20px;
        }
        
        .file-list-item {
            cursor: pointer;
            padding: 8px 12px;
            margin: 2px 0;
            border-radius: 6px;
            transition: all 0.2s;
            border: 1px solid transparent;
        }
        
        .file-list-item:hover {
            background-color: #f8f9fa;
            border-color: var(--border-color);
        }
        
        .file-list-item.active {
            background-color: #e3f2fd;
            border-color: #2196f3;
        }
        
        .log-file-size {
            font-size: 0.8rem;
            color: #6c757d;
        }
        
        .log-search-box {
            position: sticky;
            top: 0;
            background: rgba(30, 30, 30, 0.95);
            padding: 10px;
            border-bottom: 1px solid #444;
            margin: -20px -20px 10px -20px;
        }
        
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            animation: spin 2s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .log-line-number {
            color: #858585;
            margin-right: 15px;
            user-select: none;
        }
        
        .log-highlight {
            background-color: #ffeb3b;
            color: #000;
            padding: 2px 4px;
            border-radius: 3px;
        }
    </style>
</head>
<body class="bg-light">
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/"><i class="fas fa-server"></i> 内部平台</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/apps">应用管理</a>
                <a class="nav-link active" href="/admin/servers">服务器管理</a>
                <a class="nav-link" href="/admin/users">用户管理</a>
                <form th:action="@{/logout}" method="post" style="display: inline;">
                    <button type="submit" class="nav-link" style="background: none; border: none; cursor: pointer;">退出</button>
                </form>
            </div>
        </div>
    </nav>

    <!-- 主内容区域 -->
    <div class="container-fluid mt-4">
        <div class="row">
            <div class="col-12">
                <!-- 消息显示 -->
                <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="fas fa-exclamation-triangle me-2"></i>
                    <span th:text="${errorMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <!-- 页面标题和操作按钮 -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2><i class="fas fa-file-alt"></i> 
                        <span th:text="${server.name} + ' - 服务器日志'">服务器日志</span>
                    </h2>
                    <div>
                        <a th:href="@{/admin/servers/{id}(id=${server.id})}" class="btn btn-outline-secondary me-2">
                            <i class="fas fa-arrow-left"></i> 返回服务器详情
                        </a>
                        <a href="/admin/servers" class="btn btn-outline-primary me-2">
                            <i class="fas fa-list"></i> 服务器列表
                        </a>
                        <button class="btn btn-outline-success" onclick="refreshLogFiles()">
                            <i class="fas fa-sync-alt"></i> 刷新
                        </button>
                    </div>
                </div>

                <!-- 日志控制面板 -->
                <div class="row">
                    <!-- 左侧：日志文件列表 -->
                    <div class="col-md-4">
                        <div class="log-controls">
                            <div class="panel-header">
                                <i class="fas fa-folder-open"></i> 日志文件列表
                            </div>
                            <div class="panel-body">
                                <div id="logFilesLoading" class="text-center py-3">
                                    <div class="loading-spinner me-2"></div>
                                    正在加载日志文件...
                                </div>
                                <div id="logFilesList" class="d-none">
                                    <!-- 日志文件列表将通过JavaScript动态加载 -->
                                </div>
                                <div id="logFilesError" class="alert alert-warning d-none" role="alert">
                                    <i class="fas fa-exclamation-triangle me-2"></i>
                                    <span id="logFilesErrorMessage">加载日志文件失败</span>
                                </div>
                            </div>
                        </div>

                        <!-- 日志控制选项 -->
                        <div class="log-controls mt-3">
                            <div class="panel-header">
                                <i class="fas fa-cog"></i> 显示选项
                            </div>
                            <div class="panel-body">
                                <div class="row">
                                    <div class="col-12 mb-3">
                                        <label for="logLines" class="form-label">显示行数：</label>
                                        <select id="logLines" class="form-select">
                                            <option value="50">50行</option>
                                            <option value="100" selected>100行</option>
                                            <option value="200">200行</option>
                                            <option value="500">500行</option>
                                            <option value="1000">1000行</option>
                                        </select>
                                    </div>
                                    <div class="col-12 mb-3">
                                        <div class="form-check form-switch">
                                            <input class="form-check-input" type="checkbox" id="showFromEnd" checked>
                                            <label class="form-check-label" for="showFromEnd">从末尾显示</label>
                                        </div>
                                    </div>
                                    <div class="col-12 mb-3">
                                        <div class="form-check form-switch">
                                            <input class="form-check-input" type="checkbox" id="showLineNumbers">
                                            <label class="form-check-label" for="showLineNumbers">显示行号</label>
                                        </div>
                                    </div>
                                    <div class="col-12">
                                        <div class="form-check form-switch">
                                            <input class="form-check-input" type="checkbox" id="autoRefresh">
                                            <label class="form-check-label" for="autoRefresh">自动刷新 (30秒)</label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 右侧：日志内容显示 -->
                    <div class="col-md-8">
                        <div class="log-controls">
                            <div class="panel-header d-flex justify-content-between align-items-center">
                                <span>
                                    <i class="fas fa-eye"></i> 日志内容
                                    <span id="currentLogFile" class="ms-2 text-light">请选择日志文件</span>
                                </span>
                                <div>
                                    <button class="btn btn-sm btn-light" onclick="clearLogContent()">
                                        <i class="fas fa-eraser"></i> 清空
                                    </button>
                                    <button class="btn btn-sm btn-light" onclick="downloadLogContent()" id="downloadBtn" disabled>
                                        <i class="fas fa-download"></i> 下载
                                    </button>
                                </div>
                            </div>
                            <div class="panel-body p-0">
                                <div id="logViewer" class="log-viewer">
                                    <div class="text-center text-muted py-5">
                                        <i class="fas fa-file-alt fa-3x mb-3"></i>
                                        <br>请从左侧选择一个日志文件查看内容
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 添加服务器ID数据属性 -->
    <div id="serverData" th:data-id="${server.id}" style="display: none;"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- 日志查看器脚本 -->
    <script>
        let currentServerId = null;
        let currentLogPath = null;
        let autoRefreshTimer = null;

        document.addEventListener('DOMContentLoaded', function() {
            currentServerId = document.getElementById('serverData').getAttribute('data-id');
            loadLogFiles();
        });

        // 加载日志文件列表
        function loadLogFiles(refresh = false) {
            const loadingDiv = document.getElementById('logFilesLoading');
            const listDiv = document.getElementById('logFilesList');
            const errorDiv = document.getElementById('logFilesError');

            loadingDiv.classList.remove('d-none');
            listDiv.classList.add('d-none');
            errorDiv.classList.add('d-none');

            const url = `/api/server-logs/${currentServerId}/files${refresh ? '?refresh=true' : ''}`;

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    loadingDiv.classList.add('d-none');
                    
                    if (data.success) {
                        displayLogFiles(data.files || []);
                        listDiv.classList.remove('d-none');
                    } else {
                        showLogFilesError(data.error || '加载日志文件失败');
                    }
                })
                .catch(error => {
                    console.error('加载日志文件失败:', error);
                    loadingDiv.classList.add('d-none');
                    showLogFilesError('网络错误或服务器无响应');
                });
        }

        // 显示日志文件列表
        function displayLogFiles(files) {
            const listDiv = document.getElementById('logFilesList');
            
            if (files.length === 0) {
                listDiv.innerHTML = '<div class="text-muted text-center py-3">未找到日志文件</div>';
                return;
            }

            let html = '';
            files.forEach(file => {
                html += `
                    <div class="file-list-item" onclick="selectLogFile('${file.path}', '${file.name}')">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <i class="fas fa-file-alt me-2"></i>
                                <strong>${file.name}</strong>
                                <div class="log-file-size mt-1">
                                    ${file.path}
                                    ${file.size ? ' | ' + formatFileSize(file.size) : ''}
                                    ${file.lastModified ? ' | ' + formatDate(file.lastModified) : ''}
                                </div>
                            </div>
                            <div class="text-muted">
                                <span class="badge bg-secondary">${file.type || 'log'}</span>
                            </div>
                        </div>
                    </div>
                `;
            });

            listDiv.innerHTML = html;
        }

        // 选择日志文件
        function selectLogFile(path, name) {
            // 更新UI状态
            document.querySelectorAll('.file-list-item').forEach(item => {
                item.classList.remove('active');
            });
            event.currentTarget.classList.add('active');

            currentLogPath = path;
            document.getElementById('currentLogFile').textContent = name;
            document.getElementById('downloadBtn').disabled = false;

            // 加载日志内容
            loadLogContent();
        }

        // 加载日志内容
        function loadLogContent() {
            if (!currentLogPath) return;

            const viewer = document.getElementById('logViewer');
            const lines = document.getElementById('logLines').value;
            const fromEnd = document.getElementById('showFromEnd').checked;
            const showLineNumbers = document.getElementById('showLineNumbers').checked;

            viewer.innerHTML = '<div class="text-center py-3"><div class="loading-spinner me-2"></div>正在加载日志内容...</div>';

            const url = `/api/server-logs/${currentServerId}/content?path=${encodeURIComponent(currentLogPath)}&lines=${lines}&fromEnd=${fromEnd}&includeLineNumbers=${showLineNumbers}`;

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    if (data.success && data.content) {
                        displayLogContent(data.content);
                    } else {
                        viewer.innerHTML = `<div class="text-danger text-center py-3"><i class="fas fa-exclamation-triangle me-2"></i>${data.error || '加载日志内容失败'}</div>`;
                    }
                })
                .catch(error => {
                    console.error('加载日志内容失败:', error);
                    viewer.innerHTML = '<div class="text-danger text-center py-3"><i class="fas fa-exclamation-triangle me-2"></i>网络错误或服务器无响应</div>';
                });
        }

        // 显示日志内容
        function displayLogContent(content) {
            const viewer = document.getElementById('logViewer');
            const showLineNumbers = document.getElementById('showLineNumbers').checked;
            
            if (!content.content || content.content.trim() === '') {
                viewer.innerHTML = '<div class="text-muted text-center py-3">日志文件为空或无内容</div>';
                return;
            }

            let logContent = content.content;
            
            // 如果需要显示行号
            if (showLineNumbers) {
                const lines = logContent.split('\n');
                const startLine = content.startLine || 1;
                logContent = lines.map((line, index) => {
                    const lineNum = startLine + index;
                    return `<span class="log-line-number">${lineNum.toString().padStart(4, ' ')}</span>${escapeHtml(line)}`;
                }).join('\n');
            } else {
                logContent = escapeHtml(logContent);
            }

            viewer.innerHTML = logContent;
            
            // 滚动到底部（如果是从末尾显示）
            if (document.getElementById('showFromEnd').checked) {
                viewer.scrollTop = viewer.scrollHeight;
            }
        }

        // 刷新日志文件列表
        function refreshLogFiles() {
            loadLogFiles(true);
        }

        // 清空日志内容
        function clearLogContent() {
            document.getElementById('logViewer').innerHTML = '<div class="text-center text-muted py-5"><i class="fas fa-file-alt fa-3x mb-3"></i><br>请从左侧选择一个日志文件查看内容</div>';
            document.getElementById('currentLogFile').textContent = '请选择日志文件';
            document.getElementById('downloadBtn').disabled = true;
            currentLogPath = null;
            
            // 取消选中状态
            document.querySelectorAll('.file-list-item').forEach(item => {
                item.classList.remove('active');
            });
        }

        // 下载日志内容
        function downloadLogContent() {
            if (!currentLogPath) return;
            
            const lines = document.getElementById('logLines').value;
            const fromEnd = document.getElementById('showFromEnd').checked;
            const url = `/api/server-logs/${currentServerId}/content?path=${encodeURIComponent(currentLogPath)}&lines=${lines}&fromEnd=${fromEnd}&download=true`;
            
            // 创建下载链接
            const a = document.createElement('a');
            a.href = url;
            a.download = `server-${currentServerId}-${currentLogPath.split('/').pop()}-${new Date().getTime()}.log`;
            a.click();
        }

        // 显示日志文件错误
        function showLogFilesError(message) {
            const errorDiv = document.getElementById('logFilesError');
            const errorMessage = document.getElementById('logFilesErrorMessage');
            errorMessage.textContent = message;
            errorDiv.classList.remove('d-none');
        }

        // 自动刷新控制
        function toggleAutoRefresh() {
            const autoRefresh = document.getElementById('autoRefresh');
            
            if (autoRefresh.checked) {
                autoRefreshTimer = setInterval(() => {
                    if (currentLogPath) {
                        loadLogContent();
                    }
                }, 30000); // 30秒刷新一次
            } else {
                if (autoRefreshTimer) {
                    clearInterval(autoRefreshTimer);
                    autoRefreshTimer = null;
                }
            }
        }

        // 事件监听器
        document.getElementById('logLines').addEventListener('change', loadLogContent);
        document.getElementById('showFromEnd').addEventListener('change', loadLogContent);
        document.getElementById('showLineNumbers').addEventListener('change', loadLogContent);
        document.getElementById('autoRefresh').addEventListener('change', toggleAutoRefresh);

        // 工具函数
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function formatDate(timestamp) {
            return new Date(timestamp).toLocaleString('zh-CN');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 页面卸载时清理定时器
        window.addEventListener('beforeunload', function() {
            if (autoRefreshTimer) {
                clearInterval(autoRefreshTimer);
            }
        });
    </script>
</body>
</html>
