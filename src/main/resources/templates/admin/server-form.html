<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${server.id} ? '编辑服务器' : '添加服务器'">服务器配置 - Dev Debug Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .form-section {
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .form-section h3 {
            margin-top: 0;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 15px;
            color: #495057;
        }
        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }
    </style>
</head>
<body>
    <!-- 顶部导航 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/"><i class="fas fa-server"></i> 内部平台</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/apps">应用管理</a>
                <a class="nav-link active" href="/admin/servers">服务器管理</a>
                <a class="nav-link" href="/admin/users">用户管理</a>
                <a class="nav-link" href="/admin/servers">服务器管理</a>
                <form th:action="@{/logout}" method="post" style="display: inline;">
                    <button type="submit" class="nav-link" style="background: none; border: none; cursor: pointer;">退出</button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <div class="row">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2><i class="fas fa-server"></i> <span th:text="${server.id} ? '编辑服务器' : '添加新服务器'">服务器配置</span></h2>
                    <a href="/admin/servers" class="btn btn-outline-secondary">
                        <i class="fas fa-arrow-left"></i> 返回服务器列表
                    </a>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-lg-8 offset-lg-2">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="fas fa-sliders-h"></i> 服务器设置</h5>
                    </div>
                    <div class="card-body">
                        <form th:action="${server.id} ? @{/admin/servers/{id}/update(id=${server.id})} : @{/admin/servers}" 
                              th:object="${server}" method="post">
                    
                    <!-- 消息显示 -->
                    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                        <i class="fas fa-check-circle me-2"></i>
                        <span th:text="${successMessage}"></span>
                        <button type="button" class="alert-close-button" data-bs-dismiss="alert"></button>
                    </div>
                    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                        <i class="fas fa-exclamation-triangle me-2"></i>
                        <span th:text="${errorMessage}"></span>
                        <button type="button" class="alert-close-button" data-bs-dismiss="alert"></button>
                    </div>

                    <div class="form-group">
                        <label for="name" class="form-label">服务器名称 *</label>
                        <input type="text" class="form-control" id="name" th:field="*{name}" required 
                               placeholder="例如：本地开发服务器">
                    </div>

                    <div class="form-section">
                        <h3>应用服务配置</h3>
                        
                        <div class="form-group">
                            <label for="hostname" class="form-label">应用主机名/IP地址 *</label>
                            <input type="text" class="form-control" id="hostname" th:field="*{hostname}" required 
                                   placeholder="例如：localhost 或 192.168.1.100">
                            <div class="form-text">用户访问此服务器的应用地址</div>
                        </div>

                        <div class="form-group">
                            <label for="port" class="form-label">应用端口号 *</label>
                            <input type="number" class="form-control" id="port" th:field="*{port}" required 
                                   min="1" max="65535" placeholder="8080">
                            <div class="form-text">应用服务运行的端口号</div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="baseWorkDirectory" class="form-label">基础工作目录 *</label>
                        <input type="text" class="form-control" id="baseWorkDirectory" th:field="*{baseWorkDirectory}" required 
                               placeholder="例如：./workspaces">
                        <div class="form-text">这是所有用户工作目录的基础路径</div>
                    </div>

                    <div class="form-group">
                        <label for="description" class="form-label">描述</label>
                        <textarea class="form-control" id="description" th:field="*{description}" rows="3" 
                                  placeholder="服务器的详细描述信息..."></textarea>
                    </div>

                    <!-- SSH连接配置 -->
                    <div class="form-section">
                        <h3>SSH连接配置</h3>
                        
                        <div class="form-group">
                            <label for="sshPort" class="form-label">SSH端口</label>
                            <input type="number" class="form-control" id="sshPort" th:field="*{sshPort}" 
                                   min="1" max="65535" placeholder="22">
                        </div>

                        <div class="form-group">
                            <label for="sshUsername" class="form-label">SSH用户名</label>
                            <input type="text" class="form-control" id="sshUsername" th:field="*{sshUsername}" 
                                   placeholder="root">
                        </div>

                        <div class="form-group">
                            <label for="sshPassword" class="form-label">SSH密码</label>
                            <input type="password" class="form-control" id="sshPassword" th:field="*{sshPassword}" 
                                   placeholder="必填：密码认证" required>
                            <div class="form-text">仅支持密码认证，请填写SSH密码</div>
                        </div>
                    </div>

                    <div class="form-group">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="active" th:field="*{active}">
                            <label class="form-check-label" for="active">启用此服务器</label>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> 
                            <span th:text="${server.id} ? '更新服务器' : '创建服务器'">保存</span>
                        </button>
                        <a href="/admin/servers" class="btn btn-secondary">
                            <i class="fas fa-times"></i> 取消
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
