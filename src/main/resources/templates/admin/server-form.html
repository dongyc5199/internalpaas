<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${server.id} ? '编辑服务器' : '添加服务器'">服务器配置 - Dev Debug Platform</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <h1 th:text="${server.id} ? '编辑服务器' : '添加新服务器'">服务器配置</h1>
        
        <nav class="admin-nav">
            <ul>
                <li><a href="/admin/servers">服务器管理</a></li>
                <li><a href="/admin/users">用户管理</a></li>
                <li><a href="/">返回首页</a></li>
            </ul>
        </nav>

        <form th:action="${server.id} ? @{/admin/servers/{id}/update(id=${server.id})} : @{/admin/servers}" 
              th:object="${server}" method="post">
            
            <div class="form-group">
                <label for="name">服务器名称 *</label>
                <input type="text" id="name" th:field="*{name}" required 
                       placeholder="例如：本地开发服务器">
            </div>

            <fieldset>
                <legend>应用服务配置</legend>
                
                <div class="form-group">
                    <label for="hostname">应用主机名/IP地址 *</label>
                    <input type="text" id="hostname" th:field="*{hostname}" required 
                           placeholder="例如：localhost 或 192.168.1.100">
                    <small>用户访问此服务器的应用地址</small>
                </div>

                <div class="form-group">
                    <label for="port">应用端口号 *</label>
                    <input type="number" id="port" th:field="*{port}" required 
                           min="1" max="65535" placeholder="8080">
                    <small>应用服务运行的端口号</small>
                </div>
            </fieldset>

            <div class="form-group">
                <label for="baseWorkDirectory">基础工作目录 *</label>
                <input type="text" id="baseWorkDirectory" th:field="*{baseWorkDirectory}" required 
                       placeholder="例如：./workspaces">
                <small>这是所有用户工作目录的基础路径</small>
            </div>

            <div class="form-group">
                <label for="description">描述</label>
                <textarea id="description" th:field="*{description}" rows="3" 
                          placeholder="服务器的详细描述信息..."></textarea>
            </div>

            <!-- SSH连接配置 -->
            <fieldset>
                <legend>SSH连接配置</legend>
                
                <div class="form-group">
                    <label for="sshPort">SSH端口</label>
                    <input type="number" id="sshPort" th:field="*{sshPort}" 
                           min="1" max="65535" placeholder="22">
                </div>

                <div class="form-group">
                    <label for="sshUsername">SSH用户名</label>
                    <input type="text" id="sshUsername" th:field="*{sshUsername}" 
                           placeholder="root">
                </div>

                <div class="form-group">
                    <label for="sshPassword">SSH密码</label>
                    <input type="password" id="sshPassword" th:field="*{sshPassword}" 
                           placeholder="必填：密码认证" required>
                    <small>仅支持密码认证，请填写SSH密码</small>
                </div>
            </fieldset>

            <div class="form-group">
                <label>
                    <input type="checkbox" th:field="*{active}">
                    启用此服务器
                </label>
            </div>

            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button type="submit" class="btn-primary" 
                        th:text="${server.id} ? '更新服务器' : '创建服务器'">创建服务器</button>
                <a href="/admin/servers" class="btn-secondary">取消</a>
            </div>
        </form>
    </div>
</body>
</html>
