<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>部署管理平台</title>

    <!-- React应用样式 -->
    <link rel="stylesheet" th:href="@{/react-app/assets/index.css}">

    <style>
        /* 全屏布局 - 移除所有边距和填充 */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* React容器占据整个视口 */
        #deploy-platform-root {
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgba(79, 70, 229, 0.05), rgba(14, 165, 233, 0.05));
        }

        /* 加载状态 */
        .loading-message {
            font-size: 16px;
            color: #64748b;
            font-weight: 500;
        }

        /* React应用挂载后移除加载样式 */
        #deploy-platform-root[data-react-mounted="true"] {
            background: none;
            display: block;
        }

        #deploy-platform-root[data-react-mounted="true"] .loading-message {
            display: none;
        }
    </style>
</head>
<body>
    <!-- React应用容器 -->
    <div id="deploy-platform-root"
         data-auth-endpoint="/api/deploy-platform/token"
         data-summary-endpoint="/api/deploy-platform/dashboard/summary"
         data-spring-context="true"
         data-embedded="false"
         data-i18n-zh="正在加载部署管理面板…"
         data-i18n-en="Loading deployment console...">
        <div class="loading-message">Loading deployment console...</div>
    </div>

    <!-- React应用脚本 -->
    <script type="module" th:src="@{/react-app/assets/index.js}"></script>
</body>
</html>
