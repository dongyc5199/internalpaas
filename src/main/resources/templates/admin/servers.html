<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>服务器管理 - Dev Debug Platform</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <h1>🚀 超级管理员控制台</h1>
        
        <nav class="admin-nav">
            <ul>
                <li><a href="/admin/servers" class="active">🖥️ 服务器管理</a></li>
                <li><a href="/admin/users">👥 用户管理</a></li>
                <li><a href="/">🏠 返回首页</a></li>
            </ul>
        </nav>
        
        <div class="page-header">
            <h2>🖥️ 服务器列表</h2>
            <a href="/admin/servers/new" class="btn-primary">➕ 添加新服务器</a>
        </div>
        
        <div th:if="${#lists.isEmpty(servers)}" class="empty-state">
            <p>🖥️ 暂无服务器配置</p>
            <small>请添加第一个服务器来开始使用开发调试平台</small>
            <div style="margin-top: 30px;">
                <a href="/admin/servers/new" class="btn-primary">🚀 添加第一个服务器</a>
            </div>
        </div>
        
        <table class="server-table" th:unless="${#lists.isEmpty(servers)}">
            <thead>
                <tr>
                    <th>🏷️ 服务器名称</th>
                    <th>🌐 主机地址</th>
                    <th>🔌 端口号</th>
                    <th>📁 工作目录</th>
                    <th>📝 描述信息</th>
                    <th>🔄 运行状态</th>
                    <th>⚙️ 操作</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="server : ${servers}">
                    <td>
                        <strong th:text="${server.name}">本地服务器</strong>
                    </td>
                    <td>
                        <code th:text="${server.hostname}">localhost</code>
                    </td>
                    <td>
                        <code th:text="${server.port}">8080</code>
                    </td>
                    <td>
                        <span class="work-directory" th:text="${server.baseWorkDirectory}">./workspaces</span>
                    </td>
                    <td th:text="${server.description}">本地开发环境</td>
                    <td>
                        <span th:class="${server.active} ? 'status-active' : 'status-inactive'" 
                              th:text="${server.active} ? '运行中' : '已停用'">运行中</span>
                    </td>
                    <td>
                        <div class="action-buttons">
                            <a th:href="@{/admin/servers/{id}/edit(id=${server.id})}" 
                               class="btn-secondary">✏️ 编辑配置</a>
                            <form th:action="@{/admin/servers/{id}/delete(id=${server.id})}" 
                                  method="post" style="display: inline;" 
                                  onsubmit="return confirm('⚠️ 确定要删除服务器 ' + '[[${server.name}]]' + ' 吗？ \n 此操作将影响所有使用该服务器的用户！')">
                                <button type="submit" class="btn-danger">🗑️ 删除</button>
                            </form>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
