<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>服务器管理 - 内部平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .metric-card { transition: transform 0.2s; }
        .metric-card:hover { transform: translateY(-2px); }
        .server-card { border-left: 4px solid #dee2e6; }
        .server-card.active { border-left-color: #28a745; }
        .server-card.inactive { border-left-color: #dc3545; }
        .server-card.monitoring { border-left-color: #007bff; }
    </style>
</head>
<body>
    <!-- 顶部导航 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/"><i class="fas fa-server"></i> 内部平台</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/apps">应用管理</a>
                <a class="nav-link active" href="/admin/servers">服务器管理</a>
                <a class="nav-link" href="/admin/users">用户管理</a>
                <a class="nav-link" href="/monitoring/dashboard">监控面板</a>
                <a class="nav-link" href="/logout">退出</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <div class="row">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2><i class="fas fa-tachometer-alt"></i> 服务器监控面板</h2>
                    <div>
                        <button class="btn btn-outline-primary" onclick="refreshData()">
                            <i class="fas fa-sync-alt"></i> 刷新数据
                        </button>
                        <button class="btn btn-outline-success" onclick="addServer()">
                            <i class="fas fa-plus"></i> 添加服务器
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 消息显示 -->
        <div th:if="${successMessage}" class="row mb-3">
            <div class="col-12">
                <div class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="fas fa-check-circle me-2"></i>
                    <span th:text="${successMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            </div>
        </div>
        <div th:if="${errorMessage}" class="row mb-3">
            <div class="col-12">
                <div class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="fas fa-exclamation-triangle me-2"></i>
                    <span th:text="${errorMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            </div>
        </div>

        <!-- 服务器状态统计 -->
        <div class="row mb-4">
            <div class="col-md-3 col-sm-6 mb-3">
                <div class="card metric-card bg-success text-white">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h4 th:text="${activeServers ?: 0}">0</h4>
                                <p>在线服务器</p>
                            </div>
                            <i class="fas fa-check-circle fa-2x align-self-center"></i>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3 col-sm-6 mb-3">
                <div class="card metric-card bg-danger text-white">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h4 th:text="${inactiveServers ?: 0}">0</h4>
                                <p>离线服务器</p>
                            </div>
                            <i class="fas fa-times-circle fa-2x align-self-center"></i>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3 col-sm-6 mb-3">
                <div class="card metric-card bg-primary text-white">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h4 th:text="${monitoringServers ?: 0}">0</h4>
                                <p>监控中</p>
                            </div>
                            <i class="fas fa-eye fa-2x align-self-center"></i>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3 col-sm-6 mb-3">
                <div class="card metric-card bg-secondary text-white">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h4 th:text="${totalServers ?: 1}">1</h4>
                                <p>总服务器数</p>
                            </div>
                            <i class="fas fa-server fa-2x align-self-center"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 服务器列表 -->
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="fas fa-list"></i> 服务器状态</h5>
                    </div>
                    <div class="card-body">
                        <!-- 空状态 -->
                        <div class="row" th:if="${servers == null or #lists.isEmpty(servers)}">
                            <div class="col-12 text-center py-4">
                                <i class="fas fa-server fa-3x text-muted mb-3"></i>
                                <p class="text-muted">暂无服务器配置，请添加第一个服务器来开始使用开发调试平台</p>
                                <button class="btn btn-primary" onclick="addServer()">
                                    <i class="fas fa-plus"></i> 添加第一个服务器
                                </button>
                            </div>
                        </div>
                        
                        <!-- 服务器卡片列表 -->
                        <div class="row" th:each="server : ${servers}">
                            <div class="col-lg-6 col-xl-4 mb-3">
                                <div class="card server-card" 
                                     th:classappend="${server.active} ? 'active' : 'inactive'">
                                    <div class="card-body">
                                        <div class="d-flex justify-content-between align-items-start mb-2">
                                            <h6 class="card-title mb-0">
                                                <a th:href="@{/admin/servers/{id}(id=${server.id})}" 
                                                   th:text="${server.name}" 
                                                   class="text-decoration-none">服务器名称</a>
                                            </h6>
                                            <span class="badge" 
                                                  th:classappend="${server.active} ? 'bg-success' : 'bg-danger'"
                                                  th:text="${server.active} ? '在线' : '离线'">状态</span>
                                        </div>
                                        <p class="card-text small text-muted mb-2">
                                            <i class="fas fa-globe"></i> 主机: <span th:text="${server.hostname}">localhost</span>
                                        </p>
                                        <p class="card-text small text-muted mb-2">
                                            <i class="fas fa-plug"></i> 端口: <span th:text="${server.port}">8080</span>
                                        </p>
                                        <p class="card-text small text-muted mb-3">
                                            <i class="fas fa-folder"></i> 工作目录: <span th:text="${server.baseWorkDirectory}">./workspaces</span>
                                        </p>
                                        
                                        <!-- SSH状态 -->
                                        <div class="mb-3">
                                            <span class="badge" 
                                                  th:classappend="${server.connectionStatus != null ? 
                                                                 (server.connectionStatus.name() == 'CONNECTED' ? 'bg-success' : 
                                                                  server.connectionStatus.name() == 'FAILED' ? 'bg-danger' :
                                                                  server.connectionStatus.name() == 'TIMEOUT' ? 'bg-warning' :
                                                                  server.connectionStatus.name() == 'AUTH_FAILED' ? 'bg-danger' :
                                                                  server.connectionStatus.name() == 'MONITORING' ? 'bg-primary' : 'bg-secondary') : 'bg-secondary'}"
                                                  th:text="${server.connectionStatus != null} ? 'SSH: ' + ${server.connectionStatus.description} : 'SSH: 未知'">
                                                SSH状态
                                            </span>
                                        </div>
                                        
                                        <div class="mt-3">
                                            <button class="btn btn-sm btn-outline-primary" th:onclick="'viewServer(\'' + ${server.id} + '\')'">
                                                <i class="fas fa-chart-line"></i> 详细信息
                                            </button>
                                            <button class="btn btn-sm btn-outline-success" th:onclick="'refreshServer(\'' + ${server.id} + '\')'">
                                                <i class="fas fa-sync-alt"></i> 刷新
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function refreshData() {
            location.reload();
        }
        
        function addServer() {
            window.location.href = '/admin/servers/new';
        }
        
        function viewServer(serverId) {
            window.location.href = '/admin/servers/' + serverId;
        }
        
        function refreshServer(serverId) {
            // 刷新单个服务器状态
            fetch('/admin/servers/' + serverId + '/refresh', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                }
            }).then(response => {
                if (response.ok) {
                    location.reload();
                } else {
                    alert('刷新失败，请稍后重试');
                }
            }).catch(error => {
                console.error('刷新服务器状态失败:', error);
                alert('刷新失败，请稍后重试');
            });
        }
    </script>
</body>
</html>
