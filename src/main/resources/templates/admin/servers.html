<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>服务器管理与监控 - 内部平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .metric-card { transition: transform 0.2s; }
        .metric-card:hover { transform: translateY(-2px); }
        .server-card { border-left: 4px solid #dee2e6; }
        .server-card.active { border-left-color: #28a745; }
        .server-card.inactive { border-left-color: #dc3545; }
        .server-card.monitoring { border-left-color: #007bff; }
    </style>
</head>
<body>
    <!-- 顶部导航 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/"><i class="fas fa-server"></i> 内部平台</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/apps">应用管理</a>
                <a class="nav-link active" href="/admin/servers">服务器管理与监控</a>
                <a class="nav-link" href="/admin/users">用户管理</a>
                <form th:action="@{/logout}" method="post" style="display: inline;">
                    <button type="submit" class="nav-link" style="background: none; border: none; cursor: pointer;">退出</button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <div class="row">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2><i class="fas fa-tachometer-alt"></i> 服务器管理与监控</h2>
                    <div>
                        <button class="btn btn-outline-primary" onclick="refreshAllData()">
                            <i class="fas fa-sync-alt"></i> 刷新所有数据
                        </button>
                        <button class="btn btn-outline-warning" onclick="triggerHealthCheck()">
                            <i class="fas fa-heartbeat"></i> 健康检查
                        </button>
                        <button class="btn btn-outline-success" onclick="addServer()">
                            <i class="fas fa-plus"></i> 添加服务器
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 消息显示 -->
        <div th:if="${successMessage}" class="row mb-3">
            <div class="col-12">
                <div class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="fas fa-check-circle me-2"></i>
                    <span th:text="${successMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            </div>
        </div>
        <div th:if="${errorMessage}" class="row mb-3">
            <div class="col-12">
                <div class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="fas fa-exclamation-triangle me-2"></i>
                    <span th:text="${errorMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            </div>
        </div>

        <!-- 服务器状态统计 -->
        <div class="row mb-4">
            <div class="col-md-3 col-sm-6 mb-3">
                <div class="card metric-card bg-success text-white">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h4 th:text="${activeServers ?: 0}">0</h4>
                                <p>在线服务器</p>
                            </div>
                            <i class="fas fa-check-circle fa-2x align-self-center"></i>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3 col-sm-6 mb-3">
                <div class="card metric-card bg-danger text-white">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h4 th:text="${inactiveServers ?: 0}">0</h4>
                                <p>离线服务器</p>
                            </div>
                            <i class="fas fa-times-circle fa-2x align-self-center"></i>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3 col-sm-6 mb-3">
                <div class="card metric-card bg-primary text-white">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h4 th:text="${monitoringServers ?: 0}">0</h4>
                                <p>监控中</p>
                            </div>
                            <i class="fas fa-eye fa-2x align-self-center"></i>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3 col-sm-6 mb-3">
                <div class="card metric-card bg-secondary text-white">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h4 th:text="${totalServers ?: 1}">1</h4>
                                <p>总服务器数</p>
                            </div>
                            <i class="fas fa-server fa-2x align-self-center"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 服务器列表 -->
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="fas fa-list"></i> 服务器状态</h5>
                    </div>
                    <div class="card-body">
                        <!-- 空状态 -->
                        <div class="row" th:if="${servers == null or #lists.isEmpty(servers)}">
                            <div class="col-12 text-center py-4">
                                <i class="fas fa-server fa-3x text-muted mb-3"></i>
                                <p class="text-muted">暂无服务器配置，请添加第一个服务器来开始使用开发调试平台</p>
                                <button class="btn btn-primary" onclick="addServer()">
                                    <i class="fas fa-plus"></i> 添加第一个服务器
                                </button>
                            </div>
                        </div>
                        
                        <!-- 服务器卡片列表 -->
                        <div class="row" th:each="server : ${servers}">
                            <div class="col-lg-6 col-xl-4 mb-3">
                                <div class="card server-card" 
                                     th:classappend="${server.active} ? 'active' : 'inactive'">
                                    <div class="card-body">
                                        <div class="d-flex justify-content-between align-items-start mb-2">
                                            <h6 class="card-title mb-0">
                                                <a th:href="@{/admin/servers/{id}(id=${server.id})}" 
                                                   th:text="${server.name}" 
                                                   class="text-decoration-none">服务器名称</a>
                                            </h6>
                                            <span class="badge" 
                                                  th:classappend="${server.active} ? 'bg-success' : 'bg-danger'"
                                                  th:text="${server.active} ? '在线' : '离线'">状态</span>
                                        </div>
                                        <p class="card-text small text-muted mb-2">
                                            <i class="fas fa-globe"></i> 主机: <span th:text="${server.hostname}">localhost</span>
                                        </p>
                                        <p class="card-text small text-muted mb-2">
                                            <i class="fas fa-plug"></i> 端口: <span th:text="${server.port}">8080</span>
                                        </p>
                                        <p class="card-text small text-muted mb-3">
                                            <i class="fas fa-folder"></i> 工作目录: <span th:text="${server.baseWorkDirectory}">./workspaces</span>
                                        </p>
                                        
                                        <!-- 实时监控数据 -->
                                        <div class="monitoring-metrics mb-3" th:data-server-id="${server.id}" style="display: none;">
                                            <div class="row g-2">
                                                <div class="col-4">
                                                    <div class="text-center p-2" style="background-color: #f8f9fa; border-radius: 4px;">
                                                        <i class="fas fa-microchip text-primary"></i>
                                                        <div class="cpu-usage font-weight-bold" style="font-size: 0.8rem;">--%</div>
                                                        <div style="font-size: 0.7rem; color: #6c757d;">CPU</div>
                                                    </div>
                                                </div>
                                                <div class="col-4">
                                                    <div class="text-center p-2" style="background-color: #f8f9fa; border-radius: 4px;">
                                                        <i class="fas fa-memory text-success"></i>
                                                        <div class="memory-usage font-weight-bold" style="font-size: 0.8rem;">--%</div>
                                                        <div style="font-size: 0.7rem; color: #6c757d;">内存</div>
                                                    </div>
                                                </div>
                                                <div class="col-4">
                                                    <div class="text-center p-2" style="background-color: #f8f9fa; border-radius: 4px;">
                                                        <i class="fas fa-hdd text-warning"></i>
                                                        <div class="disk-usage font-weight-bold" style="font-size: 0.8rem;">--%</div>
                                                        <div style="font-size: 0.7rem; color: #6c757d;">磁盘</div>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="text-center mt-2">
                                                <small class="text-muted last-update">正在获取监控数据...</small>
                                            </div>
                                        </div>
                                        
                                        <!-- SSH状态 -->
                                        <div class="mb-3">
                                            <span class="badge" 
                                                  th:classappend="${server.connectionStatus != null ? 
                                                                 (server.connectionStatus.name() == 'CONNECTED' ? 'bg-success' : 
                                                                  server.connectionStatus.name() == 'FAILED' ? 'bg-danger' :
                                                                  server.connectionStatus.name() == 'TIMEOUT' ? 'bg-warning' :
                                                                  server.connectionStatus.name() == 'AUTH_FAILED' ? 'bg-danger' :
                                                                  server.connectionStatus.name() == 'MONITORING' ? 'bg-primary' : 'bg-secondary') : 'bg-secondary'}"
                                                  th:text="${server.connectionStatus != null} ? 'SSH: ' + ${server.connectionStatus.description} : 'SSH: 未知'">
                                                SSH状态
                                            </span>
                                        </div>
                                        
                                        <div class="mt-3">
                                            <button class="btn btn-sm btn-outline-primary" th:data-id="${server.id}" onclick="viewServer(this)">
                                                <i class="fas fa-chart-line"></i> 详细信息
                                            </button>
                                            <button class="btn btn-sm btn-outline-info" th:data-id="${server.id}" onclick="toggleMonitoring(this)">
                                                <i class="fas fa-eye"></i> <span class="monitor-text">显示监控</span>
                                            </button>
                                            <button class="btn btn-sm btn-outline-success" th:data-id="${server.id}" onclick="refreshServer(this)">
                                                <i class="fas fa-sync-alt"></i> 刷新
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let monitoringInterval;
        let activeMonitoringServers = new Set();
        
        // CSRF Token 获取
        const csrfToken = document.querySelector('meta[name="_csrf"]').getAttribute('content');
        const csrfHeader = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');
        
        function refreshAllData() {
            location.reload();
        }
        
        function triggerHealthCheck() {
            const button = event.target.closest('button');
            const originalText = button.innerHTML;
            button.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 检查中...';
            button.disabled = true;
            
            fetch('/monitoring/trigger-health-check', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    [csrfHeader]: csrfToken
                }
            }).then(response => {
                if (response.ok) {
                    return response.json();
                } else {
                    throw new Error('健康检查触发失败');
                }
            }).then(data => {
                alert(data.message || '健康检查已启动');
                setTimeout(() => location.reload(), 2000);
            }).catch(error => {
                console.error('健康检查失败:', error);
                alert('健康检查失败，请稍后重试');
            }).finally(() => {
                button.innerHTML = originalText;
                button.disabled = false;
            });
        }
        
        function addServer() {
            window.location.href = '/admin/servers/new';
        }
        
        function viewServer(element) {
            const serverId = element.getAttribute('data-id');
            window.location.href = '/admin/servers/' + serverId;
        }
        
        function refreshServer(element) {
            const serverId = element.getAttribute('data-id');
            const button = element;
            const originalText = button.innerHTML;
            button.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 刷新中...';
            button.disabled = true;
            
            fetch('/admin/servers/' + serverId + '/refresh', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    [csrfHeader]: csrfToken
                }
            }).then(response => {
                if (response.ok) {
                    // 如果当前服务器正在显示监控数据，立即更新
                    if (activeMonitoringServers.has(serverId)) {
                        fetchServerMetrics(serverId);
                    }
                    location.reload();
                } else {
                    alert('刷新失败，请稍后重试');
                }
            }).catch(error => {
                console.error('刷新服务器状态失败:', error);
                alert('刷新失败，请稍后重试');
            }).finally(() => {
                button.innerHTML = originalText;
                button.disabled = false;
            });
        }
        
        function toggleMonitoring(element) {
            const serverId = element.getAttribute('data-id');
            const monitoringDiv = document.querySelector(`div[data-server-id="${serverId}"].monitoring-metrics`);
            const buttonText = element.querySelector('.monitor-text');
            const isHidden = monitoringDiv.style.display === 'none';
            
            if (isHidden) {
                monitoringDiv.style.display = 'block';
                buttonText.textContent = '隐藏监控';
                activeMonitoringServers.add(serverId);
                fetchServerMetrics(serverId);
            } else {
                monitoringDiv.style.display = 'none';
                buttonText.textContent = '显示监控';
                activeMonitoringServers.delete(serverId);
            }
        }
        
        function fetchServerMetrics(serverId) {
            const monitoringDiv = document.querySelector(`div[data-server-id="${serverId}"].monitoring-metrics`);
            if (!monitoringDiv || monitoringDiv.style.display === 'none') {
                return;
            }
            
            fetch(`/monitoring/server/${serverId}/metrics`, {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json',
                    [csrfHeader]: csrfToken
                }
            }).then(response => {
                if (response.ok) {
                    return response.json();
                } else {
                    throw new Error('获取监控数据失败');
                }
            }).then(data => {
                updateMetricsDisplay(serverId, data);
            }).catch(error => {
                console.error(`获取服务器 ${serverId} 监控数据失败:`, error);
                updateMetricsDisplay(serverId, null, '数据获取失败');
            });
        }
        
        function updateMetricsDisplay(serverId, metrics, errorMsg = null) {
            const monitoringDiv = document.querySelector(`div[data-server-id="${serverId}"].monitoring-metrics`);
            if (!monitoringDiv) return;
            
            const cpuElement = monitoringDiv.querySelector('.cpu-usage');
            const memoryElement = monitoringDiv.querySelector('.memory-usage');
            const diskElement = monitoringDiv.querySelector('.disk-usage');
            const lastUpdateElement = monitoringDiv.querySelector('.last-update');
            
            if (errorMsg) {
                cpuElement.textContent = '--';
                memoryElement.textContent = '--';
                diskElement.textContent = '--';
                lastUpdateElement.textContent = errorMsg;
                return;
            }
            
            if (metrics) {
                cpuElement.textContent = metrics.cpuUsage ? metrics.cpuUsage.toFixed(1) + '%' : '--%';
                memoryElement.textContent = metrics.memoryUsage ? metrics.memoryUsage.toFixed(1) + '%' : '--%';
                diskElement.textContent = metrics.diskUsage ? metrics.diskUsage.toFixed(1) + '%' : '--%';
                
                const now = new Date();
                lastUpdateElement.textContent = `最后更新: ${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')}`;
                
                // 根据使用率调整颜色
                updateUsageColor(cpuElement, metrics.cpuUsage);
                updateUsageColor(memoryElement, metrics.memoryUsage);
                updateUsageColor(diskElement, metrics.diskUsage);
            } else {
                cpuElement.textContent = '--%';
                memoryElement.textContent = '--%';
                diskElement.textContent = '--%';
                lastUpdateElement.textContent = '无数据';
            }
        }
        
        function updateUsageColor(element, usage) {
            if (!usage) return;
            
            element.className = 'font-weight-bold';
            element.style.fontSize = '0.8rem';
            
            if (usage >= 90) {
                element.style.color = '#dc3545'; // 危险红色
            } else if (usage >= 70) {
                element.style.color = '#ffc107'; // 警告黄色
            } else {
                element.style.color = '#28a745'; // 正常绿色
            }
        }
        
        // 定期刷新监控数据
        function startMonitoringRefresh() {
            if (monitoringInterval) {
                clearInterval(monitoringInterval);
            }
            
            monitoringInterval = setInterval(() => {
                activeMonitoringServers.forEach(serverId => {
                    fetchServerMetrics(serverId);
                });
            }, 30000); // 30秒刷新一次
        }
        
        // 页面加载完成后启动监控
        document.addEventListener('DOMContentLoaded', function() {
            startMonitoringRefresh();
        });
        
        // 页面卸载时清理定时器
        window.addEventListener('beforeunload', function() {
            if (monitoringInterval) {
                clearInterval(monitoringInterval);
            }
        });
    </script>
</body>
</html>
