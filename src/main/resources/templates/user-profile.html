<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/springsecurity" class="theme-light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人档案设置 - Dev Debug Platform</title>
    <!-- 防止主题闪烁的同步脚本 -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.body.classList.add('dark-theme');
                document.documentElement.classList.remove('theme-light');
                document.documentElement.classList.add('theme-dark');
            }
        })();
    </script>
    <link href="/vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/profile.css">
    <script src="/js/theme.js"></script>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body class="dashboard-body theme-body">
    <!-- 顶部导航栏 -->
    <nav class="top-nav">
        <div class="nav-brand">
            <div class="brand-icon">🚀</div>
            <span class="brand-text">Dev Debug Platform</span>
        </div>
        <div class="nav-menu">
            <div class="user-profile">
                <div class="user-avatar">
                    <span th:text="${#strings.substring(profile.username, 0, 1)}">A</span>
                </div>
                <div class="user-info">
                    <span class="greeting">欢迎回来</span>
                    <span class="username" th:text="${profile.username}">用户</span>
                </div>
            </div>
            <div class="nav-actions">
                <div class="theme-toggle" onclick="toggleTheme()" title="切换主题">
                    <span class="theme-icon">🌙</span>
                </div>
                <form th:action="@{/logout}" method="post" style="display: inline;">
                    <button type="submit" class="logout-btn" title="安全退出">
                        <span class="logout-icon">🚪</span>
                    </button>
                </form>
            </div>
        </div>
    </nav>

    <!-- 主要内容区域 -->
    <div class="dashboard-container theme-container">
        <!-- 侧边栏导航 -->
        <aside class="sidebar">
            <nav class="sidebar-nav">
                <ul>
                    <li class="nav-item">
                        <a href="/admin/dashboard" class="nav-link">
                            <span class="nav-icon">🏠</span>
                            <span class="nav-text">返回主页</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </aside>

        <!-- 主要内容 -->
        <main class="main-content">
            <!-- 页面标题 -->
            <div class="content-header">
                <h1 class="page-title">
                    <span class="title-icon">👤</span>
                    个人档案设置
                </h1>
                <nav class="breadcrumb">
                    <a href="/admin/dashboard">主页</a>
                    <span class="separator">></span>
                    <span class="current">个人档案</span>
                </nav>
            </div>

            <!-- 消息提示 -->
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
                <span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show">
                <span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- 档案内容 -->
            <div class="profile-container">
                <!-- 用户信息卡片 -->
                <div class="profile-card user-info-card">
                    <div class="card-header">
                        <h3 class="card-title">
                            <span class="card-icon">📋</span>
                            用户信息概览
                        </h3>
                    </div>
                    <div class="card-content">
                        <div class="user-avatar-large">
                            <span th:text="${#strings.substring(profile.username, 0, 1)}">A</span>
                        </div>
                        <div class="user-details">
                            <div class="detail-row">
                                <span class="detail-label">用户名：</span>
                                <span class="detail-value" th:text="${profile.username}">admin</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">角色：</span>
                                <div class="role-badges">
                                    <span th:each="role : ${profile.roles}" 
                                          class="role-badge" 
                                          th:classappend="${role == 'SUPER_ADMIN'} ? 'super-admin' : (${role == 'ADMIN'} ? 'admin' : 'user')"
                                          th:text="${role == 'SUPER_ADMIN'} ? '超级管理员' : (${role == 'ADMIN'} ? '管理员' : '开发者')">用户</span>
                                </div>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">注册时间：</span>
                                <span class="detail-value" th:text="${#temporals.format(profile.createdAt, 'yyyy-MM-dd HH:mm:ss')}">2025-01-01 12:00:00</span>
                            </div>
                            <div class="detail-row" th:if="${profile.lastLoginTime}">
                                <span class="detail-label">最后登录：</span>
                                <span class="detail-value" th:text="${#temporals.format(profile.lastLoginTime, 'yyyy-MM-dd HH:mm:ss')}">2025-01-01 12:00:00</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 统计信息卡片 -->
                <div class="profile-card stats-card">
                    <div class="card-header">
                        <h3 class="card-title">
                            <span class="card-icon">📊</span>
                            活动统计
                        </h3>
                    </div>
                    <div class="card-content">
                        <div class="stats-grid">
                            <div class="stat-item">
                                <div class="stat-icon">🚀</div>
                                <div class="stat-content">
                                    <div class="stat-number" th:text="${profile.totalApplications ?: 0}">0</div>
                                    <div class="stat-label">应用总数</div>
                                </div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-icon">🟢</div>
                                <div class="stat-content">
                                    <div class="stat-number" th:text="${profile.activeApplications ?: 0}">0</div>
                                    <div class="stat-label">运行中应用</div>
                                </div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-icon">🔗</div>
                                <div class="stat-content">
                                    <div class="stat-number" th:text="${profile.totalSessions ?: 0}">0</div>
                                    <div class="stat-label">总会话数</div>
                                </div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-icon">⌨️</div>
                                <div class="stat-content">
                                    <div class="stat-number" th:text="${profile.totalCommands ?: 0}">0</div>
                                    <div class="stat-label">执行命令数</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 个人信息设置 -->
                <div class="profile-card settings-card">
                    <div class="card-header">
                        <h3 class="card-title">
                            <span class="card-icon">✏️</span>
                            个人信息设置
                        </h3>
                    </div>
                    <div class="card-content">
                        <form th:action="@{/profile/update}" method="post" th:object="${profile}" class="profile-form">
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="username" class="form-label">用户名</label>
                                    <input type="text" id="username" class="form-control" 
                                           th:field="*{username}" readonly>
                                    <small class="form-text">用户名不可修改</small>
                                </div>
                                <div class="form-group">
                                    <label for="email" class="form-label">邮箱地址</label>
                                    <input type="email" id="email" class="form-control" 
                                           th:field="*{email}" required>
                                </div>
                            </div>
                            
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="fullName" class="form-label">真实姓名</label>
                                    <input type="text" id="fullName" class="form-control" 
                                           th:field="*{fullName}" placeholder="请输入真实姓名">
                                </div>
                                <div class="form-group">
                                    <label for="phone" class="form-label">联系电话</label>
                                    <input type="tel" id="phone" class="form-control" 
                                           th:field="*{phone}" placeholder="请输入联系电话">
                                </div>
                            </div>
                            
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="department" class="form-label">部门</label>
                                    <input type="text" id="department" class="form-control" 
                                           th:field="*{department}" placeholder="请输入所属部门">
                                </div>
                                <div class="form-group">
                                    <label for="workDirectory" class="form-label">工作目录</label>
                                    <input type="text" id="workDirectory" class="form-control" 
                                           th:field="*{workDirectory}" required>
                                </div>
                            </div>
                            
                            <div class="form-actions">
                                <button type="submit" class="btn btn-primary">
                                    <span class="btn-icon">💾</span>
                                    保存信息
                                </button>
                                <button type="reset" class="btn btn-secondary">
                                    <span class="btn-icon">🔄</span>
                                    重置
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- 密码修改 -->
                <div class="profile-card password-card">
                    <div class="card-header">
                        <h3 class="card-title">
                            <span class="card-icon">🔐</span>
                            密码修改
                        </h3>
                    </div>
                    <div class="card-content">
                        <form th:action="@{/profile/change-password}" method="post" th:object="${passwordChangeDto}" class="password-form">
                            <div class="form-group">
                                <label for="currentPassword" class="form-label">当前密码</label>
                                <input type="password" id="currentPassword" class="form-control" 
                                       th:field="*{currentPassword}" required>
                            </div>
                            
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="newPassword" class="form-label">新密码</label>
                                    <input type="password" id="newPassword" class="form-control" 
                                           th:field="*{newPassword}" required minlength="6">
                                    <small class="form-text">密码长度至少6位</small>
                                </div>
                                <div class="form-group">
                                    <label for="confirmNewPassword" class="form-label">确认新密码</label>
                                    <input type="password" id="confirmNewPassword" class="form-control" 
                                           th:field="*{confirmNewPassword}" required>
                                </div>
                            </div>
                            
                            <div class="form-actions">
                                <button type="submit" class="btn btn-warning">
                                    <span class="btn-icon">🔐</span>
                                    修改密码
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- 系统偏好设置 -->
                <div class="profile-card preferences-card">
                    <div class="card-header">
                        <h3 class="card-title">
                            <span class="card-icon">⚙️</span>
                            系统偏好设置
                        </h3>
                    </div>
                    <div class="card-content">
                        <form id="preferencesForm" th:object="${preferences}" class="preferences-form">
                            <!-- 界面主题 -->
                            <div class="preference-section">
                                <h4 class="section-title">
                                    <span class="section-icon">🎨</span>
                                    界面主题
                                </h4>
                                <div class="form-group">
                                    <label class="form-label">主题模式</label>
                                    <div class="theme-options">
                                        <label class="theme-option">
                                            <input type="radio" name="theme" value="light" th:field="*{theme}">
                                            <span class="option-content">
                                                <span class="option-icon">☀️</span>
                                                <span class="option-text">浅色模式</span>
                                            </span>
                                        </label>
                                        <label class="theme-option">
                                            <input type="radio" name="theme" value="dark" th:field="*{theme}">
                                            <span class="option-content">
                                                <span class="option-icon">🌙</span>
                                                <span class="option-text">深色模式</span>
                                            </span>
                                        </label>
                                        <label class="theme-option">
                                            <input type="radio" name="theme" value="auto" th:field="*{theme}">
                                            <span class="option-content">
                                                <span class="option-icon">🔄</span>
                                                <span class="option-text">自动切换</span>
                                            </span>
                                        </label>
                                    </div>
                                </div>
                            </div>

                            <!-- 通知设置 -->
                            <div class="preference-section">
                                <h4 class="section-title">
                                    <span class="section-icon">🔔</span>
                                    通知设置
                                </h4>
                                <div class="notification-options">
                                    <label class="checkbox-option">
                                        <input type="checkbox" th:field="*{emailNotifications}">
                                        <span class="checkmark"></span>
                                        <span class="option-content">
                                            <span class="option-title">邮件通知</span>
                                            <span class="option-desc">接收重要事件的邮件通知</span>
                                        </span>
                                    </label>
                                    
                                    <label class="checkbox-option">
                                        <input type="checkbox" th:field="*{systemNotifications}">
                                        <span class="checkmark"></span>
                                        <span class="option-content">
                                            <span class="option-title">系统通知</span>
                                            <span class="option-desc">接收系统消息和更新通知</span>
                                        </span>
                                    </label>
                                    
                                    <label class="checkbox-option">
                                        <input type="checkbox" th:field="*{applicationStatusNotifications}">
                                        <span class="checkmark"></span>
                                        <span class="option-content">
                                            <span class="option-title">应用状态通知</span>
                                            <span class="option-desc">应用启动、停止等状态变化通知</span>
                                        </span>
                                    </label>
                                    
                                    <label class="checkbox-option">
                                        <input type="checkbox" th:field="*{securityNotifications}">
                                        <span class="checkmark"></span>
                                        <span class="option-content">
                                            <span class="option-title">安全通知</span>
                                            <span class="option-desc">登录异常、权限变更等安全事件</span>
                                        </span>
                                    </label>
                                </div>
                            </div>

                            <!-- 仪表板设置 -->
                            <div class="preference-section">
                                <h4 class="section-title">
                                    <span class="section-icon">📊</span>
                                    仪表板设置
                                </h4>
                                <div class="form-row">
                                    <div class="form-group">
                                        <label for="dashboardLayout" class="form-label">布局样式</label>
                                        <select id="dashboardLayout" class="form-select" th:field="*{dashboardLayout}">
                                            <option value="default">默认布局</option>
                                            <option value="compact">紧凑布局</option>
                                            <option value="detailed">详细布局</option>
                                        </select>
                                    </div>
                                </div>
                                
                                <div class="dashboard-options">
                                    <label class="checkbox-option">
                                        <input type="checkbox" th:field="*{showWelcomeMessage}">
                                        <span class="checkmark"></span>
                                        <span class="option-content">
                                            <span class="option-title">显示欢迎信息</span>
                                            <span class="option-desc">在仪表板顶部显示欢迎消息</span>
                                        </span>
                                    </label>
                                    
                                    <label class="checkbox-option">
                                        <input type="checkbox" th:field="*{showQuickActions}">
                                        <span class="checkmark"></span>
                                        <span class="option-content">
                                            <span class="option-title">显示快捷操作</span>
                                            <span class="option-desc">显示常用功能的快捷按钮</span>
                                        </span>
                                    </label>
                                    
                                    <label class="checkbox-option">
                                        <input type="checkbox" th:field="*{showRecentActivity}">
                                        <span class="checkmark"></span>
                                        <span class="option-content">
                                            <span class="option-title">显示最近活动</span>
                                            <span class="option-desc">显示最近的操作活动历史</span>
                                        </span>
                                    </label>
                                </div>
                            </div>

                            <!-- 终端设置 -->
                            <div class="preference-section">
                                <h4 class="section-title">
                                    <span class="section-icon">💻</span>
                                    终端设置
                                </h4>
                                <div class="form-row">
                                    <div class="form-group">
                                        <label for="terminalTheme" class="form-label">终端主题</label>
                                        <select id="terminalTheme" class="form-select" th:field="*{terminalTheme}">
                                            <option value="dark">深色主题</option>
                                            <option value="light">浅色主题</option>
                                        </select>
                                    </div>
                                    <div class="form-group">
                                        <label for="terminalFontSize" class="form-label">字体大小</label>
                                        <select id="terminalFontSize" class="form-select" th:field="*{terminalFontSize}">
                                            <option value="12">12px</option>
                                            <option value="14">14px</option>
                                            <option value="16">16px</option>
                                            <option value="18">18px</option>
                                            <option value="20">20px</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label for="terminalFontFamily" class="form-label">字体族</label>
                                    <select id="terminalFontFamily" class="form-select" th:field="*{terminalFontFamily}">
                                        <option value="Monaco">Monaco</option>
                                        <option value="Consolas">Consolas</option>
                                        <option value="Courier New">Courier New</option>
                                        <option value="monospace">monospace</option>
                                    </select>
                                </div>
                            </div>

                            <!-- 语言设置 -->
                            <div class="preference-section">
                                <h4 class="section-title">
                                    <span class="section-icon">🌐</span>
                                    语言设置
                                </h4>
                                <div class="form-row">
                                    <div class="form-group">
                                        <label for="language" class="form-label">界面语言</label>
                                        <select id="language" class="form-select" th:field="*{language}">
                                            <option value="zh_CN">简体中文</option>
                                            <option value="en_US">English</option>
                                        </select>
                                    </div>
                                    <div class="form-group">
                                        <label for="timeZone" class="form-label">时区设置</label>
                                        <select id="timeZone" class="form-select" th:field="*{timeZone}">
                                            <option value="Asia/Shanghai">中国标准时间 (UTC+8)</option>
                                            <option value="UTC">协调世界时 (UTC+0)</option>
                                            <option value="America/New_York">美国东部时间</option>
                                            <option value="Europe/London">英国时间</option>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <div class="form-actions">
                                <button type="submit" class="btn btn-success" id="savePreferences">
                                    <span class="btn-icon">💾</span>
                                    保存偏好设置
                                </button>
                                <button type="button" class="btn btn-secondary" onclick="resetPreferences()">
                                    <span class="btn-icon">🔄</span>
                                    恢复默认
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- JavaScript -->
    <script src="/vendor/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="/js/profile.js"></script>
</body>
</html>
