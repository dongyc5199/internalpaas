<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 功能管理 · 模型配置</title>
    <link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="/css/ai-panel.css">
    <style>
        .models-page { padding:16px; }
        .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
        .list { display:flex; flex-direction:column; gap:8px; }
        .item { display:flex; justify-content:space-between; align-items:center; background:#121722; border:1px solid #262b36; border-radius:8px; padding:8px 10px; }
        .modal[hidden]{ display:none; }
        .modal .modal-content { max-width:520px; }
        .form-row { display:flex; gap:8px; margin-bottom:8px; }
        .form-row label { flex:1; display:flex; flex-direction:column; font-size:12px; color:#a9b0c3; }
        .form-row select, .form-row input { margin-top:4px; background:#0b0e14; border:1px solid #262b36; color:#e6e8ee; padding:6px 8px; border-radius:6px; }
    </style>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
  </head>
<body class="vscode-theme">
  <header class="mini-topbar">
    <div class="mini-left">debugAI / 模型配置</div>
    <div class="mini-right">
      <a class="btn ghost sm" href="/terminal/ai-panel">返回对话</a>
    </div>
  </header>
  <main class="models-page">
    <div class="header">
      <h2 style="margin:0;font-size:16px;">已配置的模型</h2>
      <button class="btn primary sm" id="btnAddModel">添加模型</button>
    </div>
    <section class="list" id="modelList"></section>
  </main>

  <div class="modal" id="addModelModal" role="dialog" aria-modal="true" hidden>
    <div class="modal-content">
      <div class="modal-head"><div class="title">添加模型</div><button class="btn ghost" id="btnCloseAdd">✕</button></div>
      <div class="modal-body">
        <div class="form-row">
          <label>服务商
            <select id="fieldProvider">
              <option value="Kimi">Kimi</option>
              <option value="DeepSeek">DeepSeek</option>
              <option value="Doubao">Doubao</option>
            </select>
          </label>
        </div>
        <div class="form-row">
          <label>模型
            <select id="fieldModel">
              <option value="Kimi K2">Kimi K2</option>
              <option value="DeepSeek V3">DeepSeek V3</option>
              <option value="Doubao Seed">Doubao Seed</option>
            </select>
          </label>
        </div>
        <div class="form-row">
          <label>API 秘钥
            <input type="password" id="fieldKey" placeholder="输入 API Key" />
          </label>
        </div>
      </div>
      <div class="modal-foot"><div></div><div><button class="btn primary" id="btnSaveModel">添加模型</button></div></div>
    </div>
  </div>

  <script>
    (function(){
      const $ = (s, c=document)=>c.querySelector(s);
      function csrf(){
        const token=document.querySelector('meta[name="_csrf"]').content; const header=document.querySelector('meta[name="_csrf_header"]').content; return {token, header};
      }
      async function load(){ try{ const res=await fetch('/api/ai/models/detailed'); return await res.json(); }catch{return []} }
      async function render(){ const list=$('#modelList'); list.innerHTML=''; const data=await load(); if (!data.length){ const empty=document.createElement('div'); empty.style.color='#a9b0c3'; empty.textContent='暂无模型，请点击“添加模型”'; list.appendChild(empty); return;} data.forEach(m=>{ const el=document.createElement('div'); el.className='item'; el.innerHTML=`<div>${m.provider||m.clientId} · ${m.model||''}</div>`; list.appendChild(el); }); }
      render();
      const modal=$('#addModelModal');
      $('#btnAddModel')?.addEventListener('click', ()=>modal.removeAttribute('hidden'));
      $('#btnCloseAdd')?.addEventListener('click', ()=>modal.setAttribute('hidden',''));
      $('#btnSaveModel')?.addEventListener('click', ()=>{
        const provider=$('#fieldProvider').value; const model=$('#fieldModel').value; const key=$('#fieldKey').value.trim();
        const {token, header}=csrf();
        fetch('/api/ai/models', { method:'POST', headers: Object.assign({'Content-Type':'application/json'}, token?{[header]:token}:{}) , body: JSON.stringify({ provider, model, apiKey: key })})
          .then(()=>{ modal.setAttribute('hidden',''); render(); })
          .catch(()=> alert('添加失败'));
      });
    })();
  </script>
  </body>
  </html>
