<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>AI 面板原型 · IPaaS</title>
    <link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="/vendor/prism/prism.min.css">
    <link rel="stylesheet" href="/vendor/prism/prism-tomorrow.min.css">
    <link rel="stylesheet" href="/css/ai-panel.css">
    <script src="/vendor/markdown-it/markdown-it.min.js" defer></script>
    <script src="/vendor/markdown-it/markdown-it-task-lists.min.js" defer></script>
    <script src="/vendor/markdown-it/markdown-it-emoji.min.js" defer></script>
    <script src="/vendor/markdown-it/multimd-table.min.js" defer></script>
    <script src="/vendor/markdown-it/markdown-it-task-lists.min.js" defer></script>
</head>
<body class="vscode-theme">
<header class="mini-topbar" role="banner">
    <div class="mini-left">debugAI</div>
    <div class="mini-right" role="toolbar" aria-label="顶栏操作">
        <button class="btn ghost sm" id="btnNewSession" title="新建会话">新建会话</button>
        <div class="dropdown-wrap">
            <button class="btn ghost sm" id="btnHistory" title="历史会话" aria-haspopup="true" aria-expanded="false">历史会话</button>
            <div class="menu" id="historyMenu" hidden>
                <div class="group"><div class="group-title">本周</div><ul id="histThisWeek"></ul></div>
                <div class="group"><div class="group-title">今年</div><ul id="histThisYear"></ul></div>
            </div>
        </div>
        <a class="btn ghost sm" id="btnFeatures" href="/terminal/ai-models" title="AI功能管理">AI功能管理</a>
        <a class="btn ghost sm" id="btnClose" href="/terminal" title="关闭">关闭</a>
    </div>
    <div class="sr-only" aria-live="polite" id="ariaLive"></div>
</header>

<main class="layout" role="main">
    <section class="messages" id="messageList" aria-label="消息流" tabindex="0"></section>

    <section class="drawer-bar" role="tablist" aria-label="抽屉状态">
        <button class="tab active" data-target="#planDrawer" role="tab" aria-controls="planDrawer">Plan: <strong>3</strong></button>
        <button class="tab" data-target="#contextDrawer" role="tab" aria-controls="contextDrawer">Context: <strong>2</strong></button>
        <button class="tab" data-target="#resultsDrawer" role="tab" aria-controls="resultsDrawer">Results: <strong>1</strong></button>
        <button class="tab" data-target="#settingsDrawer" role="tab" aria-controls="settingsDrawer">设置</button>
    </section>
    <section class="drawers" aria-live="polite">
        <div class="drawer open" id="planDrawer" role="tabpanel">
            <ol class="plan">
                <li><span class="status running">Running</span> 检查样式结构 (~20s) <span class="risk low">低风险</span> <span class="perm ro">只读</span></li>
                <li><span class="status wait">Waiting Approval</span> 生成 Patch <span class="risk mid">中风险</span> <span class="perm rw">写文件</span> <button class="btn sm primary" data-open-diff>审核</button></li>
                <li><span class="status draft">Draft</span> 更新测试</li>
            </ol>
            <div class="plan-actions">
                <button class="btn sm" id="btnRunStep">Run Step</button>
                <button class="btn sm" id="btnRunAll">Run All</button>
                <button class="btn sm" id="btnRetry">Retry</button>
                <button class="btn sm" id="btnSkip">Skip</button>
            </div>
        </div>
        <div class="drawer" id="contextDrawer" role="tabpanel" hidden>
            <ul class="context">
                <li><label><input type="checkbox" checked> 打开文件：server.html, drawer.js</label></li>
                <li><label><input type="checkbox"> 选区摘要（120 行）</label></li>
                <li><label><input type="checkbox"> 终端输出（最近 200 行）</label></li>
            </ul>
        </div>
        <div class="drawer" id="resultsDrawer" role="tabpanel" hidden>
            <ul class="results">
                <li>应用结果 #1021 · 2 hunks applied · <button class="btn link" data-undo>撤销</button></li>
            </ul>
        </div>
        <div class="drawer" id="settingsDrawer" role="tabpanel" hidden>
            <div class="settings-section">
                <h3 style="margin-bottom: 16px; color: var(--foreground, #333); font-size: 14px; font-weight: 600;">AI 聊天设置</h3>

                <div class="setting-item" style="margin-bottom: 20px;">
                    <label style="display: flex; align-items: center; cursor: pointer;">
                        <input type="checkbox" id="aiStreamingEnabled" checked style="margin-right: 8px; cursor: pointer;">
                        <span style="font-weight: 500;">启用打字机效果</span>
                    </label>
                    <p style="margin: 8px 0 0 24px; font-size: 12px; color: var(--muted-foreground, #666);">
                        AI 回复将逐字符流式显示，提升互动体验
                    </p>
                </div>

                <div class="setting-item" style="margin-bottom: 20px;">
                    <label for="aiStreamingSpeed" style="display: block; margin-bottom: 8px; font-weight: 500;">流式速度</label>
                    <select id="aiStreamingSpeed" style="width: 200px; padding: 6px 10px; border: 1px solid var(--border, #ddd); border-radius: 4px; background: var(--background, #fff); color: var(--foreground, #333); cursor: pointer;">
                        <option value="slow">慢速 (30 字符/秒)</option>
                        <option value="normal" selected>正常 (50 字符/秒)</option>
                        <option value="fast">快速 (80 字符/秒)</option>
                    </select>
                    <p style="margin: 8px 0 0 0; font-size: 12px; color: var(--muted-foreground, #666);">
                        调整 AI 回复的显示速度
                    </p>
                </div>

                <div style="margin-top: 24px; padding: 12px; background: rgba(59, 130, 246, 0.1); border-left: 3px solid #3b82f6; border-radius: 4px;">
                    <p style="margin: 0; font-size: 12px; color: var(--foreground, #333);">
                        💡 <strong>提示：</strong>在流式输出过程中，您可以点击消息区域立即显示完整内容。
                    </p>
                </div>
            </div>
        </div>
    </section>

    <footer class="composer" aria-label="输入与模型">
        <div class="suggestion-bar" id="suggestionBar" hidden></div>
        <div class="input-shell">
            <div class="chips" id="contextChips" aria-label="上下文标签"></div>
            <textarea id="composerInput" placeholder="添加上下文(#)、扩展(@)、命令(/)"></textarea>
            <div class="hashtag-pop" id="hashtagPop" hidden>
                <div class="pop-title">选择对话加入上下文</div>
                <ul id="hashtagList"></ul>
            </div>
        </div>
        <div class="bottom-row">
            <div class="left-controls">
                <div class="modes" role="tablist" aria-label="模式切换">
                    <button class="mode active" data-mode="ask" role="tab" aria-selected="true">ask</button>
                    <button class="mode" data-mode="agent" role="tab" aria-selected="false">agent</button>
                </div>
                <div class="models">
                    <button class="model" data-model="Kimi K2">Kimi K2</button>
                    <button class="model" data-model="DeepSeek">DeepSeek</button>
                    <button class="model" data-model="Doubao">Doubao</button>
                </div>
            </div>
            <div class="right-controls">
                <button class="btn voice" id="btnVoice" title="语音输入"><span class="dot"></span> 语音</button>
                <button class="btn primary btn-icon" id="btnSend" title="发送">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M14.5 1.5L6.5 9.5M14.5 1.5L10 14.5L6.5 9.5M14.5 1.5L1.5 6L6.5 9.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>
        </div>
    </footer>

    <!-- 简化后原型不包含 Diff 预览对话框，后续按需再加 -->
</main>

<script src="/vendor/prism/prism.min.js"></script>
<script src="/vendor/prism/prism-json.min.js"></script>
<script src="/vendor/prism/prism-yaml.min.js"></script>
<script src="/js/ai-panel.js"></script>
</body>
</html>
