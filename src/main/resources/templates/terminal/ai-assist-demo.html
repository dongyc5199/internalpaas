<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>终端 · AI 助手 Demo</title>
    <link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/dashboard-theme.css">
    <link rel="stylesheet" href="/vendor/xterm/xterm.css">
    <script src="/vendor/xterm/xterm.js"></script>
    <script src="/vendor/xterm/addons/fit/fit.js"></script>
    <script src="/js/theme.js"></script>
    <style>
        body {
            background: #10141a;
            color: #f5f6fa;
            font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            margin: 0;
        }
        .layout {
            display: grid;
            grid-template-columns: 1.6fr 1fr;
            gap: 20px;
            padding: 24px;
            height: 100vh;
            box-sizing: border-box;
        }
        .panel {
            background: rgba(20, 24, 32, 0.92);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .panel-header {
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .panel-header h2 {
            font-size: 1.1rem;
            font-weight: 600;
            margin: 0;
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .badge {
            font-size: 0.78rem;
            padding: 4px 10px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .terminal-body {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        #terminal {
            flex: 1;
            background: #000;
            padding: 12px;
            border-radius: 12px;
            margin: 16px;
        }
        .toolbar {
            display: flex;
            gap: 10px;
            padding: 12px 16px;
            align-items: center;
        }
        .toolbar select,
        .toolbar button {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: inherit;
            border-radius: 10px;
            padding: 8px 12px;
        }
        .suggestions {
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding: 14px 16px;
            min-height: 56px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .suggestion-chip {
            padding: 6px 12px;
            border-radius: 999px;
            background: rgba(63, 140, 255, 0.14);
            border: 1px solid rgba(63, 140, 255, 0.35);
            cursor: pointer;
            font-size: 0.88rem;
        }
        .chat-body {
            flex: 1;
            display: grid;
            grid-template-rows: auto 1fr auto;
        }
        .model-selector {
            padding: 14px 16px;
            display: flex;
            gap: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .model-selector select,
        .model-selector button {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: inherit;
            border-radius: 10px;
            padding: 8px 12px;
        }
        .chat-history {
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .chat-entry {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 10px 12px;
            max-width: 96%;
        }
        .chat-entry.user {
            align-self: flex-end;
            background: rgba(80, 227, 194, 0.18);
        }
        .chat-entry.assistant {
            align-self: flex-start;
            background: rgba(66, 135, 245, 0.16);
        }
        .chat-entry .meta {
            font-size: 0.75rem;
            opacity: 0.7;
            margin-bottom: 4px;
        }
        .chat-input {
            padding: 14px 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 12px;
        }
        .chat-input textarea {
            resize: none;
            min-height: 80px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(12, 14, 20, 0.85);
            color: inherit;
            padding: 10px;
        }
        .chat-input button {
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #f7971e 0%, #ffd200 100%);
            color: #1b1d24;
            font-weight: 600;
            padding: 0 18px;
        }
        @media (max-width: 1200px) {
            .layout {
                grid-template-columns: 1fr;
                height: auto;
                padding-bottom: 48px;
            }
        }
    </style>
</head>
<body>
<nav class="top-nav">
    <div class="nav-brand">
        <span class="brand-icon">💡</span>
        <span class="brand-text">终端智能助手 Demo</span>
    </div>
    <div class="nav-actions">
        <a href="/terminal" class="logout-btn" title="返回终端主页">
            <span class="logout-icon">←</span>
        </a>
    </div>
</nav>

<div class="layout">
    <section class="panel">
        <div class="panel-header">
            <h2>💻 实时终端</h2>
            <span class="badge" id="terminalStatusBadge">未连接</span>
        </div>
        <div class="toolbar">
            <select id="serverSelector">
                <option value="">选择服务器</option>
                <option th:each="server : ${servers}"
                        th:value="${server.id}"
                        th:text="${server.name + ' (' + server.hostname + ')'}">
                </option>
            </select>
            <button id="connectBtn" type="button">连接</button>
            <button id="completionBtn" type="button">智能补全 (Ctrl+Space)</button>
        </div>
        <div class="terminal-body">
            <div id="terminal"></div>
            <div class="suggestions" id="suggestionChips">
                <span class="text-muted">等待输入以生成命令建议...</span>
            </div>
        </div>
    </section>

    <section class="panel">
        <div class="panel-header">
            <h2>🤖 AI 对话</h2>
            <span class="badge" id="modelStatus">模型未选择</span>
        </div>
        <div class="chat-body">
            <div class="model-selector">
                <select id="modelSelector">
                    <option value="">选择模型</option>
                    <option value="echo">本地 Echo</option>
                    <option value="ollama">Ollama</option>
                    <option value="moonshot">Kimi K2</option>
                </select>
                <button id="startChatBtn" type="button">启用模型</button>
            </div>
            <div class="chat-history" id="chatHistory">
                <div class="chat-entry assistant">
                    <div class="meta">AI 助手</div>
                    <div>请选择模型并连接终端后提问，我可以结合终端上下文给出建议。</div>
                </div>
            </div>
            <div class="chat-input">
                <textarea id="chatInput" placeholder="例如：帮我检查当前服务的 CPU 使用情况。"></textarea>
                <button id="sendChatBtn" type="button">发送</button>
            </div>
        </div>
    </section>
</div>

<script>
    const TerminalConstructor = window.Terminal || Terminal;
    const FitAddon = window.fit || window.fitAddon;

    const term = new TerminalConstructor({
        fontFamily: 'Fira Code, Consolas, monospace',
        fontSize: 14,
        cursorBlink: true,
        theme: { background: '#050607', foreground: '#f5f6fa' }
    });
    const fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);
    term.open(document.getElementById('terminal'));
    fitAddon.fit();
    term.writeln('┌──────────────────────────────────────────────┐');
    term.writeln('│  欢迎使用 Internal PaaS 终端 + AI Demo        │');
    term.writeln('│  连接服务器后体验命令补全与智能聊天能力       │');
    term.writeln('└──────────────────────────────────────────────┘');

    window.addEventListener('resize', () => fitAddon.fit());

    let activeWs = null;
    let currentServerId = null;
    let modelReady = false;
    let currentChatId = null;
    let terminalTailBuffer = '';
    const TERMINAL_TAIL_MAX = 2000;

    const csrfToken = document.querySelector('meta[name=\"_csrf\"]')?.content;
    const csrfHeader = document.querySelector('meta[name=\"_csrf_header\"]')?.content;

    function recordTerminalOutput(chunk) {
        if (!chunk) return;
        terminalTailBuffer = (terminalTailBuffer + chunk).slice(-TERMINAL_TAIL_MAX);
    }

    function getTerminalTail() {
        return terminalTailBuffer.slice(-800);
    }

    function updateTerminalStatus(text, healthy) {
        const badge = document.getElementById('terminalStatusBadge');
        badge.textContent = text;
        badge.style.background = healthy ? 'rgba(39,174,96,0.2)' : 'rgba(235,87,87,0.2)';
        badge.style.borderColor = healthy ? 'rgba(39,174,96,0.45)' : 'rgba(235,87,87,0.45)';
    }

    function updateModelStatus(text, active) {
        const badge = document.getElementById('modelStatus');
        badge.textContent = text;
        badge.style.background = active ? 'rgba(86,180,255,0.2)' : 'rgba(255, 255, 255, 0.08)';
        badge.style.borderColor = active ? 'rgba(86,180,255,0.45)' : 'rgba(255, 255, 255, 0.12)';
    }

    document.getElementById('connectBtn').addEventListener('click', () => {
        const serverId = document.getElementById('serverSelector')?.value;
        if (!serverId) {
            alert('请选择服务器');
            return;
        }
        currentServerId = serverId;
        connectTerminal(serverId);
    });

    function connectTerminal(serverId) {
        if (activeWs) {
            activeWs.close();
        }
        const ws = new WebSocket('/ws/ssh-terminal');
        activeWs = ws;
        updateTerminalStatus('连接中…', false);

        ws.onopen = () => {
            updateTerminalStatus('连接成功', true);
            ws.send(JSON.stringify({
                type: 'connect',
                serverId: Number(serverId),
                terminalType: 'xterm-256color',
                windowSize: `${term.cols}x${term.rows}`
            }));
        };

        ws.onmessage = (event) => {
            try {
                const payload = JSON.parse(event.data);
                if (payload.type === 'output') {
                    term.write(payload.data);
                    recordTerminalOutput(payload.data);
                } else if (payload.type === 'connected') {
                    term.writeln(`\r\n已连接至 ${payload.serverName}`);
                } else if (payload.type === 'error') {
                    term.writeln(`\r\n[错误] ${payload.message}`);
                }
            } catch (err) {
                term.write(event.data);
                recordTerminalOutput(event.data);
            }
        };

        ws.onclose = () => {
            updateTerminalStatus('已断开', false);
            term.writeln('\r\n会话已关闭');
        };

        term.focus();
        term.onData(data => {
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'input', data }));
            }
        });
    }

    document.getElementById('completionBtn').addEventListener('click', triggerCompletion);
    term.onKey(e => {
        if (e.domEvent.ctrlKey && e.domEvent.code === 'Space') {
            e.domEvent.preventDefault();
            triggerCompletion();
        }
    });

    function triggerCompletion() {
        if (!currentServerId) {
            alert('请先连接终端');
            return;
        }
        const headers = { 'Content-Type': 'application/json' };
        if (csrfToken && csrfHeader) headers[csrfHeader] = csrfToken;
        fetch('/ai/completion/suggest', {
            method: 'POST',
            headers,
            body: JSON.stringify({
                serverId: Number(currentServerId),
                prompt: getTerminalTail(),
                maxSuggestions: 3
            })
        })
            .then(res => res.ok ? res.json() : Promise.reject(res))
            .then(showSuggestions)
            .catch(() => showSuggestions({
                suggestions: [
                    { text: 'ls -lah', provider: '历史命令' },
                    { text: 'journalctl -fu internal-paas', provider: '示例建议' }
                ]
            }));
    }

    function showSuggestions(result) {
        const container = document.getElementById('suggestionChips');
        container.innerHTML = '';
        const list = result?.suggestions || [];
        if (!list.length) {
            container.innerHTML = '<span class="text-muted">暂无建议</span>';
            return;
        }
        list.forEach(item => {
            const chip = document.createElement('span');
            chip.className = 'suggestion-chip';
            chip.textContent = `${item.text} · ${item.provider || 'AI'}`;
            chip.addEventListener('click', () => {
                if (activeWs && activeWs.readyState === WebSocket.OPEN) {
                    activeWs.send(JSON.stringify({ type: 'input', data: item.text + '\n' }));
                }
            });
            container.appendChild(chip);
        });
    }

    document.getElementById('startChatBtn').addEventListener('click', () => {
        const modelId = document.getElementById('modelSelector').value;
        if (!modelId) {
            alert('请选择模型');
            return;
        }
        modelReady = true;
        currentChatId = `chat-${currentServerId || 'local'}-${Date.now()}`;
        updateModelStatus(`模型已连接 · ${modelId}`, true);
        appendAssistantMessage(`模型 ${modelId} 已就绪，可以结合终端上下文进行分析。`);
    });

    document.getElementById('sendChatBtn').addEventListener('click', sendChat);
    document.getElementById('chatInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendChat();
        }
    });

    function sendChat() {
        const textarea = document.getElementById('chatInput');
        const content = textarea.value.trim();
        if (!content) return;
        if (!modelReady) {
            alert('请先启用模型');
            return;
        }
        if (!currentChatId) {
            currentChatId = `chat-${currentServerId || 'local'}-${Date.now()}`;
        }
        appendUserMessage(content);
        textarea.value = '';

        const headers = { 'Content-Type': 'application/json' };
        if (csrfToken && csrfHeader) headers[csrfHeader] = csrfToken;
        const payload = {
            chatId: currentChatId,
            model: document.getElementById('modelSelector').value || 'echo',
            message: content,
            sessionId: currentServerId,
            terminalTail: getTerminalTail()
        };
        fetch('/ai/chat/stream', {
            method: 'POST',
            headers,
            body: JSON.stringify(payload)
        })
            .then(res => res.body ? streamResponse(res.body) : res.json())
            .catch(() => appendAssistantMessage('请求失败，请检查服务是否已开启。'));
    }

    function appendUserMessage(text) {
        const node = document.createElement('div');
        node.className = 'chat-entry user';
        node.innerHTML = `<div class="meta">你 · ${new Date().toLocaleTimeString()}</div><div>${text}</div>`;
        document.getElementById('chatHistory').appendChild(node);
        scrollHistoryBottom();
    }

    function appendAssistantMessage(text) {
        const node = document.createElement('div');
        node.className = 'chat-entry assistant';
        node.innerHTML = `<div class="meta">AI 助手 · ${new Date().toLocaleTimeString()}</div><div>${text}</div>`;
        document.getElementById('chatHistory').appendChild(node);
        scrollHistoryBottom();
    }

    async function streamResponse(stream) {
        const reader = stream.getReader();
        const decoder = new TextDecoder();
        let remainder = '';
        let streamingContent = '';

        const entry = document.createElement('div');
        entry.className = 'chat-entry assistant';
        entry.innerHTML = `<div class="meta">AI 助手 · ${new Date().toLocaleTimeString()}</div><div class="content"></div>`;
        const contentNode = entry.querySelector('.content');
        document.getElementById('chatHistory').appendChild(entry);

        const processChunk = (chunk) => {
            const lines = chunk.split('\n');
            let event = 'message';
            const dataParts = [];
            lines.forEach(line => {
                if (line.startsWith('event:')) {
                    event = line.slice(6).trim();
                } else if (line.startsWith('data:')) {
                    dataParts.push(line.slice(5));
                }
            });
            const data = dataParts.join('\n');
            if (!data) return;
            if (event === 'token' || event === 'message') {
                streamingContent += data;
                contentNode.textContent = streamingContent;
            } else if (event === 'error') {
                streamingContent += `\n[错误] ${data}`;
                contentNode.textContent = streamingContent;
                entry.classList.add('error');
            }
            scrollHistoryBottom();
        };

        while (true) {
            const { value, done } = await reader.read();
            if (done) break;
            remainder += decoder.decode(value || new Uint8Array(), { stream: true });
            let boundary;
            while ((boundary = remainder.indexOf('\n\n')) !== -1) {
                const chunk = remainder.slice(0, boundary);
                remainder = remainder.slice(boundary + 2);
                processChunk(chunk);
            }
        }
        if (remainder.trim()) {
            processChunk(remainder);
        }
    }

    function scrollHistoryBottom() {
        const history = document.getElementById('chatHistory');
        history.scrollTop = history.scrollHeight;
    }
</script>
</body>
</html>
