<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSH连接测试 - InternalPaaS</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .test-container {
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        
        .test-header {
            text-align: center;
            margin-bottom: 30px;
            color: #1e293b;
        }
        
        .test-form {
            display: grid;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
        }
        
        .form-group label {
            font-weight: 600;
            margin-bottom: 5px;
            color: #374151;
        }
        
        .form-group input, .form-group select {
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
        }
        
        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background: #3b82f6;
            color: white;
        }
        
        .btn-primary:hover {
            background: #2563eb;
        }
        
        .btn-secondary {
            background: #6b7280;
            color: white;
        }
        
        .btn-secondary:hover {
            background: #4b5563;
        }
        
        .result-container {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            display: none;
        }
        
        .result-success {
            background: #dcfce7;
            border: 1px solid #16a34a;
            color: #15803d;
        }
        
        .result-error {
            background: #fef2f2;
            border: 1px solid #dc2626;
            color: #dc2626;
        }
        
        .servers-list {
            margin-top: 30px;
        }
        
        .server-card {
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .server-card:hover {
            border-color: #3b82f6;
            background: #f8fafc;
        }
        
        .server-name {
            font-weight: 600;
            color: #1e293b;
        }
        
        .server-details {
            font-size: 12px;
            color: #6b7280;
            margin-top: 5px;
        }
        
        .loading {
            opacity: 0.6;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <div class="test-header">
            <h1>🔗 SSH连接测试工具</h1>
            <p>测试InternalPaaS的SSH连接功能</p>
        </div>
        
        <form class="test-form" id="sshTestForm">
            <div class="form-row">
                <div class="form-group">
                    <label for="host">主机地址</label>
                    <input type="text" id="host" name="host" value="localhost" required>
                </div>
                <div class="form-group">
                    <label for="port">端口</label>
                    <input type="number" id="port" name="port" value="2222" required>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" id="username" name="username" value="testuser" required>
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" name="password" value="admin123" required>
                </div>
            </div>
            
            <div class="form-group">
                <label for="command">测试命令 (可选)</label>
                <input type="text" id="command" name="command" value="whoami && pwd && date" placeholder="留空则只测试连接">
            </div>
            
            <div class="btn-group">
                <button type="button" class="btn btn-primary" onclick="testConnection()">🔗 测试连接</button>
                <button type="button" class="btn btn-secondary" onclick="executeCommand()">⚡ 执行命令</button>
                <button type="button" class="btn btn-secondary" onclick="loadTestServers()">📋 加载预设</button>
            </div>
        </form>
        
        <div class="result-container" id="resultContainer">
            <pre id="resultText"></pre>
        </div>
        
        <div class="servers-list" id="serversList">
            <h3>📋 预设测试服务器</h3>
            <div id="serversContainer">
                <!-- 动态加载服务器列表 -->
            </div>
        </div>
    </div>
    
    <script>
        // 测试SSH连接
        function testConnection() {
            const form = document.getElementById('sshTestForm');
            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());
            
            // 转换端口为数字
            data.port = parseInt(data.port);
            
            showLoading(true);
            
            fetch('/test/ssh/connect', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(result => {
                showResult(result.success, JSON.stringify(result, null, 2));
            })
            .catch(error => {
                showResult(false, '请求失败: ' + error.message);
            })
            .finally(() => {
                showLoading(false);
            });
        }
        
        // 执行SSH命令
        function executeCommand() {
            const form = document.getElementById('sshTestForm');
            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());
            
            if (!data.command.trim()) {
                alert('请输入要执行的命令');
                return;
            }
            
            // 转换端口为数字
            data.port = parseInt(data.port);
            
            showLoading(true);
            
            fetch('/test/ssh/execute', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(result => {
                showResult(result.success, JSON.stringify(result, null, 2));
            })
            .catch(error => {
                showResult(false, '请求失败: ' + error.message);
            })
            .finally(() => {
                showLoading(false);
            });
        }
        
        // 加载预设测试服务器
        function loadTestServers() {
            fetch('/test/ssh/servers')
            .then(response => response.json())
            .then(result => {
                if (result.success) {
                    displayServers(result.servers);
                }
            })
            .catch(error => {
                console.error('加载服务器列表失败:', error);
            });
        }
        
        // 显示服务器列表
        function displayServers(servers) {
            const container = document.getElementById('serversContainer');
            container.innerHTML = '';
            
            servers.forEach(server => {
                const card = document.createElement('div');
                card.className = 'server-card';
                card.onclick = () => useServerConfig(server);
                
                card.innerHTML = `
                    <div class="server-name">${server.name}</div>
                    <div class="server-details">
                        ${server.host}:${server.port} | ${server.username}/${server.password}
                    </div>
                `;
                
                container.appendChild(card);
            });
        }
        
        // 使用服务器配置
        function useServerConfig(server) {
            document.getElementById('host').value = server.host;
            document.getElementById('port').value = server.port;
            document.getElementById('username').value = server.username;
            document.getElementById('password').value = server.password;
        }
        
        // 显示结果
        function showResult(success, text) {
            const container = document.getElementById('resultContainer');
            const textElement = document.getElementById('resultText');
            
            container.className = 'result-container ' + (success ? 'result-success' : 'result-error');
            textElement.textContent = text;
            container.style.display = 'block';
        }
        
        // 显示加载状态
        function showLoading(loading) {
            const form = document.getElementById('sshTestForm');
            if (loading) {
                form.classList.add('loading');
            } else {
                form.classList.remove('loading');
            }
        }
        
        // 页面加载时自动加载预设服务器
        document.addEventListener('DOMContentLoaded', function() {
            loadTestServers();
        });
    </script>
</body>
</html>
