<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>应用管理 - 内部平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .metric-card { transition: transform 0.2s; }
        .metric-card:hover { transform: translateY(-2px); }
        .app-card { border-left: 4px solid #dee2e6; }
        .app-card.running { border-left-color: #28a745; }
        .app-card.stopped { border-left-color: #dc3545; }
        .app-card.starting { border-left-color: #007bff; }
    </style>
</head>
<body>
    <!-- 顶部导航 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/"><i class="fas fa-server"></i> 内部平台</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link active" href="/applications">应用管理</a>
                <a class="nav-link" href="/admin/servers">服务器管理</a>
                <a class="nav-link" href="/admin/users">用户管理</a>
                <a class="nav-link" href="/monitoring/dashboard">监控面板</a>
                <a class="nav-link" href="/logout">退出</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <div class="row">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2><i class="fas fa-rocket"></i> 应用管理控制面板</h2>
                    <div>
                        <button class="btn btn-outline-primary" onclick="refreshApps()">
                            <i class="fas fa-sync-alt"></i> 刷新数据
                        </button>
                        <button class="btn btn-outline-success" onclick="checkHealth()">
                            <i class="fas fa-heartbeat"></i> 健康检查
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 应用状态统计 -->
        <div class="row mb-4">
            <div class="col-md-3 col-sm-6 mb-3">
                <div class="card metric-card bg-success text-white">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h4 th:text="${#lists.size(applications.?[status == 'RUNNING'])}">0</h4>
                                <p>运行中</p>
                            </div>
                            <i class="fas fa-check-circle fa-2x align-self-center"></i>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3 col-sm-6 mb-3">
                <div class="card metric-card bg-danger text-white">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h4 th:text="${#lists.size(applications.?[status == 'STOPPED'])}">0</h4>
                                <p>已停止</p>
                            </div>
                            <i class="fas fa-times-circle fa-2x align-self-center"></i>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3 col-sm-6 mb-3">
                <div class="card metric-card bg-primary text-white">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h4 th:text="${#lists.size(applications.?[status == 'STARTING'])}">0</h4>
                                <p>启动中</p>
                            </div>
                            <i class="fas fa-spinner fa-2x align-self-center"></i>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3 col-sm-6 mb-3">
                <div class="card metric-card bg-secondary text-white">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h4 th:text="${#lists.size(applications)}">0</h4>
                                <p>总应用数</p>
                            </div>
                            <i class="fas fa-rocket fa-2x align-self-center"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 应用列表 -->
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="fas fa-list"></i> 应用状态</h5>
                    </div>
                    <div class="card-body">
                        <!-- 空状态 -->
                        <div class="row" th:if="${applications.empty}">
                            <div class="col-12 text-center py-4">
                                <i class="fas fa-rocket fa-3x text-muted mb-3"></i>
                                <p class="text-muted">还没有应用，上传您的第一个应用开始使用管理功能</p>
                                <button class="btn btn-primary" onclick="uploadApp()">
                                    <i class="fas fa-plus"></i> 上传应用
                                </button>
                            </div>
                        </div>
                        
                        <!-- 应用卡片列表 -->
                        <div class="row" th:each="app : ${applications}">
                            <div class="col-lg-6 col-xl-4 mb-3">
                                <div class="card app-card" 
                                     th:classappend="${app.status?.toLowerCase()}">
                                    <div class="card-body">
                                        <div class="d-flex justify-content-between align-items-start mb-2">
                                            <h6 class="card-title mb-0" th:text="${app.name}">应用名称</h6>
                                            <span class="badge" 
                                                  th:classappend="${app.status == 'RUNNING'} ? 'bg-success' : 
                                                                 (${app.status == 'STOPPED'} ? 'bg-danger' : 'bg-primary')"
                                                  th:text="${app.status == 'RUNNING'} ? '运行中' : 
                                                          (${app.status == 'STOPPED'} ? '已停止' : '启动中')">状态</span>
                                        </div>
                                        <p class="card-text small text-muted mb-2">
                                            <i class="fas fa-plug"></i> 端口: <span th:text="${app.port ?: 'N/A'}">8080</span>
                                        </p>
                                        <p class="card-text small text-muted mb-3" th:if="${app.startTime}">
                                            <i class="fas fa-clock"></i> 
                                            最后启动: <span th:text="${#temporals.format(app.startTime, 'MM-dd HH:mm')}">08-24 06:15</span>
                                        </p>
                                        
                                        <!-- 应用指标区域 -->
                                        <div class="row g-2 mb-3">
                                            <div class="col-6 text-center">
                                                <div class="small text-muted">CPU</div>
                                                <div class="fw-bold">5%</div>
                                            </div>
                                            <div class="col-6 text-center">
                                                <div class="small text-muted">内存</div>
                                                <div class="fw-bold">82%</div>
                                            </div>
                                        </div>
                                        
                                        <div class="mt-3">
                                            <button class="btn btn-sm btn-outline-primary" th:onclick="'viewDetails(\'' + ${app.id} + '\')'">
                                                <i class="fas fa-info-circle"></i> 详细信息
                                            </button>
                                            <button class="btn btn-sm btn-outline-success" th:onclick="'refreshApp(\'' + ${app.id} + '\')'">
                                                <i class="fas fa-sync-alt"></i> 刷新
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function refreshApps() {
            location.reload();
        }
        
        function checkHealth() {
            // 健康检查逻辑
            console.log('执行健康检查...');
        }
        
        function viewDetails(appId) {
            // 查看详情逻辑
            console.log('查看应用详情:', appId);
        }
        
        function refreshApp(appId) {
            // 刷新单个应用逻辑
            console.log('刷新应用:', appId);
        }
        
        function uploadApp() {
            // 上传应用逻辑
            console.log('上传新应用');
        }
    </script>
</body>
</html>
