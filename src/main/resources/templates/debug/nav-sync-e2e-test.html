<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>导航同步 E2E 测试页面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 16px;
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .test-controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: #10b981;
            color: white;
        }

        .btn-success:hover {
            background: #059669;
            transform: translateY(-2px);
        }

        .btn-warning {
            background: #f59e0b;
            color: white;
        }

        .btn-warning:hover {
            background: #d97706;
            transform: translateY(-2px);
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
            transform: translateY(-2px);
        }

        .test-menu {
            background: #f9fafb;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .test-menu h3 {
            color: #1f2937;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .menu-items {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .menu-item {
            padding: 10px 20px;
            background: white;
            border: 2px solid #d1d5db;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
        }

        .menu-item:hover {
            border-color: #667eea;
            background: #f3f4f6;
        }

        .menu-item.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .log-container {
            background: #1f2937;
            border-radius: 8px;
            padding: 20px;
            max-height: 500px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.6;
        }

        .log-entry {
            margin-bottom: 8px;
            padding: 8px;
            border-radius: 4px;
            border-left: 3px solid transparent;
        }

        .log-entry.info {
            color: #60a5fa;
            border-left-color: #60a5fa;
            background: rgba(96, 165, 250, 0.1);
        }

        .log-entry.success {
            color: #34d399;
            border-left-color: #34d399;
            background: rgba(52, 211, 153, 0.1);
        }

        .log-entry.warning {
            color: #fbbf24;
            border-left-color: #fbbf24;
            background: rgba(251, 191, 36, 0.1);
        }

        .log-entry.error {
            color: #f87171;
            border-left-color: #f87171;
            background: rgba(248, 113, 113, 0.1);
        }

        .log-timestamp {
            color: #9ca3af;
            font-size: 11px;
            margin-right: 8px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 14px;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .react-container {
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            min-height: 400px;
            margin-top: 20px;
            background: #f9fafb;
            padding: 20px;
        }

        #deploy-platform-root {
            width: 100%;
            min-height: 350px;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            margin-left: 10px;
        }

        .status-badge.running {
            background: #d1fae5;
            color: #065f46;
        }

        .status-badge.idle {
            background: #fef3c7;
            color: #92400e;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧪 导航同步 E2E 测试</h1>
            <p>测试主应用与React应用之间的双向导航同步</p>
        </div>

        <div class="content">
            <!-- 测试控制按钮 -->
            <div class="test-controls">
                <button class="btn btn-primary" onclick="runFullTest()">🚀 运行完整测试</button>
                <button class="btn btn-success" onclick="enableDebug()">🐛 启用调试日志</button>
                <button class="btn btn-warning" onclick="clearLogs()">🗑️ 清空日志</button>
                <button class="btn btn-danger" onclick="resetTest()">🔄 重置测试</button>
            </div>

            <!-- 统计数据 -->
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-value" id="totalTests">0</div>
                    <div class="stat-label">总测试数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="passedTests">0</div>
                    <div class="stat-label">通过</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="failedTests">0</div>
                    <div class="stat-label">失败</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="testDuration">0ms</div>
                    <div class="stat-label">执行时间</div>
                </div>
            </div>

            <!-- 模拟菜单 -->
            <div class="test-menu">
                <h3>模拟侧边栏菜单 <span class="status-badge idle" id="menuStatus">就绪</span></h3>
                <div class="menu-items">
                    <div class="menu-item submenu-item" data-route="deploy-platform/overview" onclick="simulateMenuClick(this)">
                        📊 概览总览
                    </div>
                    <div class="menu-item submenu-item" data-route="deploy-platform/releases" onclick="simulateMenuClick(this)">
                        🚀 发布管理
                    </div>
                    <div class="menu-item submenu-item" data-route="deploy-platform/policies" onclick="simulateMenuClick(this)">
                        🛡️ 策略配置
                    </div>
                </div>
            </div>

            <!-- 日志输出 -->
            <h3 style="margin-bottom: 15px; color: #1f2937;">📋 测试日志</h3>
            <div class="log-container" id="logContainer"></div>

            <!-- React 容器 -->
            <div class="react-container">
                <h3 style="margin-bottom: 15px; color: #1f2937;">⚛️ React 应用容器</h3>
                <div id="deploy-platform-root"
                     data-auth-endpoint="/api/deploy-platform/token"
                     data-summary-endpoint="/api/deploy-platform/dashboard/summary"
                     data-spring-context="true"
                     data-embedded="true"
                     data-lazy-mount="true">
                    <p style="color: #6b7280; text-align: center; padding: 40px;">等待React应用挂载...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 加载 navigation-sync.js -->
    <script th:src="@{/js/navigation-sync.js}"></script>

    <!-- 条件加载 React 应用 -->
    <script>
        (function() {
            console.log('[E2E Test] Conditionally loading React app');
            const script = document.createElement('script');
            script.type = 'module';
            script.src = '/dist/assets/deploy-platform.js';
            document.body.appendChild(script);
        })();
    </script>

    <!-- E2E 测试脚本 -->
    <script>
        let testStats = {
            total: 0,
            passed: 0,
            failed: 0,
            startTime: 0
        };

        function log(message, type = 'info') {
            const container = document.getElementById('logContainer');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;

            const timestamp = new Date().toLocaleTimeString('zh-CN', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit', fractionalSecondDigits: 3 });
            entry.innerHTML = `<span class="log-timestamp">[${timestamp}]</span>${message}`;

            container.appendChild(entry);
            container.scrollTop = container.scrollHeight;
        }

        function updateStats() {
            document.getElementById('totalTests').textContent = testStats.total;
            document.getElementById('passedTests').textContent = testStats.passed;
            document.getElementById('failedTests').textContent = testStats.failed;

            if (testStats.startTime) {
                const duration = Date.now() - testStats.startTime;
                document.getElementById('testDuration').textContent = `${duration}ms`;
            }
        }

        function enableDebug() {
            window.__DEPLOY_PLATFORM_DEBUG__ = true;
            log('✅ 调试日志已启用', 'success');
            log('💡 现在可以在浏览器控制台查看详细的导航同步日志', 'info');
        }

        function clearLogs() {
            document.getElementById('logContainer').innerHTML = '';
            log('🗑️ 日志已清空', 'info');
        }

        function resetTest() {
            testStats = { total: 0, passed: 0, failed: 0, startTime: 0 };
            updateStats();
            clearLogs();

            // 重置菜单状态
            document.querySelectorAll('.menu-item').forEach(item => {
                item.classList.remove('active');
            });

            document.getElementById('menuStatus').textContent = '就绪';
            document.getElementById('menuStatus').className = 'status-badge idle';

            log('🔄 测试已重置', 'info');
        }

        function simulateMenuClick(element) {
            const route = element.dataset.route;
            log(`🖱️ 点击菜单项: ${element.textContent.trim()} (route: ${route})`, 'info');

            // 更新菜单状态
            document.querySelectorAll('.menu-item').forEach(item => {
                item.classList.remove('active');
            });
            element.classList.add('active');

            // 触发点击事件 (让 navigation-sync.js 处理)
            element.click();
        }

        async function runFullTest() {
            log('🚀 开始运行完整测试套件', 'info');
            testStats.startTime = Date.now();
            document.getElementById('menuStatus').textContent = '测试中';
            document.getElementById('menuStatus').className = 'status-badge running';

            // 启用调试
            enableDebug();

            // 测试1: 检查 navigation-sync.js 是否加载
            await testNavigationSyncLoaded();

            // 测试2: 检查 React 容器是否存在
            await testReactContainerExists();

            // 测试3: 测试路由映射
            await testRouteMapping();

            // 测试4: 模拟点击概览总览
            await testNavigateToOverview();

            // 测试5: 模拟点击发布管理
            await testNavigateToReleases();

            // 测试6: 模拟点击策略配置
            await testNavigateToPolicies();

            // 测试7: 测试 React 导航事件监听
            await testReactNavListener();

            // 完成
            const duration = Date.now() - testStats.startTime;
            log(`✅ 测试完成! 耗时: ${duration}ms`, 'success');
            log(`📊 结果: ${testStats.passed}/${testStats.total} 通过`, testStats.failed > 0 ? 'warning' : 'success');

            document.getElementById('menuStatus').textContent = '完成';
            document.getElementById('menuStatus').className = 'status-badge idle';
        }

        async function testNavigationSyncLoaded() {
            testStats.total++;
            log('Test 1: 检查 navigation-sync.js 是否加载...', 'info');

            if (window.__navigationSyncManager) {
                testStats.passed++;
                log('✅ navigation-sync.js 已成功加载', 'success');
                log(`   路由映射: ${JSON.stringify(window.__navigationSyncManager.routeMap)}`, 'info');
            } else {
                testStats.failed++;
                log('❌ navigation-sync.js 未加载', 'error');
            }

            updateStats();
            await sleep(500);
        }

        async function testReactContainerExists() {
            testStats.total++;
            log('Test 2: 检查 React 容器是否存在...', 'info');

            const container = document.getElementById('deploy-platform-root');
            if (container) {
                testStats.passed++;
                log('✅ React 容器存在', 'success');
                log(`   data-embedded: ${container.dataset.embedded}`, 'info');
                log(`   data-lazy-mount: ${container.dataset.lazyMount}`, 'info');
                log(`   data-react-mounted: ${container.dataset.reactMounted}`, 'info');

                // Check if React actually mounted
                const hasReactContent = container.children.length > 1 ||
                                       (container.children.length === 1 && container.children[0].tagName !== 'P');

                if (hasReactContent) {
                    log('✅ React 应用已挂载 (容器包含React内容)', 'success');
                } else {
                    log('⚠️ React 应用可能未挂载 (容器仍显示占位符)', 'warning');
                    log('   容器innerHTML: ' + container.innerHTML.substring(0, 100) + '...', 'warning');
                }
            } else {
                testStats.failed++;
                log('❌ React 容器不存在', 'error');
            }

            updateStats();
            await sleep(500);
        }

        async function testRouteMapping() {
            testStats.total++;
            log('Test 3: 检查路由映射配置...', 'info');

            const expectedRoutes = {
                'deploy-platform/overview': '/overview',
                'deploy-platform/releases': '/releases',
                'deploy-platform/policies': '/settings/policies'
            };

            const manager = window.__navigationSyncManager;
            if (!manager) {
                testStats.failed++;
                log('❌ NavigationSyncManager 未初始化', 'error');
                updateStats();
                return;
            }

            let allCorrect = true;
            for (const [menuId, expectedRoute] of Object.entries(expectedRoutes)) {
                const actualRoute = manager.routeMap[menuId];
                if (actualRoute === expectedRoute) {
                    log(`✅ ${menuId} → ${actualRoute}`, 'success');
                } else {
                    log(`❌ ${menuId}: 期望 ${expectedRoute}, 实际 ${actualRoute}`, 'error');
                    allCorrect = false;
                }
            }

            if (allCorrect) {
                testStats.passed++;
            } else {
                testStats.failed++;
            }

            updateStats();
            await sleep(500);
        }

        async function testNavigateToOverview() {
            testStats.total++;
            log('Test 4: 模拟点击概览总览...', 'info');

            const menuItem = document.querySelector('[data-route="deploy-platform/overview"]');
            if (menuItem) {
                menuItem.click();
                log('✅ 触发点击事件', 'success');
                log('⏳ 等待导航完成...', 'info');
                await sleep(2000);

                // 检查URL是否改变
                if (window.location.pathname.includes('/overview') || window.location.pathname === '/') {
                    testStats.passed++;
                    log('✅ 导航成功', 'success');
                } else {
                    testStats.failed++;
                    log(`❌ 导航失败, 当前URL: ${window.location.pathname}`, 'error');
                }
            } else {
                testStats.failed++;
                log('❌ 找不到菜单项', 'error');
            }

            updateStats();
        }

        async function testNavigateToReleases() {
            testStats.total++;
            log('Test 5: 模拟点击发布管理...', 'info');

            const menuItem = document.querySelector('[data-route="deploy-platform/releases"]');
            if (menuItem) {
                menuItem.click();
                log('✅ 触发点击事件', 'success');
                log('⏳ 等待导航完成...', 'info');
                await sleep(2000);

                if (window.location.pathname.includes('/releases')) {
                    testStats.passed++;
                    log('✅ 导航成功', 'success');
                } else {
                    testStats.failed++;
                    log(`❌ 导航失败, 当前URL: ${window.location.pathname}`, 'error');
                }
            } else {
                testStats.failed++;
                log('❌ 找不到菜单项', 'error');
            }

            updateStats();
        }

        async function testNavigateToPolicies() {
            testStats.total++;
            log('Test 6: 模拟点击策略配置...', 'info');

            const menuItem = document.querySelector('[data-route="deploy-platform/policies"]');
            if (menuItem) {
                menuItem.click();
                log('✅ 触发点击事件', 'success');
                log('⏳ 等待导航完成...', 'info');
                await sleep(2000);

                if (window.location.pathname.includes('/policies') || window.location.pathname.includes('/settings')) {
                    testStats.passed++;
                    log('✅ 导航成功', 'success');
                } else {
                    testStats.failed++;
                    log(`❌ 导航失败, 当前URL: ${window.location.pathname}`, 'error');
                }
            } else {
                testStats.failed++;
                log('❌ 找不到菜单项', 'error');
            }

            updateStats();
        }

        async function testReactNavListener() {
            testStats.total++;
            log('Test 7: 测试 React 导航事件监听...', 'info');

            // 发送 react-nav-change 事件
            const event = new CustomEvent('react-nav-change', {
                detail: {
                    route: '/overview',
                    source: 'react',
                    timestamp: Date.now()
                }
            });

            window.dispatchEvent(event);
            log('✅ 发送 react-nav-change 事件', 'success');
            await sleep(1000);

            // 检查侧边栏高亮是否更新
            const activeItem = document.querySelector('.menu-item.active');
            if (activeItem && activeItem.dataset.route === 'deploy-platform/overview') {
                testStats.passed++;
                log('✅ 侧边栏高亮已更新', 'success');
            } else {
                testStats.failed++;
                log('❌ 侧边栏高亮未更新', 'error');
            }

            updateStats();
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // 监听自定义事件用于调试
        window.addEventListener('main-nav-change', (event) => {
            log(`📨 收到 main-nav-change 事件: route=${event.detail.route}`, 'info');
        });

        window.addEventListener('react-nav-change', (event) => {
            log(`📨 收到 react-nav-change 事件: route=${event.detail.route}`, 'info');
        });

        window.addEventListener('deploy-platform-loaded', () => {
            log(`📨 收到 deploy-platform-loaded 事件`, 'success');
        });

        // 页面加载完成
        window.addEventListener('DOMContentLoaded', () => {
            log('✅ 页面加载完成', 'success');
            log('💡 点击"运行完整测试"按钮开始自动化测试', 'info');
            log('💡 或手动点击模拟菜单项进行测试', 'info');
        });
    </script>
</body>
</html>
