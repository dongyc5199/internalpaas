<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title th:text="|服务器详细监控 - ${server?.name ?: '未知服务器'} - 内部平台|">服务器详细监控 - 内部平台</title>
    <!-- 防止主题闪烁的同步脚本 -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.body.classList.add('dark-theme');
                document.documentElement.classList.remove('theme-light');
                document.documentElement.classList.add('theme-dark');
            }
        })();
    </script>
    <link href="/vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/fontawesome-local.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/common-dashboard.css">
    <link rel="stylesheet" href="/css/dashboard-theme.css">
    <script src="/js/theme.js"></script>
    <style>
        /* 确保基础变量定义 */
        :root {
            --primary-color: #409eff;
            --success-color: #67c23a;
            --error-color: #f56c6c;
            --warning-color: #e6a23c;
            --text-secondary: #6c757d;
            --border-color: #dee2e6;
            --bg-primary: #ffffff;
        }
        
        /* 修复自定义类样式 */
        .dashboard-body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f5f7fa;
        }
        
        .top-nav {
            background: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 0.5rem 2rem;
            margin-bottom: 2rem;
        }
        
        .nav-brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.25rem;
            font-weight: 600;
            color: #2c3e50;
        }
        
        .nav-menu {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        
        .user-profile {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }
        
        .user-info {
            display: flex;
            flex-direction: column;
        }
        
        .greeting {
            font-size: 0.75rem;
            color: #6c757d;
        }
        
        .username {
            font-weight: 600;
            color: #2c3e50;
        }
        
        .nav-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        
        .theme-toggle, .logout-btn {
            background: none;
            border: none;
            padding: 0.5rem;
            border-radius: 0.375rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        .theme-toggle:hover, .logout-btn:hover {
            background-color: #f8f9fa;
        }
        
        .content-wrapper {
            padding: 0 2rem;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }
        
        .metric-card { 
            transition: transform 0.2s; 
            border-left: 4px solid var(--primary-color);
        }
        .metric-card:hover { transform: translateY(-2px); }
        .progress-wrapper { position: relative; height: 8px; margin-top: 1rem; }
        .progress-text { 
            position: absolute; 
            top: -20px; 
            right: 0; 
            font-size: 0.8rem; 
            color: var(--text-secondary); 
        }
        .status-indicator { 
            width: 12px; 
            height: 12px; 
            border-radius: 50%; 
            display: inline-block; 
            margin-right: 8px; 
        }
        .status-connected { background-color: var(--success-color); }
        .status-disconnected { background-color: var(--error-color); }
        .status-monitoring { background-color: var(--primary-color); }
        .status-unknown { background-color: var(--text-secondary); }
        .refresh-indicator { 
            display: none; 
            color: var(--primary-color); 
        }
        .chart-container { 
            height: 300px; 
            border: 1px solid var(--border-color); 
            border-radius: 0.375rem; 
            background: var(--bg-primary); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: var(--text-secondary); 
        }
        
        /* 修复其他自定义类 */
        .text-secondary-text { color: #6c757d; }
        .text-primary-text { color: var(--primary-color); }
        .text-success-text { color: var(--success-color); }
        .text-warning-text { color: var(--warning-color); }
        .text-info-text { color: #17a2b8; }
        .text-muted-text { color: #6c757d; }
        
        .button-primary, .button-secondary, .button-success {
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            border: none;
            cursor: pointer;
            font-size: 0.875rem;
            transition: all 0.2s;
        }
        
        .button-primary {
            background-color: var(--primary-color);
            color: white;
        }
        
        .button-secondary {
            background-color: #6c757d;
            color: white;
        }
        
        .button-success {
            background-color: var(--success-color);
            color: white;
        }
        
        .button-primary:hover { background-color: #3a8ee6; color: white; }
        .button-secondary:hover { background-color: #5a6268; color: white; }
        .button-success:hover { background-color: #5daf34; color: white; }
        
        .table-theme { width: 100%; }
        .table-theme td { padding: 0.75rem 0; border-bottom: 1px solid #f8f9fa; }
        .table-borderless-theme td { border: none; }
        
        .progress {
            height: 8px;
            background-color: #e9ecef;
            border-radius: 4px;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 100%;
            transition: width 0.3s ease;
        }
        
        .progress-bar-primary { background-color: var(--primary-color); }
        .progress-bar-success-color { background-color: var(--success-color); }
        .progress-bar-warning-color { background-color: var(--warning-color); }
        
        .alert {
            padding: 1rem;
            border-radius: 0.375rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .alert-error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .alert-error-color { background-color: #f8d7da; color: #721c24; }
        .alert-success-color { background-color: #d4edda; color: #155724; }
        .alert-info-color { background-color: #d1ecf1; color: #0c5460; }
        
        .btn-close, .alert-close-button {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            margin-left: auto;
        }
    </style>
</head>
<body class="dashboard-body">
    <!-- 顶部导航栏 -->
    <nav class="top-nav">
        <div class="nav-brand">
            <div class="brand-icon">🚀</div>
            <span class="brand-text">Dev Debug Platform</span>
        </div>
        <div class="nav-menu">
            <div class="user-profile">
                <div class="user-avatar">
                    <span th:text="${#strings.substring(username, 0, 1)}">A</span>
                </div>
                <div class="user-info">
                    <span class="greeting">欢迎回来</span>
                    <span class="username" th:text="${username}">管理员</span>
                </div>
            </div>
            <div class="nav-actions">
                <div class="theme-toggle" onclick="toggleTheme()" title="切换主题">
                    <span class="theme-icon">🌙</span>
                </div>
                <form th:action="@{/logout}" method="post" style="display: inline;">
                    <button type="submit" class="logout-btn" title="安全退出">
                        <span class="logout-icon">🚪</span>
                    </button>
                </form>
            </div>
        </div>
    </nav>

    <!-- 主内容区域 -->
    <div class="dashboard-container">
        <div class="content-wrapper">
        <!-- 错误提示 -->
        <div th:if="${error}" class="alert alert-error alert-dismissible fade show" role="alert">
            <i class="fas fa-exclamation-triangle"></i>
            <span th:text="${error}">错误信息</span>
            <button type="button" class="btn-close" onclick="this.parentElement.remove()"></button>
        </div>

        <!-- 页面标题 -->
        <div class="row">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h2 class="mb-1">
                            <i class="fas fa-server"></i> 
                            <span th:text="${server?.name ?: '未知服务器'}">服务器名称</span>
                            <span class="ms-2" th:if="${server}">
                                <span th:class="|status-indicator status-${server.connectionStatus?.name()?.toLowerCase() ?: 'unknown'}|"></span>
                                <span class="badge" 
                                                  th:classappend="${server.connectionStatus?.name() == 'CONNECTED' ? 'status-connected' : 
                                                                    server.connectionStatus?.name() == 'MONITORING' ? 'status-monitoring' :
                                                                    server.connectionStatus?.name() == 'FAILED' ? 'status-disconnected' : 'status-unknown'}"
                                                  th:text="${server.connectionStatus?.description ?: '未知状态'}">状态</span>
                            </span>
                        </h2>
                        <p class="text-secondary-text mb-0" th:if="${server}">
                            <i class="fas fa-network-wired"></i> 
                            <span th:text="${server.hostname}">hostname</span>
                            <span th:if="${server.lastConnectionCheck}" class="ms-3">
                                <i class="fas fa-clock"></i> 
                                最后检查: <span th:text="${#temporals.format(server.lastConnectionCheck, 'yyyy-MM-dd HH:mm:ss')}">时间</span>
                            </span>
                        </p>
                    </div>
                    <div>
                        <a href="/admin/servers" class="button-secondary">
                            <i class="fas fa-arrow-left"></i> 返回面板
                        </a>
                        <button class="button-primary" onclick="refreshMetrics()">
                            <i class="fas fa-sync-alt refresh-icon"></i>
                            <span class="refresh-indicator"><i class="fas fa-spinner fa-spin"></i></span>
                            刷新数据
                        </button>
                        <button class="button-success" onclick="refreshServerConnection()" th:if="${server}">
                            <i class="fas fa-heartbeat"></i> 检查连接
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 服务器不存在的情况 -->
        <div th:if="${server == null}" class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-body text-center py-5">
                            <i class="fas fa-server fa-3x text-muted-text mb-3"></i>
                            <h4 class="text-muted-text">服务器不存在</h4>
                            <p class="text-muted-text">请检查服务器ID是否正确</p>
                            <a href="/admin/servers" class="button-primary">返回服务器管理</a>
                        </div>
                </div>
            </div>
        </div>

        <!-- 服务器监控数据 -->
        <div th:if="${server != null}">
            <!-- 系统资源监控 -->
            <div class="row mb-4">
                <div class="col-md-3 mb-3">
                    <div class="card metric-card">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-start">
                                <div>
                                    <h6 class="card-title text-secondary-text">CPU使用率</h6>
                                    <h3 class="mb-0" id="cpu-usage" th:text="${metrics?.cpuUsage != null ? #numbers.formatDecimal(metrics.cpuUsage, 1, 1) + '%' : '-'}">-</h3>
                                </div>
                                <i class="fas fa-microchip fa-2x text-primary-text"></i>
                            </div>
                            <div class="progress-wrapper mt-3">
                                <div class="progress-text" id="cpu-cores" th:text="${metrics?.cpuCores != null ? metrics.cpuCores + ' 核心' : ''}"></div>
                                <div class="progress">
                                    <div class="progress-bar progress-bar-primary" id="cpu-progress" 
                                         th:style="${metrics?.cpuUsage != null ? 'width: ' + metrics.cpuUsage + '%' : 'width: 0%'}"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="col-md-3 mb-3">
                    <div class="card metric-card">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-start">
                                <div>
                                    <h6 class="card-title text-secondary-text">内存使用率</h6>
                                    <h3 class="mb-0" id="memory-usage" th:text="${metrics?.memoryUsage != null ? #numbers.formatDecimal(metrics.memoryUsage, 1, 1) + '%' : '-'}">-</h3>
                                </div>
                                <i class="fas fa-memory fa-2x text-success-text"></i>
                            </div>
                            <div class="progress-wrapper mt-3">
                                <div class="progress-text" id="memory-info" 
                                     th:text="${metrics?.memoryTotal != null ? (#numbers.formatDecimal(metrics.memoryUsed/1024/1024/1024, 1, 1) + 'GB / ' + #numbers.formatDecimal(metrics.memoryTotal/1024/1024/1024, 1, 1) + 'GB') : ''}"></div>
                                <div class="progress">
                                    <div class="progress-bar progress-bar-success-color" id="memory-progress" 
                                         th:style="${metrics?.memoryUsage != null ? 'width: ' + metrics.memoryUsage + '%' : 'width: 0%'}"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="col-md-3 mb-3">
                    <div class="card metric-card">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-start">
                                <div>
                                    <h6 class="card-title text-secondary-text">磁盘使用率</h6>
                                    <h3 class="mb-0" id="disk-usage" th:text="${metrics?.diskUsage != null ? #numbers.formatDecimal(metrics.diskUsage, 1, 1) + '%' : '-'}">-</h3>
                                </div>
                                <i class="fas fa-hdd fa-2x text-warning-text"></i>
                            </div>
                            <div class="progress-wrapper mt-3">
                                <div class="progress-text" id="disk-info" 
                                     th:text="${metrics?.diskTotal != null ? (#numbers.formatDecimal(metrics.diskUsed/1024/1024/1024, 1, 1) + 'GB / ' + #numbers.formatDecimal(metrics.diskTotal/1024/1024/1024, 1, 1) + 'GB') : ''}"></div>
                                <div class="progress">
                                    <div class="progress-bar progress-bar-warning-color" id="disk-progress" 
                                         th:style="${metrics?.diskUsage != null ? 'width: ' + metrics.diskUsage + '%' : 'width: 0%'}"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="col-md-3 mb-3">
                    <div class="card metric-card">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-start">
                                <div>
                                    <h6 class="card-title text-secondary-text">负载平均值</h6>
                                    <h4 class="mb-0" id="load-average" th:text="${metrics?.loadAverage ?: '-'}">-</h4>
                                </div>
                                <i class="fas fa-chart-line fa-2x text-info-text"></i>
                            </div>
                            <div class="mt-3">
                                <small class="text-secondary-text">1分钟, 5分钟, 15分钟</small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 系统信息和用户活动 -->
            <div class="row mb-4">
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-header">
                            <h5 class="mb-0"><i class="fas fa-info-circle"></i> 系统信息</h5>
                        </div>
                        <div class="card-body">
                            <table class="table-theme table-borderless-theme">
                                <tr>
                                    <td class="text-secondary-text">操作系统</td>
                                    <td id="os-version" th:text="${metrics?.osVersion ?: '未知'}">未知</td>
                                </tr>
                                <tr>
                                    <td class="text-secondary-text">运行时间</td>
                                    <td id="uptime" th:text="${metrics?.uptime ?: '未知'}">未知</td>
                                </tr>
                                <tr>
                                    <td class="text-secondary-text">最后更新</td>
                                    <td id="last-update" th:text="${metrics?.timestamp != null ? #temporals.format(metrics.timestamp, 'yyyy-MM-dd HH:mm:ss') : '未知'}">未知</td>
                                </tr>
                                <tr>
                                    <td class="text-secondary-text">数据收集耗时</td>
                                    <td id="collection-duration" th:text="${metrics?.collectionDurationMs != null ? metrics.collectionDurationMs + 'ms' : '未知'}">未知</td>
                                </tr>
                            </table>
                        </div>
                    </div>
                </div>
                
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-header">
                            <h5 class="mb-0"><i class="fas fa-users"></i> 用户活动摘要</h5>
                        </div>
                        <div class="card-body">
                            <div th:if="${activitySummary}" id="activity-summary">
                                <div class="row text-center">
                                    <div class="col-4">
                                        <h4 class="text-primary-text" th:text="${activitySummary.activeUserCount}">0</h4>
                                    <small class="text-muted-text">活跃用户</small>
                                </div>
                                <div class="col-4">
                                    <h4 class="text-success-text" th:text="${activitySummary.totalSessions}">0</h4>
                                    <small class="text-muted-text">总会话数</small>
                                </div>
                                <div class="col-4">
                                    <h4 class="text-info-text" th:text="${activitySummary.totalCommands}">0</h4>
                                    <small class="text-muted-text">总命令数</small>
                                </div>
                                </div>
                            </div>
                            <div th:unless="${activitySummary}" class="text-center text-muted-text">
                                <i class="fas fa-user-slash fa-2x mb-2"></i>
                                <p>暂无用户活动数据</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 监控图表区域 -->
            <div class="row">
                <div class="col-12">
                    <div class="card">
                        <div class="card-header">
                            <h5 class="mb-0"><i class="fas fa-chart-area"></i> 历史监控图表</h5>
                        </div>
                        <div class="card-body">
                            <div class="chart-container">
                                <div class="text-center">
                                    <i class="fas fa-chart-line fa-3x mb-3"></i>
                                    <p>监控图表功能正在开发中...</p>
                                <small class="text-muted-text">未来版本将支持历史数据图表展示</small>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    </div>
    <script th:if="${server}">
        const serverId = /*[[${server.id}]]*/ 0;
        
        // 页面加载后开始定时刷新
        document.addEventListener('DOMContentLoaded', function() {
            // 立即刷新一次数据
            refreshMetrics();
            // 每30秒自动刷新
            setInterval(refreshMetrics, 30000);
        });
        
        // 刷新监控数据
        function refreshMetrics() {
            const refreshIcon = document.querySelector('.refresh-icon');
            const refreshIndicator = document.querySelector('.refresh-indicator');
            
            // 显示刷新状态
            refreshIcon.style.display = 'none';
            refreshIndicator.style.display = 'inline';
            
            fetch('/monitoring/server/' + serverId + '/metrics')
                .then(response => response.ok ? response.json() : Promise.reject('获取数据失败'))
                .then(metrics => {
                    updateMetricsDisplay(metrics);
                })
                .catch(error => {
                    console.error('刷新监控数据失败:', error);
                    showNotification('刷新监控数据失败', 'error');
                })
                .finally(() => {
                    // 恢复刷新按钮状态
                    refreshIcon.style.display = 'inline';
                    refreshIndicator.style.display = 'none';
                });
        }
        
        // 更新监控数据显示
        function updateMetricsDisplay(metrics) {
            if (metrics.cpuUsage !== null) {
                document.getElementById('cpu-usage').textContent = metrics.cpuUsage.toFixed(1) + '%';
                document.getElementById('cpu-progress').style.width = metrics.cpuUsage + '%';
            }
            if (metrics.cpuCores !== null) {
                document.getElementById('cpu-cores').textContent = metrics.cpuCores + ' 核心';
            }
            
            if (metrics.memoryUsage !== null) {
                document.getElementById('memory-usage').textContent = metrics.memoryUsage.toFixed(1) + '%';
                document.getElementById('memory-progress').style.width = metrics.memoryUsage + '%';
            }
            if (metrics.memoryTotal !== null) {
                const usedGB = (metrics.memoryUsed / 1024 / 1024 / 1024).toFixed(1);
                const totalGB = (metrics.memoryTotal / 1024 / 1024 / 1024).toFixed(1);
                document.getElementById('memory-info').textContent = usedGB + 'GB / ' + totalGB + 'GB';
            }
            
            if (metrics.diskUsage !== null) {
                document.getElementById('disk-usage').textContent = metrics.diskUsage.toFixed(1) + '%';
                document.getElementById('disk-progress').style.width = metrics.diskUsage + '%';
            }
            if (metrics.diskTotal !== null) {
                const usedGB = (metrics.diskUsed / 1024 / 1024 / 1024).toFixed(1);
                const totalGB = (metrics.diskTotal / 1024 / 1024 / 1024).toFixed(1);
                document.getElementById('disk-info').textContent = usedGB + 'GB / ' + totalGB + 'GB';
            }
            
            if (metrics.loadAverage) {
                document.getElementById('load-average').textContent = metrics.loadAverage;
            }
            
            if (metrics.osVersion) {
                document.getElementById('os-version').textContent = metrics.osVersion;
            }
            
            if (metrics.uptime) {
                document.getElementById('uptime').textContent = metrics.uptime;
            }
            
            if (metrics.timestamp) {
                document.getElementById('last-update').textContent = new Date(metrics.timestamp).toLocaleString('zh-CN');
            }
            
            if (metrics.collectionDurationMs !== null) {
                document.getElementById('collection-duration').textContent = metrics.collectionDurationMs + 'ms';
            }
        }
        
        // 刷新服务器连接状态
        function refreshServerConnection() {
            fetch('/admin/servers/' + serverId + '/check-connection', {
                method: 'POST'
            })
            .then(response => {
                if (response.ok) {
                    showNotification('连接检查已启动', 'success');
                    // 2秒后刷新页面以更新状态
                    setTimeout(() => location.reload(), 2000);
                } else {
                    showNotification('连接检查失败', 'error');
                }
            })
            .catch(error => {
                console.error('连接检查失败:', error);
                showNotification('连接检查失败', 'error');
            });
        }
        
        // 显示通知
                function showNotification(message, type = 'info') {
                    const alertClass = type === 'error' ? 'alert-error-color' : 
                                      type === 'success' ? 'alert-success-color' : 
                                      'alert-info-color';
                    
                    const alert = document.createElement('div');
                    alert.className = `alert ${alertClass} alert-dismissible fade show position-fixed`;
                    alert.style.cssText = 'top: 20px; right: 20px; z-index: 9999; max-width: 300px;';
                    alert.innerHTML = `
                        <i class="fas fa-${type === 'error' ? 'exclamation-triangle' : type === 'success' ? 'check-circle' : 'info-circle'}"></i>
                        ${message}
                        <button type="button" class="alert-close-button" onclick="this.parentElement.remove()"></button>
                    `;
                    
                    document.body.appendChild(alert);
                    
                    // 3秒后自动移除
                    setTimeout(() => {
                        if (alert.parentNode) {
                            alert.remove();
                        }
                    }, 3000);
                }
    </script>
    
    <script src="/vendor/bootstrap/bootstrap.bundle.min.js"></script>
</body>
</html>
