<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" class="theme-light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>用户行为监控 - Dev Debug Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/common-dashboard.css">
    <link rel="stylesheet" href="/css/dashboard-theme.css">
    <script src="/js/theme.js"></script>
</head>
<body class="dashboard-body admin-theme theme-body">
    <!-- 顶部导航栏 -->
    <nav class="top-nav">
        <div class="nav-brand">
            <div class="brand-icon">🚀</div>
            <span class="brand-text">Dev Debug Platform</span>
        </div>
        <div class="nav-menu">
            <a href="/profile" class="user-profile" title="查看个人档案">
                <div class="user-avatar">
                    <span th:text="${#strings.substring(username ?: 'A', 0, 1)}">A</span>
                </div>
                <div class="user-info">
                    <span class="greeting">欢迎回来</span>
                    <span class="username" th:text="${username ?: '管理员'}">管理员</span>
                </div>
            </a>
            <div class="nav-actions">
                <div class="theme-toggle" onclick="toggleTheme()" title="切换主题">
                    <span class="theme-icon">🌙</span>
                </div>
                <form th:action="@{/logout}" method="post" style="display: inline;">
                    <button type="submit" class="logout-btn" title="安全退出">
                        <span class="logout-icon">🚪</span>
                    </button>
                </form>
            </div>
        </div>
    </nav>

    <!-- 主要内容区域 -->
    <div class="dashboard-container theme-container">
        <!-- 侧边栏导航 -->
        <aside class="sidebar">
            <nav class="sidebar-nav">
                <ul>
                    <li class="nav-item">
                        <a href="/admin/dashboard" class="nav-link">
                            <span class="nav-icon">📊</span>
                            <span class="nav-text">工作台概览</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/admin/servers" class="nav-link">
                            <span class="nav-icon">🖥️</span>
                            <span class="nav-text">服务器管理</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/admin/users" class="nav-link">
                            <span class="nav-icon">👥</span>
                            <span class="nav-text">用户管理</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/terminal" class="nav-link">
                            <span class="nav-icon">💻</span>
                            <span class="nav-text">SSH终端</span>
                        </a>
                    </li>
                    <li class="nav-item active">
                        <a href="/monitoring/user-activity" class="nav-link">
                            <span class="nav-icon">👁️</span>
                            <span class="nav-text">用户行为监控</span>
                        </a>
                    </li>
                    <li class="nav-divider"></li>
                    <li class="nav-item">
                        <a href="/profile" class="nav-link">
                            <span class="nav-icon">👤</span>
                            <span class="nav-text">个人档案</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </aside>

        <!-- 主内容区域 -->
        <main class="main-content">
            <div class="content-header">
                <h1 class="page-title">用户行为监控</h1>
                <div class="header-actions">
                    <button class="action-btn primary" onclick="refreshAllData()" title="刷新数据">
                        <span class="btn-icon">🔄</span>
                        <span class="btn-text">刷新数据</span>
                    </button>
                </div>
            </div>

            <!-- 错误信息显示 -->
            <div th:if="${error}" class="message-container error">
                <div class="message-content">
                    <span class="message-icon">⚠️</span>
                    <span class="message-text" th:text="${error}"></span>
                    <button class="message-close" onclick="this.parentElement.parentElement.remove()">×</button>
                </div>
            </div>

            <!-- 服务器用户活动列表 -->
            <div class="content-section">
                <div class="section-header">
                    <h2 class="section-title">
                        <span class="section-icon">📊</span>
                        各服务器用户活动状态
                    </h2>
                </div>

                <div class="server-activity-grid">
                        <div class="row" th:if="${#lists.isEmpty(servers)}">
                            <div class="col-12 text-center py-4">
                                <i class="fas fa-server fa-3x text-muted mb-3"></i>
                                <p class="text-muted">暂无服务器数据</p>
                            </div>
                        </div>
                        <div class="row" th:each="server : ${servers}">
                            <div class="col-lg-6 col-xl-4 mb-4">
                                <div class="card server-card activity-card" 
                                     th:classappend="${server.connectionStatus?.name()?.toLowerCase()}">
                                    <div class="card-body">
                                        <div class="d-flex justify-content-between align-items-start mb-3">
                                            <h6 class="card-title mb-0" th:text="${server.name}">服务器名称</h6>
                                            <span class="badge" 
                                                  th:classappend="${server.connectionStatus?.name() == 'CONNECTED' ? 'bg-success' : 
                                                                    server.connectionStatus?.name() == 'MONITORING' ? 'bg-primary' :
                                                                    server.connectionStatus?.name() == 'FAILED' ? 'bg-danger' : 'bg-secondary'}"
                                                  th:text="${server.connectionStatus?.description ?: '未知'}">状态</span>
                                        </div>
                                        
                                        <!-- 用户活动摘要 -->
                                        <div th:if="${activitySummaries[server.id]}" class="mb-3">
                                            <div class="row g-2 text-center">
                                                <div class="col-6">
                                                    <div class="small text-muted">活跃用户</div>
                                                    <div class="fw-bold text-primary" 
                                                         th:text="${activitySummaries[server.id].activeUserCount}">0</div>
                                                </div>
                                                <div class="col-6">
                                                    <div class="small text-muted">今日活动</div>
                                                    <div class="fw-bold text-info" 
                                                         th:text="${activitySummaries[server.id].todayActivityCount}">0</div>
                                                </div>
                                            </div>
                                        </div>
                                        
                                        <!-- 活跃用户列表 -->
                                        <div th:if="${activeUsersMap[server.id]}">
                                            <h6 class="text-muted mb-2">
                                                <i class="fas fa-user-clock"></i> 当前活跃用户
                                            </h6>
                                            <div class="user-list">
                                                <div th:if="${#lists.isEmpty(activeUsersMap[server.id])}" 
                                                     class="text-muted small">
                                                    <i class="fas fa-info-circle"></i> 暂无活跃用户
                                                </div>
                                                <div th:each="activity : ${activeUsersMap[server.id]}" 
                                                     class="d-flex justify-content-between align-items-center py-1 border-bottom">
                                                    <div class="d-flex align-items-center">
                                                        <i class="fas fa-user text-primary me-2"></i>
                                                        <span class="fw-bold" th:text="${activity.username}">用户名</span>
                                                        <span th:if="${activity.activityType}" 
                                                              class="badge bg-secondary ms-2 small" 
                                                              th:text="${activity.activityType}">活动类型</span>
                                                    </div>
                                                    <div class="text-end">
                                                        <div class="small text-muted" 
                                                             th:text="${#temporals.format(activity.lastActivity, 'HH:mm')}">时间</div>
                                                        <div th:if="${activity.isActive}" 
                                                             class="badge bg-success small">在线</div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        
                                        <div class="mt-3">
                                            <a class="btn btn-sm btn-outline-primary" 
                                               th:href="@{/monitoring/server/{id}(id=${server.id})}">
                                                <i class="fas fa-chart-bar"></i> 详细监控
                                            </a>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function refreshAllData() {
            location.reload();
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            // 页面加载完成，可以添加实时更新功能
            setInterval(() => {
                location.reload();
            }, 60000); // 每分钟刷新一次用户活动数据
        });
    </script>

    <script src="/js/dashboard.js"></script>
</body>
</html>
