<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>服务器监控面板 - 内部平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .metric-card { transition: transform 0.2s; }
        .metric-card:hover { transform: translateY(-2px); }
        .server-card { border-left: 4px solid #dee2e6; }
        .server-card.connected { border-left-color: #28a745; }
        .server-card.failed { border-left-color: #dc3545; }
        .server-card.monitoring { border-left-color: #007bff; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/"><i class="fas fa-server"></i> 内部平台</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/apps">应用管理</a>
                <a class="nav-link" href="/admin/servers">服务器管理</a>
                <a class="nav-link active" href="/monitoring/dashboard">监控面板</a>
                <form th:action="@{/logout}" method="post" style="display: inline;">
                    <button type="submit" class="nav-link" style="background: none; border: none; cursor: pointer;">退出</button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <div class="row">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2><i class="fas fa-chart-line"></i> 服务器监控面板</h2>
                    <div>
                        <a href="/monitoring/history/dashboard" class="btn btn-outline-info" th:if="${hasHistoryFeature}">
                            <i class="fas fa-history"></i> 历史数据
                        </a>
                        <a href="/monitoring/thresholds/dashboard" class="btn btn-outline-warning" th:if="${hasThresholdFeature}">
                            <i class="fas fa-bell"></i> 告警设置
                        </a>
                        <button class="btn btn-outline-primary" onclick="location.reload()">
                            <i class="fas fa-sync-alt"></i> 刷新数据
                        </button>
                        <button class="btn btn-outline-success" onclick="triggerHealthCheck()">
                            <i class="fas fa-heartbeat"></i> 健康检查
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 服务器状态统计 -->
        <div class="row mb-4">
            <div class="col-md-3 col-sm-6 mb-3">
                <div class="card metric-card bg-success text-white">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h4 th:text="${statusStats['CONNECTED'] ?: 0}">0</h4>
                                <p>在线服务器</p>
                            </div>
                            <i class="fas fa-check-circle fa-2x align-self-center"></i>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3 col-sm-6 mb-3">
                <div class="card metric-card bg-danger text-white">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h4 th:text="${statusStats['FAILED'] ?: 0}">0</h4>
                                <p>离线服务器</p>
                            </div>
                            <i class="fas fa-times-circle fa-2x align-self-center"></i>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3 col-sm-6 mb-3">
                <div class="card metric-card bg-primary text-white">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h4 th:text="${statusStats['MONITORING'] ?: 0}">0</h4>
                                <p>监控中</p>
                            </div>
                            <i class="fas fa-eye fa-2x align-self-center"></i>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3 col-sm-6 mb-3">
                <div class="card metric-card bg-secondary text-white">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h4 th:text="${#lists.size(servers)}">0</h4>
                                <p>总服务器数</p>
                            </div>
                            <i class="fas fa-server fa-2x align-self-center"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 服务器列表 -->
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="fas fa-list"></i> 服务器状态</h5>
                    </div>
                    <div class="card-body">
                        <div class="row" th:if="${#lists.isEmpty(servers)}">
                            <div class="col-12 text-center py-4">
                                <i class="fas fa-server fa-3x text-muted mb-3"></i>
                                <p class="text-muted">暂无服务器数据</p>
                            </div>
                        </div>
                        <div class="row" th:each="server : ${servers}">
                            <div class="col-lg-6 col-xl-4 mb-3">
                                <div class="card server-card" 
                                     th:classappend="${server.connectionStatus?.name()?.toLowerCase()}">
                                    <div class="card-body">
                                        <div class="d-flex justify-content-between align-items-start mb-2">
                                            <h6 class="card-title mb-0" th:text="${server.name}">服务器名称</h6>
                                            <span class="badge" 
                                                  th:classappend="${server.connectionStatus?.name() == 'CONNECTED' ? 'bg-success' : 
                                                                    server.connectionStatus?.name() == 'MONITORING' ? 'bg-primary' :
                                                                    server.connectionStatus?.name() == 'FAILED' ? 'bg-danger' : 'bg-secondary'}"
                                                  th:text="${server.connectionStatus?.description ?: '未知'}">状态</span>
                                        </div>
                                        <p class="card-text small text-muted mb-2">
                                            <i class="fas fa-network-wired"></i> <span th:text="${server.hostname}">hostname</span>
                                        </p>
                                        <p class="card-text small text-muted mb-3" th:if="${server.lastConnectionCheck}">
                                            <i class="fas fa-clock"></i> 
                                            最后检查: <span th:text="${#temporals.format(server.lastConnectionCheck, 'MM-dd HH:mm')}">时间</span>
                                        </p>
                                        
                                        <!-- 监控数据区域 -->
                                        <div th:id="'metrics-' + ${server.id}" class="metrics-container">
                                            <div class="text-center py-2">
                                                <i class="fas fa-spinner fa-spin"></i> 加载中...
                                            </div>
                                        </div>
                                        
                                        <div class="mt-3">
                                            <button class="btn btn-sm btn-outline-primary" 
                                                    th:data-server-id="${server.id}"
                                                    onclick="openServerDetails(this.getAttribute('data-server-id'))">
                                                <i class="fas fa-chart-bar"></i> 详细监控
                                            </button>
                                            <button class="btn btn-sm btn-outline-success" 
                                                    th:data-server-id="${server.id}"
                                                    onclick="refreshServerMetricsFromButton(this)">
                                                <i class="fas fa-sync-alt"></i> 刷新
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 获取CSRF token
        function getCSRFToken() {
            const csrfToken = document.querySelector('meta[name="_csrf"]');
            if (csrfToken) {
                return csrfToken.getAttribute('content');
            }
            // 尝试从cookie获取
            const cookies = document.cookie.split(';');
            for (let cookie of cookies) {
                const [name, value] = cookie.trim().split('=');
                if (name === 'XSRF-TOKEN') {
                    return decodeURIComponent(value);
                }
            }
            return null;
        }
        
        // 获取CSRF头名称
        function getCSRFHeaderName() {
            const csrfHeader = document.querySelector('meta[name="_csrf_header"]');
            return csrfHeader ? csrfHeader.getAttribute('content') : 'X-XSRF-TOKEN';
        }

        document.addEventListener('DOMContentLoaded', function() {
            loadAllServerMetrics();
            setInterval(loadAllServerMetrics, 30000);
        });
        
        function loadAllServerMetrics() {
            document.querySelectorAll('.metrics-container').forEach(container => {
                const serverId = container.id.replace('metrics-', '');
                loadServerMetrics(serverId);
            });
        }
        
        function loadServerMetrics(serverId) {
            const container = document.getElementById('metrics-' + serverId);
            if (!container) return;
            
            const headers = {};
            const csrfToken = getCSRFToken();
            if (csrfToken) {
                headers[getCSRFHeaderName()] = csrfToken;
            }
            
            fetch('/monitoring/server/' + serverId + '/metrics', {
                method: 'GET',
                headers: headers,
                credentials: 'same-origin'
            })
                .then(response => {
                    if (response.ok) {
                        return response.json();
                    } else if (response.status === 404) {
                        throw new Error('服务器监控数据未找到');
                    } else {
                        throw new Error('获取监控数据失败');
                    }
                })
                .then(metrics => displayMetrics(container, metrics))
                .catch(error => {
                    console.error('加载监控数据失败:', error);
                    container.innerHTML = '<div class="text-muted small"><i class="fas fa-exclamation-triangle"></i> ' + error.message + '</div>';
                });
        }
        
        function displayMetrics(container, metrics) {
            const html = `
                <div class="row g-2">
                    <div class="col-4 text-center">
                        <div class="small text-muted">CPU</div>
                        <div class="fw-bold">${metrics.cpuUsage ? Math.round(metrics.cpuUsage) + '%' : '-'}</div>
                    </div>
                    <div class="col-4 text-center">
                        <div class="small text-muted">内存</div>
                        <div class="fw-bold">${metrics.memoryUsage ? Math.round(metrics.memoryUsage) + '%' : '-'}</div>
                    </div>
                    <div class="col-4 text-center">
                        <div class="small text-muted">磁盘</div>
                        <div class="fw-bold">${metrics.diskUsage ? Math.round(metrics.diskUsage) + '%' : '-'}</div>
                    </div>
                </div>
            `;
            container.innerHTML = html;
        }
        
        function refreshServerMetrics(serverId) {
            const container = document.getElementById('metrics-' + serverId);
            container.innerHTML = '<div class="text-center py-2"><i class="fas fa-spinner fa-spin"></i> 刷新中...</div>';
            
            const headers = {};
            const csrfToken = getCSRFToken();
            const csrfHeaderName = getCSRFHeaderName();
            const url = '/monitoring/server/' + serverId + '/refresh';
            
            console.log('Refresh request details:');
            console.log('- URL:', url);
            console.log('- Server ID:', serverId);
            console.log('- CSRF Token:', csrfToken);
            console.log('- CSRF Header:', csrfHeaderName);
            console.log('- Current location:', window.location.href);
            console.log('- All cookies:', document.cookie);
            
            if (csrfToken) {
                headers[csrfHeaderName] = csrfToken;
            }
            
            console.log('- Final headers:', headers);
            
            fetch(url, {
                method: 'POST',
                headers: headers,
                credentials: 'same-origin'
            })
                .then(response => {
                    console.log('Response received:');
                    console.log('- Status:', response.status);
                    console.log('- Status Text:', response.statusText);
                    console.log('- URL:', response.url);
                    
                    if (response.ok) {
                        return response.json();
                    } else if (response.status === 404) {
                        throw new Error('API端点不存在或路由错误');
                    } else if (response.status === 403) {
                        throw new Error('CSRF验证失败，请刷新页面后重试');
                    } else {
                        throw new Error(`刷新监控数据失败 (${response.status})`);
                    }
                })
                .then(metrics => {
                    console.log('Metrics received:', metrics);
                    displayMetrics(container, metrics);
                    showNotification('监控数据已刷新', 'success');
                })
                .catch(error => {
                    console.error('刷新监控数据失败:', error);
                    container.innerHTML = '<div class="text-danger small"><i class="fas fa-exclamation-triangle"></i> ' + error.message + '</div>';
                    showNotification('刷新失败: ' + error.message, 'danger');
                });
        }
        
        function refreshServerMetricsFromButton(button) {
            const serverId = button.getAttribute('data-server-id');
            const originalText = button.innerHTML;
            
            button.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 刷新中...';
            button.disabled = true;
            
            refreshServerMetrics(serverId);
            
            // 2秒后恢复按钮状态
            setTimeout(() => {
                button.innerHTML = originalText;
                button.disabled = false;
            }, 2000);
        }
        
        function triggerHealthCheck() {
            const button = event.target;
            const originalText = button.innerHTML;
            button.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 检查中...';
            button.disabled = true;
            
            const headers = {};
            const csrfToken = getCSRFToken();
            const csrfHeaderName = getCSRFHeaderName();
            
            if (csrfToken) {
                headers[csrfHeaderName] = csrfToken;
            }
            
            fetch('/monitoring/trigger-health-check', {
                method: 'POST',
                headers: headers,
                credentials: 'same-origin'
            })
                .then(response => {
                    if (response.ok) {
                        return response.json();
                    } else if (response.status === 403) {
                        throw new Error('CSRF验证失败，请刷新页面后重试');
                    } else {
                        throw new Error(`请求失败 (${response.status})`);
                    }
                })
                .then(data => {
                    const message = data.status === 'success' ? '健康检查已触发，请稍后查看结果' : '健康检查失败: ' + data.message;
                    showNotification(message, data.status === 'success' ? 'success' : 'danger');
                })
                .catch(error => {
                    console.error('健康检查失败:', error);
                    showNotification('健康检查失败: ' + error.message, 'danger');
                })
                .finally(() => {
                    button.innerHTML = originalText;
                    button.disabled = false;
                    setTimeout(loadAllServerMetrics, 5000);
                });
        }
        
        // 显示通知
        function showNotification(message, type = 'info') {
            // 移除现有通知
            const existingAlert = document.querySelector('.alert-notification');
            if (existingAlert) {
                existingAlert.remove();
            }
            
            // 创建新通知
            const alert = document.createElement('div');
            alert.className = `alert alert-${type} alert-dismissible fade show alert-notification`;
            alert.style.position = 'fixed';
            alert.style.top = '20px';
            alert.style.right = '20px';
            alert.style.zIndex = '9999';
            alert.style.minWidth = '300px';
            alert.innerHTML = `
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
            
            document.body.appendChild(alert);
            
            // 5秒后自动隐藏
            setTimeout(() => {
                if (alert.parentNode) {
                    alert.remove();
                }
            }, 5000);
        }
        
        // 详细监控按钮点击处理
        function openServerDetails(serverId) {
            window.location.href = '/monitoring/server/' + serverId;
        }
    </script>
</body>
</html>
