<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>服务器状态标签测试</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/fontawesome-local.css}">
    <style>
        .status-tag {
            font-size: 0.85rem;
            margin: 2px;
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-block;
            color: white;
            font-weight: 500;
        }
        .tag-success { background-color: #198754; }
        .tag-warning { background-color: #fd7e14; }
        .tag-danger { background-color: #dc3545; }
        .tag-info { background-color: #0dcaf0; color: #000; }
        .tag-secondary { background-color: #6c757d; }
        
        .memory-alert-critical {
            background: linear-gradient(45deg, #dc3545, #ff6b6b);
            animation: pulse-critical 2s infinite;
            box-shadow: 0 0 10px rgba(220, 53, 69, 0.5);
        }
        
        @keyframes pulse-critical {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        .server-card {
            transition: all 0.3s ease;
            border-left: 4px solid #e9ecef;
        }
        
        .server-card.has-alerts {
            border-left-color: #dc3545;
        }
        
        .alert-section {
            background-color: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="fas fa-server"></i> 服务器状态标签测试</h2>
            <button class="btn btn-primary" onclick="refreshAll()">
                <i class="fas fa-sync-alt"></i> 刷新状态
            </button>
        </div>
        
        <!-- 80%内存告警测试区域 -->
        <div class="alert-section">
            <h5><i class="fas fa-exclamation-triangle text-warning"></i> 80%内存告警测试</h5>
            <p class="mb-2">当前监控到的服务器内存使用情况：</p>
            <div id="memory-alerts" class="mb-3">
                <!-- 动态加载内存告警 -->
            </div>
            <button class="btn btn-warning btn-sm" onclick="simulateHighMemory()">
                <i class="fas fa-memory"></i> 模拟高内存使用
            </button>
        </div>
        
        <!-- 服务器状态列表 -->
        <div class="row" id="server-list">
            <!-- 动态加载服务器状态 -->
        </div>
    </div>

    <!-- WebSocket连接提示 -->
    <div id="connection-status" class="position-fixed bottom-0 end-0 m-3">
        <div class="badge bg-secondary">
            <i class="fas fa-circle text-danger"></i> 正在连接...
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    
    <script>
        let stompClient = null;
        let serverData = {};
        
        // WebSocket连接
        function connect() {
            const socket = new SockJS('/ws');
            stompClient = Stomp.over(socket);
            
            stompClient.connect({}, function (frame) {
                console.log('WebSocket已连接: ' + frame);
                updateConnectionStatus(true);
                
                // 订阅告警通知
                stompClient.subscribe('/topic/alerts', function (message) {
                    const alert = JSON.parse(message.body);
                    handleAlert(alert);
                });
                
                // 订阅状态更新
                stompClient.subscribe('/topic/server-status', function (message) {
                    const statusUpdate = JSON.parse(message.body);
                    handleStatusUpdate(statusUpdate);
                });
                
                // 加载初始数据
                loadServerStatus();
            }, function (error) {
                console.error('WebSocket连接失败: ' + error);
                updateConnectionStatus(false);
                // 5秒后重试连接
                setTimeout(connect, 5000);
            });
        }
        
        function updateConnectionStatus(connected) {
            const statusEl = document.getElementById('connection-status');
            if (connected) {
                statusEl.innerHTML = `
                    <div class="badge bg-success">
                        <i class="fas fa-circle text-success"></i> 已连接
                    </div>`;
            } else {
                statusEl.innerHTML = `
                    <div class="badge bg-danger">
                        <i class="fas fa-circle text-danger"></i> 连接断开
                    </div>`;
            }
        }
        
        function handleAlert(alert) {
            console.log('收到告警:', alert);
            
            // 如果是内存告警
            if (alert.type === 'resource_alert' && alert.resourceType === 'MEMORY') {
                showMemoryAlert(alert);
            }
            
            // 如果是严重内存告警
            if (alert.type === 'critical_memory_alert' || alert.type === 'emergency_memory_alert') {
                showCriticalMemoryAlert(alert);
            }
        }
        
        function showMemoryAlert(alert) {
            const alertsContainer = document.getElementById('memory-alerts');
            const alertEl = document.createElement('div');
            alertEl.className = 'alert alert-danger alert-dismissible fade show';
            alertEl.innerHTML = `
                <strong><i class="fas fa-memory"></i> 服务器 ${alert.serverId} 内存告警</strong><br>
                ${alert.message}<br>
                <small class="text-muted">时间: ${new Date(alert.timestamp).toLocaleString()}</small>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
            alertsContainer.appendChild(alertEl);
            
            // 5秒后自动关闭
            setTimeout(() => {
                if (alertEl.parentNode) {
                    alertEl.remove();
                }
            }, 5000);
        }
        
        function showCriticalMemoryAlert(alert) {
            const alertsContainer = document.getElementById('memory-alerts');
            const criticalAlertEl = document.createElement('div');
            criticalAlertEl.className = 'alert alert-danger memory-alert-critical';
            criticalAlertEl.innerHTML = `
                <strong><i class="fas fa-exclamation-triangle"></i> ${alert.title}</strong><br>
                ${alert.message}<br>
                <small class="text-muted">优先级: ${alert.priority}</small>
                <div class="mt-2">
                    <button class="btn btn-danger btn-sm" onclick="viewServerDetails(${alert.serverId})">查看详情</button>
                    <button class="btn btn-secondary btn-sm" onclick="this.parentElement.parentElement.remove()">暂时忽略</button>
                </div>
            `;
            alertsContainer.appendChild(criticalAlertEl);
        }
        
        function loadServerStatus() {
            fetch('/api/server-status/all')
                .then(response => response.json())
                .then(data => {
                    serverData = data;
                    renderServerList(data);
                })
                .catch(error => {
                    console.error('加载服务器状态失败:', error);
                });
        }
        
        function renderServerList(servers) {
            const container = document.getElementById('server-list');
            container.innerHTML = '';
            
            Object.entries(servers).forEach(([serverId, serverInfo]) => {
                const serverCard = createServerCard(serverId, serverInfo);
                container.appendChild(serverCard);
            });
        }
        
        function createServerCard(serverId, serverInfo) {
            const cardDiv = document.createElement('div');
            cardDiv.className = 'col-md-6 col-lg-4 mb-4';
            
            const hasAlerts = serverInfo.tags && serverInfo.tags.some(tag => tag.isAlert);
            
            cardDiv.innerHTML = `
                <div class="card server-card ${hasAlerts ? 'has-alerts' : ''}">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h6 class="mb-0">
                            <i class="fas fa-server"></i> 
                            服务器 ${serverInfo.name || serverId}
                        </h6>
                        <button class="btn btn-sm btn-outline-primary" onclick="refreshServer(${serverId})">
                            <i class="fas fa-sync-alt"></i>
                        </button>
                    </div>
                    <div class="card-body">
                        <div class="status-tags mb-3">
                            ${renderStatusTags(serverInfo.tags || [])}
                        </div>
                        <div class="server-metrics">
                            ${renderMetrics(serverInfo.metrics)}
                        </div>
                    </div>
                </div>
            `;
            
            return cardDiv;
        }
        
        function renderStatusTags(tags) {
            if (!tags || tags.length === 0) {
                return '<span class="text-muted">暂无状态标签</span>';
            }
            
            return tags
                .sort((a, b) => (b.priority || 0) - (a.priority || 0))
                .map(tag => {
                    const colorClass = getTagColorClass(tag.colorScheme);
                    const isMemoryAlert = tag.tagType === 'MEMORY_USAGE' && tag.status !== 'NORMAL';
                    const extraClass = isMemoryAlert ? 'memory-alert-critical' : '';
                    
                    return `<span class="status-tag ${colorClass} ${extraClass}" title="${tag.details || ''}">
                        ${tag.displayText}
                        ${tag.value ? `(${tag.value})` : ''}
                    </span>`;
                })
                .join('');
        }
        
        function renderMetrics(metrics) {
            if (!metrics) {
                return '<p class="text-muted">暂无监控数据</p>';
            }
            
            return `
                <div class="row text-center">
                    <div class="col-4">
                        <small class="text-muted">内存</small><br>
                        <span class="fw-bold ${metrics.memoryUsagePercent > 80 ? 'text-danger' : ''}">${(metrics.memoryUsagePercent || 0).toFixed(1)}%</span>
                    </div>
                    <div class="col-4">
                        <small class="text-muted">CPU</small><br>
                        <span class="fw-bold">${(metrics.cpuUsagePercent || 0).toFixed(1)}%</span>
                    </div>
                    <div class="col-4">
                        <small class="text-muted">磁盘</small><br>
                        <span class="fw-bold">${(metrics.diskUsagePercent || 0).toFixed(1)}%</span>
                    </div>
                </div>
            `;
        }
        
        function getTagColorClass(colorScheme) {
            switch(colorScheme) {
                case 'success': return 'tag-success';
                case 'warning': return 'tag-warning';
                case 'danger': return 'tag-danger';
                case 'info': return 'tag-info';
                default: return 'tag-secondary';
            }
        }
        
        function refreshAll() {
            loadServerStatus();
        }
        
        function refreshServer(serverId) {
            fetch(`/api/server-status/${serverId}/refresh`, { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    console.log('服务器状态已刷新:', data);
                    loadServerStatus(); // 重新加载所有数据
                })
                .catch(error => {
                    console.error('刷新服务器状态失败:', error);
                });
        }
        
        function simulateHighMemory() {
            // 模拟发送高内存使用告警
            const simulatedAlert = {
                type: 'critical_memory_alert',
                serverId: 1,
                serverName: '测试服务器',
                memoryUsage: 85.5,
                title: '🔥 严重内存告警',
                message: '服务器 测试服务器 内存使用率 85.5% 超过80%严重阈值',
                priority: 'HIGH',
                timestamp: Date.now()
            };
            
            showCriticalMemoryAlert(simulatedAlert);
        }
        
        function viewServerDetails(serverId) {
            window.open(`/admin/servers/${serverId}`, '_blank');
        }
        
        // 页面加载时连接WebSocket
        document.addEventListener('DOMContentLoaded', function() {
            connect();
        });
        
        // 页面关闭时断开连接
        window.addEventListener('beforeunload', function() {
            if (stompClient !== null) {
                stompClient.disconnect();
            }
        });
    </script>
</body>
</html>
