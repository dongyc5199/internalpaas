<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>初始配置 - Dev Debug Platform</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <h1 th:text="${isFirstTime} ? '欢迎首次使用！' : '工作目录配置'">初始配置</h1>
        
        <div th:if="${isFirstTime}" style="background: #e8f5e8; padding: 15px; border-radius: 4px; margin-bottom: 20px;">
            <h3>配置说明</h3>
            <p>作为一般用户，系统将在超级管理员设置的基础工作目录下为您创建个人工作空间。</p>
            <p>您无需手动选择目录，系统将自动为您创建合适的目录结构。</p>
        </div>
        
        <form th:action="@{/initial-config}" method="post" th:object="${config}">
            <div class="form-group" style="display: none;">
                <label for="workDirectory">工作目录：</label>
                <input type="text" id="workDirectory" th:field="*{workDirectory}" 
                       placeholder="系统将自动创建" readonly>
            </div>
            
            <div style="background: #f8f9fa; padding: 20px; border-radius: 4px; margin-bottom: 20px;">
                <h4>即将为您创建的工作目录：</h4>
                <p style="font-family: monospace; color: #666; margin: 10px 0;">
                    ./workspaces/[您的用户名]/
                </p>
                <small style="color: #888;">
                    系统将在此目录下存储您的所有应用文件
                </small>
            </div>
            
            <button type="submit" class="btn">确认并开始使用</button>
        </form>
        
        <a href="/" class="btn-secondary">返回首页</a>
    </div>
</body>
</html>
