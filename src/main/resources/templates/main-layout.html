            function updateDelta(id, delta) {
                const element = document.getElementById(id);
                if (!element) {
                    return;
                }

                const suffix = element.dataset.suffix || '%';
                const precisionAttr = element.dataset.precision;
                const precision = precisionAttr ? parseInt(precisionAttr, 10) : 1;

                if (delta === undefined || delta === null || delta === '') {
                    element.textContent = '--';
                    element.dataset.trend = 'neutral';
                    return;
                }

                const numeric = typeof delta === 'number' ? delta : Number(delta);
                if (!Number.isNaN(numeric)) {
                    const formatted = `${numeric > 0 ? '+' : ''}${numeric.toFixed(precision)}${suffix}`;
                    element.textContent = formatted;
                    if (numeric > 0) {
                        element.dataset.trend = 'up';
                    } else if (numeric < 0) {
                        element.dataset.trend = 'down';
                    } else {
                        element.dataset.trend = 'neutral';
                    }
                } else {
                    element.textContent = delta;
                    element.dataset.trend = 'neutral';
                }
            }

            function updateTimestamp(id, timestamp) {
                const element = document.getElementById(id);
                if (!element) {
                    return;
                }

                const label = currentLanguage === 'en' ? 'Last updated' : '更新于';
                const locale = currentLanguage === 'en' ? 'en-US' : 'zh-CN';

                if (!timestamp) {
                    element.textContent = `${label} --`;
                    return;
                }

                const date = new Date(timestamp);
                if (Number.isNaN(date.getTime())) {
                    element.textContent = `${label} ${timestamp}`;
                    return;
                }

                const formatted = date.toLocaleString(locale, { hour12: false });
                element.textContent = `${label} ${formatted}`;
            }

            function formatPercent(value, fractionDigits = 1) {
                if (value === undefined || value === null || value === '') {
                    return '--%';
                }
                const numeric = typeof value === 'number' ? value : Number(value);
                if (Number.isNaN(numeric)) {
                    return `${value}`;
                }
                const percent = Math.abs(numeric) <= 1 ? numeric * 100 : numeric;
                return `${percent.toFixed(fractionDigits)}%`;
            }

            // 健康度趋势图相关函数
            function initHealthTrendChart() {
                const ctx = document.getElementById('dashboardHealthTrendCanvas');
                if (!ctx) return;

                // 销毁现有图表
                if (healthTrendChart) {
                    healthTrendChart.destroy();
                }

                // 初始化趋势数据（最近12个数据点）
                if (healthTrendData.length === 0) {
                    // 生成初始模拟数据
                    const now = new Date();
                    for (let i = 11; i >= 0; i--) {
                        const time = new Date(now.getTime() - i * 5 * 60000); // 每5分钟一个点
                        healthTrendData.push({
                            time: time.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }),
                            value: Math.random() * 20 + 80 // 80-100之间的随机值
                        });
                    }
                }

                healthTrendChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: healthTrendData.map(d => d.time),
                        datasets: [{
                            label: '系统健康度',
                            data: healthTrendData.map(d => d.value),
                            borderColor: 'rgba(16, 185, 129, 1)',
                            backgroundColor: 'rgba(16, 185, 129, 0.1)',
                            borderWidth: 2,
                            fill: true,

                                display: false
                            },

                            duration: 400
                        }
                    }
                });
            }

            function updateHealthTrend(newScore) {
                if (!newScore || typeof newScore !== 'number') return;

                // 添加新数据点
                const now = new Date();
                healthTrendData.push({
                    time: now.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }),
                    value: newScore
                });

                // 保持最多12个数据点
                if (healthTrendData.length > 12) {
                    healthTrendData.shift();
                }

                // 更新图表
                if (healthTrendChart) {
                    healthTrendChart.data.labels = healthTrendData.map(d => d.time);
                    healthTrendChart.data.datasets[0].data = healthTrendData.map(d => d.value);
                    healthTrendChart.update('none');
                } else {
                    // 如果图表还没初始化，初始化它
                    initHealthTrendChart();
                }
            }

            // 🎯 [仪表板键盘快捷键] 功能
            function initDashboardKeyboardShortcuts() {
                // 仪表板键盘快捷键处理器
                function handleDashboardKeyboard(event) {
                    // 只在仪表板页面生效
                    if (!document.querySelector('.content-framework.admin-theme')) {
                        return;
                    }

                    // 避免在输入框中触发快捷键
                    const activeElement = document.activeElement;
                    if (activeElement && (activeElement.tagName === 'INPUT' || activeElement.tagName === 'TEXTAREA')) {
                        return;
                    }

                    // Ctrl/Cmd + 组合键
                    if (event.ctrlKey || event.metaKey) {
                        switch (event.key.toLowerCase()) {
                            case 'r':
                                // Ctrl+R: 刷新概览数据
                                event.preventDefault();
                                loadDashboardOverview();
                                showShortcutTip('刷新概览数据');
                                break;

                            case 's':
                                // Ctrl+S: 刷新服务器数据
                                event.preventDefault();
                                loadServerMonitoring();
                                showShortcutTip('刷新服务器数据');
                                break;

                            case 'n':
                                // Ctrl+N: 新建服务器
                                event.preventDefault();
                                emit('spa:navigate', { route: 'servers' });
                                showShortcutTip('跳转到服务器管理');
                                break;
                        }
                    }

                    // 单键快捷键
                    switch (event.key.toLowerCase()) {
                        case 'g': {
                            // G: 切换到网格视图
                            const gridBtn = document.getElementById('serverGridView');
                            const listBtn = document.getElementById('serverListView');
                            if (gridBtn && listBtn) {
                                setServerViewMode('grid');
                                showShortcutTip('切换到网格视图');
                            }
                            break;
                        }

                        case 'l': {
                            // L: 切换到列表视图
                            const gridBtn = document.getElementById('serverGridView');
                            const listBtn = document.getElementById('serverListView');
                            if (gridBtn && listBtn) {
                                setServerViewMode('list');
                                showShortcutTip('切换到列表视图');
                            }
                            break;
                        }

                        case 'c':
                            // C: 切换资源图表视图
                            const barBtn = document.getElementById('resourceBarView');
                            const chartBtn = document.getElementById('resourceChartView');
                            if (barBtn && chartBtn) {
                                // 判断当前状态并切换
                                if (barBtn.classList.contains('active')) {
                                    toggleResourceView('chart', barBtn, chartBtn);
                                    showShortcutTip('切换到饼图视图');
                                } else {
                                    toggleResourceView('bar', barBtn, chartBtn);
                                    showShortcutTip('切换到条形图视图');
                                }
                            }
                            break;

                        case '?':
                        case 'h':
                            // ?: 显示快捷键帮助
                            showKeyboardShortcutsHelp();
                            break;
                    }
                }

                // 添加键盘事件监听
                document.addEventListener('keydown', handleDashboardKeyboard);

                // 清理函数，当离开仪表板时移除监听器
                const originalRemove = document.removeEventListener;
                window.cleanupDashboardKeyboard = () => {
                    document.removeEventListener('keydown', handleDashboardKeyboard);
                };
            }

                    if (e.key === 'Escape') {
                        if (helpModal.parentNode) {
                            helpModal.parentNode.removeChild(helpModal);
                        }
                        document.removeEventListener('keydown', handleEsc);
                    }
                };
                document.addEventListener('keydown', handleEsc);

                // 添加kbd样式
                if (!document.getElementById('kbd-style')) {
                    const style = document.createElement('style');
                    style.id = 'kbd-style';
                    style.textContent = `
                        kbd {
                            background: #f1f3f4;
                            border: 1px solid #dadce0;
                            border-radius: 3px;
                            color: #3c4043;
                            display: inline-block;
                            font-family: monospace;
                            font-size: 0.8em;
                            margin: 0 2px;
                            padding: 2px 6px;
                            text-shadow: 0 1px 0 white;
                            white-space: nowrap;
                        }
                    `;
                    document.head.appendChild(style);
                }
            }

            loadPreferences();
            initHeader();
            initSidebar();
            initSpaOutlet();
            initResponsiveHandling();
            emit('app:ready', { theme: currentTheme, sidebar: sidebarState });

            window.AppShell = {
                on,
                emit,
                applyTheme,
                applyLanguage,
                setSidebar(state) {
                    applySidebarState(state);
                },
                setLanguage(lang) {
                    applyLanguage(lang);
                },
                getState() {
                    return { theme: currentTheme, sidebar: sidebarState, language: currentLanguage };
                }
            };
        })();
    </script>
</body>
</html>
