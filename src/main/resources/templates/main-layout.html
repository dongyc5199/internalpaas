<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/springsecurity" class="shell-theme-light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:utext="${appName != null ? appName : 'Dev Debug Platform &#x63A7;&#x5236;&#x53F0;'}">Dev Debug Platform &#x63A7;&#x5236;&#x53F0;</title>
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />

    <link rel="preload" href="/vendor/fontawesome/webfonts/fa-solid-900.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/vendor/fontawesome/webfonts/fa-regular-400.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/css/design-tokens.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/components/navigation.css">
    <link rel="stylesheet" href="/css/components/buttons.css">
    <link rel="stylesheet" href="/css/components/cards.css">
    <link rel="stylesheet" href="/css/fontawesome-local.css">
    <link rel="stylesheet" href="/css/icon-components.css">
    <link rel="stylesheet" href="/css/responsive.css">
    <link rel="stylesheet" href="/css/content-framework.css">
    <link rel="stylesheet" href="/css/admin-dashboard.css">
    <link rel="stylesheet" th:href="@{/admin-dashboard/stat-cards.css}">
    <link rel="icon" type="image/png" href="/favicon.png">

    <style>
        /* 统一去掉所有按钮和链接的焦点蓝框 */
        *:focus,
        *:focus-visible {
            outline: none !important;
        }

        button:focus,
        button:focus-visible,
        a:focus,
        a:focus-visible {
            box-shadow: none !important;
        }

        :root {
            color-scheme: light dark;
            --shell-header-height: 64px;
            --shell-sidebar-width: 240px;
            --shell-sidebar-width-collapsed: 72px;
            --shell-background: var(--background-color, #F4F5FB);
            --shell-surface: var(--surface-color, rgba(255,255,255,0.92));
            --shell-glass: rgba(255,255,255,0.78);
            --shell-border: rgba(255,255,255,0.6);
            --shell-border-dark: rgba(15,23,42,0.18);
            --shell-text-primary: var(--text-color, #0F172A);
            --shell-text-secondary: rgba(15,23,42,0.6);
            --shell-accent: linear-gradient(135deg, #2F9BFF, #3BC6B8);
            --shell-accent-dev: linear-gradient(135deg, #6C63FF, #3D8BFF);
            --shell-scrollbar: rgba(15,23,42,0.18);
        }

        .shell-theme-dark {
            --shell-background: #111827;
            --shell-surface: rgba(30,41,59,0.92);
            --shell-glass: rgba(30,41,59,0.82);
            --shell-border: rgba(148,163,184,0.32);
            --shell-border-dark: rgba(15,23,42,0.36);
            --shell-text-primary: #F9FAFB;
            --shell-text-secondary: rgba(226,232,240,0.72);
            --shell-scrollbar: rgba(148,163,184,0.35);
        }

        body.layout-shell {
            margin: 0;
            height: 100vh;
            overflow: hidden; /* 防止body滚动 */
            background: var(--shell-background);
            color: var(--shell-text-primary);
            font-family: "Inter", "Segoe UI", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", sans-serif;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .shell-grid {
            display: grid;
            grid-template-columns: var(--shell-sidebar-width) 1fr;
            grid-template-rows: var(--shell-header-height) 1fr;
            height: 100vh;
            overflow: hidden; /* 防止整个页面滚动 */
        }

        .shell-grid[data-sidebar-state="collapsed"] {
            grid-template-columns: var(--shell-sidebar-width-collapsed) 1fr;
        }

        .shell-header {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            padding: 0 24px;
            height: var(--shell-header-height);
            background: var(--shell-glass);
            border-bottom: 1px solid var(--shell-border);
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 24px rgba(15,23,42,0.12);
            position: sticky;
            top: 0;
            z-index: 4;
        }

        .shell-header[data-variant="dev"] .brand-logo {
            background: var(--shell-accent-dev);
        }

        .brand-area {
            display: flex;
            align-items: center;
            gap: 16px;
            flex: 0 0 auto;
            min-width: 260px;
        }

        .brand-logo {
            width: 32px;
            height: 32px;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            color: #FFFFFF;
            background: var(--shell-accent);
        }

        .brand-meta {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .brand-title {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .brand-subtitle {
            font-size: 12px;
            font-weight: 500;
            text-transform: uppercase;
            color: var(--shell-text-secondary);
            letter-spacing: 0.6px;
        }

        .shell-search {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 18px;
            border-radius: 16px;
            background: rgba(15,23,42,0.05);
            border: 1px solid rgba(15,23,42,0.06);
            max-width: 520px;
            transition: border 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .shell-search:hover,
        .shell-search:focus-within {
            border-color: rgba(37,99,235,0.35);
            box-shadow: 0 12px 32px rgba(37,99,235,0.18);
        }

        .shell-search-icon {
            width: 24px;
            height: 24px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            opacity: 0.6;
        }

        .shell-search-placeholder {
            flex: 1;
            font-size: 14px;
            color: var(--shell-text-secondary);
        }

        .shell-search-shortcut {
            font-size: 12px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 999px;
            background: rgba(37,99,235,0.12);
            color: rgba(37,99,235,0.85);
            letter-spacing: 0.6px;
        }

        .shell-toolbar {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .toolbar-btn,
        .toolbar-toggle {
            width: 36px;
            height: 36px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.65);
            background: rgba(255,255,255,0.7);
            box-shadow: 0 3px 10px rgba(15,23,42,0.16);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border 0.2s ease;
            color: inherit;
        }

        .toolbar-toggle {
            width: auto;
            min-width: 36px;
            padding: 0 12px;
            gap: 6px;
        }

        .theme-label {
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
        }

        .toolbar-btn:hover,
        .toolbar-toggle:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(15,23,42,0.2);
            border-color: rgba(37,99,235,0.45);
        }

        .toolbar-btn:focus,
        .toolbar-btn:focus-visible,
        .toolbar-toggle:focus,
        .toolbar-toggle:focus-visible {
            outline: none;
            box-shadow: none;
        }

        .toolbar-toggle[data-state="on"] .toggle-indicator {
            opacity: 1;
        }

        .language-switcher {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 12px;
            height: 36px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.65);
            background: rgba(255,255,255,0.7);
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.6px;
            cursor: pointer;
        }

        .toolbar-divider {
            width: 1px;
            height: 28px;
            background: rgba(15,23,42,0.12);
        }

        .sidebar {
            grid-row: 2 / -1;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 24px 44px rgba(15, 23, 42, 0.14);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            overflow-x: hidden;
            transition: all var(--transition-slow);
            position: relative;
            z-index: 2;
        }

        .sidebar-content {
            flex: 1;
            padding: 18px 16px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .sidebar-content::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar-content::-webkit-scrollbar-thumb {
            background: rgba(15, 23, 42, 0.2);
            border-radius: 3px;
        }

        .sidebar-content::-webkit-scrollbar-track {
            background: transparent;
        }

        /* 折叠状态下隐藏滚动条 */
        .sidebar[data-state="collapsed"] .sidebar-content::-webkit-scrollbar {
            width: 0;
        }

        .menu-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
            overflow-y: auto;
        }

        .menu-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14px;
            color: rgba(15, 23, 42, 0.78);
            cursor: pointer;
            transition: all var(--transition-fast);
            overflow: hidden;
            white-space: nowrap;
        }

        .menu-item .meta {
            display: flex;
            align-items: center;
            gap: 12px;
            overflow: hidden;
            flex: 1;
        }

        .menu-item .text {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .menu-item.selected {
            background: rgba(47,155,255,0.15);
            position: relative;
        }

        .menu-item.selected::before {
            content: "";
            position: absolute;
            left: -16px;
            top: 10px;
            bottom: 10px;
            width: 4px;
            border-radius: 4px;
            background: var(--primary-gradient);
        }

        .menu-item:hover:not(.selected) {
            background: rgba(47,155,255,0.05);
        }

        .menu-icon {
            width: 28px;
            height: 28px;
            border-radius: 10px;
            background: rgba(59,130,246,0.12);
            color: rgba(59,130,246,0.95);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge {
            min-width: 18px;
            height: 18px;
            padding: 0 6px;
            border-radius: 999px;
            background: rgba(59, 130, 246, 0.12);
            color: rgba(59, 130, 246, 1);
            font-size: 11px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        /* 折叠状态样式 */
        .sidebar[data-state="collapsed"] {
            width: 72px;
        }

        .sidebar[data-state="collapsed"] .sidebar-content {
            align-items: center;
        }

        .sidebar[data-state="collapsed"] .menu-item .text,
        .sidebar[data-state="collapsed"] .badge,
        .sidebar[data-state="collapsed"] .nav-tooltip {
            display: none;
        }

        .sidebar[data-state="collapsed"] .menu-item {
            width: 48px;
            height: 48px;
            padding: 12px;
            justify-content: center;
        }

        .sidebar[data-state="collapsed"] .menu-icon {
            width: 24px;
            height: 24px;
        }

        /* Footer block样式 */
        .footer-block {
            height: 175px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 16px;
            border-radius: 16px;
            background: rgba(15, 23, 42, 0.04);
        }

        .footer-block .pill {
            display: inline-flex;
            gap: 8px;
            align-items: center;
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 12px;
            color: rgba(15, 23, 42, 0.65);
            background: rgba(255, 255, 255, 0.72);
        }

        .footer-block .link {
            font-size: 12px;
            color: rgba(59, 130, 246, 0.85);
            cursor: pointer;
            text-decoration: none;
        }

        .footer-block .link:hover {
            text-decoration: underline;
        }

        /* 折叠状态下隐藏footer-block */
        .sidebar[data-state="collapsed"] .footer-block {
            display: none;
        }

        .sidebar[data-variant="glass"] {
            background: rgba(20,24,46,0.38);
            border-color: rgba(255,255,255,0.18);
        }







        /* 折叠状态下的悬浮提示样式 */
        .nav-tooltip {
            position: absolute;
            left: calc(100% + 12px);
            top: 50%;
            transform: translateY(-50%);
            background: rgba(15, 23, 42, 0.9);
            color: rgba(255, 255, 255, 0.95);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.3);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s ease, visibility 0.2s ease;
            z-index: 9999;
            pointer-events: none;
        }

        .nav-tooltip::before {
            content: "";
            position: absolute;
            left: -4px;
            top: 50%;
            transform: translateY(-50%);
            width: 8px;
            height: 8px;
            background: rgba(15, 23, 42, 0.9);
            rotate: 45deg;
        }


        /* 暗色主题下的悬浮提示 */
        .shell-theme-dark .nav-tooltip {
            background: rgba(30, 41, 59, 0.95);
            color: rgba(255, 255, 255, 0.9);
        }

        .shell-theme-dark .nav-tooltip::before {
            background: rgba(30, 41, 59, 0.95);
        }

        /* 侧边栏过渡动画 */
        .sidebar-transitioning {
            transition: width 0.3s ease, padding 0.3s ease !important;
        }

        .sidebar-transitioning * {
            transition: opacity 0.2s ease, transform 0.2s ease, width 0.2s ease, height 0.2s ease !important;
        }

        /* 背景遮罩样式 */
        .sidebar-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(4px);
            z-index: 1;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .sidebar-backdrop[data-state="visible"] {
            opacity: 1;
            visibility: visible;
        }

        /* 响应式断点调整 */
        @media (max-width: 1024px) {
            .shell-grid {
                grid-template-columns: 1fr;
                grid-template-rows: var(--shell-header-height) 1fr;
            }

            .sidebar {
                position: fixed;
                top: var(--shell-header-height);
                left: 0;
                height: calc(100vh - var(--shell-header-height));
                z-index: 2;
                transform: translateX(-100%);
                transition: transform 0.3s ease;
            }

            .sidebar[data-state="expanded"] {
                transform: translateX(0);
            }

            .content {
                grid-column: 1 / -1;
                grid-row: 2 / -1;
            }
        }

        @media (max-width: 768px) {
            .shell-header {
                padding: 0 16px;
            }

            .brand-area {
                min-width: 200px;
            }

            .shell-search {
                max-width: 300px;
            }

            /* 移动端内容区域样式 - 与content-framework完全一致 */
            .content {
                --content-padding: 16px;
                --section-gap: 16px;
            }

            /* 移动端直接使用content的样式变量 */
        }

        /* 暗色主题侧边栏 */
        .shell-theme-dark .sidebar {
            background: linear-gradient(180deg, rgba(30,41,59,0.95), rgba(17,24,39,0.92));
            border-right: 1px solid rgba(148,163,184,0.32);
        }

        .shell-theme-dark .sidebar[data-variant="glass"] {
            background: rgba(15,23,42,0.78);
            border-color: rgba(148,163,184,0.24);
        }

        /* 暗色主题菜单项 */
        .shell-theme-dark .menu-item {
            color: rgba(255,255,255,0.88);
        }

        .shell-theme-dark .menu-item.selected {
            background: rgba(96,165,250,0.18);
            color: rgba(147,197,253,1);
        }

        .shell-theme-dark .menu-item:hover:not(.selected) {
            background: rgba(96,165,250,0.08);
        }

        .shell-theme-dark .menu-icon {
            background: rgba(96,165,250,0.15);
            color: rgba(147,197,253,0.9);
        }

        /* 暗色主题badge */
        .shell-theme-dark .badge {
            background: rgba(96,165,250,0.15);
            color: rgba(147,197,253,0.95);
        }

        /* 暗色主题footer-block */
        .shell-theme-dark .footer-block {
            background: rgba(15, 23, 42, 0.15);
        }

        .shell-theme-dark .footer-block .pill {
            background: rgba(15, 23, 42, 0.25);
            color: rgba(255, 255, 255, 0.75);
        }

        .shell-theme-dark .footer-block .link {
            color: rgba(147, 197, 253, 0.85);
        }












        /* ================================================
           内容区域 - 与content-framework完全一致
           ================================================ */
        .content {
            grid-column: 2 / -1;
            grid-row: 2 / -1;
            padding: var(--content-padding, 24px 32px);
            background: var(--content-bg, rgba(248, 250, 255, 0.72));
            min-height: 100%;
            display: flex;
            flex-direction: column;
            gap: var(--section-gap, 24px);
            overflow-y: auto;
            overflow-x: hidden;
            transition: padding var(--transition-slow, 0.3s ease);
        }

        /* content-framework样式直接应用到content */

        /* 根据用户角色定义全局主题变量 */
        .layout-shell[data-variant="admin"] {
            --primary-gradient: linear-gradient(135deg, #2F9BFF, #3BC6B8);
            /* admin-dashboard.css 兼容变量 */
            --shell-background: rgba(248, 250, 255, 0.72);
            --shell-surface: rgba(255, 255, 255, 0.92);
            --shell-border: rgba(226, 232, 240, 0.8);
            --shell-text-primary: #0F172A;
            --shell-text-secondary: #64748B;
            --accent-color: #2F9BFF;
            --secondary-color: #3BC6B8;
        }
        .layout-shell[data-variant="developer"] {
            --primary-gradient: linear-gradient(135deg, #6C63FF, #3D8BFF);
            /* admin-dashboard.css 兼容变量 */
            --shell-background: rgba(240, 242, 255, 0.75);
            --shell-surface: rgba(255, 255, 255, 0.94);
            --shell-border: rgba(199, 210, 254, 0.7);
            --shell-text-primary: #1E1B4B;
            --shell-text-secondary: #6366F1;
            --accent-color: #6C63FF;
            --secondary-color: #3D8BFF;
        }

        /* 管理员主题 - 与content-framework完全一致 */
        .layout-shell .content.admin-theme {
            --primary-gradient: linear-gradient(135deg, #2F9BFF, #3BC6B8);
            --primary-color: #2F9BFF;
            --primary-hover: #1E88E5;
            --secondary-color: #3BC6B8;
            --success-color: #22C55E;
            --warning-color: #F59E0B;
            --error-color: #EF4444;
            --info-color: #3B82F6;

            --content-bg: rgba(248, 250, 255, 0.72);
            --card-bg: rgba(255, 255, 255, 0.92);
            --toolbar-bg: rgba(255, 255, 255, 0.8);
            --border-color: rgba(226, 232, 240, 0.8);

            --text-primary: #0F172A;
            --text-secondary: #64748B;
            --text-muted: #94A3B8;
            --text-inverse: #FFFFFF;

            /* 内容区域间距 */
            --content-padding: 24px 32px;
            --section-gap: 24px;
            --card-gap: 16px;
            --component-gap: 12px;

            /* 边框圆角规范 */
            --border-radius-sm: 8px;
            --border-radius: 12px;
            --border-radius-lg: 16px;
            --border-radius-xl: 20px;

            /* 阴影规范 */
            --shadow-xs: 0 1px 2px rgba(15, 23, 42, 0.05);
            --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.1), 0 1px 2px rgba(15, 23, 42, 0.06);
            --shadow: 0 1px 3px rgba(15, 23, 42, 0.1), 0 1px 2px rgba(15, 23, 42, 0.06);
            --shadow-md: 0 4px 6px rgba(15, 23, 42, 0.07), 0 2px 4px rgba(15, 23, 42, 0.06);
            --shadow-lg: 0 10px 15px rgba(15, 23, 42, 0.1), 0 4px 6px rgba(15, 23, 42, 0.05);
            --shadow-hover: 0 8px 20px rgba(15, 23, 42, 0.12), 0 3px 8px rgba(15, 23, 42, 0.08);

            /* 过渡动画 */
            --transition-fast: 0.15s ease;
            --transition-normal: 0.2s ease;
            --transition-slow: 0.3s ease;

            background: var(--content-bg);
        }

        /* 开发者主题 - 与content-framework完全一致 */
        .layout-shell .content.developer-theme {
            --primary-gradient: linear-gradient(135deg, #6C63FF, #3D8BFF);
            --primary-color: #6C63FF;
            --primary-hover: #5B54D8;
            --secondary-color: #3D8BFF;
            --success-color: #10B981;
            --warning-color: #F59E0B;
            --error-color: #EF4444;
            --info-color: #8B5CF6;

            --content-bg: rgba(240, 242, 255, 0.75);
            --card-bg: rgba(255, 255, 255, 0.94);
            --toolbar-bg: rgba(248, 250, 255, 0.85);
            --border-color: rgba(199, 210, 254, 0.7);

            --text-primary: #1E1B4B;
            --text-secondary: #6366F1;
            --text-muted: #A5B4FC;
            --text-inverse: #FFFFFF;

            background: var(--content-bg);
        }

        /* Demo页面中的内容元素样式 */
        .content .caption {
            font-size: 12px;
            color: rgba(15,23,42,0.55);
        }

        .content .placeholder {
            height: 180px;
            border-radius: 18px;
            background: repeating-linear-gradient(135deg, rgba(59,130,246,0.12), rgba(59,130,246,0.12) 12px, rgba(59,130,246,0.04) 12px, rgba(59,130,246,0.04) 24px);
        }


        .spa-placeholder {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px dashed rgba(37,99,235,0.2);
            border-radius: 20px;
            color: var(--shell-text-secondary);
            background: rgba(37,99,235,0.06);
        }

        .sidebar-backdrop {
            display: none;
        }

        @media (max-width: 1280px) {
            .shell-search {
                max-width: none;
            }
        }

        @media (max-width: 1024px) {
            .shell-grid {
                grid-template-columns: 1fr;
            }

            .sidebar {
                position: fixed;
                inset: var(--shell-header-height) auto 0 0;
                transform: translateX(-100%);
                max-width: var(--shell-sidebar-width);
                width: calc(100vw - 64px);
                box-shadow: 12px 0 32px rgba(15,23,42,0.32);
            }

            .sidebar[data-state="expanded"] {
                transform: translateX(0);
            }

            .content {
                grid-column: 1 / -1;
            }

            .sidebar-backdrop {
                display: block;
                position: fixed;
                inset: var(--shell-header-height) 0 0 0;
                background: rgba(15,23,42,0.45);
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.3s ease;
                z-index: 3;
            }

            .sidebar-backdrop[data-state="visible"] {
                opacity: 1;
                pointer-events: auto;
            }
        }

        .user-menu {
            position: relative;
            display: flex;
            align-items: center;
        }

        .user-menu__toggle {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 6px 12px;
            border: 1px solid rgba(15,23,42,0.12);
            border-radius: 999px;
            background: transparent;
            color: inherit;
            font: inherit;
            cursor: pointer;
            transition: background 0.2s ease, border-color 0.2s ease;
        }

        .user-menu__toggle:hover,
        .user-menu[data-open="true"] .user-menu__toggle {
            background: rgba(59,130,246,0.08);
            border-color: rgba(59,130,246,0.24);
        }

        .user-menu__avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            background: linear-gradient(135deg, #6366F1, #3B82F6);
            color: #FFFFFF;
        }

        .user-menu__meta {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            line-height: 1.1;
        }

        .user-menu__name {
            font-size: 14px;
            font-weight: 600;
        }

        .user-menu__role {
            font-size: 12px;
            color: var(--shell-text-secondary);
        }

        .user-menu__caret {
            font-size: 12px;
            opacity: 0.6;
        }

        .user-menu__dropdown {
            position: absolute;
            top: calc(100% + 12px);
            right: 0;
            min-width: 220px;
            display: none;
            flex-direction: column;
            gap: 12px;
            padding: 16px;
            border-radius: 16px;
            background: var(--shell-surface);
            box-shadow: 0 20px 48px rgba(15,23,42,0.18);
            border: 1px solid var(--shell-border);
            z-index: 10;
        }

        .user-menu[data-open="true"] .user-menu__dropdown {
            display: flex;
        }

        .user-menu__header {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .user-menu__header-name {
            font-size: 15px;
            font-weight: 600;
        }

        .user-menu__header-role {
            font-size: 12px;
            color: var(--shell-text-secondary);
        }

        .user-menu__options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .user-menu__option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            border-radius: 10px;
            color: inherit;
            text-decoration: none;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .user-menu__option i {
            width: 16px;
            text-align: center;
        }

        .user-menu__option:hover {
            background: rgba(59,130,246,0.1);
            color: #1D4ED8;
        }

        .user-menu__option--danger {
            width: 100%;
            border: none;
            background: transparent;
            font: inherit;
            text-align: left;
            cursor: pointer;
        }

        .user-menu__option--danger:hover {
            background: rgba(248,113,113,0.12);
            color: #DC2626;
        }

        .user-menu__footer form {
            margin: 0;
        }

        @media (max-width: 768px) {
            .user-menu__meta {
                display: none;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                transition: none !important;
                animation: none !important;
            }
            .toolbar-btn,
            .toolbar-toggle {
                transition: none;
            }
        }
    </style>
</head>
<body class="layout-shell">
    <div class="shell-grid" id="appShellRoot" data-shell-root data-sidebar-state="expanded">
        <header class="shell-header"
                data-role="shell-header"
                th:with="rawRole=${userType != null ? userType : userRole},
                         workspaceRole=${rawRole != null and #strings.equalsIgnoreCase(rawRole, 'ADMIN') ? 'admin' : 'developer'}"
                th:attr="data-variant=${workspaceRole}">
            <div class="brand-area" role="button" tabindex="0" data-action="navigate-home">
                <span class="brand-logo" aria-hidden="true"
                      th:text="${workspaceBadge ?: (workspaceRole == 'admin' ? 'AW' : 'DW')}">DW</span>
                <span class="brand-meta">
                    <span class="brand-title" th:text="${appName ?: 'Dev Debug Platform'}">Dev Debug Platform</span>
                    <span class="brand-subtitle"
                          th:text="${workspaceRole == 'admin' ? 'Admin Workspace' : 'Developer Workspace'}">Admin Workspace</span>
                </span>
            </div>
            <div class="shell-search" role="button" tabindex="0" data-action="open-command-palette" aria-haspopup="dialog" aria-expanded="false">

                <span class="shell-search-icon" aria-hidden="true">&#8984;</span>

                <span class="shell-search-placeholder"

                      th:with="defaultCommandHint=${workspaceRole == 'admin' ? '&#x641C;&#x7D22;&#x670D;&#x52A1;&#x5668;&#x3001;&#x4EFB;&#x52A1;&#x6216;&#x547D;&#x4EE4;' : '&#x641C;&#x7D22;&#x5E94;&#x7528;&#x3001;&#x670D;&#x52A1;&#x6216;&#x547D;&#x4EE4;'}"

                      th:utext="${#ctx.containsVariable('commandHint') and commandHint != null ? commandHint : defaultCommandHint}">

                    &#x641C;&#x7D22;&#x5DE5;&#x4F5C;&#x533A;&#x3001;&#x670D;&#x52A1;&#x6216;&#x547D;&#x4EE4;

                </span>

                <span class="shell-search-shortcut">Ctrl/&#8984; K</span>

            </div>
            <div class="shell-toolbar">
                <button type="button" class="toolbar-btn" data-action="toggle-sidebar" aria-controls="primarySidebar" aria-expanded="true" title="展开/收起侧边栏">
                    &#9776;
                </button>
                <button type="button" class="toolbar-btn" data-action="open-notifications" title="通知中心">
                    &#128276;
                </button>
                <button type="button" class="toolbar-toggle" data-action="toggle-theme" aria-pressed="false" title="切换主题">
                    <span aria-hidden="true">☀️</span>
                    <span class="theme-label" aria-hidden="true">浅色</span>
                </button>
                <div class="language-switcher" data-action="toggle-language" role="button" aria-pressed="false">
                    <span th:text="${languageTag ?: 'ZH'}">ZH</span>
                </div>
                <span class="toolbar-divider" aria-hidden="true"></span>
                                <div class="user-menu" data-role="user-menu" data-open="false">
                    <button type="button"
                            class="user-menu__toggle"
                            data-action="toggle-user-menu"
                            aria-haspopup="true"
                            aria-expanded="false">
                        <span class="user-menu__avatar"
                              th:text="${#strings.substring((username != null ? username : 'U'), 0, 1).toUpperCase()}">U</span>
                        <span class="user-menu__meta">
                            <span class="user-menu__name"
                                  th:text="${username != null ? username : '访客'}">访客</span>
                            <span class="user-menu__role"
                                  th:text="${workspaceRole == 'admin' ? '管理员' : '开发者'}">管理员</span>
                        </span>
                        <span class="user-menu__caret" aria-hidden="true">▾</span>
                    </button>
                    <div class="user-menu__dropdown"
                         data-role="user-dropdown"
                         aria-hidden="true">
                        <div class="user-menu__header">
                            <span class="user-menu__header-name"
                                  th:text="${username != null ? username : '访客'}">访客</span>
                            <span class="user-menu__header-role"
                                  th:text="${workspaceRole == 'admin' ? '平台管理员' : '研发成员'}">平台管理员</span>
                        </div>
                        <div class="user-menu__options">
                            <a class="user-menu__option" href="/profile">
                                <i class="fas fa-user" aria-hidden="true"></i>
                                <span>个人资料</span>
                            </a>
                            <a class="user-menu__option" href="/settings">
                                <i class="fas fa-sliders-h" aria-hidden="true"></i>
                                <span>偏好设置</span>
                            </a>
                            <a class="user-menu__option"
                               href="/admin"
                               sec:authorize="hasRole('ADMIN') or hasRole('SUPER_ADMIN')">
                                <i class="fas fa-shield-alt" aria-hidden="true"></i>
                                <span>管理面板</span>
                            </a>
                            <a class="user-menu__option" href="/help">

                                <span>帮助中心</span>

                    </div>
                </div>

            </div>
        </header>

        <aside id="primarySidebar"
               class="sidebar"
               data-role="shell-sidebar"
               data-state="expanded"
               th:with="rawRole=${userType != null ? userType : userRole},
                        workspaceRole=${rawRole != null and #strings.equalsIgnoreCase(rawRole, 'ADMIN') ? 'admin' : 'developer'}">
            <div class="sidebar-content">
                <div class="menu-group" th:each="section : ${navSections}"
                     th:if="${section.items != null and !#lists.isEmpty(section.items)}">
                    <div class="menu-item"
                         th:each="menu : ${section.items}"
                         th:classappend="${menu.active} ? ' selected' : ''"
                         th:attr="data-route=${menu.route}, data-page=${menu.page != null ? menu.page : menu.route}"
                         th:aria-current="${menu.active} ? 'page' : null">
                        <span class="meta">
                            <span class="menu-icon"
                                  th:text="${menu.badge}">OV</span>
                            <span class="text" th:text="${menu.label}">工作区概览</span>
                        </span>
                        <span class="nav-tooltip" th:text="${menu.label}">工作区概览</span>
                    </div>
                </div>
                <div class="footer-block" th:if="${(sidebarFooterLinks != null and !#lists.isEmpty(sidebarFooterLinks)) or (sidebarFooterMeta != null and !#lists.isEmpty(sidebarFooterMeta))}">
                    <span class="pill" th:each="meta : ${sidebarFooterMeta}" th:if="${sidebarFooterMeta != null}">
                        <span style="width:6px;height:6px;border-radius:50%;background:#22C55E;"></span>
                        <span th:text="${meta.label != null ? (meta.label + '：' + (meta.value != null ? meta.value : '')) : ''}">环境：DEV</span>
                    </span>
                    <a th:each="link : ${sidebarFooterLinks}"
                       th:if="${sidebarFooterLinks != null}"
                       th:href="${link.href != null ? link.href : '#'}"
                       class="link"
                       th:text="${link.label != null ? link.label : ''}">帮助与反馈</a>
                </div>
            </div>
</aside>

        <div class="sidebar-backdrop" data-role="sidebar-backdrop"></div>

        <main class="content" id="spaOutlet" data-role="spa-outlet">
            <div class="spa-placeholder" data-role="spa-placeholder">
                <p>SPA &#x5360;&#x4F4D;&#x5185;&#x5BB9;&#xFF1A;&#x7B49;&#x5F85;&#x5BFC;&#x822A;&#x4E8B;&#x4EF6;&#x6216;&#x8FDC;&#x7A0B;&#x6A21;&#x5757;&#x6302;&#x8F7D;&#x3002;</p>
            </div>
        </main>
    </div>

    <!-- Chart.js CDN -->
    <script src="/vendor/chartjs/chart.min.js"></script>

    <script>
        (function () {
            const root = document.documentElement;
            const body = document.body;
            const shellRoot = document.querySelector('[data-shell-root]');
            const sidebar = document.querySelector('[data-role="shell-sidebar"]');
            const backdrop = document.querySelector('[data-role="sidebar-backdrop"]');
            const THEME_KEY = 'app-shell-theme';
            const SIDEBAR_KEY = 'app-shell-sidebar-state';
            const LANGUAGE_KEY = 'app-shell-language';
            const eventBus = new EventTarget();
            const SERVER_VIEW_MODE_KEY = 'admin-dashboard-server-view-mode';

            if (!shellRoot) {
                console.warn('[AppShell] 未找到布局根节点，停止初始化。');
                return;
            }

            let currentTheme = 'light';
            let currentLanguage = 'zh';
            let sidebarState = shellRoot.dataset.sidebarState || 'expanded';
            let serverPanelCache = [];
            let userTrendPoints = [];

            function persist(key, value) {
                try {
                    localStorage.setItem(key, value);
                } catch (error) {
                    console.warn('[AppShell] 无法写入本地存储:', error);
                }
            }

            function load(key) {
                try {
                    return localStorage.getItem(key);
                } catch (error) {
                    console.warn('[AppShell] 无法读取本地存储:', error);
                    return null;
                }
            }

            function applyTheme(theme, persistPref = true) {
                currentTheme = theme === 'dark' ? 'dark' : 'light';
                const themeClass = currentTheme === 'dark' ? 'shell-theme-dark' : 'shell-theme-light';
                root.dataset.theme = currentTheme;
                root.classList.remove('shell-theme-light', 'shell-theme-dark');
                root.classList.add(themeClass);
                body.classList.toggle('dark-mode', currentTheme === 'dark');

                const toggle = document.querySelector('[data-action="toggle-theme"]');
                if (toggle) {
                    toggle.setAttribute('aria-pressed', String(currentTheme === 'dark'));

                    // 更新图标和文字
                    const icon = toggle.querySelector('span[aria-hidden="true"]:first-child');
                    const label = toggle.querySelector('.theme-label');

                    if (currentTheme === 'dark') {
                        if (icon) icon.innerHTML = '🌙'; // 月亮图标
                        if (label) label.innerHTML = '暗色';
                    } else {
                        if (icon) icon.innerHTML = '☀️'; // 太阳图标
                        if (label) label.innerHTML = '浅色';
                    }
                }

                if (persistPref) {
                    persist(THEME_KEY, currentTheme);
                }

                emit('theme:changed', { theme: currentTheme });
            }

            function applyLanguage(lang, persistPref = true) {
                const normalized = (typeof lang === 'string' && lang.toLowerCase() === 'en') ? 'en' : 'zh';
                currentLanguage = normalized;

                document.documentElement.setAttribute('lang', currentLanguage === 'en' ? 'en' : 'zh-CN');

                const languageToggleButton = document.querySelector('[data-action="toggle-language"]');
                if (languageToggleButton) {
                    const label = languageToggleButton.querySelector('span');
                    if (label) {
                        label.textContent = currentLanguage === 'en' ? 'EN' : 'ZH';
                    }
                    languageToggleButton.setAttribute('aria-pressed', String(currentLanguage === 'en'));
                }

                const translatable = document.querySelectorAll('[data-i18n-zh]');
                translatable.forEach((element) => {
                    const zh = element.getAttribute('data-i18n-zh');
                    const en = element.getAttribute('data-i18n-en');
                    const value = currentLanguage === 'en'
                        ? (en !== null && en !== undefined ? en : zh)
                        : (zh !== null && zh !== undefined ? zh : en);

                    if (value === null || value === undefined) {
                        return;
                    }

                    if (element.tagName === 'INPUT' || element.tagName === 'TEXTAREA') {
                        if (element.hasAttribute('placeholder')) {
                            element.setAttribute('placeholder', value);
                        } else {
                            element.value = value;
                        }
                    } else {
                        element.textContent = value;
                    }
                });

                emit('language:changed', { language: currentLanguage });

                if (persistPref) {
                    persist(LANGUAGE_KEY, currentLanguage);
                }
            }

            function applySidebarState(state, persistPref = true) {
                sidebarState = state === 'collapsed' ? 'collapsed' : 'expanded';
                shellRoot.dataset.sidebarState = sidebarState;

                if (sidebar) {
                    sidebar.setAttribute('data-state', sidebarState);
                    // 添加动画类以确保平滑过渡
                    sidebar.classList.add('sidebar-transitioning');

                    // 在动画完成后移除过渡类
                    setTimeout(() => {
                        sidebar.classList.remove('sidebar-transitioning');
                    }, 300);
                }

                if (backdrop) {
                    const shouldShow = sidebarState === 'expanded' && window.innerWidth <= 1024;
                    backdrop.setAttribute('data-state', shouldShow ? 'visible' : 'hidden');
                }

                const toggle = document.querySelector('[data-action="toggle-sidebar"]');
                if (toggle) {
                    toggle.setAttribute('aria-expanded', String(sidebarState === 'expanded'));
                    // 更新按钮图标
                    const isCollapsed = sidebarState === 'collapsed';
                    toggle.innerHTML = isCollapsed ? '&#9776;' : '&#10005;';
                    toggle.setAttribute('title', isCollapsed ? '展开侧边栏' : '收起侧边栏');
                }

                if (persistPref) {
                    persist(SIDEBAR_KEY, sidebarState);
                }

                emit('sidebar:state-changed', { state: sidebarState });
            }

            function emit(name, detail) {
                eventBus.dispatchEvent(new CustomEvent(name, { detail }));
            }

            function on(name, handler) {
                const listener = (event) => handler(event.detail, event);
                eventBus.addEventListener(name, listener);
                return () => eventBus.removeEventListener(name, listener);
            }

            on('language:changed', () => {
                updateUserTrendChart(userTrendPoints);
            });

            function loadPreferences() {
                const savedTheme = load(THEME_KEY);
                const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (savedTheme === 'dark' || savedTheme === 'light') {
                    applyTheme(savedTheme, false);
                } else if (prefersDark) {
                    applyTheme('dark');
                } else {
                    applyTheme('light');
                }

                const savedSidebar = load(SIDEBAR_KEY);
                if (savedSidebar === 'collapsed' || savedSidebar === 'expanded') {
                    applySidebarState(savedSidebar, false);
                }

                const savedLanguage = load(LANGUAGE_KEY);
                const toggleLanguageLabel = document.querySelector('[data-action="toggle-language"] span');
                const fallbackLanguage = toggleLanguageLabel ? toggleLanguageLabel.textContent.trim().toLowerCase() : 'zh';
                applyLanguage(savedLanguage || fallbackLanguage, false);
            }

            function initHeader() {
                const header = document.querySelector('[data-role="shell-header"]');
                if (!header) {
                    return;
                }

                const navHome = header.querySelector('[data-action="navigate-home"]');
                if (navHome) {
                    const navigate = () => emit('header:navigate', { route: '/' });
                    navHome.addEventListener('click', navigate);
                    navHome.addEventListener('keydown', (event) => {
                        if (event.key === 'Enter' || event.key === ' ') {
                            event.preventDefault();
                            navigate();
                        }
                    });
                }

                const toggleSidebarBtn = header.querySelector('[data-action="toggle-sidebar"]');
                if (toggleSidebarBtn) {
                    toggleSidebarBtn.addEventListener('click', () => {
                        applySidebarState(sidebarState === 'expanded' ? 'collapsed' : 'expanded');
                        emit('header:toggle-sidebar', { state: sidebarState });
                    });
                }

                const toggleThemeBtn = header.querySelector('[data-action="toggle-theme"]');
                if (toggleThemeBtn) {
                    toggleThemeBtn.addEventListener('click', () => {
                        applyTheme(currentTheme === 'dark' ? 'light' : 'dark');
                    });
                }

                const languageToggleBtn = header.querySelector('[data-action="toggle-language"]');
                if (languageToggleBtn) {
                    languageToggleBtn.addEventListener('click', () => {
                        applyLanguage(currentLanguage === 'en' ? 'zh' : 'en');
                    });
                }

                const commandPalette = header.querySelector('[data-action="open-command-palette"]');
                if (commandPalette) {
                    const openPalette = () => {
                        commandPalette.setAttribute('aria-expanded', 'true');
                        emit('header:command-palette', { show: true });
                    };
                    commandPalette.addEventListener('click', openPalette);
                    commandPalette.addEventListener('keydown', (event) => {
                        if (event.key === 'Enter' || event.key === ' ') {
                            event.preventDefault();
                            openPalette();
                        }
                    });
                }

                const userMenu = header.querySelector('[data-role="user-menu"]');
                if (userMenu) {
                    const toggle = userMenu.querySelector('[data-action="toggle-user-menu"]');
                    const dropdown = userMenu.querySelector('[data-role="user-dropdown"]');

                    const closeMenu = () => {
                        userMenu.dataset.open = 'false';
                        if (dropdown) {
                            dropdown.setAttribute('aria-hidden', 'true');
                        }
                        if (toggle) {
                            toggle.setAttribute('aria-expanded', 'false');
                        }
                    };

                    const openMenu = () => {
                        userMenu.dataset.open = 'true';
                        if (dropdown) {
                            dropdown.setAttribute('aria-hidden', 'false');
                        }
                        if (toggle) {
                            toggle.setAttribute('aria-expanded', 'true');
                        }
                    };

                    if (toggle && dropdown) {
                        closeMenu();
                        toggle.addEventListener('click', (event) => {
                            event.stopPropagation();
                            if (userMenu.dataset.open === 'true') {
                                closeMenu();
                            } else {
                                openMenu();
                            }
                        });

                        dropdown.addEventListener('click', (event) => {
                            event.stopPropagation();
                        });

                        document.addEventListener('click', (event) => {
                            if (!userMenu.contains(event.target)) {
                                closeMenu();
                            }
                        });

                        document.addEventListener('keydown', (event) => {
                            if (event.key === 'Escape') {
                                closeMenu();
                            }
                        });
                    }
                }
                window.addEventListener('keydown', (event) => {
                    const isMac = /Mac|iPod|iPhone|iPad/.test(navigator.platform);
                    const metaKey = isMac ? event.metaKey : event.ctrlKey;
                    if (metaKey && event.key.toLowerCase() === 'k') {
                        event.preventDefault();
                        emit('header:command-palette', { show: true, source: 'shortcut' });
                    }
                });
            }

            function initSidebar() {
                if (!sidebar) {
                    return;
                }

                const navItems = Array.from(sidebar.querySelectorAll('[data-route]'));

                const activateNav = (route) => {
                    if (!route) {
                        return;
                    }
                    navItems.forEach((item) => {
                        const isActive = item.getAttribute('data-route') === route;
                        if (isActive) {
                            item.classList.add('selected');
                            item.setAttribute('aria-current', 'page');
                        } else {
                            item.classList.remove('selected');
                            item.removeAttribute('aria-current');
                        }
                    });
                };

                if (navItems.length > 0) {
                    const preset = navItems.find((item) => item.classList.contains('selected')) || navItems[0];
                    if (preset) {
                        activateNav(preset.getAttribute('data-route'));
                    }
                }

                navItems.forEach((item) => {
                    item.addEventListener('click', () => {
                        const route = item.getAttribute('data-route');
                        if (!route) {
                            return;
                        }
                        activateNav(route);
                        emit('sidebar:navigate', { route });
                        emit('spa:navigate', { route });
                        if (window.innerWidth <= 1024) {
                            applySidebarState('collapsed', false);
                        }
                    });
                });

                on('spa:navigate', ({ route }) => {
                    if (!route) {
                        return;
                    }
                    activateNav(route);

            function initSpaOutlet() {
                const outlet = document.querySelector('[data-role="spa-outlet"]');
                if (!outlet) {
                    return;

                // 简化后不需要复杂的类名管理

                const loadContent = async (route) => {

                        return;
                    }

                    outlet.innerHTML = '<div class="spa-placeholder" data-i18n-zh="正在加载..." data-i18n-en="Loading...">正在加载...</div>';

                    try {
                        let apiUrl = '';
                        switch (route) {
                            case 'overview':
                            case 'admin-dashboard':
                                apiUrl = '/admin/dashboard/content';
                                break;
                            case 'servers':
                                apiUrl = '/admin/api/servers-content';
                                break;
                            case 'users':
                                apiUrl = '/admin/api/users-content';
                                break;
                            case 'settings':
                                outlet.innerHTML = '<div class="spa-placeholder" data-i18n-zh="系统设置功能开发中..." data-i18n-en="System settings coming soon...">系统设置功能开发中...</div>';

                                return;
                        }

                        const response = await fetch(apiUrl);
                        if (response.ok) {
                            const content = await response.text();
                            outlet.innerHTML = content;
                            applyLanguage(currentLanguage, false);
                        } else {
                            outlet.innerHTML = '<div class="spa-placeholder" data-i18n-zh="加载失败，请重试" data-i18n-en="Failed to load, please retry">加载失败，请重试</div>';
                            applyLanguage(currentLanguage, false);

                    } catch (error) {
                        console.error('加载内容失败:', error);
                        outlet.innerHTML = '<div class="spa-placeholder" data-i18n-zh="网络错误，请重试" data-i18n-en="Network error, please retry">网络错误，请重试</div>';
                        applyLanguage(currentLanguage, false);
                    }
                };

                on('spa:navigate', ({ route }) => {
                    outlet.dataset.route = route;
                    emit('spa:loading', { route });
                    loadContent(route).then(() => {
                        // 路由加载完成后，初始化对应页面的逻辑
                        if (route === 'admin-dashboard' || route === 'overview') {
                            initAdminDashboard();
                        }
                    });
                });

                // 初始加载默认内容
                const initialRoute = outlet.dataset.route || 'overview';
                emit('spa:navigate', { route: initialRoute });
            }

            function initResponsiveHandling() {
                const handleResize = () => {

                    if (backdrop) {
                        const shouldShow = sidebarState === 'expanded' && isMobile;
                        backdrop.setAttribute('data-state', shouldShow ? 'visible' : 'hidden');
                    }

                    // 在桌面端自动展开侧边栏，移动端自动收起
                    if (!isMobile && sidebarState === 'collapsed' && load(SIDEBAR_KEY) !== 'collapsed') {
                        applySidebarState('expanded', false);
                    }
                };

                let resizeTimer;
                window.addEventListener('resize', () => {
                    clearTimeout(resizeTimer);
                    resizeTimer = setTimeout(handleResize, 100);
                });

                // 初始化时执行一次
                handleResize();
            }

            async function loadDashboardOverview() {

                    const response = await fetch('/admin/dashboard/overview');
                    if (!response.ok) {
                        throw new Error('Failed to load dashboard overview');

            async function loadServerMonitoring(options = {}) {
                const container = document.getElementById('serverStatusContainer');
                if (!container) {
                    return;
                }

                const { force = false, silent = false, showLoading } = options;
                const url = force
                    ? `/admin/dashboard/servers/summary?_=${Date.now()}`
                    : '/admin/dashboard/servers/summary';

                const shouldShowLoading = showLoading !== undefined
                    ? showLoading
                    : (!silent && serverPanelCache.length === 0);

                if (shouldShowLoading) {
                    container.innerHTML = '<div class="empty-state" data-i18n-zh="正在加载服务器数据..." data-i18n-en="Loading server data...">正在加载服务器数据...</div>';
                    applyLanguage(currentLanguage, false);
                }

                try {
                    const response = await fetch(url);
                    if (!response.ok) {
                        throw new Error('Failed to load server monitoring');
                    }

                    const servers = await response.json();
                    serverPanelCache = Array.isArray(servers) ? servers : [];
                    renderServerMonitoring(serverPanelCache);
                    updateLastRefreshTime();
                } catch (error) {
                    console.error('加载服务器监控失败:', error);
                    showErrorMessage('加载服务器数据失败，请稍后重试');
                    showServerPanelError();
                }
            }

            async function loadAnalysisPanels() {
                try {
                    // 加载资源统计
                    const resourceResponse = await fetch('/admin/dashboard/system/health');
                    if (resourceResponse.ok) {
                        const resourceData = await resourceResponse.json();
                        renderResourceAnalysis(resourceData);
                    }
                } catch (error) {
                    console.error('加载分析面板失败:', error);
                }
            }

            function renderDashboardOverview(data) {
                if (!data) {
                    return;
                }

                const coalesce = (...values) => {
                    for (const value of values) {
                        if (value !== undefined && value !== null) {
                            return value;
                        }
                    }
                    return undefined;
                };

                // 服务器统计
                const serverStats = data.serverStats || {};
                const serversOnline = coalesce(serverStats.online, serverStats.active, data.activeServers, data.onlineServers);
                const serversTotal = coalesce(serverStats.total, data.totalServers);
                const serversMaintaining = coalesce(serverStats.maintaining, serverStats.warning, data.monitoringServers);
                const serversOffline = coalesce(serverStats.offline, data.inactiveServers, data.offlineServers);
                const serversUpdatedAt = coalesce(serverStats.updatedAt, data.serverUpdatedAt, data.updatedAt);

                updateElement('dashboardServersOnline', serversOnline ?? 0);
                updateElement('dashboardServersTotal', serversTotal ?? 0);
                updateElement('dashboardServersMaintaining', serversMaintaining ?? 0);
                updateElement('dashboardServersOffline', serversOffline ?? 0);

                const serverRate = serversTotal ? ((serversOnline || 0) / serversTotal) * 100 : 0;
                updateElement('dashboardServersRate', `${serverRate.toFixed(1)}%`);
                updateTimestamp('dashboardServersUpdatedAt', serversUpdatedAt);

                // 用户统计
                const userStats = data.userStats || {};
                const activeToday = coalesce(userStats.activeToday, data.todayActiveUsers, data.activeUsers);
                const activeYesterday = coalesce(userStats.activeYesterday, data.yesterdayActiveUsers);
                const activeThreeDays = coalesce(userStats.activeThreeDaysAgo, data.threeDaysAgoActiveUsers);
                const usersTotal = coalesce(userStats.total, data.totalUsers);
                const usersDelta = coalesce(userStats.delta, data.userDelta);
                const usersConversion = coalesce(userStats.conversionRate, data.conversionRate);
                const usersUpdatedAt = coalesce(userStats.updatedAt, data.usersUpdatedAt, data.updatedAt);

                updateElement('dashboardUsersActiveToday', activeToday ?? 0);
                updateElement('dashboardUsersYesterday', activeYesterday ?? 0);
                updateElement('dashboardUsersThreeDays', activeThreeDays ?? 0);
                updateElement('dashboardUsersTotal', usersTotal ?? 0);
                updateDelta('dashboardUsersDelta', usersDelta);
                if (usersConversion !== undefined && usersConversion !== null) {
                    updateStatusText('dashboardUsersConversion', `转化率 ${formatPercent(usersConversion)}`);
                } else {
                    updateStatusText('dashboardUsersConversion', '转化率 --');
                }
                updateTimestamp('dashboardUsersUpdatedAt', usersUpdatedAt);

                // 告警统计
                const alertStats = data.alertStats || {};
                const unresolved = coalesce(alertStats.unresolved, data.totalAlerts);
                const critical = coalesce(alertStats.critical, data.criticalAlerts);
                const warning = coalesce(alertStats.warning, data.warningAlerts);
                const rules = coalesce(alertStats.rules, data.activeThresholds);
                const alertDelta = coalesce(alertStats.delta, data.alertDelta);
                const alertSla = coalesce(alertStats.slaStatus, data.alertSlaStatus);
                const alertsUpdatedAt = coalesce(alertStats.updatedAt, data.alertsUpdatedAt, data.updatedAt);

                updateElement('dashboardAlertsUnresolved', unresolved ?? 0);
                updateElement('dashboardAlertsCritical', critical ?? 0);
                updateElement('dashboardAlertsWarning', warning ?? 0);
                updateElement('dashboardAlertsRules', rules ?? 0);
                updateDelta('dashboardAlertsDelta', alertDelta);
                updateStatusText('dashboardAlertsSla', alertSla, 'SLA 正常');
                updateTimestamp('dashboardAlertsUpdatedAt', alertsUpdatedAt);

                // 系统健康度
                const healthStats = data.health || {};
                const healthScoreRaw = coalesce(healthStats.score, data.systemHealthScore);
                const healthScore = Number(healthScoreRaw);
                const healthStatus = coalesce(healthStats.status, data.systemHealthStatus);
                const healthSummary = coalesce(healthStats.summary, data.systemHealthSummary);
                const healthUpdatedAt = coalesce(healthStats.updatedAt, data.healthUpdatedAt, data.updatedAt);

                if (!Number.isNaN(healthScore)) {
                    updateElement('dashboardHealthScore', healthScore.toFixed(1));
                } else {
                    updateElement('dashboardHealthScore', healthScoreRaw ?? 0);
                }

                const healthConfig = getHealthStatusConfig(healthStatus, healthScore);
                updateStatusText('dashboardHealthSummary', healthSummary || healthConfig.text, '运行正常');
                updateTimestamp('dashboardHealthUpdatedAt', healthUpdatedAt);
                updateSystemHealthStatus(healthStatus, Number.isNaN(healthScore) ? 0 : healthScore);
            }

            function renderServerMonitoring(servers) {
                const container = document.getElementById('serverStatusContainer');
                if (!container) {
                    return;
                }

                const list = Array.isArray(servers) ? servers : [];

                updateServerAggregatedMetrics(list);

                if (list.length === 0) {
                    container.innerHTML = '<div class="empty-state server-alert-placeholder" data-i18n-zh="当前所有监控服务器运行正常。" data-i18n-en="All monitored servers look healthy right now.">当前所有监控服务器运行正常。</div>';
                    container.classList.add('server-empty');
                    applyLanguage(currentLanguage, false);
                    return;
                }

                container.classList.remove('server-empty');

                let mode = container.dataset.viewMode;
                if (mode !== 'list' && mode !== 'grid') {
                    const savedMode = load(SERVER_VIEW_MODE_KEY);
                    mode = savedMode === 'list' ? 'list' : 'grid';
                }

                container.dataset.viewMode = mode;
                container.classList.toggle('list-view', mode === 'list');
                container.classList.toggle('grid-view', mode === 'grid');

                const cardsHtml = list.map((server) => buildServerCard(server)).join('');
                container.innerHTML = cardsHtml;

                setServerViewMode(mode, { persist: false });
                applyLanguage(currentLanguage, false);
            }

            function updateServerAggregatedMetrics(servers) {
                const avgCpu = calculateAverageMetric(servers, 'cpuUsage');
                const avgMemory = calculateAverageMetric(servers, 'memoryUsage');
                const avgDisk = calculateAverageMetric(servers, 'diskUsage');

                updateElement('avgCpuUsage', avgCpu !== null ? Math.round(avgCpu) : '--');
                updateElement('avgMemoryUsage', avgMemory !== null ? Math.round(avgMemory) : '--');
                updateElement('avgDiskUsage', avgDisk !== null ? Math.round(avgDisk) : '--');

                updateProgressBar('cpuProgressBar', avgCpu ?? 0);
                updateProgressBar('memoryProgressBar', avgMemory ?? 0);
                updateProgressBar('diskProgressBar', avgDisk ?? 0);
            }

            function calculateAverageMetric(servers, key) {
                const values = servers
                    .map((server) => {
                        if (!server || server[key] === undefined || server[key] === null) {
                            return null;
                        }
                        const value = Number(server[key]);
                        return Number.isFinite(value) ? value : null;
                    })
                    .filter((value) => value !== null);

                if (values.length === 0) {
                    return null;
                }

                const total = values.reduce((sum, value) => sum + value, 0);
                return total / values.length;
            }

            function buildServerCard(server) {
                const status = normalizeServerStatus(server && server.status);
                const statusZh = getStatusText(status, 'zh');
                const statusEn = getStatusText(status, 'en');

                const name = server && server.name ? server.name : 'Unknown';
                const host = server && (server.host || server.hostname) ? (server.host || server.hostname) : 'N/A';
                const portValue = server && server.port !== undefined && server.port !== null ? server.port : '';
                const cpu = formatUsage(server ? server.cpuUsage : null);
                const memory = formatUsage(server ? server.memoryUsage : null);
                const disk = formatUsage(server ? server.diskUsage : null);
                const searchTokens = [name, host, portValue, status].filter(Boolean).join(' ').toLowerCase();
                const serverId = server && server.id !== undefined ? server.id : 'null';

                return `
                    <article class="server-card" data-role="server-card" data-status="${escapeHtml(status)}" data-search="${escapeHtml(searchTokens)}">
                        <div class="server-card__header">
                            <div class="server-card__identity">
                                <div class="server-card__name">${escapeHtml(name)}</div>
                                <div class="server-card__meta">${escapeHtml(host)}${portValue !== '' ? `:${escapeHtml(portValue)}` : ''}</div>
                            </div>
                            <span class="server-card__status server-card__status--${escapeHtml(status)}" data-i18n-zh="${escapeHtml(statusZh)}" data-i18n-en="${escapeHtml(statusEn)}">
                                <span class="server-card__status-dot server-card__status-dot--${escapeHtml(status)}"></span>
                                ${escapeHtml(getStatusText(status))}
                            </span>
                        </div>
                        <dl class="server-card__metrics">
                            <div class="server-card__metric">
                                <dt data-i18n-zh="CPU" data-i18n-en="CPU">CPU</dt>
                                <dd>${escapeHtml(cpu)}</dd>
                            </div>
                            <div class="server-card__metric">
                                <dt data-i18n-zh="内存" data-i18n-en="Memory">内存</dt>
                                <dd>${escapeHtml(memory)}</dd>
                            </div>
                            <div class="server-card__metric">
                                <dt data-i18n-zh="磁盘" data-i18n-en="Disk">磁盘</dt>
                                <dd>${escapeHtml(disk)}</dd>
                            </div>
                        </dl>
                        <div class="server-card__actions">
                            <button class="btn btn-link" type="button" onclick="viewServerDetail(${serverId})">
                                <span data-i18n-zh="查看详情" data-i18n-en="View details">查看详情</span>
                            </button>
                            <button class="btn btn-link" type="button" onclick="connectToServer(${serverId})">
                                <span data-i18n-zh="SSH 连接" data-i18n-en="SSH Connect">SSH 连接</span>
                            </button>
                        </div>
                    </article>`;
            }

            function normalizeServerStatus(status) {
                const normalized = (status || '').toString().toLowerCase();
                if (normalized === 'online') {
                    return 'online';
                }
                if (normalized === 'warning' || normalized === 'maintaining') {
                    return 'warning';
                }
                if (normalized === 'error') {
                    return 'error';
                }
                if (normalized === 'offline') {
                    return 'offline';
                }
                return 'offline';
            }

            function formatUsage(value) {
                const numeric = Number(value);
                if (!Number.isFinite(numeric)) {
                    return '--%';
                }
                return `${Math.round(numeric)}%`;
            }

            function setServerViewMode(mode, options = {}) {
                const persistPref = options.persist !== false;
                const container = document.getElementById('serverStatusContainer');
                const gridBtn = document.getElementById('serverGridView');
                const listBtn = document.getElementById('serverListView');

                const normalized = mode === 'list' ? 'list' : 'grid';

                if (container) {
                    container.dataset.viewMode = normalized;
                    container.classList.toggle('list-view', normalized === 'list');
                    container.classList.toggle('grid-view', normalized === 'grid');
                }

                if (gridBtn) {
                    gridBtn.classList.toggle('active', normalized === 'grid');
                }

                if (listBtn) {
                    listBtn.classList.toggle('active', normalized === 'list');
                }

                if (persistPref) {
                    persist(SERVER_VIEW_MODE_KEY, normalized);
                }
            }

            function showServerPanelError() {
                const container = document.getElementById('serverStatusContainer');
                if (!container) {
                    return;
                }

                container.innerHTML = '<div class="empty-state server-alert-placeholder" data-i18n-zh="暂时无法加载服务器告警信息，请稍后重试。" data-i18n-en="Server alert information is unavailable at the moment. Please retry later.">暂时无法加载服务器告警信息，请稍后重试。</div>';
                container.classList.add('server-empty');
                applyLanguage(currentLanguage, false);
            }

            function escapeHtml(value) {
                if (value === null || value === undefined) {
                    return '';
                }

                return String(value).replace(/[&<>"']/g, (char) => {
                    switch (char) {
                        case '&':
                            return '&amp;';
                        case '<':
                            return '&lt;';
                        case '>':
                            return '&gt;';
                        case '"':
                            return '&quot;';
                        case '\'':
                            return '&#39;';
                        default:
                            return char;
                    }
                });
            }

            function renderUserPanel(data) {
                if (!data) {
                    showUserPanelError();
                    return;
                }

                const userStats = data.userStats || {};

                const activeToday = userStats.activeToday ?? data.todayActiveUsers ?? 0;
                const activeYesterday = userStats.activeYesterday ?? data.yesterdayActiveUsers ?? 0;
                const conversionRate = userStats.conversionRate ?? data.conversionRate ?? null;

                updateElement('userActiveToday', activeToday ?? 0);
                updateElement('userActiveYesterday', activeYesterday ?? 0);
                updateElement('userConversionRate', conversionRate !== null && conversionRate !== undefined ? formatPercent(conversionRate) : '--');

                const trendPoints = buildUserTrendPoints(data);
                userTrendPoints = trendPoints;
                updateUserTrendChart(userTrendPoints);

                const activities = Array.isArray(data.recentActivities) ? data.recentActivities : [];
                renderUserEvents(activities);

                applyLanguage(currentLanguage, false);
            }

            function buildUserTrendPoints(data) {
                const stats = data && data.userStats ? data.userStats : {};

                return [
                    {
                        labelZh: '前日',
                        labelEn: '2 Days Ago',
                        value: stats.activeThreeDaysAgo ?? data.threeDaysAgoActiveUsers ?? 0
                    },
                    {
                        labelZh: '昨日',
                        labelEn: 'Yesterday',
                        value: stats.activeYesterday ?? data.yesterdayActiveUsers ?? 0
                    },
                    {
                        labelZh: '今日',
                        labelEn: 'Today',
                        value: stats.activeToday ?? data.todayActiveUsers ?? 0
                    }
                ];
            }

            function updateUserTrendChart(points) {
                const canvas = document.getElementById('userTrendChart');
                if (!canvas) {
                    return;
                }

                const targetHeight = 220;
                canvas.setAttribute('height', String(targetHeight));
                canvas.style.height = `${targetHeight}px`;

                if (!Array.isArray(points) || points.length === 0) {
                    if (userTrendChart) {
                        userTrendChart.destroy();
                        userTrendChart = null;
                    }
                    return;
                }

                const labels = points.map((point) => {
                    return currentLanguage === 'en' ? point.labelEn : point.labelZh;
                });
                const values = points.map((point) => {
                    const numeric = Number(point.value);
                    return Number.isFinite(numeric) ? numeric : 0;
                });

                if (!userTrendChart) {
                    userTrendChart = new Chart(canvas, {
                        type: 'line',
                        data: {
                            labels,
                            datasets: [{
                                label: currentLanguage === 'en' ? 'Active users' : '活跃用户',
                                data: values,
                                borderColor: 'rgba(47, 155, 255, 1)',
                                backgroundColor: 'rgba(47, 155, 255, 0.12)',
                                borderWidth: 2,
                                tension: 0.4,
                                fill: true,
                                pointRadius: 3,
                                pointHoverRadius: 5
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: {
                                    display: false
                                },
                                tooltip: {
                                    mode: 'index',

            function updateStatusText(id, value, fallback = "--") {
