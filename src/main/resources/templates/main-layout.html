    <script>
        (function() {
            function updateBodyTheme(theme) {
                if (document.body) {
                    document.body.classList.toggle('dark-theme', theme === 'dark');
                } else {
                    const onReady = () => {
                        document.body.classList.toggle('dark-theme', theme === 'dark');
                    };
                    document.addEventListener('DOMContentLoaded', function handleReady() {
                        document.removeEventListener('DOMContentLoaded', handleReady);
                        onReady();
                    });
                }
            }

            function applyTheme(theme, persist) {
                const root = document.documentElement;
                root.setAttribute('data-theme', theme);
                root.classList.remove('theme-light', 'theme-dark');
                root.classList.add(theme === 'dark' ? 'theme-dark' : 'theme-light');

                if (theme === 'dark') {
                    root.style.setProperty('--background-color', '#121212');
                    root.style.setProperty('--background-light', '#1e1e1e');
                    root.style.setProperty('--text-color', '#e0e0e0');
                } else {
                    root.style.removeProperty('--background-color');
                    root.style.removeProperty('--background-light');
                    root.style.removeProperty('--text-color');
                }

                updateBodyTheme(theme);

                if (persist) {
                    localStorage.setItem('theme', theme);
                    localStorage.setItem('modern-nav-theme', theme);
                }
            }

            window.__applyThemePreferences = function(theme, persist = true) {
                applyTheme(theme, persist);
            };

            const savedTheme = localStorage.getItem('theme');
            const theme = savedTheme === 'dark' ? 'dark' : 'light';
            applyTheme(theme, true);
        })();
    </script>

    // 馃帹 鍒濆鍖栫幇浠ｅ寲璁捐绯荤粺
    function initModernDesignSystem() {
        // 鍒濆鍖栦晶杈规爮

    // 鐜颁唬鍖栦晶杈规爮鍔熻兘
    function initModernSidebar() {
        if (window.modernNavController) {
            return;
        }

        const sidebar = document.getElementById('modernSidebar');
        const toggleBtn = document.getElementById('sidebarToggle');
        const mobileToggle = document.getElementById('navMobileToggle');
        const mainContent = document.getElementById('mainContent');
        const overlay = document.getElementById('sidebarOverlay');

        // 妗岄潰绔晶杈规爮鎶樺彔
        if (toggleBtn) {
            toggleBtn.addEventListener('click', function() {
                sidebar?.classList.toggle('collapsed');
                mainContent?.classList.toggle('sidebar-collapsed');
                localStorage.setItem('sidebarCollapsed', sidebar?.classList.contains('collapsed'));
            });
        }

        // 绉诲姩绔晶杈规爮寮€鍏?
        if (mobileToggle) {
            mobileToggle.addEventListener('click', function() {
                sidebar?.classList.toggle('mobile-open');
                document.body.classList.toggle('sidebar-mobile-open');
            });
        }

        // 鐐瑰嚮瑕嗙洊灞傚叧闂晶杈规爮
        if (overlay) {
            overlay.addEventListener('click', function() {
                sidebar?.classList.remove('mobile-open');
                document.body.classList.remove('sidebar-mobile-open');
            });
        }

        // ESC閿叧闂Щ鍔ㄧ渚ц竟鏍?
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && sidebar?.classList.contains('mobile-open')) {
                sidebar.classList.remove('mobile-open');
                document.body.classList.remove('sidebar-mobile-open');
            }
        });

        // 鎭㈠渚ц竟鏍忕姸鎬侊紙浠呮闈㈢锛?
        if (window.innerWidth > 768 && localStorage.getItem('sidebarCollapsed') === 'true') {
            sidebar?.classList.add('collapsed');
            mainContent?.classList.add('sidebar-collapsed');
        }

        // 鐩戝惉绐楀彛澶у皬鍙樺寲
        window.addEventListener('resize', function() {
            if (window.innerWidth > 768) {
                // 妗岄潰绔細绉婚櫎绉诲姩绔被锛屾仮澶嶆姌鍙犵姸鎬?
                sidebar?.classList.remove('mobile-open');
                document.body.classList.remove('sidebar-mobile-open');

                if (localStorage.getItem('sidebarCollapsed') === 'true') {
                    sidebar?.classList.add('collapsed');
                    mainContent?.classList.add('sidebar-collapsed');
                }
            } else {
                // 绉诲姩绔細绉婚櫎妗岄潰绔被
                sidebar?.classList.remove('collapsed');
                mainContent?.classList.remove('sidebar-collapsed');
            }
        });
    }

    // 鐜颁唬鍖栫敤鎴疯彍鍗曞姛鑳?
    function initModernUserMenu() {
        const userTrigger = document.getElementById('navUserTrigger');
        const userDropdown = document.getElementById('navUserDropdown');

        if (userTrigger && userDropdown) {
            userTrigger.addEventListener('click', function(e) {
                e.stopPropagation();
                userDropdown.classList.toggle('show');
            });

            document.addEventListener('click', function() {
                userDropdown.classList.remove('show');
            });
        }
    }

    // 鐜颁唬鍖栨悳绱㈠姛鑳?
    function initModernSearch() {
        const searchInput = document.querySelector('.search-input');
        const searchBtn = document.querySelector('.search-button');

        if (searchInput && searchBtn) {
            searchInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    performModernSearch(this.value);
                }
            });

            searchBtn.addEventListener('click', function() {
                performModernSearch(searchInput.value);
            });
        }
    }

        // window.location.href = `/search?q=${encodeURIComponent(query)}`;
    }

    // 鐜颁唬鍖栦富棰樺垏鎹?
    function initModernTheme() {
        window.toggleTheme = function() {
            if (window.modernNavController) {
                window.modernNavController.toggleTheme();
                return;
            }

            const html = document.documentElement;
            const current = html.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
            const nextTheme = current === 'dark' ? 'light' : 'dark';

            if (typeof window.__applyThemePreferences === 'function') {
                window.__applyThemePreferences(nextTheme, true);
                return;
            }

            html.classList.remove('theme-light', 'theme-dark');
            html.classList.add(nextTheme === 'dark' ? 'theme-dark' : 'theme-light');

            if (document.body) {
                document.body.classList.toggle('dark-theme', nextTheme === 'dark');
            }

            localStorage.setItem('theme', nextTheme);
            localStorage.setItem('modern-nav-theme', nextTheme);
        };
    }

    // CSRF Token Helper Functions
    function getCSRFToken() {
        const csrfToken = document.querySelector('meta[name="_csrf"]');
        return csrfToken ? csrfToken.getAttribute('content') : null;
    }
    
    function getCSRFHeaderName() {
        const csrfHeader = document.querySelector('meta[name="_csrf_header"]');
        return csrfHeader ? csrfHeader.getAttribute('content') : 'X-CSRF-TOKEN';
    }

    // 鍏ㄥ眬AJAX閿欒澶勭悊鍣紝鐢ㄤ簬澶勭悊浼氳瘽瓒呮椂
    function handleAjaxError(response) {
        if (response.status === 401) {
            // 妫€鏌ユ槸鍚︽槸JSON鍝嶅簲
            const contentType = response.headers.get('content-type');
            if (contentType && contentType.includes('application/json')) {
                return response.json().then(errorData => {
                    if (errorData.error === 'session_expired') {
                        window.location.href = errorData.redirect || '/login?expired';
                        return Promise.reject(new Error('Session expired'));
                    }
                    return Promise.reject(new Error('Unauthorized'));
                });
            } else {
                // 闈濲SON鍝嶅簲锛屽彲鑳芥槸鐧诲綍椤甸潰HTML
                window.location.href = '/login?expired';
                return Promise.reject(new Error('Session expired'));
            }
        }
        return response;
    }

    // 鏍规嵁褰撳墠URL鑾峰彇椤甸潰鍚嶇О
    function getCurrentPageFromUrl() {
        const hash = window.location.hash.substring(1); // 绉婚櫎 # 鍙?
        const pathname = window.location.pathname;
        
        // 妫€鏌ash鏄惁瀛樺湪涓旀湁鏁?
        if (hash) {
            const validPages = ['dashboard', 'servers', 'users', 'applications', 'monitoring', 'terminal'];
            if (validPages.includes(hash)) {
                //('浠巋ash鑾峰彇椤甸潰:', hash);
                return hash;
            }
        }
        
        // 鏍规嵁pathname鎺ㄦ柇椤甸潰
        if (pathname.includes('/admin/workspace') || pathname === '/admin/workspace') {
            return 'dashboard';
        } else if (pathname.includes('/admin/servers')) {
            return 'servers';
        } else if (pathname.includes('/admin/users')) {
            return 'users';
        } else if (pathname.includes('/apps')) {
            return 'applications';
        } else if (pathname.includes('/monitoring')) {
            return 'monitoring';
        } else if (pathname.includes('/terminal')) {
            return 'terminal';
        }
        
        // 榛樿杩斿洖dashboard
        return 'dashboard';
    }

    // 椤甸潰鍔犺浇瀹屾垚鍚庡垵濮嬪寲
    document.addEventListener('themeChanged', function(event) {
        if (typeof window.__applyThemePreferences !== 'function') {
            return;
        }
        const detail = event.detail || {};
        const nextTheme = detail.to || detail.theme;
        if (nextTheme) {
            window.__applyThemePreferences(nextTheme, true);
            const toggle = document.querySelector('.theme-toggle-btn');
            if (toggle) {
                const icons = toggle.querySelectorAll('.theme-icon');
                const sunIcon = toggle.querySelector('.sun-icon') || icons[0];
                const moonIcon = toggle.querySelector('.moon-icon') || icons[1] || icons[0];
                if (sunIcon) {
                    sunIcon.classList.add('sun-icon', 'theme-icon', 'fas', 'fa-sun');
                    sunIcon.classList.remove('fa-moon');
                    sunIcon.setAttribute('aria-hidden', nextTheme === 'dark' ? 'true' : 'false');
                }
                if (moonIcon) {
                    moonIcon.classList.add('moon-icon', 'theme-icon', 'fas', 'fa-moon');
                    moonIcon.classList.remove('fa-sun');
                    moonIcon.setAttribute('aria-hidden', nextTheme === 'dark' ? 'false' : 'true');
                }
            }
        }
    });

    document.addEventListener('navigationInitialized', function() {
        if (typeof window.__applyThemePreferences !== 'function') {
            return;
        }
        const persisted = localStorage.getItem('theme');
        if (persisted) {
            window.__applyThemePreferences(persisted, false);
        }
    });

    document.addEventListener('DOMContentLoaded', function() {
        try {
            // 鍒濆鍖栨柊璁捐绯荤粺
            initModernDesignSystem();

            // 鑾峰彇褰撳墠椤甸潰骞跺姞杞藉搴斿唴瀹?
            const currentPageName = getCurrentPageFromUrl();
            //('椤甸潰鍒濆鍖栵紝褰撳墠椤甸潰:', currentPageName);

            // 鍔犺浇褰撳墠椤甸潰鍐呭锛堥娆″姞杞戒繚鎸佸綋鍓嶈鍥撅級
            loadContent(currentPageName, false);
        } catch (error) {
            console.error('Error calling loadContent:', error);
            // 濡傛灉鍑洪敊锛屽洖閫€鍒伴粯璁ら〉闈?
            loadContent('dashboard', false);
        }

        // 鍒濆鍖栫Щ鍔ㄧ鑿滃崟
        initMobileMenu();

        // 鍒濆鍖栦晶杈规爮鏀惰捣灞曞紑鍔熻兘
        if (!window.modernNavController) {
            initSidebarToggle();
        }

        // 鍏ㄥ眬娴嬭瘯鍑芥暟
        window.testToggle = function() {
            if (window.modernNavController) {
                window.modernNavController.toggle();
            } else {
                toggleSidebar();
            }
        };

        // 缁戝畾渚ц竟鏍忓垏鎹簨浠讹紙鏃犳帶鍒跺櫒鏃剁殑鍚庡閫昏緫锛?
        const toggleButton = document.getElementById('sidebarToggle');
        if (toggleButton && !window.modernNavController) {
            toggleButton.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                toggleSidebar();
            });
        } else if (!toggleButton) {
            console.error('鏈壘鍒颁晶杈规爮鍒囨崲鎸夐挳');
        }

        // 鍒濆鍖栨娊灞夌鐞嗗櫒
        try {
            window.drawerManager = new DrawerManager();
        } catch (error) {
            console.error('鉂?DrawerManager 鍒濆鍖栧け璐?', error);
        }
        
        // 鐩戝惉娴忚鍣ㄥ悗閫€/鍓嶈繘鎸夐挳
        window.addEventListener('popstate', function(e) {
            if (e.state && e.state.page) {
                loadContent(e.state.page, false);
            }
        });
        
        // 璁剧疆鍒濆鐘舵€佷负褰撳墠椤甸潰
        const currentPageName = getCurrentPageFromUrl();
        history.replaceState({ page: currentPageName }, '', `#${currentPageName}`);
    });

    // 鏍稿績鍐呭鍔犺浇鍑芥暟 (鍏ㄥ眬鍙闂?
    function buildPlaceholderContent(config) {
        const defaultConfig = {
            icon: '🚧',
            title: '功能建设中',
            description: '我们正在补充该模块的实现，欢迎稍后再试。',
            tips: []
        };
        const data = Object.assign({}, defaultConfig, config || {});
        const hasTips = Array.isArray(data.tips) && data.tips.length > 0;
        const tips = hasTips
            ? `<ul class="placeholder-tips">${data.tips.map(item => `<li>${item}</li>`).join('')}</ul>`
            : '';
        return `
        <section class="workspace-placeholder">
            <div class="placeholder-icon">${data.icon}</div>
            <h2 class="placeholder-title">${data.title}</h2>
            <p class="placeholder-desc">${data.description}</p>
            ${tips}
        </section>
        `;
    }

    async function loadPlaceholderContent(config) {
        return buildPlaceholderContent(config);
    }

    //console.log('馃敡 姝ｅ湪瀹氫箟window.loadContent鍑芥暟...');
    window.loadContent = async function loadContent(page, addToHistory = true) {
        if (isLoading || page === currentPage) {
            return;
        }

        isLoading = true;

        try {
            // 鏇存柊鑿滃崟婵€娲荤姸鎬?
            updateActiveMenu(page);

            // 鏍规嵁椤甸潰绫诲瀷鍐冲畾鍔犺浇鏂瑰紡
            let content;
            switch (page) {
                case 'dashboard':
                    content = await loadDashboardContent();
                    break;
                case 'servers':
                    content = await loadServersContent();
                    // 鍔犺浇瀹屾湇鍔″櫒鍐呭鍚庯紝缁戝畾浜嬩欢澶勭悊鍣ㄥ苟鍔犺浇鐘舵€佹爣绛?
                    setTimeout(() => {
                        // 缁戝畾鏈嶅姟鍣ㄤ簨浠跺鐞嗗櫒
                        bindServerEvents();

                        // 鍒濆鍖栨湇鍔″櫒鍚嶇О婊氬姩鏁堟灉
                        initServerNameScrolling();

                        // 鍔犺浇鏈嶅姟鍣ㄧ姸鎬佹爣绛?
                        if (serverStatusManager) {
                            serverStatusManager.loadAllServerStatus();
                        } else {
                            // 濡傛灉鐘舵€佺鐞嗗櫒杩樻湭鍒濆鍖栵紝浣跨敤澶囩敤鏂规硶
                            const serverCards = document.querySelectorAll('[data-server-id]');
                            serverCards.forEach(card => {
                                const serverId = card.getAttribute('data-server-id');
                                if (serverId) {
                                    loadServerStatusTagsFallback(serverId);
                                }
                            });
                        }
                    }, 100);
                    break;
                case 'users':
                    content = await loadUsersContent();
                    // 鍔犺浇瀹岀敤鎴峰唴瀹瑰悗锛岀粦瀹氫簨浠跺鐞嗗櫒骞舵墽琛岄〉闈㈠垵濮嬪寲
                    setTimeout(() => {
                        bindContentEvents();
                        initUsersContent();
                    }, 100);
                    break;

    function executeScriptsInElement(element) {
        const scripts = element.querySelectorAll('script');
        scripts.forEach(script => {
            if (script.src) {
                // 澶栭儴鑴氭湰锛屽垱寤烘柊鐨剆cript鏍囩
                const newScript = document.createElement('script');
                newScript.src = script.src;
                document.head.appendChild(newScript);
            } else {
                // 鍐呰仈鑴氭湰锛岀洿鎺ユ墽琛?
                try {
                    eval(script.innerHTML);
                } catch (error) {
                    console.error('鎵ц鑴氭湰鍑洪敊:', error);
                }
            }
        });
    }

    function renderTimelineData(data) {
        const container = document.getElementById('timelineContent');
        
        // 鎸夋棩鏈熷垎缁?
        const groupedData = {};
        data.forEach(log => {
            const date = log.timestamp.split(' ')[0];
            if (!groupedData[date]) {
                groupedData[date] = [];
            }
            groupedData[date].push(log);
        });

        let html = '';
        Object.keys(groupedData).forEach(date => {
            const logs = groupedData[date];
            const today = new Date().toISOString().split('T')[0];
            const dateLabel = date === today ? '浠婂ぉ ' + date : date;

            html += `
                <div class="date-group">
                    <div class="date-header">
                        <i class="fas fa-calendar-day"></i>
                        ${dateLabel}
                        <span class="date-stats">${logs.length} 娆℃搷浣?/span>
                    </div>
                    <div class="timeline-items">
            `;

            logs.forEach(log => {
                html += `
                    <div class="timeline-item type-${log.type}" data-log-id="${log.id}" onclick="selectServerLog(${log.id})">
                        <div class="item-content">
                            <div class="item-header">
                                <div class="user-info">
                                    <div class="user-avatar">${log.username.charAt(0)}</div>
                                    <span class="username">${log.username}</span>
                                </div>
                                <span class="timestamp">${log.timestamp.split(' ')[1]}</span>
                            </div>
                            
                            <div class="operation-info">
                                <div class="operation-type ${log.type}">
                                    <i class="fas fa-${getServerLogTypeIcon(log.type)}"></i>
                                    ${getServerLogTypeLabel(log.type)}
                                </div>
                                <div class="operation-desc">${log.operation}</div>
                            </div>
                            
                            <div class="status-indicator ${log.status}">
                                <i class="fas fa-${getServerLogStatusIcon(log.status)}"></i>
                                ${getServerLogStatusLabel(log.status)} - ${log.duration}
                            </div>
                        </div>
                    </div>
                `;
            });

            html += '</div></div>';
        });

        container.innerHTML = html;
    }

        }

                <i class="${iconClass}"></i>
                <span class="tag-text">${tag.displayText}</span>
            </span>`;
        }).join('');
        
        container.innerHTML = tagsHtml;
        
        // 楠岃瘉DOM缁撴瀯
        setTimeout(() => {
            const appliedTags = container.querySelectorAll('.status-tag');
            appliedTags.forEach((tagElement, index) => {
            });

    function getTagClass(tag) {
        // 鏍规嵁鏈嶅姟绔繑鍥炵殑瀛楁鍒ゆ柇鏍囩绫诲瀷
        if (tag.status === 'CRITICAL' || tag.colorScheme === 'danger') {
            // 绯荤粺璧勬簮绱у紶鏍囩浣跨敤鐗规畩鏍峰紡
            if (tag.displayText && tag.displayText.includes('绯荤粺璧勬簮绱у紶')) {
                return 'tag-danger memory-critical';
            }
            return 'tag-danger';
        }
        if (tag.status === 'WARNING' || tag.colorScheme === 'warning') return 'tag-warning';
        if (tag.status === 'OK' || tag.colorScheme === 'success') return 'tag-success';
        if (tag.colorScheme === 'info') return 'tag-info';
        if (tag.colorScheme === 'secondary') return 'tag-secondary';
        
        // 鍥為€€锛氬熀浜庢爣绛剧被鍨嬪垽鏂?
        switch(tag.tagType) {
            case 'CONNECTION': return tag.status === 'OK' ? 'tag-success' : 'tag-danger';
            case 'SYSTEM_RESOURCE': return 'tag-danger memory-critical';
            case 'MEMORY_USAGE': 
            case 'CPU_USAGE':
            case 'DISK_USAGE':
                if (tag.isAlert) return 'tag-warning';
                return 'tag-info';
            default: return 'tag-secondary';
        }
    }
    
    function getTagIcon(tag) {
        const typeIcons = {
            'CONNECTION': 'fas fa-wifi',
            'MEMORY_USAGE': 'fas fa-memory',
            'CPU_USAGE': 'fas fa-microchip',
            'DISK_USAGE': 'fas fa-hdd',
            'PROCESS_STATUS': 'fas fa-cogs',
            'USER_ACTIVITY': 'fas fa-user',
            'WORKING_DIRECTORY': 'fas fa-folder'
        };
        return typeIcons[tag.tagType] || 'fas fa-info-circle';
    }

    // 鏈嶅姟鍣ㄥ埛鏂扮姸鎬佺鐞嗗櫒
    class ServerRefreshManager {
        constructor() {
            this.storageKey = 'serverRefreshStates';
            this.refreshStates = this.loadStates();
            this.cleanExpiredStates();
        }
        
        loadStates() {
            try {
                const stored = localStorage.getItem(this.storageKey);
                return stored ? JSON.parse(stored) : {};
            } catch (e) {
                console.warn('鏃犳硶鍔犺浇鏈嶅姟鍣ㄥ埛鏂扮姸鎬?', e);
                return {};
            }
        }
        
        saveStates() {
            try {
                localStorage.setItem(this.storageKey, JSON.stringify(this.refreshStates));
            } catch (e) {
                console.warn('鏃犳硶淇濆瓨鏈嶅姟鍣ㄥ埛鏂扮姸鎬?', e);
            }
        }
        
        startRefresh(serverId) {
            this.refreshStates[serverId] = {
                isRefreshing: true,
                startTime: Date.now(),
                status: 'running'
            };
            this.saveStates();
        }
        
        finishRefresh(serverId, success = true, message = '') {
            if (this.refreshStates[serverId]) {
                this.refreshStates[serverId] = {
                    isRefreshing: false,
                    startTime: this.refreshStates[serverId].startTime,
                    endTime: Date.now(),
                    status: success ? 'completed' : 'failed',
                    message: message
                };
                this.saveStates();
                
                // 30绉掑悗娓呯悊鐘舵€?
                setTimeout(() => {
                    delete this.refreshStates[serverId];
                    this.saveStates();
                }, 30000);
            }
        }
        
        isRefreshing(serverId) {
            const state = this.refreshStates[serverId];
            if (!state || !state.isRefreshing) return false;
            
            // 妫€鏌ユ槸鍚﹁秴鏃?(瓒呰繃40绉掕涓哄紓甯?
            const elapsed = Date.now() - state.startTime;
            if (elapsed > 40000) {
                this.finishRefresh(serverId, false, '鍒锋柊瓒呮椂');
                return false;
            }
            
            return true;
        }
        
        cleanExpiredStates() {
            const now = Date.now();
            Object.keys(this.refreshStates).forEach(serverId => {
                const state = this.refreshStates[serverId];
                // 娓呯悊瓒呰繃5鍒嗛挓鐨勭姸鎬?
                if (state.startTime && (now - state.startTime) > 300000) {
                    delete this.refreshStates[serverId];
                }
            });
            this.saveStates();
        }

        applyRefreshingState(serverId) {
            const serverCard = document.querySelector(`[data-server-id="${serverId}"]`)?.closest('.modern-server-card');
            if (!serverCard) {
                // 灏濊瘯鍏朵粬閫夋嫨鍣?
                const altCard = document.querySelector(`[data-id="${serverId}"]`)?.closest('.modern-server-card');
                if (altCard) {
                    this._applyRefreshingToCard(altCard, serverId);
                }
                return;
            }
            
            this._applyRefreshingToCard(serverCard, serverId);
        }
        
        _applyRefreshingToCard(serverCard, serverId) {
            // 娣诲姞鍒锋柊鐘舵€佹牱寮?
            serverCard.classList.add('server-card-refreshing');
            
            // 鍒涘缓鍔犺浇鎸囩ず鍣?
            if (!serverCard.querySelector('.refresh-loading-indicator')) {
                const loadingIndicator = document.createElement('div');
                loadingIndicator.className = 'refresh-loading-indicator';
                loadingIndicator.innerHTML = `
                    <div class="refresh-spinner"></div>
                    <span>姝ｅ湪鍒锋柊鏈嶅姟鍣ㄧ姸鎬?..</span>
                `;
                serverCard.appendChild(loadingIndicator);
            }
        }
        
        clearRefreshingState(serverId) {
            const serverCard = document.querySelector(`[data-server-id="${serverId}"]`)?.closest('.modern-server-card');
            if (!serverCard) {
                // 灏濊瘯鍏朵粬閫夋嫨鍣?
                const altCard = document.querySelector(`[data-id="${serverId}"]`)?.closest('.modern-server-card');
                if (altCard) {
                    this._clearRefreshingFromCard(altCard);
                }
                return;
            }
            
            this._clearRefreshingFromCard(serverCard);
        }
        
        _clearRefreshingFromCard(serverCard) {
            // 绉婚櫎鍒锋柊鐘舵€?
            serverCard.classList.remove('server-card-refreshing');
            const indicator = serverCard.querySelector('.refresh-loading-indicator');
            if (indicator) {
                indicator.remove();
            }
        }
    }

    // 鏈嶅姟鍣ㄧ浉鍏冲嚱鏁?
    function refreshServer(element) {
        const serverId = element.getAttribute('data-id');
        
        // 闃叉閲嶅鍒锋柊
        if (refreshManager.isRefreshing(serverId)) {
            alert('鏈嶅姟鍣ㄦ鍦ㄥ埛鏂颁腑锛岃绛夊緟瀹屾垚');
            return;
        }
        
        // 寮€濮嬪埛鏂扮姸鎬佺鐞?
        refreshManager.startRefresh(serverId);
        
        // 搴旂敤鏈嶅姟鍣ㄥ崱鐗囧埛鏂扮姸鎬?
        refreshManager.applyRefreshingState(serverId);
        
        // 娣诲姞鎸夐挳瑙嗚鍙嶉
        const originalText = element.innerHTML;
        element.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 鍒锋柊涓?..';
        element.disabled = true;
        
        // 娣诲姞30绉掕秴鏃舵帶鍒?
        const controller = new AbortController();
        const timeoutId = setTimeout(() => {
            controller.abort();
        }, 30000);
        
        fetch('/admin/servers/' + serverId + '/refresh', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                [getCSRFHeaderName()]: getCSRFToken()
            },
            signal: controller.signal
        }).then(response => {
            clearTimeout(timeoutId);
            if (response.ok) {
                return response.json();
            } else {
                throw new Error('鏈嶅姟鍣ㄥ搷搴旈敊璇? ' + response.status);
            }
        }).then(data => {
            // 鏍囪鍒锋柊瀹屾垚
            refreshManager.finishRefresh(serverId, true, '鍒锋柊鎴愬姛');
            
            alert('鏈嶅姟鍣ㄧ姸鎬佸凡鍒锋柊');
            // 閲嶆柊鍔犺浇鏈嶅姟鍣ㄥ唴瀹?
            loadContent('servers');
        }).catch(error => {
            clearTimeout(timeoutId);
            console.error('鍒锋柊鏈嶅姟鍣ㄧ姸鎬佸け璐?', error);
            
            let errorMessage = '鍒锋柊澶辫触';
            if (error.name === 'AbortError') {
                errorMessage = '鍒锋柊瓒呮椂(30绉?锛岃妫€鏌ユ湇鍔″櫒SSH閰嶇疆鎴栫綉缁滆繛鎺?;
            } else if (error.message) {
                errorMessage = '鍒锋柊澶辫触: ' + error.message;
            }
            
            // 鏍囪鍒锋柊澶辫触
            refreshManager.finishRefresh(serverId, false, errorMessage);
            alert(errorMessage);
        }).finally(() => {
            // 娓呯悊鍒锋柊鐘舵€佽瑙夋晥鏋?
            refreshManager.clearRefreshingState(serverId);
            
            // 鎭㈠鎸夐挳鐘舵€?
            element.innerHTML = originalText;
            element.disabled = false;
        });
    }

        if (targetCard) {
            targetCard.classList.add('active');
        }
    }

    function handleContentEvents(event) {
        // 澶勭悊涓嬫媺鑿滃崟鍏抽棴
        if (!event.target.closest('.server-actions-dropdown')) {
            document.querySelectorAll('.dropdown-menu.show').forEach(menu => {
                menu.classList.remove('show');
            });
        }
        
        const target = event.target.closest('button, a, .quick-action-btn');
        if (!target) return;
        
        // 璋冭瘯淇℃伅 - 鏌ョ湅鐐瑰嚮鐨勫厓绱?
        if (target.classList.contains('btn-view-logs') || target.classList.contains('quick-action-btn')) {
            console.log('鐐瑰嚮鐨勫厓绱?', target, '绫诲悕:', target.className, '灞炴€?', {
                serverId: target.getAttribute('data-server-id'),
                id: target.getAttribute('data-id'),
                serverName: target.getAttribute('data-server-name')
            });
        }
        
        // 鍒锋柊鏈嶅姟鍣ㄦ寜閽?
        if (target.classList.contains('btn-refresh-server')) {
            event.preventDefault();
            refreshServer(target);
            return;
        }
        
        // 鍒犻櫎鏈嶅姟鍣ㄦ寜閽?
        if (target.classList.contains('btn-delete-server')) {
            event.preventDefault();
            deleteServer(target);
            return;
        }
        
        // 缂栬緫鏈嶅姟鍣ㄦ寜閽?
        if (target.classList.contains('btn-edit-server')) {
            event.preventDefault();
            editServer(target);
            return;
        }
        
        // 閲嶆柊鐢熸垚宸ヤ綔鐩綍鎸夐挳
        if (target.classList.contains('btn-regenerate-workdir')) {
            event.preventDefault();
            const serverId = target.getAttribute('data-id');
            const workdir = target.getAttribute('data-workdir');
            showRegenerateWorkdirModal(serverId, workdir);
            
            // 鍏抽棴涓嬫媺鑿滃崟
            const dropdown = target.closest('.server-actions-dropdown');
            if (dropdown) {
                const menu = dropdown.querySelector('.dropdown-menu');
                if (menu) {
                    menu.classList.remove('show');
                }
            }

    function initServerNameScrolling() {
        const serverNames = document.querySelectorAll('.server-name');
        
        serverNames.forEach((nameElement, index) => {

            // 褰诲簳娓呯悊鏂囨湰鍐呭锛岀Щ闄ゆ墍鏈夌┖鐧藉瓧绗︺€佹崲琛岀绛?
            let textContent = nameElement.textContent || nameElement.innerText || '';
            const originalLength = textContent.length;
            textContent = textContent.replace(/\s+/g, ' ').trim(); // 灏嗘墍鏈夎繛缁┖鐧藉瓧绗︽浛鎹负鍗曚釜绌烘牸

            }

    // 鏄剧ず閲嶆柊鐢熸垚宸ヤ綔鐩綍寮瑰嚭绐楀彛
    function showRegenerateWorkdirModal(serverId, currentWorkdir) {
        currentRegenerateServerId = serverId;
        
        // 璁剧疆褰撳墠宸ヤ綔鐩綍
        const workdirInput = document.getElementById('current-workdir-path');
        if (!workdirInput) {
            console.error('鎵句笉鍒拌緭鍏ユ: current-workdir-path');
            return;
        }
        workdirInput.value = currentWorkdir || '鏈缃伐浣滅洰褰?;
        
        // 鏄剧ず寮瑰嚭绐楀彛

        document.body.style.overflow = 'hidden';

    function closeRegenerateWorkdirModal() {
        const modal = document.getElementById('regenerate-workdir-modal');
        
        // 绉婚櫎鏄剧ず鍔ㄧ敾
        modal.classList.remove('show');
        
        // 绛夊緟鍔ㄧ敾瀹屾垚鍚庨殣钘?

            modal.style.display = 'none';

        document.body.style.overflow = '';
    }

    // 纭閲嶆柊鐢熸垚宸ヤ綔鐩綍
    function confirmRegenerateWorkdir() {
        if (!currentRegenerateServerId) {
            console.error('鏈€夋嫨鏈嶅姟鍣?);
            return;
        }
        
        const confirmBtn = document.getElementById('btn-confirm-regenerate');
        const originalHtml = confirmBtn.innerHTML;
        
        // 绂佺敤鎸夐挳骞舵樉绀哄姞杞界姸鎬?
        confirmBtn.disabled = true;
        confirmBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i><span>妫€鏌ヤ腑...</span>';
        
        // 鍙戦€佽姹?
        fetch(`/admin/servers/${currentRegenerateServerId}/initialize-working-directory`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                [getCSRFHeaderName()]: getCSRFToken()
            }
        }).then(response => response.json()).then(data => {
            if (data.status === 'success') {
                let alertMessage = '';
                let alertTitle = '';
                
                if (data.created === true) {
                    // 鐩綍鏄柊鍒涘缓鐨?
                    alertTitle = '鉁?宸ヤ綔鐩綍鍒涘缓鎴愬姛';
                    alertMessage = `${data.message}\n\n鐩綍璺緞: ${data.workingDirectory || '宸茶缃?}`;
                } else if (data.created === false) {
                    // 鐩綍宸插瓨鍦紝娌℃湁鍒涘缓鏂扮殑
                    alertTitle = '鈩癸笍 宸ヤ綔鐩綍妫€鏌ュ畬鎴?;
                    alertMessage = `${data.message}\n\n鐩綍璺緞: ${data.workingDirectory || '宸茶缃?}\n\n馃摑 鎻愮ず: 鐩綍宸插瓨鍦紝鏃犻渶閲嶆柊鍒涘缓`;
                } else {
                    // 鍏朵粬鎴愬姛鎯呭喌
                    alertTitle = '鉁?鎿嶄綔瀹屾垚';
                    alertMessage = data.message;
                }
                
                alert(`${alertTitle}\n\n${alertMessage}`);
                closeRegenerateWorkdirModal();
                // 閲嶆柊鍔犺浇鏈嶅姟鍣ㄩ〉闈互鏇存柊鐘舵€?
                loadContent('servers');
            } else {
                alert('鉂?鎿嶄綔澶辫触\n\n' + (data.message || '鏈煡閿欒'));
            }
        }).catch(error => {
            console.error('閲嶆柊鐢熸垚宸ヤ綔鐩綍澶辫触:', error);
            alert('鉂?缃戠粶閿欒\n\n璇锋鏌ョ綉缁滆繛鎺ユ垨鏈嶅姟鍣ㄩ厤缃€俓n閿欒璇︽儏: ' + (error.message || error));
        }).finally(() => {
            confirmBtn.disabled = false;
            confirmBtn.innerHTML = originalHtml;
        });
    }

    // 娣诲姞閬僵灞傚拰ESC閿叧闂姛鑳?

</script>

<script>
    // 鏂扮殑绯荤粺椋庢牸鏈嶅姟鍣ㄨ鎯呮ā鎬佹鍑芥暟
    function showSystemServerDetailModal(serverId, serverName) {
        console.log('鏄剧ず绯荤粺椋庢牸鏈嶅姟鍣ㄨ鎯呮ā鎬佹:', { serverId, serverName });
        
        const modal = document.getElementById('systemServerDetailModal');
        if (!modal) {
            console.error('鎵句笉鍒版ā鎬佹鍏冪礌');
            return;
        }
        
        // 鏇存柊妯℃€佹鏍囬
        const titleElement = document.getElementById('systemModalServerName');
        if (titleElement) {
            titleElement.textContent = (serverName || 'Server-' + serverId) + ' 璇︽儏';
        }
        
        // 鏄剧ず妯℃€佹
        modal.classList.add('show');
        document.body.style.overflow = 'hidden';
        
        // 鍔犺浇鏈嶅姟鍣ㄦ暟鎹?
        loadSystemServerData(serverId);
    }

    function hideSystemServerDetailModal() {
        const modal = document.getElementById('systemServerDetailModal');
        if (modal) {
            modal.classList.remove('show');
            document.body.style.overflow = 'auto';
        }
    }

    function loadSystemServerData(serverId) {
        console.log('鍔犺浇鏈嶅姟鍣ㄦ暟鎹?', serverId);
        
        // 鏄剧ず鍔犺浇鐘舵€?
        document.getElementById('systemHostname').textContent = '鍔犺浇涓?..';
        document.getElementById('systemIpAddress').textContent = '鍔犺浇涓?..';
        document.getElementById('systemUptime').textContent = '鍔犺浇涓?..';
        document.getElementById('systemOperatingSystem').textContent = '鍔犺浇涓?..';
        document.getElementById('systemWorkDirectory').textContent = '鍔犺浇涓?..';
        document.getElementById('systemConnectionStatus').textContent = '妫€鏌ヤ腑...';
        
        // 璋冪敤鐪熷疄API鑾峰彇鏈嶅姟鍣ㄨ鎯?
        fetch(`/admin/api/servers/${serverId}/details`, {
            method: 'GET',
            headers: {
                'Content-Type': 'application/json',
                'X-Requested-With': 'XMLHttpRequest'
            }
        })
        .then(response => response.json())
        .then(data => {
            console.log('鏈嶅姟鍣ㄨ鎯匒PI鍝嶅簲:', data);
            
            if (data.success) {
                // 鏇存柊鏈嶅姟鍣ㄥ熀鏈俊鎭?
                const basicInfo = data.basicInfo;
                document.getElementById('systemHostname').textContent = basicInfo.hostname || '鏈煡';
                document.getElementById('systemIpAddress').textContent = basicInfo.ipAddress || '鏈煡';
                document.getElementById('systemUptime').textContent = basicInfo.uptime || '鏈煡';
                document.getElementById('systemOperatingSystem').textContent = basicInfo.operatingSystem || 'Linux';
                document.getElementById('systemWorkDirectory').textContent = basicInfo.workDirectory || '/opt/apps';
                
                // 鏇存柊杩炴帴鐘舵€?
                const statusText = basicInfo.connectionStatus === 'CONNECTED' ? '鍦ㄧ嚎' : 
                                  basicInfo.connectionStatus === 'MONITORING' ? '鐩戞帶涓? : '绂荤嚎';
                document.getElementById('systemConnectionStatus').textContent = `${statusText} ${basicInfo.lastCheck}`;
                
                // 鍔犺浇搴旂敤鍒楄〃鍜屾搷浣滄棩蹇?
                loadSystemApplications(data.applications);
                loadSystemOperationLogs(serverId);
            } else {
                // 澶勭悊閿欒鎯呭喌
                console.error('鑾峰彇鏈嶅姟鍣ㄨ鎯呭け璐?', data.error);
                document.getElementById('systemHostname').textContent = '鑾峰彇澶辫触';
                document.getElementById('systemIpAddress').textContent = data.error || '鏈煡閿欒';
                document.getElementById('systemUptime').textContent = '';
                document.getElementById('systemOperatingSystem').textContent = '';
                document.getElementById('systemWorkDirectory').textContent = '';
                document.getElementById('systemConnectionStatus').textContent = '鏃犳硶杩炴帴';
                
                // 鏄剧ず閿欒鐨勫簲鐢ㄥ拰鏃ュ織
                loadSystemApplications([]);
                loadSystemOperationLogs(null);
            }
        })
        .catch(error => {
            console.error('鏈嶅姟鍣ㄨ鎯匒PI璋冪敤澶辫触:', error);
            document.getElementById('systemHostname').textContent = '缃戠粶閿欒';
            document.getElementById('systemIpAddress').textContent = '璇锋鏌ョ綉缁滆繛鎺?;
            document.getElementById('systemUptime').textContent = '';
            document.getElementById('systemOperatingSystem').textContent = '';
            document.getElementById('systemWorkDirectory').textContent = '';
            document.getElementById('systemConnectionStatus').textContent = '杩炴帴澶辫触';
            
            // 鏄剧ず绌虹殑搴旂敤鍜屾棩蹇?
            loadSystemApplications([]);
            loadSystemOperationLogs(null);
        });
    }

    function loadSystemApplications(applications) {
        const container = document.getElementById('systemApplicationsList');
        
        if (!applications || applications.length === 0) {
            container.innerHTML = `
                <div class="system-app-card system-fade-in" style="text-align: center; padding: 40px;">
                    <div style="font-size: 1.2rem; color: #6b7280; margin-bottom: 10px;">馃摫</div>
                    <div style="color: #6b7280;">鏆傛棤搴旂敤閮ㄧ讲</div>
                    <div style="font-size: 0.875rem; color: #9ca3af; margin-top: 5px;">
                        璇ユ湇鍔″櫒涓婃殏鏃舵病鏈夐儴缃茬殑搴旂敤
                    </div>
                </div>
            `;
            return;
        }
        
        let html = '';
        applications.forEach(app => {
            // 澶勭悊搴旂敤鐘舵€?
            const status = app.status ? app.status.toLowerCase() : 'unknown';
            const statusClass = status === 'running' ? 'running' : 
                               status === 'stopped' ? 'stopped' : 
                               status === 'error' ? 'stopped' : 'starting';
            const statusText = status === 'running' ? '杩愯涓? :
                              status === 'stopped' ? '宸插仠姝? :
                              status === 'error' ? '閿欒' : '鏈煡';
            
            // 鏋勫缓搴旂敤鍗＄墖
            html += `
                <div class="system-app-card ${statusClass} system-fade-in">
                    <div class="system-app-header">
                        <h3 class="system-app-name">${app.name || '鏈煡搴旂敤'}</h3>
                        <span class="system-app-status ${statusClass}">${statusText}</span>
                    </div>
                    <div class="system-app-metrics">
                        ${app.owner ? `<div class="system-app-metric">鎵€鏈夎€? ${app.owner}</div>` : ''}
                        ${app.port ? `<div class="system-app-metric">绔彛: ${app.port}</div>` : ''}
                        ${app.debugPort ? `<div class="system-app-metric">璋冭瘯: ${app.debugPort}</div>` : ''}
                        ${app.uptime && app.uptime !== '鏈繍琛? ? `<div class="system-app-metric">杩愯: ${app.uptime}</div>` : ''}
                        ${app.jarFileName ? `<div class="system-app-metric">鏂囦欢: ${app.jarFileName}</div>` : ''}
                        ${app.processId ? `<div class="system-app-metric">PID: ${app.processId}</div>` : ''}
                        ${app.error ? `<div class="system-app-metric" style="color: #dc3545;">閿欒: ${app.error}</div>` : ''}
                    </div>
                </div>
            `;
        });
        
        // 璁＄畻缁熻淇℃伅
        const runningCount = applications.filter(a => a.status && a.status.toLowerCase() === 'running').length;
        const stoppedCount = applications.filter(a => a.status && a.status.toLowerCase() === 'stopped').length;
        const errorCount = applications.filter(a => a.status && a.status.toLowerCase() === 'error').length;
        
        html += `
            <div class="system-app-summary">
                馃捇 鎬昏: ${applications.length}涓簲鐢?鈥?
                ${runningCount > 0 ? `${runningCount}涓繍琛屼腑` : ''} 
                ${runningCount > 0 && (stoppedCount > 0 || errorCount > 0) ? ' 鈥?' : ''}
                ${stoppedCount > 0 ? `${stoppedCount}涓凡鍋滄` : ''} 
                ${stoppedCount > 0 && errorCount > 0 ? ' 鈥?' : ''}
                ${errorCount > 0 ? `${errorCount}涓敊璇痐 : ''}
                ${runningCount === 0 && stoppedCount === 0 && errorCount === 0 ? '0涓繍琛屼腑' : ''}
            </div>
        `;
        
        container.innerHTML = html;
    }

    function loadSystemOperationLogs(serverId) {
        const container = document.getElementById('systemOperationLogs');
        
        // 鏄剧ず鍔犺浇鐘舵€?
        container.innerHTML = `
            <div style="text-align: center; padding: 40px; color: var(--color-text-secondary);">
                <i class="fas fa-spinner fa-spin" style="font-size: 2rem; margin-bottom: 1rem;"></i>
                <div>姝ｅ湪鍔犺浇鐢ㄦ埛鎿嶄綔璇︽儏...</div>
            </div>
        `;
        
        // 濡傛灉娌℃湁serverId,鏄剧ず绌虹姸鎬?
        if (!serverId) {
            console.log('loadSystemOperationLogs called with empty serverId, showing empty state');
            container.innerHTML = `
                <div style="text-align: center; padding: 40px; color: var(--color-text-secondary);">
                    <i class="fas fa-user-slash" style="font-size: 2rem; margin-bottom: 1rem;"></i>
                    <div>鏆傛棤鐢ㄦ埛鎿嶄綔璁板綍</div>
                    <div style="font-size: 0.875rem; color: #9ca3af; margin-top: 5px;">
                        璇ユ湇鍔″櫒涓婃殏鏃舵病鏈夌敤鎴锋搷浣滆褰?
                    </div>
                </div>
            `;
            return;
        }
        
        console.log('璋冪敤鐢ㄦ埛鎿嶄綔璇︽儏API锛宻erverId:', serverId);
        
        // 鏋勫缓鏌ヨ鍙傛暟
        const queryDto = {
            serverId: parseInt(serverId),
            page: 0,
            size: 10,
            sortBy: 'lastActivity',
            sortDirection: 'DESC'
        };
        
        // 璋冪敤瀹為檯鐨勭敤鎴锋搷浣滆鎯匒PI
        fetch('/user-operations/api/search', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-Requested-With': 'XMLHttpRequest'
            },
            body: JSON.stringify(queryDto)
        })
        .then(response => response.json())
        .then(data => {
            console.log('鐢ㄦ埛鎿嶄綔璇︽儏API鍝嶅簲:', data);
            
            if (data.content && Array.isArray(data.content)) {
                renderUserOperations(data.content, data.totalElements);
            } else if (data.error) {
                console.error('鑾峰彇鐢ㄦ埛鎿嶄綔璇︽儏澶辫触:', data.error);
                container.innerHTML = `
                    <div style="text-align: center; padding: 40px; color: var(--color-danger);">
                        <i class="fas fa-exclamation-triangle" style="font-size: 2rem; margin-bottom: 1rem;"></i>
                        <div>鍔犺浇鐢ㄦ埛鎿嶄綔璇︽儏澶辫触</div>
                        <div style="font-size: 0.875rem; margin-top: 5px;">${data.error}</div>
                    </div>
                `;
            } else {
                // 绌烘暟鎹?
                container.innerHTML = `
                    <div style="text-align: center; padding: 40px; color: var(--color-text-secondary);">
                        <i class="fas fa-user-slash" style="font-size: 2rem; margin-bottom: 1rem;"></i>
                        <div>鏆傛棤鐢ㄦ埛鎿嶄綔璁板綍</div>
                        <div style="font-size: 0.875rem; color: #9ca3af; margin-top: 5px;">
                            璇ユ湇鍔″櫒涓婃殏鏃舵病鏈夌敤鎴锋搷浣滆褰?
                        </div>
                    </div>
                `;
            }
        })
        .catch(error => {
            console.error('鐢ㄦ埛鎿嶄綔璇︽儏API璋冪敤澶辫触:', error);
            container.innerHTML = `
                <div style="text-align: center; padding: 40px; color: var(--color-danger);">
                    <i class="fas fa-network-wired" style="font-size: 2rem; margin-bottom: 1rem;"></i>
                    <div>缃戠粶杩炴帴澶辫触</div>
                    <div style="font-size: 0.875rem; margin-top: 5px;">璇锋鏌ョ綉缁滆繛鎺ュ悗閲嶈瘯</div>
                </div>
            `;
        });
    }
    
    function renderUserOperations(operations, totalElements) {
        const container = document.getElementById('systemOperationLogs');
        
        if (!operations || operations.length === 0) {
            container.innerHTML = `
                <div style="text-align: center; padding: 40px; color: var(--color-text-secondary);">
                    <i class="fas fa-user-slash" style="font-size: 2rem; margin-bottom: 1rem;"></i>
                    <div>鏆傛棤鐢ㄦ埛鎿嶄綔璁板綍</div>
                    <div style="font-size: 0.875rem; color: #9ca3af; margin-top: 5px;">
                        璇ユ湇鍔″櫒涓婃殏鏃舵病鏈夌敤鎴锋搷浣滆褰?
                    </div>
                </div>
            `;
            return;
        }
        
        let html = '';
        operations.forEach((operation, index) => {
            const formatTime = operation.lastActivity ? 
                new Date(operation.lastActivity).toLocaleTimeString('zh-CN', { 
                    hour12: false,
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                }) : '鏈煡鏃堕棿';
            
            const activityIcon = getActivityIcon(operation.activityType);
            const riskColor = getRiskColor(operation.riskLevel);
            
            html += `
                <div class="system-log-card system-fade-in" style="animation-delay: ${index * 0.1}s">
                    <div class="system-log-header">
                        <div class="system-log-time">${formatTime}</div>
                        <div class="system-log-user">
                            <i class="fas fa-user"></i>
                            ${operation.username || '鏈煡鐢ㄦ埛'}${operation.remoteIp ? ' @' + operation.remoteIp : ''}
                        </div>
                    </div>
                    <div class="system-log-content">
                        <h3 class="system-log-action">
                            ${activityIcon} ${operation.operationSummary || operation.activityTypeDescription || '鏈煡鎿嶄綔'}
                        </h3>
                        <div class="system-log-details">
                            ${operation.activityDetails ? `
                                <div class="system-detail-row">
                                    <span class="system-detail-label">鎿嶄綔璇︽儏:</span>
                                    <span class="system-detail-value">${operation.activityDetails}</span>
                                </div>
                            ` : ''}
                            ${operation.sessionId ? `
                                <div class="system-detail-row">
                                    <span class="system-detail-label">浼氳瘽ID:</span>
                                    <span class="system-detail-value">${operation.sessionId}</span>
                                </div>
                            ` : ''}
                            ${operation.commandCount && operation.commandCount > 0 ? `
                                <div class="system-detail-row">
                                    <span class="system-detail-label">鍛戒护鏁伴噺:</span>
                                    <span class="system-detail-value">${operation.commandCount}涓?/span>
                                </div>
                            ` : ''}
                            ${operation.sessionDuration ? `
                                <div class="system-detail-row">
                                    <span class="system-detail-label">浼氳瘽鏃堕暱:</span>
                                    <span class="system-detail-value">${operation.sessionDuration}鍒嗛挓</span>
                                </div>
                            ` : ''}
                            ${operation.riskLevel ? `
                                <div class="system-detail-row">
                                    <span class="system-detail-label">椋庨櫓绛夌骇:</span>
                                    <span class="system-detail-value" style="color: ${riskColor}">
                                        <i class="fas fa-shield-alt"></i>
                                        ${operation.riskLevel}
                                    </span>
                                </div>
                            ` : ''}
                            ${operation.isActive !== null ? `
                                <div class="system-detail-row">
                                    <span class="system-detail-label">浼氳瘽鐘舵€?</span>
                                    <span class="system-detail-value system-status-${operation.isActive ? 'success' : 'error'}">
                                        ${operation.isActive ? '<i class="fas fa-check-circle"></i>娲昏穬' : '<i class="fas fa-times-circle"></i>宸茬粨鏉?}
                                    </span>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                </div>
            `;
        });
        
        // 濡傛灉鏈夋洿澶氳褰曪紝鏄剧ず鍔犺浇鏇村鎸夐挳
        const remainingCount = totalElements - operations.length;
        if (remainingCount > 0) {
            html += `
                <button class="system-load-more" onclick="loadMoreUserOperations(${operations[0].serverId})">
                    <i class="fas fa-plus-circle"></i>
                    鍔犺浇鏇村鎿嶄綔璁板綍 (杩樻湁${remainingCount}鏉?
                </button>
            `;
        }
        
        container.innerHTML = html;
    }
    
    function getActivityIcon(activityType) {
        const iconMap = {
            'SSH_LOGIN': '馃攼',
            'SSH_LOGOUT': '馃毆',
            'COMMAND_EXECUTE': '馃捇',
            'FILE_EDIT': '馃摑',
            'PROCESS_START': '鈻讹笍',
            'PROCESS_STOP': '鈴癸笍',
            'SYSTEM_INFO': '馃搳',
            'APPLICATION_DEPLOY': '馃殌'
        };
        return iconMap[activityType] || '鈿欙笍';
    }
    
    function getRiskColor(riskLevel) {
        const colorMap = {
            '浣?: '#10b981',  // green
            '涓?: '#f59e0b',  // amber
            '楂?: '#ef4444'   // red
        };
        return colorMap[riskLevel] || '#6b7280'; // default gray
    }
    
    function loadMoreUserOperations(serverId) {
        const button = event.target.closest('.system-load-more');
        const originalHTML = button.innerHTML;
        
        button.innerHTML = '<i class="fas fa-spinner fa-spin"></i>鍔犺浇涓?..';

        setTimeout(() => {

    function loadMoreSystemLogs() {

            // 杩欓噷鍙互娣诲姞鏇村鏃ュ織
            console.log('鍔犺浇鏇村鏃ュ織璁板綍');
        }, 1500);
    }

    // 鏇存柊鐜版湁鐨剆howServerLogsModal鍑芥暟浠ヤ娇鐢ㄦ柊鐨勬ā鎬佹
    if (typeof window.originalShowServerLogsModal === 'undefined') {
        const originalShowServerLogsModal = window.showServerLogsModal;
        window.originalShowServerLogsModal = originalShowServerLogsModal; // 瀛樺偍寮曠敤闃叉閲嶅澹版槑
        window.showServerLogsModal = function(serverId, serverName) {
            // 浣跨敤鏂扮殑绯荤粺椋庢牸妯℃€佹

    // 鍏抽棴妯℃€佹鐨勪簨浠跺鐞?

<script>
    // 鐜颁唬瀵艰埅鏍忛泦鎴愬垵濮嬪寲
    document.addEventListener('DOMContentLoaded', function() {
        //console.log('馃殌 鐜颁唬瀵艰埅鏍忛泦鎴愬垵濮嬪寲寮€濮?..');
        
        
        // 搜索输入快捷键占位
        const navSearchInput = document.querySelector('.workspace-nav .search-input');
        if (navSearchInput) {
            navSearchInput.addEventListener('keydown', function(event) {
                if (event.key === 'Escape') {
                    navSearchInput.blur();
                }
            });
        }
        
        // 閫氱煡鎸夐挳鍔熻兘锛堟紨绀猴級
        const notificationBtn = document.querySelector('.notification-btn');
        if (notificationBtn) {
            notificationBtn.addEventListener('click', function() {
                console.log('馃敂 閫氱煡鍔熻兘瑙﹀彂');
                // TODO: 瀹炵幇閫氱煡鍔熻兘
                alert('閫氱煡涓績鍗冲皢鎺ㄥ嚭锛?);
            });
        }
        
        // 瀵艰埅閾炬帴鐐瑰嚮澶勭悊 - 闆嗘垚鐜版湁鐨刲oadContent鍔熻兘
        const modernNavLinks = document.querySelectorAll('.modern-nav-link');
        modernNavLinks.forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                
                // 绉婚櫎鎵€鏈夋椿璺冪姸鎬?
                modernNavLinks.forEach(l => l.classList.remove('active'));
                // 娣诲姞褰撳墠娲昏穬鐘舵€?
                this.classList.add('active');
                
                // 鑾峰彇椤甸潰ID骞惰皟鐢ㄧ幇鏈夌殑loadContent鍑芥暟
                const pageId = this.getAttribute('data-page');
                if (pageId && typeof loadContent === 'function') {
                    console.log('馃搫 鍒囨崲鍒伴〉闈?', pageId);
                    loadContent(pageId);
                }
                
                // 鍦ㄧЩ鍔ㄧ鑷姩鍏抽棴渚ц竟鏍?
                if (window.innerWidth <= 768 && window.modernNavController) {
                    setTimeout(() => {
                        window.modernNavController.closeMobileSidebar();
                    }, 300);
                }
            });
        });
        
        // 閿洏蹇嵎閿敮鎸?
        document.addEventListener('keydown', function(e) {
            // Ctrl+B 鍒囨崲渚ц竟鏍?
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'b') {
                e.preventDefault();
                if (window.modernNavController) {
                    window.modernNavController.toggle();
                }
            }
            
            // Ctrl+Shift+T 鍒囨崲涓婚锛堝鏋滃瓨鍦╰oggleTheme鍑芥暟锛?
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 't') {
                e.preventDefault();
                if (typeof toggleTheme === 'function') {
                    toggleTheme();
                }
            }
            
            // Ctrl+K 瑙﹀彂鎼滅储
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
                e.preventDefault();
                const searchInput = document.querySelector('.workspace-nav .search-input');
                if (searchInput) {
                    searchInput.focus();
                    searchInput.select();
                }
            }
        });
        
        // 鐩戝惉鐜颁唬瀵艰埅浜嬩欢
        document.addEventListener('modernNav:sidebarToggle', function(e) {
            //console.log('馃摫 渚ц竟鏍忓垏鎹?', e.detail.collapsed ? '鏀惰捣' : '灞曞紑');
        });
        
        document.addEventListener('modernNav:themeChanged', function(e) {
            //console.log('馃帹 涓婚鍒囨崲:', e.detail.theme);
        });

        // 鐩戝惉鐜颁唬瀵艰埅鐐瑰嚮浜嬩欢
        document.addEventListener('modernNav:navigationItemClick', function(e) {
            //console.log('馃幆 瀵艰埅椤圭偣鍑?', e.detail);

            // 璇︾粏璇婃柇淇℃伅


            const itemId = e.detail.itemId;
            if (itemId) {
                // 绉婚櫎#鍙峰墠缂€锛堝鏋滄湁锛?
                const page = itemId.replace('#', '');
                //console.log('馃搷 鍔犺浇椤甸潰:', page);

                // 灏濊瘯澶氱鏂瑰紡璋冪敤loadContent鍑芥暟
                let loadContentFunc = null;

                // 1. 灏濊瘯浠巜indow瀵硅薄鑾峰彇
                if (typeof window.loadContent === 'function') {
                    //console.log('鉁?鏂规硶1鎴愬姛: 浠巜indow瀵硅薄鎵惧埌loadContent');
                    loadContentFunc = window.loadContent;
                }
                // 2. 灏濊瘯浠庡叏灞€浣滅敤鍩熻幏鍙?
                else if (typeof loadContent === 'function') {
                    //console.log('鉁?鏂规硶2鎴愬姛: 浠庡叏灞€浣滅敤鍩熸壘鍒發oadContent');
                    loadContentFunc = loadContent;
                }
                // 3. 绛夊緟涓€涓嬪啀灏濊瘯
                else {
                    //console.log('馃攧 loadContent鏆傛椂涓嶅彲鐢紝绛夊緟100ms鍚庨噸璇?..');
                    setTimeout(() => {
                        //console.log('馃攧 閲嶈瘯涓紝鍐嶆妫€鏌?');
                        //console.log('  - typeof window.loadContent:', typeof window.loadContent);
                        //console.log('  - typeof loadContent:', typeof loadContent);

                        if (typeof window.loadContent === 'function') {
                            //console.log('鉁?閲嶈瘯鎴愬姛: window.loadContent鍙敤');
                            window.loadContent(page, true);
                        } else if (typeof loadContent === 'function') {
                            //console.log('鉁?閲嶈瘯鎴愬姛: loadContent鍙敤');
                            loadContent(page, true);
                        } else {
                            console.error('鉂?loadContent鍑芥暟浠嶇劧涓嶅彲鐢紝浣跨敤闄嶇骇鏂规');
                            // 浣滀负鏈€鍚庣殑澶囬€夋柟妗堬紝瑙﹀彂椤甸潰璺宠浆
                            window.location.hash = page;
                        }
                    }, 100);
                    return;
                }

                if (loadContentFunc) {
                    //console.log('鉁?鎵惧埌loadContent鍑芥暟锛屽紑濮嬭皟鐢?);
                    loadContentFunc(page, true, true);
                } else {
                    console.error('鉂?loadContent鍑芥暟涓嶅彲鐢?);
                }
            }
        });
        
        // 纭繚涓婚鍥炬爣姝ｇ‘鏄剧ず
        function updateThemeIcon() {
            const themeIcon = document.querySelector('.theme-icon');
            if (themeIcon) {
                const isDark = document.documentElement.classList.contains('theme-dark');
                themeIcon.className = isDark ? 'theme-icon fas fa-sun' : 'theme-icon fas fa-moon';
            }
        }
        
        // 鍒濆鍖栦富棰樺浘鏍?
        updateThemeIcon();
        
        // 鐩戝惉涓婚鍙樺寲
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.type === 'attributes' && mutation.attributeName === 'class') {
                    updateThemeIcon();
                }
            });
        });
        
        observer.observe(document.documentElement, {
            attributes: true,
            attributeFilter: ['class']
        });
        
        //console.log('鉁?鐜颁唬瀵艰埅鏍忛泦鎴愬垵濮嬪寲瀹屾垚');
    });
</script>

            animation: none;
        }

        .server-name-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-color);
            margin: 0;
        }

        .time-range-selector {
            display: flex;
            gap: 0.5rem;
            background: var(--background-light);
            border-radius: var(--border-radius-md);
            padding: 0.25rem;
            border: 1px solid var(--border-color);
        }

        .time-range-btn {
            padding: 0.5rem 1rem;
            border: none;
            background: transparent;
            color: var(--text-color-secondary);
            border-radius: var(--border-radius-sm);
            cursor: pointer;
            transition: all 0.15s ease;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .time-range-btn.active {
            background: var(--primary-color);
            color: white;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        .time-range-btn:hover:not(.active) {
            background: var(--primary-light);
            color: var(--primary-color);
        }

        .modal-close-btn {
            width: 40px;
            height: 40px;
            border: none;
            background: var(--background-light);
            border-radius: 50%;
            color: var(--text-color-secondary);
            cursor: pointer;
            transition: all 0.15s ease;
            font-size: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close-btn:hover {
            background: var(--danger-color);
            color: white;
            transform: scale(1.1);
        }

        .logs-modal-body {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .timeline-panel {
            width: 35%;
            background: var(--background-light);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .timeline-header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
            background: white;
        }

        .timeline-title {
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--text-color);
            margin: 0 0 0.5rem 0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .activity-summary {
            display: flex;
            gap: 1rem;
            margin-top: 0.5rem;
        }

        .summary-item {
            font-size: 0.75rem;
            color: var(--text-color-secondary);
        }

        .summary-value {
            font-weight: 600;
            color: var(--text-color);
        }

        .timeline-content {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
        }

        .timeline-content::-webkit-scrollbar {
            width: 6px;
        }

        .timeline-content::-webkit-scrollbar-track {
            background: var(--background-light);
        }

        .timeline-content::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }

        .date-group {
            margin-bottom: 2rem;
        }

        .date-header {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-color-secondary);
            margin-bottom: 1rem;
            padding: 0.5rem 1rem;
            background: white;
            border-radius: var(--border-radius-md);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .date-stats {
            margin-left: auto;
            font-size: 0.75rem;
            color: var(--text-color-tertiary);
        }

        .timeline-items {
            position: relative;
            padding-left: 2rem;
        }

        .timeline-items::before {
            content: '';
            position: absolute;
            left: 0.75rem;
            top: 0;
            bottom: 0;
            width: 2px;
            background: var(--border-color);
        }

        .timeline-item {
            position: relative;
            margin-bottom: 1.5rem;
            background: white;
            border-radius: var(--border-radius-md);
            border: 1px solid var(--border-color);
            transition: all 0.15s ease;
            cursor: pointer;
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: -2.25rem;
            top: 1rem;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: white;
            border: 3px solid var(--primary-color);
            z-index: 1;
        }

        .timeline-item:hover {
            transform: translateX(4px);
            box-shadow: var(--card-shadow);
            border-color: var(--primary-color);
            background: var(--primary-light);
        }

        .timeline-item.active {
            border-color: var(--primary-color);
            background: var(--primary-light);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        .timeline-item.active::before {
            border-color: var(--primary-color);
            background: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        .timeline-item.type-command::before { border-color: #6366f1; }
        .timeline-item.type-file::before { border-color: #10b981; }
        .timeline-item.type-app::before { border-color: #8b5cf6; }
        .timeline-item.type-log::before { border-color: #f59e0b; }
        .timeline-item.type-ssh::before { border-color: #f97316; }
        .timeline-item.type-system::before { border-color: #6b7280; }

        .item-content {
            padding: 1rem;
        }

        .item-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.5rem;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .user-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--primary-color);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .username {
            font-weight: 600;
            color: var(--text-color);
            font-size: 0.875rem;
        }

        .timestamp {
            font-size: 0.75rem;
            color: var(--text-color-tertiary);
            background: var(--background-light);
            padding: 0.25rem 0.5rem;
            border-radius: var(--border-radius-sm);
        }

        .operation-info {
            margin-bottom: 0.75rem;
        }

        .operation-type {
            display: inline-flex;
            align-items: center;
            gap: 0.375rem;
            padding: 0.25rem 0.75rem;
            border-radius: var(--border-radius-sm);
            font-size: 0.75rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.025em;
            margin-bottom: 0.5rem;
        }

        .operation-type.command { background: rgba(99, 102, 241, 0.1); color: #6366f1; }
        .operation-type.file { background: rgba(16, 185, 129, 0.1); color: #10b981; }
        .operation-type.app { background: rgba(139, 92, 246, 0.1); color: #8b5cf6; }
        .operation-type.log { background: rgba(245, 158, 11, 0.1); color: #f59e0b; }
        .operation-type.ssh { background: rgba(249, 115, 22, 0.1); color: #f97316; }
        .operation-type.system { background: rgba(107, 114, 128, 0.1); color: #6b7280; }

        .operation-desc {
            font-size: 0.875rem;
            color: var(--text-color);
            font-weight: 500;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', 'Courier New', monospace;
            background: var(--background-light);
            padding: 0.5rem;
            border-radius: var(--border-radius-sm);
            border-left: 3px solid var(--primary-color);
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 0.375rem;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .status-indicator.success { color: var(--success-color); }
        .status-indicator.warning { color: var(--warning-color); }
        .status-indicator.error { color: var(--danger-color); }

        .details-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: white;
        }

        .details-header {
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--border-color);
            background: var(--background-light);
        }

        .details-title {
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--text-color);
            margin: 0;
        }

        .details-content {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
        }

        .detail-card {
            background: var(--background-light);
            border-radius: var(--border-radius-md);
            border: 1px solid var(--border-color);
            margin-bottom: 1.5rem;
            overflow: hidden;
        }

        .card-header {
            padding: 1rem 1.5rem;
            background: white;
            border-bottom: 1px solid var(--border-color);
            font-weight: 600;
            color: var(--text-color);
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .card-content {
            padding: 1.5rem;
        }

        .command-output {
            background: var(--text-color);
            color: #f8f9fa;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', 'Courier New', monospace;
            font-size: 0.875rem;
            line-height: 1.5;
            padding: 1rem;
            border-radius: var(--border-radius-sm);
            overflow-x: auto;
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
        }

        .resource-metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 1rem;
        }

        .metric-item {
            text-align: center;
        }

        .metric-label {
            font-size: 0.75rem;
            color: var(--text-color-secondary);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .metric-value {
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--text-color);
            margin-bottom: 0.5rem;
        }

        .metric-bar {
            height: 6px;
            background: var(--border-color);
            border-radius: 3px;
            overflow: hidden;
        }

        .metric-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--success-color), var(--info-color));
            border-radius: 3px;
            transition: width 0.5s ease;
        }

        .logs-modal-footer {
            padding: 1rem 2rem;
            border-top: 1px solid var(--border-color);
            background: var(--background-light);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .search-controls {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .search-input {
            padding: 0.5rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-md);
            font-size: 0.875rem;
            width: 300px;
            transition: border-color 0.15s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .filter-btn {
            padding: 0.5rem 1rem;
            border: 1px solid var(--border-color);
            background: white;
            border-radius: var(--border-radius-md);
            cursor: pointer;
            transition: all 0.15s ease;
            font-size: 0.875rem;
        }

        .filter-btn:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .filter-btn.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .action-controls {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .export-btn, .refresh-btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: var(--border-radius-md);
            cursor: pointer;
            transition: all 0.15s ease;
            font-size: 0.875rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .export-btn {
            background: var(--info-color);
            color: white;
        }

        .export-btn:hover {
            background: #2563eb;
            transform: translateY(-1px);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        .refresh-btn {
            background: var(--success-color);
            color: white;
        }

        .refresh-btn:hover {
            background: #059669;
            transform: translateY(-1px);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        .pagination {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            color: var(--text-color-secondary);
        }

        .page-btn {
            width: 32px;
            height: 32px;
            border: 1px solid var(--border-color);
            background: white;
            border-radius: var(--border-radius-sm);
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .page-btn:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .empty-timeline {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            color: var(--text-color-secondary);
            padding: 2rem;
        }

        .empty-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .empty-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-color);
            margin-bottom: 0.5rem;
        }

        .empty-desc {
            font-size: 0.875rem;
            margin-bottom: 1.5rem;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>

</body>
</html>
