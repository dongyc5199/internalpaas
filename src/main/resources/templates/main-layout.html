<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/springsecurity" class="shell-theme-light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:utext="${appName != null ? appName : 'Dev Debug Platform &#x63A7;&#x5236;&#x53F0;'}">Dev Debug Platform &#x63A7;&#x5236;&#x53F0;</title>
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />

    <link rel="preload" href="/vendor/fontawesome/webfonts/fa-solid-900.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/vendor/fontawesome/webfonts/fa-regular-400.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/css/design-tokens.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/components/navigation.css">
    <link rel="stylesheet" href="/css/components/buttons.css">
    <link rel="stylesheet" href="/css/components/cards.css">
    <link rel="stylesheet" href="/css/icon-components.css">
    <link rel="stylesheet" href="/css/responsive.css">
    <link rel="icon" type="image/png" href="/favicon.png">

    <style>
        /* 统一去掉所有按钮和链接的焦点蓝框 */
        *:focus,
        *:focus-visible {
            outline: none !important;
        }

        button:focus,
        button:focus-visible,
        a:focus,
        a:focus-visible {
            box-shadow: none !important;
        }

        :root {
            color-scheme: light dark;
            --shell-header-height: 64px;
            --shell-sidebar-width: 240px;
            --shell-sidebar-width-collapsed: 72px;
            --shell-background: var(--background-color, #F4F5FB);
            --shell-surface: var(--surface-color, rgba(255,255,255,0.92));
            --shell-glass: rgba(255,255,255,0.78);
            --shell-border: rgba(255,255,255,0.6);
            --shell-border-dark: rgba(15,23,42,0.18);
            --shell-text-primary: var(--text-color, #0F172A);
            --shell-text-secondary: rgba(15,23,42,0.6);
            --shell-accent: linear-gradient(135deg, #2F9BFF, #3BC6B8);
            --shell-accent-dev: linear-gradient(135deg, #6C63FF, #3D8BFF);
            --shell-scrollbar: rgba(15,23,42,0.18);
        }

        .shell-theme-dark {
            --shell-background: #111827;
            --shell-surface: rgba(30,41,59,0.92);
            --shell-glass: rgba(30,41,59,0.82);
            --shell-border: rgba(148,163,184,0.32);
            --shell-border-dark: rgba(15,23,42,0.36);
            --shell-text-primary: #F9FAFB;
            --shell-text-secondary: rgba(226,232,240,0.72);
            --shell-scrollbar: rgba(148,163,184,0.35);
        }

        body.layout-shell {
            margin: 0;
            min-height: 100vh;
            background: var(--shell-background);
            color: var(--shell-text-primary);
            font-family: "Inter", "Segoe UI", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", sans-serif;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .shell-grid {
            display: grid;
            grid-template-columns: var(--shell-sidebar-width) 1fr;
            grid-template-rows: var(--shell-header-height) 1fr;
            min-height: 100vh;
        }

        .shell-grid[data-sidebar-state="collapsed"] {
            grid-template-columns: var(--shell-sidebar-width-collapsed) 1fr;
        }

        .shell-header {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            padding: 0 24px;
            height: var(--shell-header-height);
            background: var(--shell-glass);
            border-bottom: 1px solid var(--shell-border);
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 24px rgba(15,23,42,0.12);
            position: sticky;
            top: 0;
            z-index: 4;
        }

        .shell-header[data-variant="dev"] .brand-logo {
            background: var(--shell-accent-dev);
        }

        .brand-area {
            display: flex;
            align-items: center;
            gap: 16px;
            flex: 0 0 auto;
            min-width: 260px;
        }

        .brand-logo {
            width: 32px;
            height: 32px;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            color: #FFFFFF;
            background: var(--shell-accent);
        }

        .brand-meta {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .brand-title {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .brand-subtitle {
            font-size: 12px;
            font-weight: 500;
            text-transform: uppercase;
            color: var(--shell-text-secondary);
            letter-spacing: 0.6px;
        }

        .shell-search {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 18px;
            border-radius: 16px;
            background: rgba(15,23,42,0.05);
            border: 1px solid rgba(15,23,42,0.06);
            max-width: 520px;
            transition: border 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .shell-search:hover,
        .shell-search:focus-within {
            border-color: rgba(37,99,235,0.35);
            box-shadow: 0 12px 32px rgba(37,99,235,0.18);
        }

        .shell-search-icon {
            width: 24px;
            height: 24px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            opacity: 0.6;
        }

        .shell-search-placeholder {
            flex: 1;
            font-size: 14px;
            color: var(--shell-text-secondary);
        }

        .shell-search-shortcut {
            font-size: 12px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 999px;
            background: rgba(37,99,235,0.12);
            color: rgba(37,99,235,0.85);
            letter-spacing: 0.6px;
        }

        .shell-toolbar {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .toolbar-btn,
        .toolbar-toggle {
            width: 36px;
            height: 36px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.65);
            background: rgba(255,255,255,0.7);
            box-shadow: 0 3px 10px rgba(15,23,42,0.16);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border 0.2s ease;
            color: inherit;
        }

        .toolbar-toggle {
            width: auto;
            min-width: 36px;
            padding: 0 12px;
            gap: 6px;
        }

        .theme-label {
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
        }

        .toolbar-btn:hover,
        .toolbar-toggle:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(15,23,42,0.2);
            border-color: rgba(37,99,235,0.45);
        }

        .toolbar-btn:focus,
        .toolbar-btn:focus-visible,
        .toolbar-toggle:focus,
        .toolbar-toggle:focus-visible {
            outline: none;
            box-shadow: none;
        }

        .toolbar-toggle[data-state="on"] .toggle-indicator {
            opacity: 1;
        }

        .language-switcher {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 12px;
            height: 36px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.65);
            background: rgba(255,255,255,0.7);
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.6px;
            cursor: pointer;
        }

        .toolbar-divider {
            width: 1px;
            height: 28px;
            background: rgba(15,23,42,0.12);
        }

        .shell-sidebar {
            grid-row: 2 / -1;
            background: linear-gradient(180deg, rgba(255,255,255,0.95), rgba(245,247,255,0.92));
            border-right: 1px solid rgba(255,255,255,0.65);
            display: flex;
            flex-direction: column;
            padding: 24px 16px;
            gap: 24px;
            position: relative;
            z-index: 2;
            transition: transform 0.3s ease;
        }

        .shell-sidebar[data-variant="glass"] {
            background: rgba(20,24,46,0.38);
            border-color: rgba(255,255,255,0.18);
        }

        .shell-sidebar[data-state="collapsed"] {
            width: var(--shell-sidebar-width-collapsed);
            padding: 24px 12px;
            align-items: center;
            overflow-x: hidden; /* 隐藏横向滚动条 */
            overflow-y: auto; /* 保持纵向滚动 */
        }

        /* 折叠状态下隐藏导航项文本 */
        .shell-sidebar[data-state="collapsed"] .nav-item-label {
            display: none;
        }

        /* 折叠状态下调整导航项样式 */
        .shell-sidebar[data-state="collapsed"] .nav-item {
            width: 48px;
            height: 48px;
            padding: 0; /* 移除padding，让图标完全居中 */
            justify-content: center;
            align-items: center;
            position: relative;
            margin: 0 auto 6px auto; /* 水平居中并保持垂直间距 */
            display: flex;
            border-radius: 12px;
        }

        .shell-sidebar[data-state="collapsed"] .nav-icon {
            width: 24px;
            height: 24px;
            min-width: 24px;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
        }

        /* 折叠状态下的活跃指示条 */
        .shell-sidebar[data-state="collapsed"] .nav-item[data-state="active"]::before {
            content: "";
            position: absolute;
            left: -16px;
            top: 50%;
            transform: translateY(-50%);
            width: 4px;
            height: 24px;
            border-radius: 2px;
            background: var(--shell-accent);
            z-index: 10;
        }

        /* 开发者主题下的活跃指示条 */
        .shell-sidebar[data-variant="developer"][data-state="collapsed"] .nav-item[data-state="active"]::before {
            background: var(--shell-accent-dev);
        }

        /* 折叠状态下隐藏侧边栏滚动区域的文本内容 */
        .shell-sidebar[data-state="collapsed"] .nav-section-title {
            display: none;
        }

        /* 折叠状态下的底部链接 */
        .shell-sidebar[data-state="collapsed"] .sidebar-link {
            width: 48px;
            height: 48px;
            padding: 0; /* 移除padding，让图标完全居中 */
            justify-content: center;
            align-items: center;
            margin: 0 auto 6px auto; /* 水平居中并保持垂直间距 */
            display: flex;
            border-radius: 12px;
        }

        .shell-sidebar[data-state="collapsed"] .sidebar-link__label {
            display: none;
        }

        .shell-sidebar[data-state="collapsed"] .sidebar-link__icon {
            width: 24px;
            height: 24px;
            min-width: 24px;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
        }

        /* 折叠状态下隐藏底部元数据 */
        .shell-sidebar[data-state="collapsed"] .sidebar-meta {
            display: none;
        }

        /* 折叠状态下的悬浮提示样式 */
        .nav-tooltip {
            position: absolute;
            left: calc(100% + 12px);
            top: 50%;
            transform: translateY(-50%);
            background: rgba(15, 23, 42, 0.9);
            color: rgba(255, 255, 255, 0.95);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.3);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s ease, visibility 0.2s ease;
            z-index: 9999;
            pointer-events: none;
        }

        .nav-tooltip::before {
            content: "";
            position: absolute;
            left: -4px;
            top: 50%;
            transform: translateY(-50%);
            width: 8px;
            height: 8px;
            background: rgba(15, 23, 42, 0.9);
            rotate: 45deg;
        }

        .shell-sidebar[data-state="collapsed"] .nav-item:hover .nav-tooltip,
        .shell-sidebar[data-state="collapsed"] .sidebar-link:hover .nav-tooltip {
            opacity: 1;
            visibility: visible;
        }

        /* 暗色主题下的悬浮提示 */
        .shell-theme-dark .nav-tooltip {
            background: rgba(30, 41, 59, 0.95);
            color: rgba(255, 255, 255, 0.9);
        }

        .shell-theme-dark .nav-tooltip::before {
            background: rgba(30, 41, 59, 0.95);
        }

        /* 侧边栏过渡动画 */
        .sidebar-transitioning {
            transition: width 0.3s ease, padding 0.3s ease !important;
        }

        .sidebar-transitioning * {
            transition: opacity 0.2s ease, transform 0.2s ease, width 0.2s ease, height 0.2s ease !important;
        }

        /* 背景遮罩样式 */
        .sidebar-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(4px);
            z-index: 1;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .sidebar-backdrop[data-state="visible"] {
            opacity: 1;
            visibility: visible;
        }

        /* 响应式断点调整 */
        @media (max-width: 1024px) {
            .shell-grid {
                grid-template-columns: 1fr;
                grid-template-rows: var(--shell-header-height) 1fr;
            }

            .shell-sidebar {
                position: fixed;
                top: var(--shell-header-height);
                left: 0;
                height: calc(100vh - var(--shell-header-height));
                z-index: 2;
                transform: translateX(-100%);
                transition: transform 0.3s ease;
            }

            .shell-sidebar[data-state="expanded"] {
                transform: translateX(0);
            }

            .shell-content {
                grid-column: 1 / -1;
                grid-row: 2 / -1;
            }
        }

        @media (max-width: 768px) {
            .shell-header {
                padding: 0 16px;
            }

            .brand-area {
                min-width: 200px;
            }

            .shell-search {
                max-width: 300px;
            }
        }

        /* 暗色主题侧边栏 */
        .shell-theme-dark .shell-sidebar {
            background: linear-gradient(180deg, rgba(30,41,59,0.95), rgba(17,24,39,0.92));
            border-right: 1px solid rgba(148,163,184,0.32);
        }

        .shell-theme-dark .shell-sidebar[data-variant="glass"] {
            background: rgba(15,23,42,0.78);
            border-color: rgba(148,163,184,0.24);
        }

        /* 暗色主题导航项 */
        .shell-theme-dark .nav-item {
            color: rgba(255,255,255,0.88);
            border-color: rgba(148,163,184,0.18);
        }

        .shell-theme-dark .nav-item[data-state="active"],
        .shell-theme-dark .nav-item:hover {
            background: rgba(96,165,250,0.18);
            border-color: rgba(96,165,250,0.35);
            color: rgba(147,197,253,1);
        }

        /* 暗色主题侧边栏链接 */
        .shell-theme-dark .sidebar-link {
            color: rgba(255,255,255,0.75);
        }

        .shell-theme-dark .sidebar-link:hover {
            background: rgba(96,165,250,0.18);
            border-color: rgba(96,165,250,0.35);
            color: rgba(147,197,253,1);
        }

        .shell-theme-dark .sidebar-link:focus,
        .shell-theme-dark .sidebar-link:focus-visible {
            outline: none;
            box-shadow: none;
        }

        /* 暗色主题侧边栏元数据 */
        .shell-theme-dark .sidebar-meta .meta-label {
            color: rgba(255,255,255,0.65);
        }

        .shell-theme-dark .sidebar-meta .meta-value {
            color: rgba(255,255,255,0.88);
        }

        /* 暗色主题侧边栏底部 */
        .shell-theme-dark .sidebar-footer {
            border-top: 1px solid rgba(148,163,184,0.24);
        }

        .sidebar-scroll {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden; /* 确保没有横向滚动 */
            padding-right: 6px;
        }

        /* 折叠状态下的滚动区域 */
        .shell-sidebar[data-state="collapsed"] .sidebar-scroll {
            padding-right: 0;
            overflow-x: hidden;
            width: 100%;
        }

        .sidebar-scroll::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar-scroll::-webkit-scrollbar-thumb {
            background: var(--shell-scrollbar);
            border-radius: 999px;
        }

        /* 折叠状态下隐藏滚动条 */
        .shell-sidebar[data-state="collapsed"] .sidebar-scroll::-webkit-scrollbar {
            width: 0;
        }

        .nav-section {
            margin-bottom: 28px;
        }

        .nav-section:last-of-type {
            margin-bottom: 0;
        }

        .nav-section-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--shell-text-secondary);
            letter-spacing: 0.6px;
            text-transform: uppercase;
            padding: 0 8px;
            margin-bottom: 12px;
        }

        .nav-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .nav-item {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            border-radius: 14px;
            background: transparent;
            border: 1px solid transparent;
            color: inherit;
            cursor: pointer;
            transition: 0.2s ease;
            font-size: 14px;
            font-weight: 500;
        }

        .nav-item[data-state="active"],
        .nav-item:hover {
            background: rgba(37,99,235,0.12);
            border-color: rgba(37,99,235,0.28);
            color: #1D4ED8;
        }

        .nav-item:focus,
        .nav-item:focus-visible {
            outline: none;
            box-shadow: none;
        }


        .sidebar-footer {
            padding-top: 18px;
            border-top: 1px solid rgba(15,23,42,0.08);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 12px;
            background: transparent;
            border: 1px solid transparent;
            color: inherit;
            text-decoration: none;
            font-size: 13px;
            transition: 0.2s ease;
        }

        .sidebar-link:hover {
            background: rgba(37,99,235,0.12);
            border-color: rgba(37,99,235,0.28);
            color: #1D4ED8;
            outline: none;
        }

        .sidebar-link:focus,
        .sidebar-link:focus-visible {
            outline: none;
            box-shadow: none;
        }

        .sidebar-link__icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 28px;
            height: 28px;
            border-radius: 10px;
            background: rgba(37,99,235,0.1);
            color: rgba(37,99,235,0.9);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .sidebar-link__label {
            flex: 1;
        }

        .sidebar-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 2px;
            font-size: 12px;
            color: var(--shell-text-secondary);
        }

        .sidebar-meta .meta-value {
            font-weight: 600;
            color: var(--shell-text-primary);
        }

        .shell-content {
            grid-column: 2 / -1;
            grid-row: 2 / -1;
            display: flex;
            flex-direction: column;
            background: linear-gradient(180deg, rgba(248,249,255,0.8), rgba(243,245,252,0.9));
        }

        .spa-outlet {
            flex: 1;
            min-height: 0;
            padding: 32px;
        }

        .spa-placeholder {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px dashed rgba(37,99,235,0.2);
            border-radius: 20px;
            color: var(--shell-text-secondary);
            background: rgba(37,99,235,0.06);
        }

        .sidebar-backdrop {
            display: none;
        }

        @media (max-width: 1280px) {
            .shell-search {
                max-width: none;
            }
        }

        @media (max-width: 1024px) {
            .shell-grid {
                grid-template-columns: 1fr;
            }

            .shell-sidebar {
                position: fixed;
                inset: var(--shell-header-height) auto 0 0;
                transform: translateX(-100%);
                max-width: var(--shell-sidebar-width);
                width: calc(100vw - 64px);
                box-shadow: 12px 0 32px rgba(15,23,42,0.32);
            }

            .shell-sidebar[data-state="expanded"] {
                transform: translateX(0);
            }

            .shell-content {
                grid-column: 1 / -1;
            }

            .sidebar-backdrop {
                display: block;
                position: fixed;
                inset: var(--shell-header-height) 0 0 0;
                background: rgba(15,23,42,0.45);
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.3s ease;
                z-index: 3;
            }

            .sidebar-backdrop[data-state="visible"] {
                opacity: 1;
                pointer-events: auto;
            }
        }

        .user-menu {
            position: relative;
            display: flex;
            align-items: center;
        }

        .user-menu__toggle {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 6px 12px;
            border: 1px solid rgba(15,23,42,0.12);
            border-radius: 999px;
            background: transparent;
            color: inherit;
            font: inherit;
            cursor: pointer;
            transition: background 0.2s ease, border-color 0.2s ease;
        }

        .user-menu__toggle:hover,
        .user-menu[data-open="true"] .user-menu__toggle {
            background: rgba(59,130,246,0.08);
            border-color: rgba(59,130,246,0.24);
        }

        .user-menu__avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            background: linear-gradient(135deg, #6366F1, #3B82F6);
            color: #FFFFFF;
        }

        .user-menu__meta {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            line-height: 1.1;
        }

        .user-menu__name {
            font-size: 14px;
            font-weight: 600;
        }

        .user-menu__role {
            font-size: 12px;
            color: var(--shell-text-secondary);
        }

        .user-menu__caret {
            font-size: 12px;
            opacity: 0.6;
        }

        .user-menu__dropdown {
            position: absolute;
            top: calc(100% + 12px);
            right: 0;
            min-width: 220px;
            display: none;
            flex-direction: column;
            gap: 12px;
            padding: 16px;
            border-radius: 16px;
            background: var(--shell-surface);
            box-shadow: 0 20px 48px rgba(15,23,42,0.18);
            border: 1px solid var(--shell-border);
            z-index: 10;
        }

        .user-menu[data-open="true"] .user-menu__dropdown {
            display: flex;
        }

        .user-menu__header {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .user-menu__header-name {
            font-size: 15px;
            font-weight: 600;
        }

        .user-menu__header-role {
            font-size: 12px;
            color: var(--shell-text-secondary);
        }

        .user-menu__options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .user-menu__option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            border-radius: 10px;
            color: inherit;
            text-decoration: none;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .user-menu__option i {
            width: 16px;
            text-align: center;
        }

        .user-menu__option:hover {
            background: rgba(59,130,246,0.1);
            color: #1D4ED8;
        }

        .user-menu__option--danger {
            width: 100%;
            border: none;
            background: transparent;
            font: inherit;
            text-align: left;
            cursor: pointer;
        }

        .user-menu__option--danger:hover {
            background: rgba(248,113,113,0.12);
            color: #DC2626;
        }

        .user-menu__footer form {
            margin: 0;
        }

        @media (max-width: 768px) {
            .user-menu__meta {
                display: none;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                transition: none !important;
                animation: none !important;
            }
            .toolbar-btn,
            .toolbar-toggle {
                transition: none;
            }
        }
    </style>
</head>
<body class="layout-shell">
    <div class="shell-grid" id="appShellRoot" data-shell-root data-sidebar-state="expanded">
        <header class="shell-header"
                data-role="shell-header"
                th:with="rawRole=${userType != null ? userType : userRole},
                         workspaceRole=${rawRole != null and #strings.equalsIgnoreCase(rawRole, 'ADMIN') ? 'admin' : 'developer'}"
                th:attr="data-variant=${workspaceRole}">
            <div class="brand-area" role="button" tabindex="0" data-action="navigate-home">
                <span class="brand-logo" aria-hidden="true"
                      th:text="${workspaceBadge ?: (workspaceRole == 'admin' ? 'AW' : 'DW')}">DW</span>
                <span class="brand-meta">
                    <span class="brand-title" th:text="${appName ?: 'Dev Debug Platform'}">Dev Debug Platform</span>
                    <span class="brand-subtitle"
                          th:text="${workspaceRole == 'admin' ? 'Admin Workspace' : 'Developer Workspace'}">Admin Workspace</span>
                </span>
            </div>
            <div class="shell-search" role="button" tabindex="0" data-action="open-command-palette" aria-haspopup="dialog" aria-expanded="false">

                <span class="shell-search-icon" aria-hidden="true">&#8984;</span>

                <span class="shell-search-placeholder"

                      th:with="defaultCommandHint=${workspaceRole == 'admin' ? '&#x641C;&#x7D22;&#x670D;&#x52A1;&#x5668;&#x3001;&#x4EFB;&#x52A1;&#x6216;&#x547D;&#x4EE4;' : '&#x641C;&#x7D22;&#x5E94;&#x7528;&#x3001;&#x670D;&#x52A1;&#x6216;&#x547D;&#x4EE4;'}"

                      th:utext="${#ctx.containsVariable('commandHint') and commandHint != null ? commandHint : defaultCommandHint}">

                    &#x641C;&#x7D22;&#x5DE5;&#x4F5C;&#x533A;&#x3001;&#x670D;&#x52A1;&#x6216;&#x547D;&#x4EE4;

                </span>

                <span class="shell-search-shortcut">Ctrl/&#8984; K</span>

            </div>
            <div class="shell-toolbar">
                <button type="button" class="toolbar-btn" data-action="toggle-sidebar" aria-controls="primarySidebar" aria-expanded="true" title="展开/收起侧边栏">
                    &#9776;
                </button>
                <button type="button" class="toolbar-btn" data-action="open-notifications" title="通知中心">
                    &#128276;
                </button>
                <button type="button" class="toolbar-toggle" data-action="toggle-theme" aria-pressed="false" title="切换主题">
                    <span aria-hidden="true">☀️</span>
                    <span class="theme-label" aria-hidden="true">浅色</span>
                </button>
                <div class="language-switcher" data-action="toggle-language" role="button" aria-pressed="false">
                    <span th:text="${languageTag ?: 'ZH'}">ZH</span>
                </div>
                <span class="toolbar-divider" aria-hidden="true"></span>
                                <div class="user-menu" data-role="user-menu" data-open="false">
                    <button type="button"
                            class="user-menu__toggle"
                            data-action="toggle-user-menu"
                            aria-haspopup="true"
                            aria-expanded="false">
                        <span class="user-menu__avatar"
                              th:text="${#strings.substring((username != null ? username : 'U'), 0, 1).toUpperCase()}">U</span>
                        <span class="user-menu__meta">
                            <span class="user-menu__name"
                                  th:text="${username != null ? username : '访客'}">访客</span>
                            <span class="user-menu__role"
                                  th:text="${workspaceRole == 'admin' ? '管理员' : '开发者'}">管理员</span>
                        </span>
                        <span class="user-menu__caret" aria-hidden="true">▾</span>
                    </button>
                    <div class="user-menu__dropdown"
                         data-role="user-dropdown"
                         aria-hidden="true">
                        <div class="user-menu__header">
                            <span class="user-menu__header-name"
                                  th:text="${username != null ? username : '访客'}">访客</span>
                            <span class="user-menu__header-role"
                                  th:text="${workspaceRole == 'admin' ? '平台管理员' : '研发成员'}">平台管理员</span>
                        </div>
                        <div class="user-menu__options">
                            <a class="user-menu__option" href="/profile">
                                <i class="fas fa-user" aria-hidden="true"></i>
                                <span>个人资料</span>
                            </a>
                            <a class="user-menu__option" href="/settings">
                                <i class="fas fa-sliders-h" aria-hidden="true"></i>
                                <span>偏好设置</span>
                            </a>
                            <a class="user-menu__option"
                               href="/admin"
                               sec:authorize="hasRole('ADMIN') or hasRole('SUPER_ADMIN')">
                                <i class="fas fa-shield-alt" aria-hidden="true"></i>
                                <span>管理面板</span>
                            </a>
                            <a class="user-menu__option" href="/help">
                                <i class="fas fa-life-ring" aria-hidden="true"></i>
                                <span>帮助中心</span>
                            </a>
                        </div>
                        <div class="user-menu__footer">
                            <form th:action="@{/logout}" method="post">
                                <button type="submit" class="user-menu__option user-menu__option--danger">
                                    <i class="fas fa-sign-out-alt" aria-hidden="true"></i>
                                    <span>退出登录</span>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>

            </div>
        </header>

        <aside id="primarySidebar"
               class="shell-sidebar"
               data-role="shell-sidebar"
               data-state="expanded"
               th:with="rawRole=${userType != null ? userType : userRole},
                        workspaceRole=${rawRole != null and #strings.equalsIgnoreCase(rawRole, 'ADMIN') ? 'admin' : 'developer'}">
                                    <div class="sidebar-scroll" data-role="sidebar-scroll">
            <section class="nav-section"
                     th:each="section : ${navSections}"
                     th:if="${section.items != null and !#lists.isEmpty(section.items)}">
                <h2 class="nav-section-title"
                    th:text="${section.title}">工作空间</h2>
                <ul class="nav-list">
                    <li class="nav-list-item" th:each="menu : ${section.items}">
                        <button type="button"
                                class="nav-item"
                                th:classappend="${menu.active} ? ' active' : ''"
                                th:attr="data-route=${menu.route}, data-page=${menu.page != null ? menu.page : menu.route}"
                                th:aria-current="${menu.active} ? 'page' : null">
                            <span class="nav-icon nav-item__icon"
                                  th:class="'nav-icon nav-item__icon ' + (${userType == 'admin'} ? 'nav-icon--admin' : 'nav-icon--developer')"
                                  th:text="${menu.badge}">OV</span>
                            <span class="nav-item-label" th:text="${menu.label}">工作区概览</span>
                            <span class="nav-tooltip" th:text="${menu.label}">工作区概览</span>
                        </button>
                    </li>
                </ul>
            </section>
        </div>

        <div class="sidebar-footer" th:if="${(sidebarFooterLinks != null and !#lists.isEmpty(sidebarFooterLinks)) or (sidebarFooterMeta != null and !#lists.isEmpty(sidebarFooterMeta))}">
            <a th:each="link : ${sidebarFooterLinks}"
               th:href="${link.href}"
               class="sidebar-link">
                <span class="nav-icon nav-icon--small footer-link__icon"
                      th:class="'nav-icon nav-icon--small footer-link__icon ' + (${userType == 'admin'} ? 'nav-icon--admin' : 'nav-icon--developer')"
                      th:text="${link.badge}">DC</span>
                <span class="sidebar-link__label" th:text="${link.label}">文档中心</span>
                <span class="nav-tooltip" th:text="${link.label}">文档中心</span>
            </a>
            <div class="sidebar-meta" th:each="meta : ${sidebarFooterMeta}">
                <span class="meta-label" th:text="${meta.label}">当前环境</span>
                <span class="meta-value" th:text="${meta.value}">DEV</span>
            </div>
        </div>
</aside>

        <div class="sidebar-backdrop" data-role="sidebar-backdrop"></div>

        <main class="shell-content" data-role="shell-content">
            <section class="spa-outlet" id="spaOutlet" data-role="spa-outlet">
                <div class="spa-placeholder" data-role="spa-placeholder">
                    <p>SPA &#x5360;&#x4F4D;&#x5185;&#x5BB9;&#xFF1A;&#x7B49;&#x5F85;&#x5BFC;&#x822A;&#x4E8B;&#x4EF6;&#x6216;&#x8FDC;&#x7A0B;&#x6A21;&#x5757;&#x6302;&#x8F7D;&#x3002;</p>
                </div>
            </section>
        </main>
    </div>

    <script>
        (function () {
            const root = document.documentElement;
            const body = document.body;
            const shellRoot = document.querySelector('[data-shell-root]');
            const sidebar = document.querySelector('[data-role="shell-sidebar"]');
            const backdrop = document.querySelector('[data-role="sidebar-backdrop"]');
            const THEME_KEY = 'app-shell-theme';
            const SIDEBAR_KEY = 'app-shell-sidebar-state';
            const eventBus = new EventTarget();

            if (!shellRoot) {
                console.warn('[AppShell] 未找到布局根节点，停止初始化。');
                return;
            }

            let currentTheme = 'light';
            let sidebarState = shellRoot.dataset.sidebarState || 'expanded';

            function persist(key, value) {
                try {
                    localStorage.setItem(key, value);
                } catch (error) {
                    console.warn('[AppShell] 无法写入本地存储:', error);
                }
            }

            function load(key) {
                try {
                    return localStorage.getItem(key);
                } catch (error) {
                    console.warn('[AppShell] 无法读取本地存储:', error);
                    return null;
                }
            }

            function applyTheme(theme, persistPref = true) {
                currentTheme = theme === 'dark' ? 'dark' : 'light';
                const themeClass = currentTheme === 'dark' ? 'shell-theme-dark' : 'shell-theme-light';
                root.dataset.theme = currentTheme;
                root.classList.remove('shell-theme-light', 'shell-theme-dark');
                root.classList.add(themeClass);
                body.classList.toggle('dark-mode', currentTheme === 'dark');

                const toggle = document.querySelector('[data-action="toggle-theme"]');
                if (toggle) {
                    toggle.setAttribute('aria-pressed', String(currentTheme === 'dark'));

                    // 更新图标和文字
                    const icon = toggle.querySelector('span[aria-hidden="true"]:first-child');
                    const label = toggle.querySelector('.theme-label');

                    if (currentTheme === 'dark') {
                        if (icon) icon.innerHTML = '🌙'; // 月亮图标
                        if (label) label.innerHTML = '暗色';
                    } else {
                        if (icon) icon.innerHTML = '☀️'; // 太阳图标
                        if (label) label.innerHTML = '浅色';
                    }
                }

                if (persistPref) {
                    persist(THEME_KEY, currentTheme);
                }

                emit('theme:changed', { theme: currentTheme });
            }

            function applySidebarState(state, persistPref = true) {
                sidebarState = state === 'collapsed' ? 'collapsed' : 'expanded';
                shellRoot.dataset.sidebarState = sidebarState;

                if (sidebar) {
                    sidebar.setAttribute('data-state', sidebarState);
                    // 添加动画类以确保平滑过渡
                    sidebar.classList.add('sidebar-transitioning');

                    // 在动画完成后移除过渡类
                    setTimeout(() => {
                        sidebar.classList.remove('sidebar-transitioning');
                    }, 300);
                }

                if (backdrop) {
                    const shouldShow = sidebarState === 'expanded' && window.innerWidth <= 1024;
                    backdrop.setAttribute('data-state', shouldShow ? 'visible' : 'hidden');
                }

                const toggle = document.querySelector('[data-action="toggle-sidebar"]');
                if (toggle) {
                    toggle.setAttribute('aria-expanded', String(sidebarState === 'expanded'));
                    // 更新按钮图标
                    const isCollapsed = sidebarState === 'collapsed';
                    toggle.innerHTML = isCollapsed ? '&#9776;' : '&#10005;';
                    toggle.setAttribute('title', isCollapsed ? '展开侧边栏' : '收起侧边栏');
                }

                if (persistPref) {
                    persist(SIDEBAR_KEY, sidebarState);
                }

                emit('sidebar:state-changed', { state: sidebarState });
            }

            function emit(name, detail) {
                eventBus.dispatchEvent(new CustomEvent(name, { detail }));
            }

            function on(name, handler) {
                const listener = (event) => handler(event.detail, event);
                eventBus.addEventListener(name, listener);
                return () => eventBus.removeEventListener(name, listener);
            }

            function loadPreferences() {
                const savedTheme = load(THEME_KEY);
                const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (savedTheme === 'dark' || savedTheme === 'light') {
                    applyTheme(savedTheme, false);
                } else if (prefersDark) {
                    applyTheme('dark');
                } else {
                    applyTheme('light');
                }

                const savedSidebar = load(SIDEBAR_KEY);
                if (savedSidebar === 'collapsed' || savedSidebar === 'expanded') {
                    applySidebarState(savedSidebar, false);
                }
            }

            function initHeader() {
                const header = document.querySelector('[data-role="shell-header"]');
                if (!header) {
                    return;
                }

                const navHome = header.querySelector('[data-action="navigate-home"]');
                if (navHome) {
                    const navigate = () => emit('header:navigate', { route: '/' });
                    navHome.addEventListener('click', navigate);
                    navHome.addEventListener('keydown', (event) => {
                        if (event.key === 'Enter' || event.key === ' ') {
                            event.preventDefault();
                            navigate();
                        }
                    });
                }

                const toggleSidebarBtn = header.querySelector('[data-action="toggle-sidebar"]');
                if (toggleSidebarBtn) {
                    toggleSidebarBtn.addEventListener('click', () => {
                        applySidebarState(sidebarState === 'expanded' ? 'collapsed' : 'expanded');
                        emit('header:toggle-sidebar', { state: sidebarState });
                    });
                }

                const toggleThemeBtn = header.querySelector('[data-action="toggle-theme"]');
                if (toggleThemeBtn) {
                    toggleThemeBtn.addEventListener('click', () => {
                        applyTheme(currentTheme === 'dark' ? 'light' : 'dark');
                    });
                }

                const commandPalette = header.querySelector('[data-action="open-command-palette"]');
                if (commandPalette) {
                    const openPalette = () => {
                        commandPalette.setAttribute('aria-expanded', 'true');
                        emit('header:command-palette', { show: true });
                    };
                    commandPalette.addEventListener('click', openPalette);
                    commandPalette.addEventListener('keydown', (event) => {
                        if (event.key === 'Enter' || event.key === ' ') {
                            event.preventDefault();
                            openPalette();
                        }
                    });
                }

                const userMenu = header.querySelector('[data-role="user-menu"]');
                if (userMenu) {
                    const toggle = userMenu.querySelector('[data-action="toggle-user-menu"]');
                    const dropdown = userMenu.querySelector('[data-role="user-dropdown"]');

                    const closeMenu = () => {
                        userMenu.dataset.open = 'false';
                        if (dropdown) {
                            dropdown.setAttribute('aria-hidden', 'true');
                        }
                        if (toggle) {
                            toggle.setAttribute('aria-expanded', 'false');
                        }
                    };

                    const openMenu = () => {
                        userMenu.dataset.open = 'true';
                        if (dropdown) {
                            dropdown.setAttribute('aria-hidden', 'false');
                        }
                        if (toggle) {
                            toggle.setAttribute('aria-expanded', 'true');
                        }
                    };

                    if (toggle && dropdown) {
                        closeMenu();
                        toggle.addEventListener('click', (event) => {
                            event.stopPropagation();
                            if (userMenu.dataset.open === 'true') {
                                closeMenu();
                            } else {
                                openMenu();
                            }
                        });

                        dropdown.addEventListener('click', (event) => {
                            event.stopPropagation();
                        });

                        document.addEventListener('click', (event) => {
                            if (!userMenu.contains(event.target)) {
                                closeMenu();
                            }
                        });

                        document.addEventListener('keydown', (event) => {
                            if (event.key === 'Escape') {
                                closeMenu();
                            }
                        });
                    }
                }
                window.addEventListener('keydown', (event) => {
                    const isMac = /Mac|iPod|iPhone|iPad/.test(navigator.platform);
                    const metaKey = isMac ? event.metaKey : event.ctrlKey;
                    if (metaKey && event.key.toLowerCase() === 'k') {
                        event.preventDefault();
                        emit('header:command-palette', { show: true, source: 'shortcut' });
                    }
                });
            }

            function initSidebar() {
                if (!sidebar) {
                    return;
                }

                const navItems = Array.from(sidebar.querySelectorAll('[data-route]'));

                const activateNav = (route) => {
                    if (!route) {
                        return;
                    }
                    navItems.forEach((item) => {
                        const isActive = item.getAttribute('data-route') === route;
                        if (isActive) {
                            item.setAttribute('data-state', 'active');
                            item.setAttribute('aria-current', 'page');
                        } else {
                            item.removeAttribute('data-state');
                            item.removeAttribute('aria-current');
                        }
                    });
                };

                if (navItems.length > 0) {
                    const preset = navItems.find((item) => item.getAttribute('data-state') === 'active') || navItems[0];
                    if (preset) {
                        activateNav(preset.getAttribute('data-route'));
                    }
                }

                navItems.forEach((item) => {
                    item.addEventListener('click', () => {
                        const route = item.getAttribute('data-route');
                        if (!route) {
                            return;
                        }
                        activateNav(route);
                        emit('sidebar:navigate', { route });
                        emit('spa:navigate', { route });
                        if (window.innerWidth <= 1024) {
                            applySidebarState('collapsed', false);
                        }
                    });
                });

                on('spa:navigate', ({ route }) => {
                    if (!route) {
                        return;
                    }
                    activateNav(route);
                });

                if (backdrop) {
                    backdrop.addEventListener('click', () => {
                        applySidebarState('collapsed', false);
                        emit('sidebar:collapsed-by-overlay');
                    });
                }
            }

            function initSpaOutlet() {
                const outlet = document.querySelector('[data-role="spa-outlet"]');
                if (!outlet) {
                    return;
                }

                const loadContent = async (route) => {
                    if (!route) {
                        return;
                    }

                    outlet.innerHTML = '<div class="spa-placeholder">正在加载...</div>';

                    try {
                        let apiUrl = '';
                        switch (route) {
                            case 'overview':
                                apiUrl = '/admin/api/dashboard-content';
                                break;
                            case 'servers':
                                apiUrl = '/admin/api/servers-content';
                                break;
                            case 'users':
                                apiUrl = '/admin/api/users-content';
                                break;
                            case 'settings':
                                outlet.innerHTML = '<div class="spa-placeholder">系统设置功能开发中...</div>';
                                return;
                            default:
                                outlet.innerHTML = '<div class="spa-placeholder">页面不存在</div>';
                                return;
                        }

                        const response = await fetch(apiUrl);
                        if (response.ok) {
                            const content = await response.text();
                            outlet.innerHTML = content;
                        } else {
                            outlet.innerHTML = '<div class="spa-placeholder">加载失败，请重试</div>';
                        }
                    } catch (error) {
                        console.error('加载内容失败:', error);
                        outlet.innerHTML = '<div class="spa-placeholder">网络错误，请重试</div>';
                    }
                };

                on('spa:navigate', ({ route }) => {
                    outlet.dataset.route = route;
                    emit('spa:loading', { route });
                    loadContent(route);
                });

                // 初始加载默认内容
                const initialRoute = outlet.dataset.route || 'overview';
                loadContent(initialRoute);
            }

            function initResponsiveHandling() {
                const handleResize = () => {
                    const isMobile = window.innerWidth <= 1024;

                    if (backdrop) {
                        const shouldShow = sidebarState === 'expanded' && isMobile;
                        backdrop.setAttribute('data-state', shouldShow ? 'visible' : 'hidden');
                    }

                    // 在桌面端自动展开侧边栏，移动端自动收起
                    if (!isMobile && sidebarState === 'collapsed' && load(SIDEBAR_KEY) !== 'collapsed') {
                        applySidebarState('expanded', false);
                    }
                };

                let resizeTimer;
                window.addEventListener('resize', () => {
                    clearTimeout(resizeTimer);
                    resizeTimer = setTimeout(handleResize, 100);
                });

                // 初始化时执行一次
                handleResize();
            }

            loadPreferences();
            initHeader();
            initSidebar();
            initSpaOutlet();
            initResponsiveHandling();
            emit('app:ready', { theme: currentTheme, sidebar: sidebarState });

            window.AppShell = {
                on,
                emit,
                applyTheme,
                setSidebar(state) {
                    applySidebarState(state);
                },
                getState() {
                    return { theme: currentTheme, sidebar: sidebarState };
                }
            };
        })();
    </script>
</body>
</html>
