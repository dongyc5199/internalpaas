            // 检查用户名唯一性
            async function checkUsernameAvailability(username) {
                if (!username || username.trim() === '') {
                    return {
                        status: 'idle',
                        message: '用于登录及工作目录名称,需唯一。'
                    };
                }

                try {
                    const response = await fetch(`/admin/api/users/check-username?username=${encodeURIComponent(username.trim())}`);
                    const data = await response.json();

                    return {
                        status: data.available ? 'success' : 'error',
                        message: data.message || (data.available ? '用户名可用。' : '该用户名已存在,请更换。')
                    };
                } catch (error) {
                    console.error('[UserAddModal] 检查用户名失败:', error);
                    return {
                        status: 'error',
                        message: '检查用户名时出错,请稍后重试。'
                    };
                }
            }

            // 检查邮箱唯一性
            async function checkEmailAvailability(email) {
                if (!email || email.trim() === '') {
                    return {
                        status: 'idle',
                        message: '用于接收通知及重置密码,需唯一。'
                    };
                }

                try {
                    const response = await fetch(`/admin/api/users/check-email?email=${encodeURIComponent(email.trim())}`);
                    const data = await response.json();

                    return {
                        status: data.available ? 'success' : 'error',
                        message: data.message || (data.available ? '邮箱可用。' : '该邮箱已存在,请更换。')
                    };
                } catch (error) {
                    console.error('[UserAddModal] 检查邮箱失败:', error);
                    return {
                        status: 'error',
                        message: '检查邮箱时出错,请稍后重试。'
                    };
                }
            }

            // 渲染角色按钮
            function renderRoleChips() {
                if (!addRoleMatrix) return;

                const roleChips = addRoleMatrix.querySelectorAll('.role-chip');
                roleChips.forEach(chip => {
                    const role = chip.dataset.role;
                    if (selectedRoles.has(role)) {
                        chip.classList.add('active');
                    } else {
                        chip.classList.remove('active');
                    }
                });
            }

            // 加载可用服务器列表
            async function loadAvailableServers() {
                try {
                    const response = await fetch('/admin/api/servers/available');
                    if (!response.ok) {
                        throw new Error('获取服务器列表失败');
                    }
                    availableServers = await response.json();
                    renderServerOptions();
                } catch (error) {
                    console.error('[UserAddModal] 加载服务器列表失败:', error);
                    showToast('加载服务器列表失败', 'error');
                }
            }

            // 渲染服务器选项
            function renderServerOptions() {
                if (!addServerGrid) return;

                addServerGrid.innerHTML = '';

                availableServers.forEach(server => {
                    const label = document.createElement('label');
                    label.className = 'checkbox-tile';

                    const isSelected = selectedServers.has(server.id);
                    const statusClass = server.connectionStatus === 'CONNECTED' || server.connectionStatus === 'MONITORING' ? 'active' : 'pending';

                    label.innerHTML = `
                        <header>
                            <div style="display:flex; align-items:center; gap: 8px;">
                                <input type="checkbox" value="${server.id}" ${isSelected ? 'checked' : ''}>
                                <span style="font-weight:600;">${server.name}</span>
                            </div>
                            <span class="status-pill ${statusClass}" style="font-size:11px;">
                                ${server.connectionStatus || 'UNKNOWN'}
                            </span>
                        </header>
                        <div class="tile-meta">${server.hostname}</div>
                    `;

                    const checkbox = label.querySelector('input[type="checkbox"]');
                    checkbox.addEventListener('change', function() {
                        const serverId = parseInt(this.value);
                        if (this.checked) {
                            selectedServers.add(serverId);
                        } else {
                            selectedServers.delete(serverId);
                        }
                        renderDefaultServerOptions();
                    });

                    addServerGrid.appendChild(label);
                });

                renderDefaultServerOptions();
            }

            // 渲染默认服务器下拉选项
            function renderDefaultServerOptions() {
                if (!addDefaultServer) return;

                const selected = Array.from(selectedServers);
                addDefaultServer.innerHTML = '';

                if (selected.length === 0) {
                    addDefaultServer.disabled = true;
                    const option = document.createElement('option');
                    option.value = '';
                    option.textContent = '尚未勾选服务器';
                    addDefaultServer.appendChild(option);
                    return;
                }

                addDefaultServer.disabled = false;
                selected.forEach(id => {
                    const server = availableServers.find(s => s.id === id);
                    if (server) {
                        const option = document.createElement('option');
                        option.value = server.id;
                        option.textContent = `${server.name} · ${server.hostname}`;
                        addDefaultServer.appendChild(option);
                    }
                });
            }

            // 构建请求payload
            function buildPayload() {
                const formData = new FormData(userAddForm);
                const accountEnabled = document.getElementById('addAccountEnabled');
                const forceReset = document.getElementById('addForceReset');
                const sendWelcome = document.getElementById('addSendWelcome');

                const payload = {
                    username: (formData.get('username') || '').trim(),
                    email: (formData.get('email') || '').trim(),
                    fullName: (formData.get('fullName') || '').trim() || null,
                    department: (formData.get('department') || '').trim() || null,
                    password: formData.get('password'),
                    enabled: accountEnabled ? accountEnabled.checked : true,
                    enforcePasswordReset: forceReset ? forceReset.checked : false,
                    roles: Array.from(selectedRoles),
                    serverIds: Array.from(selectedServers),
                    defaultServerId: addDefaultServer.value ? parseInt(addDefaultServer.value) : null,
                    workDirectory: (formData.get('workspacePath') || '').trim() || null,
                    sendWelcomeMail: sendWelcome ? sendWelcome.checked : false
                };

                return payload;
            }

            // 提交表单
            async function handleSubmit(event) {
                event.preventDefault();

                const password = addPasswordInput.value;
                const confirmPassword = addConfirmPasswordInput.value;

                // 验证密码
                if (!password || password.length < 8) {
                    showToast('❌ 密码至少 8 位且需包含字母与数字', 'error');
                    return;
                }

                if (password !== confirmPassword) {
                    showToast('❌ 两次密码输入不一致', 'error');
                    return;
                }

                // 验证角色
                if (selectedRoles.size === 0) {
                    showToast('❌ 请至少选择一个角色', 'error');
                    return;
                }

                // 验证必填项
                if (!addUsernameInput.value || !addEmailInput.value) {
                    showToast('❌ 请补全必填信息', 'error');
                    return;
                }

                // 显示加载状态
                submitUserAddBtn.classList.add('is-loading');
                submitUserAddBtn.disabled = true;

                try {
                    const payload = buildPayload();
                    console.log('[UserAddModal] 提交用户数据:', payload);

                    // 获取CSRF token
                    const csrfToken = document.querySelector('meta[name="_csrf"]')?.content;
                    const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.content;

                    const headers = {
                        'Content-Type': 'application/json'
                    };

                    // 添加CSRF header
                    if (csrfToken && csrfHeader) {
                        headers[csrfHeader] = csrfToken;
                    }

                    const response = await fetch('/admin/api/users', {
                        method: 'POST',
                        headers: headers,
                        body: JSON.stringify(payload)
                    });

                    const result = await response.json();

                    if (!response.ok) {
                        throw new Error(result.message || '创建用户失败');
                    }

                    showToast('✅ ' + (result.message || '用户创建成功'), 'success');
                    closeUserAddModal();

                    // 刷新用户列表
                    if (window.AppShell && window.AppShell.emit) {
                        window.AppShell.emit('user:created', result.user);
                    }

                    // 如果当前在用户权限管理页面,刷新列表
                    if (typeof refreshUserList === 'function') {
                        refreshUserList();
                    }
                } catch (error) {
                    console.error('[UserAddModal] 创建用户失败:', error);
                    showToast('❌ ' + error.message, 'error');
                } finally {
                    submitUserAddBtn.classList.remove('is-loading');
                    submitUserAddBtn.disabled = false;
                }
            }

            // 初始化事件监听器
            function initEventListeners() {
                // 等待DOM加载完成
                if (document.readyState === 'loading') {
                    document.addEventListener('DOMContentLoaded', () => {
                        initDomReferences();
                        attachEventListeners();
                        setupPageUnloadCleanup();
                    });
                } else {
                    initDomReferences();
                    attachEventListeners();
                    setupPageUnloadCleanup();
                }
            }

            // 设置页面卸载清理
            function setupPageUnloadCleanup() {
                window.addEventListener('beforeunload', () => {
                    // 清理服务器群组管理的定时器
                    stopServerGroupAutoRefresh();
                });
            }

            function attachEventListeners() {
                // 打开弹窗按钮 (使用事件委托)
                document.addEventListener('click', function(e) {
                    if (e.target && (e.target.id === 'addUserBtn' || e.target.closest('#addUserBtn'))) {
                        e.preventDefault();
                        openUserAddModal();
                    }

                    // 关闭弹窗按钮 (使用事件委托)
                    if (e.target && (e.target.id === 'closeUserAddModal' || e.target.closest('#closeUserAddModal'))) {
                        e.preventDefault();
                        closeUserAddModal();
                    }

                    // 取消按钮 (使用事件委托)
                    if (e.target && (e.target.id === 'cancelUserAddBtn' || e.target.closest('#cancelUserAddBtn'))) {
                        e.preventDefault();
                        closeUserAddModal();
                    }

                    // 点击遮罩层关闭 (使用事件委托)
                    if (e.target && e.target.id === 'userAddModalOverlay' && e.target.classList.contains('modal-overlay')) {
                        closeUserAddModal();
                    }

                    // 密码显示/隐藏切换
                    if (e.target && e.target.id === 'addPasswordToggle') {
                        const passwordInput = document.getElementById('addPassword');
                        if (passwordInput) {
                            const type = passwordInput.type === 'password' ? 'text' : 'password';
                            passwordInput.type = type;
                            e.target.textContent = type === 'password' ? '👁️' : '👁️‍🗨️';
                        }
                    }
                });

                // ESC键关闭
                document.addEventListener('keydown', function(e) {
                    const overlay = document.getElementById('userAddModalOverlay');
                    if (e.key === 'Escape' && overlay && overlay.classList.contains('show')) {
                        closeUserAddModal();
                    }
                });

                // 表单提交 (使用事件委托)
                document.addEventListener('submit', function(e) {
                    if (e.target && e.target.id === 'userAddForm') {
                        handleSubmit(e);
                    }
                });

                // 使用事件委托处理输入验证
                document.addEventListener('blur', async function(e) {
                    // 用户名唯一性检查
                    if (e.target && e.target.id === 'addUsername') {
                        const result = await checkUsernameAvailability(e.target.value);
                        const statusElement = document.getElementById('addUsernameStatus');
                        updateValidation(
                            statusElement,
                            result.message,
                            result.status === 'success' ? 'success' : result.status === 'error' ? 'error' : undefined
                        );
                    }

                    // 邮箱唯一性检查
                    if (e.target && e.target.id === 'addEmail') {
                        const result = await checkEmailAvailability(e.target.value);
                        const statusElement = document.getElementById('addEmailStatus');
                        updateValidation(
                            statusElement,
                            result.message,
                            result.status === 'success' ? 'success' : result.status === 'error' ? 'error' : undefined
                        );
                    }
                }, true); // 使用捕获阶段

                // 使用事件委托处理输入事件
                document.addEventListener('input', function(e) {
                    // 密码一致性检查
                    if (e.target && e.target.id === 'addConfirmPassword') {
                        const passwordInput = document.getElementById('addPassword');
                        const statusElement = document.getElementById('addPasswordStatus');
                        if (!e.target.value) {
                            updateValidation(statusElement, '确保两次输入一致。');
                            return;
                        }
                        if (e.target.value === passwordInput.value) {
                            updateValidation(statusElement, '两次输入一致。', 'success');
                        } else {
                            updateValidation(statusElement, '密码不一致,请重新确认。', 'error');
                        }
                    }
                });

                // 角色选择 (使用事件委托)
                document.addEventListener('click', function(e) {
                    const chip = e.target.closest('.role-chip');
                    const roleMatrix = document.getElementById('addRoleMatrix');
                    if (chip && roleMatrix && roleMatrix.contains(chip)) {
                        const role = chip.dataset.role;
                        if (selectedRoles.has(role)) {
                            selectedRoles.delete(role);
                        } else {
                            selectedRoles.add(role);
                        }

                        // 至少保留一个角色
                        if (selectedRoles.size === 0) {
                            selectedRoles.add('USER');
                            showToast('⚠️ 至少保留一个角色', 'warning');
                        }

                        renderRoleChips();
                    }

                    // 高级选项切换
                    if (e.target && (e.target.id === 'addAdvancedToggle' || e.target.closest('#addAdvancedToggle'))) {
                        const panel = document.getElementById('addAdvancedPanel');
                        const toggleText = document.getElementById('addAdvancedToggleText');
                        if (panel && toggleText) {
                            const isShown = panel.classList.toggle('show');
                            toggleText.textContent = isShown ? '收起' : '展开';
                        }
                    }
                });
            }

            // 初始化
            initEventListeners();

            // 暴露API
            window.UserAddModal = {
                open: openUserAddModal,
                close: closeUserAddModal
            };
        })();

            /**

            async function handleStartScan() {

                if (scanInProgress) {
                    showToast('⏳ 扫描正在进行中，请稍候...', 'info');

                try {
                    scanInProgress = true;

                    const csrfToken = document.querySelector('meta[name="_csrf"]')?.content;
                    const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.content;
                    
                    console.log('[DEBUG] CSRF Token:', csrfToken);
                    console.log('[DEBUG] CSRF Header:', csrfHeader);
                    
                    // 3. 准备请求头
                    const headers = {
                        'Content-Type': 'application/json'
                    };
                    
                    // 添加 CSRF header
                    if (csrfToken && csrfHeader) {
                        headers[csrfHeader] = csrfToken;
                    }
                    
                    console.log('[DEBUG] 请求头:', headers);
                    
                    // 4. 调用扫描API
                    const response = await fetch('/api/ssh-scan/scan-all', {
                        method: 'POST',
                        headers: headers
                    });
                    
                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.message || '扫描失败');
                    }
                    
                    const result = await response.json();
                    console.log('[DEBUG] 扫描API返回结果:', result);
                    
                    // 3. 显示扫描结果
                    if (result.success) {
                        console.log('[DEBUG] 扫描成功，准备调用 showScanResult');
                        showScanResult(result.data);
                        //showToast('✅ 扫描完成！', 'success');
                    } else {
                        console.log('[DEBUG] 扫描失败:', result.message);
                        throw new Error(result.message || '扫描失败');
                    }
                    
                } catch (error) {
                    console.error('SSH扫描失败:', error);
                    hideScanningStatus();
                    
                    // ✅ 新增：显示错误信息到 scanResult 区域
                    showScanError(error.message || '扫描过程中发生未知错误');
                    
                    showToast('❌ ' + error.message, 'error');
                } finally {
                    scanInProgress = false;
                }
            }

                steps.forEach((stepId, index) => {
                    setTimeout(() => {

            /**
             * 表格排序
             */
            function sortTable(header) {
                const table = document.getElementById('serverPreviewTable');
                const tbody = document.getElementById('serverPreviewTableBody');
                const rows = Array.from(tbody.querySelectorAll('tr'));
                const columnIndex = Array.from(header.parentElement.children).indexOf(header);
                
                // 确定排序方向
                const isAscending = header.classList.contains('sort-asc');
                
                // 清除所有排序标记
                header.parentElement.querySelectorAll('th').forEach(th => {
                    th.classList.remove('sort-asc', 'sort-desc');
                });
                
                // 添加新的排序标记
                if (isAscending) {
                    header.classList.add('sort-desc');
                } else {
                    header.classList.add('sort-asc');
                }
                
                // 排序行
                rows.sort((a, b) => {
                    const aText = a.children[columnIndex].textContent.trim();
                    const bText = b.children[columnIndex].textContent.trim();
                    
                    // 数字排序
                    const aNum = parseFloat(aText);
                    const bNum = parseFloat(bText);
                    if (!isNaN(aNum) && !isNaN(bNum)) {
                        return isAscending ? bNum - aNum : aNum - bNum;
                    }
                    
                    // 文本排序
                    return isAscending ? 
                        bText.localeCompare(aText) : 
                        aText.localeCompare(bText);
                });
                
                // 重新插入行
                rows.forEach(row => tbody.appendChild(row));
            }

            function getSelectedServers() {
                console.log('[DEBUG] getSelectedServers 被调用');
                const checkboxes = document.querySelectorAll('.server-checkbox:checked');

            /**
             * 转换为 ServerImportDto 格式
             */
            function convertToServerImportDto(tableRow) {
                try {
                    const hostData = JSON.parse(tableRow.dataset.hostData);
                    
                    // 从表格输入框获取用户编辑的值
                    const serverNameInput = tableRow.querySelector('.server-name-input');
                    const serverTypeSelect = tableRow.querySelector('.server-type-select');
                    const osTypeSelect = tableRow.querySelector('.server-os-select');  // ✅ 新增：获取操作系统选择框
                    const passwordInput = tableRow.querySelector('.server-password-input');  // ✅ 新增：获取密码输入框
                    
                    // ✅ 新增：优先使用用户输入的密码，其次使用原始数据中的密码
                    const password = passwordInput && passwordInput.value ? passwordInput.value : (hostData.password || null);
                    
                    return {
                        name: serverNameInput ? serverNameInput.value : hostData.hostname,
                        hostname: hostData.hostname,
                        sshPort: hostData.port || 22,
                        sshUsername: hostData.user,
                        sshPassword: password,  // ✅ 修改：使用收集的密码
                        sshKeyPath: hostData.identityFile || null,
                        serverType: serverTypeSelect ? serverTypeSelect.value : 'DEVELOPMENT',
                        osType: osTypeSelect ? osTypeSelect.value : 'LINUX',  // ✅ 新增：操作系统类型
                        description: hostData.description || `从 ${hostData.source} 导入`,
                        // 可选字段
                        baseWorkDirectory: null,  // 后端会自动生成
                        port: 8080  // 应用端口默认值
                    };
                } catch (error) {
                    console.error('转换数据格式失败:', error);
                    return null;
                }
            }
            
            /**
             * 批量导入选中的服务器
             */
            async function importSelectedServers(servers) {
                try {
                    // 显示导入进度
                    showImportProgress();
                    
                    // 调用批量导入 API
                    const response = await fetch('/api/ssh-config-import/batch', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(servers)
                    });
                    
                    const result = await response.json();
                    
                    // 隐藏进度
                    hideImportProgress();
                    
                    // 处理不同状态码
                    if (response.ok || response.status === 207) {
                        // 全部成功或部分成功 (207 Multi-Status)
                        showImportResult(result);
                    } else {
                        // 全部失败或请求错误
                        showImportError(result);
                    }
                    
                } catch (error) {
                    console.error('导入失败:', error);
                    hideImportProgress();
                    showToast('导入失败: ' + error.message, 'error');
                }
            }

            /**

             */
            function showImportResult(result) {
                // 显示结果容器
                const resultContainer = document.getElementById('importResultContainer');
                if (resultContainer) {
                    resultContainer.style.display = 'block';
                }
                
                // 更新成功统计
                const successCount = document.getElementById('successCount');
                if (successCount) {
                    successCount.textContent = result.successCount || 0;
                }
                
                // 更新标题和图标
                const summaryTitle = document.getElementById('summaryTitle');
                const summaryText = document.getElementById('summaryText');
                const summaryIcon = document.getElementById('summaryIcon');
                
                if (result.successCount === result.totalCount) {
                    // 全部成功
                    if (summaryTitle) summaryTitle.textContent = '导入成功！';
                    if (summaryIcon) summaryIcon.innerHTML = '<span class="icon-success">✓</span>';
                    if (summaryText) {
                        summaryText.innerHTML = `成功导入 <strong>${result.successCount}</strong> 台服务器`;
                    }
                } else if (result.successCount > 0) {
                    // 部分成功
                    if (summaryTitle) summaryTitle.textContent = '部分导入成功';
                    if (summaryIcon) summaryIcon.innerHTML = '<span class="icon-warning">⚠</span>';
                    if (summaryText) {
                        summaryText.innerHTML = `成功 <strong>${result.successCount}</strong> 台，失败 <strong>${result.failedCount}</strong> 台`;
                    }
                } else {
                    // 全部失败
                    if (summaryTitle) summaryTitle.textContent = '导入失败';
                    if (summaryIcon) summaryIcon.innerHTML = '<span class="icon-error">✗</span>';
                    if (summaryText) {
                        summaryText.innerHTML = `失败 <strong>${result.failedCount}</strong> 台`;
                    }
                }
                
                // 显示失败详情
                if (result.failedCount > 0 && result.failedList) {
                    const failureSection = document.getElementById('failureSection');
                    if (failureSection) {
                        failureSection.style.display = 'block';
                        
                        const failureTableBody = document.getElementById('failureTableBody');
                        if (failureTableBody) {
                            failureTableBody.innerHTML = '';
                            
                            result.failedList.forEach(failed => {
                                const row = document.createElement('tr');
                                row.innerHTML = `
                                    <td>${failed.serverName || failed.hostname}</td>
                                    <td>${failed.hostname}</td>
                                    <td class="text-danger">${failed.reason || failed.errorMessage || '未知错误'}</td>
                                `;
                                failureTableBody.appendChild(row);
                            });
                        }
                    }
                }
                
                // 显示成功列表
                if (result.successCount > 0 && result.successList) {
                    const successSection = document.getElementById('successSection');
                    if (successSection) {
                        successSection.style.display = 'block';
                        
                        const successGrid = document.getElementById('successServerGrid');
                        if (successGrid) {
                            successGrid.innerHTML = '';
                            
                            result.successList.forEach(success => {
                                const card = document.createElement('div');
                                card.className = 'server-card-success';
                                card.innerHTML = `
                                    <div class="server-card-icon">✓</div>
                                    <div class="server-card-name">${success.serverName}</div>
                                    <div class="server-card-host">${success.hostname}</div>
                                `;
                                successGrid.appendChild(card);
                            });
                        }
                    }
                }
                
                // 更新状态管理对象（统一控制按钮）
                wizardState.setImportResult(result);
                
                // 显示成功提示
                if (result.successCount > 0) {
                    showToast(`✓ 成功导入 ${result.successCount} 台服务器`, 'success');
                }
                
                // ✅ 新增：如果全部导入成功，2秒后自动关闭弹窗
                if (result.successCount === result.totalCount && result.successCount > 0) {
                    setTimeout(() => {
                        console.log('[DEBUG] 导入全部成功，自动关闭弹窗');
                        closeSSHConfigModal();

            /**
             * Toast 通知函数 (如果全局没有，则创建简单版本)
             */
            function showToast(message, type = 'info') {
                // 尝试使用全局 showToast
                if (window.showToast && typeof window.showToast === 'function') {
                    window.showToast(message, type);
                    return;
                }
                
                // 否则使用简单的 alert
                const icons = {
                    'success': '✓',
                    'error': '✗',
                    'warning': '⚠',
                    'info': 'ℹ'
                };
                alert(`${icons[type] || ''} ${message}`);
            }
            
            /**
             * 关闭SSH配置导入弹窗
             */
            function closeSSHConfigModal() {
                console.log('[DEBUG] 关闭SSH配置导入弹窗');
                const modal = document.getElementById('sshConfigImportModal');
                if (modal) {
                    modal.style.display = 'none';
                    console.log('[DEBUG] 弹窗已关闭');
                    
                    // 关闭后重置所有状态
                    resetModalState();
                }
            }
            
            /**
             * 重置弹窗内部所有状态
             */
            function resetModalState() {
                console.log('[DEBUG] 重置弹窗状态');
                
                // 1. 重置向导步骤和状态
                wizardState.reset();
                
                // 2. 重置扫描按钮状态
                const startScanBtn = document.getElementById('startScanBtn');
                if (startScanBtn) {
                    startScanBtn.disabled = false;
                    startScanBtn.classList.remove('is-scanning');
                    startScanBtn.innerHTML = '<span>🔍</span><span>开始自动扫描</span>';
                    startScanBtn.style.display = 'inline-flex';  // ✅ 确保按钮可见
                    console.log('[DEBUG] 扫描按钮已重置');
                }
                
                // 3. 清空扫描结果表格
                const scanResultBody = document.getElementById('scanResultBody');
                if (scanResultBody) {
                    scanResultBody.innerHTML = '';
                }
                
                // 4. 清空服务器预览表格
                const serverPreviewTableBody = document.getElementById('serverPreviewTableBody');
                if (serverPreviewTableBody) {
                    serverPreviewTableBody.innerHTML = '';
                }
                
                // 5. 隐藏扫描状态
                const scanningStatus = document.getElementById('scanningStatus');
                if (scanningStatus) {
                    scanningStatus.style.display = 'none';
                }
                
                // 6. 隐藏扫描结果容器
                const scanResultContainer = document.getElementById('scanResultContainer');
                if (scanResultContainer) {
                    scanResultContainer.style.display = 'none';
                }
                
                // 7. 重置进度条
                const progressFill = document.getElementById('progressFill');
                if (progressFill) {
                    progressFill.style.width = '0%';
                }
                
                // 8. 隐藏导入结果容器
                const importResultContainer = document.getElementById('importResultContainer');
                if (importResultContainer) {
                    importResultContainer.style.display = 'none';
                }
                
                // 9. 清空成功列表
                const successServerGrid = document.getElementById('successServerGrid');
                if (successServerGrid) {
                    successServerGrid.innerHTML = '';
                }
                
                // 10. 清空失败列表
                const failureTableBody = document.getElementById('failureTableBody');
                if (failureTableBody) {
                    failureTableBody.innerHTML = '';
                }
                
                // 11. 隐藏成功和失败区域
                const successSection = document.getElementById('successSection');
                const failureSection = document.getElementById('failureSection');
                if (successSection) successSection.style.display = 'none';
                if (failureSection) failureSection.style.display = 'none';
                
                // 12. 显示自动扫描标签页内容，隐藏其他步骤
                const autoScanTab = document.getElementById('auto-scan');
                const wizardStep2 = document.getElementById('wizardStep2');
                const wizardStep3 = document.getElementById('wizardStep3');
                
                if (autoScanTab) autoScanTab.style.display = 'block';
                if (wizardStep2) wizardStep2.style.display = 'none';
                if (wizardStep3) wizardStep3.style.display = 'none';
                
                // 13. ✅ 新增：调用 updateUI() 确保按钮状态与步骤一致
                if (typeof wizardState !== 'undefined' && wizardState.updateUI) {
                    console.log('[DEBUG] 调用 wizardState.updateUI() 更新按钮显示');
                    wizardState.updateUI();
                }
                
                console.log('[DEBUG] 弹窗状态重置完成');
            }
            
            /**
             * 页面加载后初始化
             */
            
            // ========================================
            // 向导状态管理系统
            // ========================================
            
            /**
             * 向导步骤枚举
             */
            const WizardStep = {
                SCAN: 'scan',           // 步骤1: 扫描配置
                PREVIEW: 'preview',     // 步骤2: 预览服务器列表
                IMPORT: 'import'        // 步骤3: 导入进度/结果
            };
            
            /**
             * 向导状态对象
             */
            const wizardState = {
                currentStep: WizardStep.SCAN,
                scanData: null,              // 扫描结果数据
                selectedServers: [],         // 选中的服务器
                importResult: null,          // 导入结果
                hasScanned: false,           // 是否已完成首次扫描
                
                /**
                 * 重置状态
                 */
                reset: function() {
                    this.currentStep = WizardStep.SCAN;
                    this.scanData = null;
                    this.selectedServers = [];
                    this.importResult = null;
                    this.hasScanned = false;
                    console.log('[STATE] 向导状态已重置');
                },
                
                /**
                 * 设置当前步骤
                 */
                setStep: function(step) {
                    console.log(`[STATE] 步骤切换: ${this.currentStep} → ${step}`);
                    this.currentStep = step;
                    this.updateUI();
                },
                
                /**
                 * 更新UI状态（按钮显示/禁用）
                 */
                updateUI: function() {
                    console.log(`[STATE] 更新UI，当前步骤: ${this.currentStep}`);
                    
                    const prevBtn = document.getElementById('wizardPrevBtn');
                    const nextBtn = document.getElementById('wizardNextBtn');
                    const cancelBtn = document.getElementById('wizardCancelBtn');
                    const scanBtn = document.getElementById('startScanBtn');
                    
                    // 根据当前步骤更新按钮状态
                    switch (this.currentStep) {
                        case WizardStep.SCAN:
                            // 步骤1: 扫描页
                            this.updateButton(prevBtn, { visible: false, disabled: true });
                            this.updateButton(nextBtn, { visible: true, disabled: true, text: '下一步 →' });
                            this.updateButton(cancelBtn, { visible: true, disabled: false });
                            // 开始扫描按钮：只在首次扫描时显示
                            if (scanBtn) {
                                scanBtn.style.display = this.hasScanned ? 'none' : 'inline-flex';
                            }
                            console.log('[STATE] Step1按钮: Prev(隐藏) Next(禁用) Cancel(启用) Scan(' + (this.hasScanned ? '隐藏' : '显示') + ')');
                            break;
                            
                        case WizardStep.PREVIEW:
                            // 步骤2: 预览页
                            this.updateButton(prevBtn, { visible: true, disabled: false, text: '← 上一步' });
                            this.updateButton(nextBtn, { 
                                visible: true, 
                                disabled: this.selectedServers.length === 0, 
                                text: '下一步 →' 
                            });
                            this.updateButton(cancelBtn, { visible: true, disabled: false });
                            // 预览页隐藏扫描按钮
                            if (scanBtn) {
                                scanBtn.style.display = 'none';
                            }
                            console.log('[STATE] Step2按钮: Prev(启用) Next(根据选择) Cancel(启用) Scan(隐藏)');
                            break;
                            
                        case WizardStep.IMPORT:
                            // 步骤3: 导入中或导入完成
                            const isImporting = this.importResult === null;
                            this.updateButton(prevBtn, { 
                                visible: !isImporting,  // 导入中隐藏，完成后显示
                                disabled: isImporting,
                                text: '← 上一步' 
                            });
                            this.updateButton(nextBtn, { visible: false, disabled: true });
                            this.updateButton(cancelBtn, { visible: true, disabled: isImporting });
                            // 导入页隐藏扫描按钮
                            if (scanBtn) {
                                scanBtn.style.display = 'none';
                            }
                            console.log(`[STATE] Step3按钮: Prev(${isImporting ? '隐藏' : '显示'}) Next(隐藏) Cancel(${isImporting ? '禁用' : '启用'}) Scan(隐藏)`);
                            break;
                    }
                },
                
                /**
                 * 更新单个按钮状态
                 */
                updateButton: function(btn, options) {
                    if (!btn) return;
                    
                    if (options.visible !== undefined) {
                        btn.style.display = options.visible ? 'inline-flex' : 'none';
                    }
                    if (options.disabled !== undefined) {
                        btn.disabled = options.disabled;
                    }
                    if (options.text !== undefined) {
                        btn.innerHTML = `<span>${options.text}</span>`;
                    }
                },
                
                /**
                 * 更新选中的服务器数量
                 */
                updateSelectedServers: function(servers) {
                    this.selectedServers = servers || [];
                    console.log(`[STATE] 选中服务器数量: ${this.selectedServers.length}`);
                    
                    // 如果当前在预览步骤，更新下一步按钮状态
                    if (this.currentStep === WizardStep.PREVIEW) {
                        const nextBtn = document.getElementById('wizardNextBtn');
                        if (nextBtn) {
                            nextBtn.disabled = this.selectedServers.length === 0;
                            console.log(`[STATE] 下一步按钮状态: ${nextBtn.disabled ? '禁用' : '启用'}`);
                        }
                    }
                },
                
                /**
                 * 设置导入结果（导入完成后调用）
                 */
                setImportResult: function(result) {
                    this.importResult = result;
                    console.log('[STATE] 导入结果已设置:', result);
                    this.updateUI();  // 重新更新UI，显示上一步按钮
                }
            };
            
            /**
             * 初始化
             */
            function init() {
                console.log('[DEBUG] SSH扫描模块 init() 被调用');
                
                // 使用事件委托，在 document 上监听点击
                document.addEventListener('click', function(e) {
                    // 处理 wizardPrevBtn 点击（使用事件委托）
                    if (e.target.id === 'wizardPrevBtn' || e.target.closest('#wizardPrevBtn')) {
                        console.log('[DEBUG] ========== 全局捕获到 wizardPrevBtn 点击！==========');
                        const btn = document.getElementById('wizardPrevBtn');
                        console.log('[DEBUG] 按钮状态:', { display: btn.style.display, disabled: btn.disabled });
                        
                        if (btn.style.display !== 'none' && !btn.disabled) {
                            e.preventDefault();
                            e.stopPropagation();
                            
                            // 判断当前在哪个步骤
                            const wizardStep2 = document.getElementById('wizardStep2');
                            const wizardStep3 = document.getElementById('wizardStep3');
                            
                            const isOnStep2 = wizardStep2 && window.getComputedStyle(wizardStep2).display !== 'none';
                            const isOnStep3 = wizardStep3 && window.getComputedStyle(wizardStep3).display !== 'none';
                            
                            console.log('[DEBUG] 当前步骤:', { isOnStep2, isOnStep3 });
                            
                            if (isOnStep3) {
                                // 从导入结果页返回到预览页（保留数据）
                                console.log('[DEBUG] 从Step3返回到Step2，调用 switchBackToPreviewStep');
                                switchBackToPreviewStep();
                            } else if (isOnStep2) {
                                // 从预览页返回到扫描页
                                console.log('[DEBUG] 从Step2返回到Step1，调用 switchBackToScanStep');
                                switchBackToScanStep();
                            }
                            return;
                        } else {
                            console.log('[DEBUG] 上一步按钮不可用，忽略点击');
                        }
                    }
                    
                    // 处理 wizardNextBtn 点击（使用事件委托）
                    if (e.target.id === 'wizardNextBtn' || e.target.closest('#wizardNextBtn')) {
                        console.log('[DEBUG] ========== 全局捕获到 wizardNextBtn 点击！==========');
                        const btn = document.getElementById('wizardNextBtn');
                        console.log('[DEBUG] 按钮状态:', { disabled: btn.disabled, innerHTML: btn.innerHTML.substring(0, 50) });
                        
                        if (!btn.disabled) {
                            console.log('[DEBUG] 通过事件委托直接调用 handleWizardNextClick');
                            e.preventDefault();
                            e.stopPropagation();
                            
                            // 创建一个伪事件对象传递给处理函数
                            const syntheticEvent = {
                                ...e,
                                currentTarget: btn,
                                preventDefault: () => e.preventDefault(),
                                stopPropagation: () => e.stopPropagation()
                            };
                            handleWizardNextClick(syntheticEvent);
                            return;
                        } else {
                            console.log('[DEBUG] 按钮被禁用，忽略点击');
                        }
                    }
                    
                    // 检查是否点击了扫描按钮
                    if (e.target.id === 'startScanBtn' || e.target.closest('#startScanBtn')) {
                        console.log('[DEBUG] ========== 通过事件委托捕获到扫描按钮点击！==========');
                        e.preventDefault();
                        e.stopPropagation();
                        handleStartScan();
                        return;
                    }
                    
                    // ✅ 新增：检查是否点击了关闭弹窗按钮
                    const closeBtn = e.target.closest('[data-action="ssh-config-modal-close"]');
                    if (closeBtn) {
                        console.log('[DEBUG] 检测到关闭SSH配置导入弹窗按钮点击');
                        e.preventDefault();
                        e.stopPropagation();
                        closeSSHConfigModal();
                        return;
                    }
                    
                    // ✅ 新增：点击弹窗背景遮罩层也关闭弹窗
                    if (e.target.id === 'sshConfigImportModal' && e.target.classList.contains('ssh-config-wizard-overlay')) {
                        console.log('[DEBUG] 检测到点击弹窗背景遮罩层');
                        closeSSHConfigModal();
                        return;
                    }
                    
                    // 检测打开模态框的点击
                    const importTrigger = e.target.closest('[data-action="open-import-modal"]');
                    if (importTrigger) {
                        console.log('[DEBUG] 检测到打开导入模态框的点击');
                        setTimeout(() => {
                            console.log('[DEBUG] 模态框打开后重新初始化按钮');
                            initSSHScanButton();
                            initWizardNextButton();  // 重新初始化下一步按钮
                            initWizardPrevButton();  // 重新初始化上一步按钮
                        }, 300);  // 增加延迟到 300ms
                    }
                });
                
                // ✅ 新增：ESC键关闭弹窗
                document.addEventListener('keydown', function(e) {
                    if (e.key === 'Escape') {
                        const modal = document.getElementById('sshConfigImportModal');
                        if (modal && modal.style.display !== 'none') {
                            console.log('[DEBUG] ESC键关闭弹窗');
                            closeSSHConfigModal();
                        }
                    }
                });
                
                // 延迟初始化，确保DOM完全加载
                setTimeout(() => {
                    console.log('[DEBUG] 开始初始化扫描和按钮功能');
                    initSSHScanButton();
                    initWizardNextButton();  // 初始化下一步按钮
                    initWizardPrevButton();  // 初始化上一步按钮
                    console.log('[DEBUG] 初始化完成');
                    
                    // 设置 MutationObserver 监听模态框的显示
                    setupModalObserver();
                }, 500);
            }
            
            /**
             * 设置 MutationObserver 监听模态框显示状态
             */
            function setupModalObserver() {
                const modal = document.getElementById('sshConfigImportModal');
                if (!modal) {
                    console.log('[DEBUG] 未找到 sshConfigImportModal');
                    return;
                }
                
                console.log('[DEBUG] 设置模态框观察器');
                const observer = new MutationObserver((mutations) => {
                    mutations.forEach((mutation) => {
                        if (mutation.type === 'attributes' && mutation.attributeName === 'style') {
                            const isVisible = modal.style.display !== 'none' && 
                                            window.getComputedStyle(modal).display !== 'none';
                            if (isVisible) {
                                console.log('[DEBUG] 模态框变为可见，重新初始化按钮');
                                setTimeout(() => {
                                    initSSHScanButton();
                                    initWizardNextButton();
                                    initWizardPrevButton();
                                    // 诊断表格状态
                                    diagnoseTableState();
                                }, 100);
                            }
                        }
                    });
                });
                
                observer.observe(modal, {
                    attributes: true,
                    attributeFilter: ['style', 'class']
                });
            }
            
            /**
             * 诊断表格状态（用于调试checkbox不显示问题）
             */
            function diagnoseTableState() {
                console.log('=== 表格诊断开始 ===');
                const tbody = document.getElementById('serverPreviewTableBody');
                if (!tbody) {
                    console.error('[DIAG] 找不到 serverPreviewTableBody');
                    return;
                }
                
                const rows = tbody.querySelectorAll('tr');
                console.log('[DIAG] 表格行数:', rows.length);
                
                rows.forEach((row, index) => {
                    const checkboxTd = row.querySelector('.col-checkbox');
                    const checkbox = row.querySelector('input[type="checkbox"]');
                    console.log(`[DIAG] 行${index}:`, {
                        'col-checkbox存在': !!checkboxTd,
                        'checkbox存在': !!checkbox,
                        'checkboxTd HTML': checkboxTd ? checkboxTd.outerHTML.substring(0, 100) : 'null',
                        'checkbox computed display': checkbox ? window.getComputedStyle(checkbox).display : 'null',
                        'checkbox computed visibility': checkbox ? window.getComputedStyle(checkbox).visibility : 'null',
                        'checkbox computed opacity': checkbox ? window.getComputedStyle(checkbox).opacity : 'null',
                        'checkbox computed color': checkbox ? window.getComputedStyle(checkbox).color : 'null',
                        'checkbox computed backgroundColor': checkbox ? window.getComputedStyle(checkbox).backgroundColor : 'null',
                        'checkbox computed border': checkbox ? window.getComputedStyle(checkbox).border : 'null',
                        'checkbox computed zIndex': checkbox ? window.getComputedStyle(checkbox).zIndex : 'null',
                        'checkbox offsetWidth': checkbox ? checkbox.offsetWidth : 'null',
                        'checkbox offsetHeight': checkbox ? checkbox.offsetHeight : 'null',
                        'checkbox getBoundingClientRect': checkbox ? checkbox.getBoundingClientRect() : 'null'
                    });
                });
                
                console.log('=== 表格诊断结束 ===');
            }
            
            // 在切换到预览步骤时也诊断
            const originalSwitchToPreview = switchToPreviewStep;
            switchToPreviewStep = function() {
                originalSwitchToPreview.apply(this, arguments);
                setTimeout(diagnoseTableState, 200);
            };
            
            // 初始化
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
            
        })();
        </script>

        <!-- Inline compact spinner styles (small & lively, non-intrusive) -->
        <style>
        /* Compact bouncing dots spinner used inside the scan button */
        .spinner {
            display: inline-block;
            width: 18px;
            height: 6px;
            position: relative;
            margin-right: 8px;
            vertical-align: middle;
        }
        .spinner::before, .spinner::after {
            content: '';
            position: absolute;
            top: 0;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: linear-gradient(90deg,#4f46e5,#06b6d4);
            transform-origin: center;
            animation: bounce 900ms infinite ease-in-out;
            box-shadow: 0 1px 0 rgba(0,0,0,0.05);
        }
        .spinner::before { left: 0; animation-delay: 0ms; }
        .spinner { background: transparent; }
        .spinner span { display:none }
        .spinner::after { right: 0; animation-delay: 300ms; }

        @keyframes bounce {
            0% { transform: translateY(0) scale(0.9); opacity:0.9 }
            50% { transform: translateY(-6px) scale(1.05); opacity:1 }
            100% { transform: translateY(0) scale(0.95); opacity:0.9 }
        }

        /* Scan status heading layout */
        .scan-status-heading {
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            margin-bottom: 16px;
            color: #667eea;
            font-weight: 500;
            font-size: 14px;
        }

        .scan-status-text {
            display: inline-block;
        }

        .scan-spinner-lite {
            display: inline-block;
            width: 20px;
            height: 20px;
            margin-right: 10px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.45);
            border-top-color: #ffffff;
            border-right-color: rgba(59, 130, 246, 0.9);
            animation: scanRotate 0.8s linear infinite;
            vertical-align: middle;
            box-shadow: 0 0 6px rgba(59, 130, 246, 0.35);
        }

        .scan-btn-text {
            display: inline-block;
            vertical-align: middle;
        }

        @keyframes scanRotate {
            to { transform: rotate(360deg); }
        }

        #startScanBtn[disabled],
        #startScanBtn.is-scanning {
            opacity: 0.95;
            cursor: progress;
        }

        /* Small subtle ripple displayed in scan-status area */
        .scan-ripple {
            display: none;
            width: 44px; height: 44px; border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(79,70,229,0.22), transparent 40%);
            box-shadow: 0 6px 20px rgba(79,70,229,0.06);
            animation: ripple 1400ms infinite linear;
            margin: 6px auto;
        }
        @keyframes ripple {
            0% { transform: scale(0.9); opacity: 1 }
            70% { transform: scale(1.6); opacity: 0.35 }
            100% { transform: scale(1.8); opacity: 0 }
        }
        </style>

        <!-- Include SSH Config Import Wizard Modal -->
        <div th:replace="~{fragments/ssh-config-import-wizard :: ssh-config-import-wizard}"></div>
</body>
