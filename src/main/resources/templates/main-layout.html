<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/springsecurity" class="theme-light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- CSRF Meta Tags -->
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>

    <!-- 更强的防闪烁策略 - 立即执行 -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.documentElement.classList.remove('theme-light');
                document.documentElement.classList.add('theme-dark');
                document.documentElement.style.setProperty('--background-color', '#121212');
                document.documentElement.style.setProperty('--background-light', '#1e1e1e');
                document.documentElement.style.setProperty('--text-color', '#e0e0e0');
                // 监听body可用时立即应用
                function applyToBody() {
                    if (document.body) {
                        document.body.classList.add('dark-theme');
                    } else {
                        setTimeout(applyToBody, 1);
                    }
                }
                applyToBody();
            }
        })();
    </script>

    <style>
        /* 预设暗色主题样式避免闪烁 */
        .theme-dark {
            background-color: #121212 !important;
            color: #e0e0e0 !important;
        }
        .theme-dark * {
            transition: none !important;
        }

<body>

    <!-- 保留原有的SPA JavaScript逻辑 -->
    <script th:inline="javascript">
        // 全局变量
        let currentPage = '';
        let isLoading = false;

        // 传递服务器端数据到客户端
        const username = /*[[${username}]]*/ 'guest';
        const isAdmin = /*[[${isAdmin}]]*/ false;
        const userRole = /*[[${userRole}]]*/ 'DEVELOPER';

        // 传递管理员数据（如果存在）
        const adminData = /*[[${adminData != null ? adminData : null}]]*/ null;

    </script>

    <!-- 现代化导航JavaScript控制器 -->
    <script src="/js/modern-navigation.js"></script>

    <!-- 原有SPA功能脚本的完整复制将在这里 -->
    <script>
    // 注意：全局变量已在上面的Thymeleaf内联脚本中声明

    // 🎨 初始化现代化设计系统
    function initModernDesignSystem() {
        // 初始化侧边栏
        initModernSidebar();

        // 初始化用户菜单
        initModernUserMenu();

        // 初始化搜索功能
        initModernSearch();

        // 初始化主题切换
        initModernTheme();
    }

    // 现代化侧边栏功能
    function initModernSidebar() {
        if (window.modernNavController) {
            return;
        }

        const sidebar = document.getElementById('modernSidebar');
        const toggleBtn = document.getElementById('sidebarToggle');
        const mobileToggle = document.getElementById('navMobileToggle');
        const mainContent = document.getElementById('mainContent');
        const overlay = document.getElementById('sidebarOverlay');

        // 桌面端侧边栏折叠
        if (toggleBtn) {
            toggleBtn.addEventListener('click', function() {
                sidebar?.classList.toggle('collapsed');
                mainContent?.classList.toggle('sidebar-collapsed');
                localStorage.setItem('sidebarCollapsed', sidebar?.classList.contains('collapsed'));
            });
        }

        // 移动端侧边栏开关
        if (mobileToggle) {
            mobileToggle.addEventListener('click', function() {
                sidebar?.classList.toggle('mobile-open');
                document.body.classList.toggle('sidebar-mobile-open');
            });
        }

        // 点击覆盖层关闭侧边栏
        if (overlay) {
            overlay.addEventListener('click', function() {
                sidebar?.classList.remove('mobile-open');
                document.body.classList.remove('sidebar-mobile-open');
            });
        }

        // ESC键关闭移动端侧边栏
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && sidebar?.classList.contains('mobile-open')) {
                sidebar.classList.remove('mobile-open');
                document.body.classList.remove('sidebar-mobile-open');
            }
        });

        // 恢复侧边栏状态（仅桌面端）
        if (window.innerWidth > 768 && localStorage.getItem('sidebarCollapsed') === 'true') {
            sidebar?.classList.add('collapsed');
            mainContent?.classList.add('sidebar-collapsed');
        }

        // 监听窗口大小变化
        window.addEventListener('resize', function() {
            if (window.innerWidth > 768) {
                // 桌面端：移除移动端类，恢复折叠状态
                sidebar?.classList.remove('mobile-open');
                document.body.classList.remove('sidebar-mobile-open');

                if (localStorage.getItem('sidebarCollapsed') === 'true') {
                    sidebar?.classList.add('collapsed');
                    mainContent?.classList.add('sidebar-collapsed');
                }
            } else {
                // 移动端：移除桌面端类
                sidebar?.classList.remove('collapsed');
                mainContent?.classList.remove('sidebar-collapsed');
            }
        });
    }

    // 现代化用户菜单功能
    function initModernUserMenu() {
        const userTrigger = document.getElementById('navUserTrigger');
        const userDropdown = document.getElementById('navUserDropdown');

        if (userTrigger && userDropdown) {
            userTrigger.addEventListener('click', function(e) {
                e.stopPropagation();
                userDropdown.classList.toggle('show');
            });

            document.addEventListener('click', function() {
                userDropdown.classList.remove('show');
            });
        }
    }

    // 现代化搜索功能
    function initModernSearch() {
        const searchInput = document.querySelector('.search-input');
        const searchBtn = document.querySelector('.search-button');

        if (searchInput && searchBtn) {
            searchInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    performModernSearch(this.value);
                }
            });

            searchBtn.addEventListener('click', function() {
                performModernSearch(searchInput.value);
            });
        }
    }

    function performModernSearch(query) {
        if (!query.trim()) return;

        console.log('搜索:', query);
        // 可以跳转到相应页面或显示搜索结果
        // window.location.href = `/search?q=${encodeURIComponent(query)}`;
    }

    // 现代化主题切换
    function initModernTheme() {
        // 主题切换逻辑已存在，确保兼容
        window.toggleTheme = function() {
            const html = document.documentElement;
            const body = document.body;

            if (html.classList.contains('theme-dark')) {
                html.classList.remove('theme-dark');
                html.classList.add('theme-light');
                body.classList.remove('dark-theme');
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.remove('theme-light');
                html.classList.add('theme-dark');
                body.classList.add('dark-theme');
                localStorage.setItem('theme', 'dark');
            }
        };
    }

    // CSRF Token Helper Functions
    function getCSRFToken() {
        const csrfToken = document.querySelector('meta[name="_csrf"]');
        return csrfToken ? csrfToken.getAttribute('content') : null;
    }
    
    function getCSRFHeaderName() {
        const csrfHeader = document.querySelector('meta[name="_csrf_header"]');
        return csrfHeader ? csrfHeader.getAttribute('content') : 'X-CSRF-TOKEN';
    }

    // 全局AJAX错误处理器，用于处理会话超时
    function handleAjaxError(response) {
        if (response.status === 401) {
            // 检查是否是JSON响应
            const contentType = response.headers.get('content-type');
            if (contentType && contentType.includes('application/json')) {
                return response.json().then(errorData => {
                    if (errorData.error === 'session_expired') {
                        window.location.href = errorData.redirect || '/login?expired';
                        return Promise.reject(new Error('Session expired'));
                    }
                    return Promise.reject(new Error('Unauthorized'));
                });
            } else {
                // 非JSON响应，可能是登录页面HTML
                window.location.href = '/login?expired';
                return Promise.reject(new Error('Session expired'));
            }
        }
        return response;
    }

    // 根据当前URL获取页面名称
    function getCurrentPageFromUrl() {
        const hash = window.location.hash.substring(1); // 移除 # 号
        const pathname = window.location.pathname;
        
        // 检查hash是否存在且有效
        if (hash) {
            const validPages = ['dashboard', 'servers', 'users', 'applications', 'monitoring', 'terminal'];
            if (validPages.includes(hash)) {
                //('从hash获取页面:', hash);
                return hash;
            }
        }
        
        // 根据pathname推断页面
        if (pathname.includes('/admin/workspace') || pathname === '/admin/workspace') {
            return 'dashboard';
        } else if (pathname.includes('/admin/servers')) {
            return 'servers';
        } else if (pathname.includes('/admin/users')) {
            return 'users';
        } else if (pathname.includes('/apps')) {
            return 'applications';
        } else if (pathname.includes('/monitoring')) {
            return 'monitoring';
        } else if (pathname.includes('/terminal')) {
            return 'terminal';
        }
        
        // 默认返回dashboard
        return 'dashboard';
    }

    // 页面加载完成后初始化
    document.addEventListener('DOMContentLoaded', function() {
        try {
            // 初始化新设计系统
            initModernDesignSystem();

            // 获取当前页面并加载对应内容
            const currentPageName = getCurrentPageFromUrl();
            //('页面初始化，当前页面:', currentPageName);

            // 加载当前页面内容（首次加载保持当前视图）
            loadContent(currentPageName, false);
        } catch (error) {
            console.error('Error calling loadContent:', error);
            // 如果出错，回退到默认页面
            loadContent('dashboard', false);
        }

        // 初始化移动端菜单
        initMobileMenu();

        // 初始化侧边栏收起展开功能
        if (!window.modernNavController) {
            initSidebarToggle();
        }

        // 全局测试函数
        window.testToggle = function() {
            if (window.modernNavController) {
                window.modernNavController.toggle();
            } else {
                toggleSidebar();
            }
        };

        // 绑定侧边栏切换事件（无控制器时的后备逻辑）
        const toggleButton = document.getElementById('sidebarToggle');
        if (toggleButton && !window.modernNavController) {
            toggleButton.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                toggleSidebar();
            });
        } else if (!toggleButton) {
            console.error('未找到侧边栏切换按钮');
        }

        // 初始化抽屉管理器
        try {
            window.drawerManager = new DrawerManager();
        } catch (error) {
            console.error('❌ DrawerManager 初始化失败:', error);
        }
        
        // 监听浏览器后退/前进按钮
        window.addEventListener('popstate', function(e) {
            if (e.state && e.state.page) {
                loadContent(e.state.page, false);
            }
        });
        
        // 设置初始状态为当前页面
        const currentPageName = getCurrentPageFromUrl();
        history.replaceState({ page: currentPageName }, '', `#${currentPageName}`);
    });

    // 核心内容加载函数 (全局可访问)
    //console.log('🔧 正在定义window.loadContent函数...');
    window.loadContent = async function loadContent(page, addToHistory = true) {
        if (isLoading || page === currentPage) {
            return;
        }

        isLoading = true;

        try {
            // 更新菜单激活状态
            updateActiveMenu(page);

            // 根据页面类型决定加载方式
            let content;
            switch (page) {
                case 'dashboard':
                    content = await loadDashboardContent();
                    break;
                case 'servers':
                    content = await loadServersContent();
                    // 加载完服务器内容后，绑定事件处理器并加载状态标签
                    setTimeout(() => {
                        // 绑定服务器事件处理器
                        bindServerEvents();

                        // 初始化服务器名称滚动效果
                        initServerNameScrolling();

                        // 加载服务器状态标签
                        if (serverStatusManager) {
                            serverStatusManager.loadAllServerStatus();
                        } else {
                            // 如果状态管理器还未初始化，使用备用方法
                            const serverCards = document.querySelectorAll('[data-server-id]');
                            serverCards.forEach(card => {
                                const serverId = card.getAttribute('data-server-id');
                                if (serverId) {
                                    loadServerStatusTagsFallback(serverId);
                                }
                            });
                        }
                    }, 100);
                    break;
                case 'users':
                    content = await loadUsersContent();
                    // 加载完用户内容后，绑定事件处理器并执行页面初始化
                    setTimeout(() => {
                        bindContentEvents();
                        initUsersContent();
                    }, 100);
                    break;
                case 'applications':
                    content = await loadApplicationsContent();
                    // 加载完应用内容后，绑定事件处理器
                    setTimeout(() => {
                        bindContentEvents();
                    }, 100);
                    break;
                case 'monitoring':
                    content = await loadMonitoringContent();
                    break;
                case 'terminal':
                    content = await loadTerminalContent();
                    break;
                default:
                    content = '<p>页面不存在</p>';
            }

            // 更新内容
            updateContent(content);

            // 更新浏览器历史
            if (addToHistory) {
                history.pushState({ page: page }, '', '#' + page);
            }

            currentPage = page;
        } catch (error) {
            console.error('加载内容失败:', error);

            // 检查是否是会话过期错误
            if (error.message && error.message.includes('401') && error.sessionExpired) {
                // 会话过期，重定向到登录页面
                window.location.href = '/login?expired';
                return;
            } else if (error.message && error.message.includes('401')) {
                // 可能是会话过期，检查响应内容
                window.location.href = '/login?expired';
                return;
            }

            updateContent('<div class="alert alert-danger"><i class="fas fa-exclamation-triangle"></i> 加载失败: ' + error.message + '</div>');
        } finally {
            isLoading = false;
        }
    }
    //('✅ window.loadContent函数定义完成，立即验证:', typeof window.loadContent);


    // 更新内容
    function updateContent(content) {
        //console.log('🔄 updateContent called with content length:', content ? content.length : 0);
        const wrapper = document.getElementById('contentWrapper');
        if (!wrapper) {
            console.error('❌ contentWrapper element not found!');
            //console.log('Available elements:', document.querySelectorAll('[id]'));
            return;
        }
        //console.log('✅ contentWrapper found, updating content...');
        wrapper.innerHTML = content;
        wrapper.classList.add('content-fade-in');
        
        // 执行新加载内容中的JavaScript
        executeScriptsInElement(wrapper);
        
        // 移除动画类，为下次使用准备
        setTimeout(() => {
            wrapper.classList.remove('content-fade-in');
        }, 300);
    }
    
    // 执行元素中的JavaScript代码
    function executeScriptsInElement(element) {
        const scripts = element.querySelectorAll('script');
        scripts.forEach(script => {
            if (script.src) {
                // 外部脚本，创建新的script标签
                const newScript = document.createElement('script');
                newScript.src = script.src;
                document.head.appendChild(newScript);
            } else {
                // 内联脚本，直接执行
                try {
                    eval(script.innerHTML);
                } catch (error) {
                    console.error('执行脚本出错:', error);
                }
            }
        });
    }

    // 更新菜单激活状态 - 兼容现代导航栏
    function updateActiveMenu(page) {
        // 移除所有激活状态 - 兼容新旧导航栏
        document.querySelectorAll('.nav-item, .modern-nav-link').forEach(item => {
            item.classList.remove('active');
        });
        
        // 设置当前页面为激活状态
        const currentItem = document.querySelector(`[data-page="${page}"]`);
        if (currentItem) {
            // 新的现代导航栏结构
            if (currentItem.classList.contains('modern-nav-link')) {
                currentItem.classList.add('active');
            } 
            // 旧的导航栏结构（向后兼容）
            else {
                const navItem = currentItem.closest('.nav-item');
                if (navItem) {
                    navItem.classList.add('active');
                }
            }
        }
    }
    
    // 全局下拉菜单函数
    function toggleDropdown(button) {
        const dropdown = button.nextElementSibling;
        const isOpen = dropdown.classList.contains('show');
        
        // 关闭所有其他下拉菜单
        document.querySelectorAll('.dropdown-menu.show').forEach(menu => {
            menu.classList.remove('show');
        });
        
        if (!isOpen) {
            dropdown.classList.add('show');
        }
    }
    
    // 点击外部关闭下拉菜单
    document.addEventListener('click', function(event) {
        if (!event.target.closest('.server-actions-dropdown')) {
            document.querySelectorAll('.dropdown-menu.show').forEach(menu => {
                menu.classList.remove('show');
            });
        }
    });
    
    // 全局服务器操作函数
    function toggleServerMetrics(element) {
        const serverId = element.getAttribute('data-id');
        const card = element.closest('.modern-server-card');
        const metricsContent = card.querySelector('.metrics-content');
        const toggleIcon = element.querySelector('i');
        const isHidden = metricsContent.style.display === 'none';
        
        if (isHidden) {
            metricsContent.style.display = 'block';
            toggleIcon.className = 'fas fa-chevron-up';
            // 加载监控数据
            fetchServerMetrics(serverId);
        } else {
            metricsContent.style.display = 'none';
            toggleIcon.className = 'fas fa-chevron-down';
        }
    }
    
    function openTerminal(element) {
        const serverId = element.getAttribute('data-id');
        window.open('/terminal/manager?serverId=' + serverId, '_blank');
    }
    
    function viewServer(element) {
        const serverId = element.getAttribute('data-id');
        const serverName = element.getAttribute('data-server-name') || '未知服务器';
        
        // 调用新的系统风格服务器详情模态框
        showSystemServerDetailModal(serverId, serverName);
    }
    
    function viewLogs(element) {
        const serverId = element.getAttribute('data-id');
        window.location.href = '/admin/servers/' + serverId + '/logs';
    }
    
    // 服务器日志弹窗相关函数
    function showServerLogsModal(serverId, serverName) {
        // 创建弹窗HTML
        const modalHtml = createServerLogsModalHtml(serverId, serverName);
        
        // 移除已存在的弹窗
        const existingModal = document.getElementById('serverLogsModal');
        if (existingModal) {
            existingModal.remove();
        }
        
        // 添加弹窗到页面
        document.body.insertAdjacentHTML('beforeend', modalHtml);
        
        // 显示弹窗
        setTimeout(() => {
            const modal = document.getElementById('serverLogsModal');
            modal.classList.add('show');
            
            // 加载日志数据
            loadServerLogsData(serverId);
            
            // 绑定弹窗内部事件
            bindServerLogsModalEvents();
        }, 50);
    }
    
    function hideServerLogsModal() {
        const modal = document.getElementById('serverLogsModal');
        if (modal) {
            modal.classList.remove('show');
            setTimeout(() => {
                modal.remove();
            }, 300);
        }
    }
    
    function createServerLogsModalHtml(serverId, serverName) {
        return `
            <div class="logs-modal-overlay" id="serverLogsModal">
                <div class="logs-modal">
                    <!-- 弹窗头部 -->
                    <div class="logs-modal-header">
                        <div class="server-info-header">
                            <div class="server-status-indicator online"></div>
                            <h2 class="server-name-title">${serverName || 'Server-' + serverId}</h2>
                        </div>
                        
                        <div class="time-range-selector">
                            <button class="time-range-btn active" data-range="1day">最近1天</button>
                            <button class="time-range-btn" data-range="7days">最近7天</button>
                            <button class="time-range-btn" data-range="30days">最近30天</button>
                        </div>
                        
                        <button class="modal-close-btn" onclick="hideServerLogsModal()">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>

                    <!-- 弹窗主体 -->
                    <div class="logs-modal-body">
                        <!-- 左侧时间轴 -->
                        <div class="timeline-panel">
                            <div class="timeline-header">
                                <h3 class="timeline-title">
                                    <i class="fas fa-clock"></i>
                                    用户操作时间轴
                                </h3>
                                <div class="activity-summary">
                                    <div class="summary-item">
                                        今日操作: <span class="summary-value">127次</span>
                                    </div>
                                    <div class="summary-item">
                                        活跃用户: <span class="summary-value">8人</span>
                                    </div>
                                    <div class="summary-item">
                                        错误次数: <span class="summary-value">3次</span>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="timeline-content" id="timelineContent">

    function renderTimelineData(data) {
        const container = document.getElementById('timelineContent');
        
        // 按日期分组
        const groupedData = {};
        data.forEach(log => {
            const date = log.timestamp.split(' ')[0];
            if (!groupedData[date]) {
                groupedData[date] = [];
            }
            groupedData[date].push(log);
        });

        let html = '';
        Object.keys(groupedData).forEach(date => {
            const logs = groupedData[date];
            const today = new Date().toISOString().split('T')[0];
            const dateLabel = date === today ? '今天 ' + date : date;

            html += `
                <div class="date-group">
                    <div class="date-header">
                        <i class="fas fa-calendar-day"></i>
                        ${dateLabel}
                        <span class="date-stats">${logs.length} 次操作</span>
                    </div>
                    <div class="timeline-items">
            `;

            logs.forEach(log => {
                html += `
                    <div class="timeline-item type-${log.type}" data-log-id="${log.id}" onclick="selectServerLog(${log.id})">
                        <div class="item-content">
                            <div class="item-header">
                                <div class="user-info">

                                    <span class="username">${log.username}</span>
                                </div>
                                <span class="timestamp">${log.timestamp.split(' ')[1]}</span>

    function fetchServerMetrics(serverId) {
        const card = document.querySelector(`[data-server-id="${serverId}"]`);
        if (!card) return;
        
        fetch(`/admin/servers/${serverId}/metrics`, {
            method: 'GET',

        })
        .catch(error => {

    function updateMetricsDisplay(card, metrics) {
        const cpuUsage = card.querySelector('.cpu-usage');
        const memoryUsage = card.querySelector('.memory-usage');
        const diskUsage = card.querySelector('.disk-usage');
        const cpuFill = card.querySelector('.cpu-fill');
        const memoryFill = card.querySelector('.memory-fill');
        const diskFill = card.querySelector('.disk-fill');
        const lastUpdate = card.querySelector('.last-update-time');
        
        if (cpuUsage && metrics.cpuUsage !== undefined) {
            cpuUsage.textContent = `${metrics.cpuUsage.toFixed(1)}%`;
            cpuFill.style.width = `${metrics.cpuUsage}%`;
        }
        
        if (memoryUsage && metrics.memoryUsage !== undefined) {
            memoryUsage.textContent = `${metrics.memoryUsage.toFixed(1)}%`;
            memoryFill.style.width = `${metrics.memoryUsage}%`;
        }
        
        if (diskUsage && metrics.diskUsage !== undefined) {
            diskUsage.textContent = `${metrics.diskUsage.toFixed(1)}%`;
            diskFill.style.width = `${metrics.diskUsage}%`;
        }
        
        if (lastUpdate) {
            lastUpdate.textContent = `最后更新: ${new Date().toLocaleTimeString()}`;
        }
    }

    function displayServerStatusTags(container, tags) {
        if (!tags || tags.length === 0) {
            container.innerHTML = '<div class="status-tags-empty">无状态信息</div>';
            return;
        }
        
        const tagsHtml = tags.map(tag => {
            const tagClass = getTagClass(tag);
            const iconClass = getTagIcon(tag);
            
            // 调试日志
            
            return `<span class="status-tag ${tagClass}" title="${tag.details || tag.displayText}" data-debug-class="${tagClass}">
                <i class="${iconClass}"></i>
                <span class="tag-text">${tag.displayText}</span>
            </span>`;
        }).join('');
        
        container.innerHTML = tagsHtml;
        
        // 验证DOM结构
        setTimeout(() => {
            const appliedTags = container.querySelectorAll('.status-tag');
            appliedTags.forEach((tagElement, index) => {
            });
        }, 100);
    }
    
    function getTagClass(tag) {
        // 根据服务端返回的字段判断标签类型
        if (tag.status === 'CRITICAL' || tag.colorScheme === 'danger') {
            // 系统资源紧张标签使用特殊样式
            if (tag.displayText && tag.displayText.includes('系统资源紧张')) {
                return 'tag-danger memory-critical';
            }
            return 'tag-danger';
        }
        if (tag.status === 'WARNING' || tag.colorScheme === 'warning') return 'tag-warning';
        if (tag.status === 'OK' || tag.colorScheme === 'success') return 'tag-success';
        if (tag.colorScheme === 'info') return 'tag-info';
        if (tag.colorScheme === 'secondary') return 'tag-secondary';
        
        // 回退：基于标签类型判断
        switch(tag.tagType) {
            case 'CONNECTION': return tag.status === 'OK' ? 'tag-success' : 'tag-danger';
            case 'SYSTEM_RESOURCE': return 'tag-danger memory-critical';
            case 'MEMORY_USAGE': 
            case 'CPU_USAGE':
            case 'DISK_USAGE':
                if (tag.isAlert) return 'tag-warning';
                return 'tag-info';
            default: return 'tag-secondary';
        }
    }
    
    function getTagIcon(tag) {
        const typeIcons = {
            'CONNECTION': 'fas fa-wifi',
            'MEMORY_USAGE': 'fas fa-memory',
            'CPU_USAGE': 'fas fa-microchip',
            'DISK_USAGE': 'fas fa-hdd',
            'PROCESS_STATUS': 'fas fa-cogs',
            'USER_ACTIVITY': 'fas fa-user',
            'WORKING_DIRECTORY': 'fas fa-folder'
        };
        return typeIcons[tag.tagType] || 'fas fa-info-circle';
    }

    function initMobileMenu() {
        const mediaQuery = window.matchMedia('(max-width: 768px)');
        
        // 添加菜单切换按钮（在移动端）
        if (mediaQuery.matches) {
            addMobileMenuToggle();
        }
        
        // 监听屏幕尺寸变化
        mediaQuery.addEventListener('change', function(e) {
            if (e.matches) {
                addMobileMenuToggle();
            } else {
                removeMobileMenuToggle();
                closeMobileMenu();
            }
        });
    }

    function addMobileMenuToggle() {
        const navBrand = document.querySelector('.nav-brand');
        let menuToggle = document.getElementById('mobileMenuToggle');
        
        if (!menuToggle) {
            menuToggle = document.createElement('button');
            menuToggle.id = 'mobileMenuToggle';
            menuToggle.className = 'mobile-menu-toggle';
            menuToggle.innerHTML = '<i class="fas fa-bars"></i>';
            menuToggle.onclick = toggleMobileMenu;
            navBrand.parentNode.insertBefore(menuToggle, navBrand);
            
            // 添加样式
            const style = document.createElement('style');
            style.textContent = `
                .mobile-menu-toggle {
                    display: block;
                    width: 32px;
                    height: 32px;
                    background: none;
                    border: none;
                    color: var(--text-color);
                    font-size: 1.2rem;
                    cursor: pointer;
                    margin-right: 1rem;
                }
                @media (min-width: 769px) {
                    .mobile-menu-toggle {
                        display: none;
                    }
                }
            `;
            document.head.appendChild(style);
        }
    }

    function removeMobileMenuToggle() {
        const menuToggle = document.getElementById('mobileMenuToggle');

    // 服务器刷新状态管理器
    class ServerRefreshManager {
        constructor() {
            this.storageKey = 'serverRefreshStates';
            this.refreshStates = this.loadStates();
            this.cleanExpiredStates();
        }
        
        loadStates() {
            try {
                const stored = localStorage.getItem(this.storageKey);
                return stored ? JSON.parse(stored) : {};
            } catch (e) {
                console.warn('无法加载服务器刷新状态:', e);
                return {};
            }
        }
        
        saveStates() {
            try {
                localStorage.setItem(this.storageKey, JSON.stringify(this.refreshStates));
            } catch (e) {
                console.warn('无法保存服务器刷新状态:', e);
            }
        }
        
        startRefresh(serverId) {
            this.refreshStates[serverId] = {
                isRefreshing: true,
                startTime: Date.now(),
                status: 'running'
            };
            this.saveStates();
        }
        
        finishRefresh(serverId, success = true, message = '') {
            if (this.refreshStates[serverId]) {
                this.refreshStates[serverId] = {
                    isRefreshing: false,
                    startTime: this.refreshStates[serverId].startTime,
                    endTime: Date.now(),
                    status: success ? 'completed' : 'failed',
                    message: message
                };
                this.saveStates();
                
                // 30秒后清理状态
                setTimeout(() => {
                    delete this.refreshStates[serverId];
                    this.saveStates();
                }, 30000);
            }
        }
        
        isRefreshing(serverId) {
            const state = this.refreshStates[serverId];
            if (!state || !state.isRefreshing) return false;
            
            // 检查是否超时 (超过40秒认为异常)
            const elapsed = Date.now() - state.startTime;
            if (elapsed > 40000) {
                this.finishRefresh(serverId, false, '刷新超时');
                return false;
            }
            
            return true;
        }
        
        cleanExpiredStates() {
            const now = Date.now();
            Object.keys(this.refreshStates).forEach(serverId => {
                const state = this.refreshStates[serverId];
                // 清理超过5分钟的状态
                if (state.startTime && (now - state.startTime) > 300000) {
                    delete this.refreshStates[serverId];
                }
            });
            this.saveStates();
        }

        applyRefreshingState(serverId) {
            const serverCard = document.querySelector(`[data-server-id="${serverId}"]`)?.closest('.modern-server-card');
            if (!serverCard) {
                // 尝试其他选择器
                const altCard = document.querySelector(`[data-id="${serverId}"]`)?.closest('.modern-server-card');
                if (altCard) {
                    this._applyRefreshingToCard(altCard, serverId);
                }
                return;
            }
            
            this._applyRefreshingToCard(serverCard, serverId);
        }
        
        _applyRefreshingToCard(serverCard, serverId) {
            // 添加刷新状态样式
            serverCard.classList.add('server-card-refreshing');
            
            // 创建加载指示器
            if (!serverCard.querySelector('.refresh-loading-indicator')) {
                const loadingIndicator = document.createElement('div');
                loadingIndicator.className = 'refresh-loading-indicator';
                loadingIndicator.innerHTML = `
                    <div class="refresh-spinner"></div>
                    <span>正在刷新服务器状态...</span>
                `;
                serverCard.appendChild(loadingIndicator);
            }
        }
        
        clearRefreshingState(serverId) {
            const serverCard = document.querySelector(`[data-server-id="${serverId}"]`)?.closest('.modern-server-card');
            if (!serverCard) {
                // 尝试其他选择器
                const altCard = document.querySelector(`[data-id="${serverId}"]`)?.closest('.modern-server-card');
                if (altCard) {
                    this._clearRefreshingFromCard(altCard);
                }
                return;
            }
            
            this._clearRefreshingFromCard(serverCard);
        }
        
        _clearRefreshingFromCard(serverCard) {
            // 移除刷新状态
            serverCard.classList.remove('server-card-refreshing');
            const indicator = serverCard.querySelector('.refresh-loading-indicator');
            if (indicator) {
                indicator.remove();
            }
        }
    }
    
    // 初始化刷新管理器
    const refreshManager = new ServerRefreshManager();
    
    // 服务器相关函数
    function refreshServer(element) {
        const serverId = element.getAttribute('data-id');
        
        // 防止重复刷新
        if (refreshManager.isRefreshing(serverId)) {
            alert('服务器正在刷新中，请等待完成');
            return;
        }
        
        // 开始刷新状态管理
        refreshManager.startRefresh(serverId);
        
        // 应用服务器卡片刷新状态
        refreshManager.applyRefreshingState(serverId);
        
        // 添加按钮视觉反馈
        const originalText = element.innerHTML;
        element.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 刷新中...';
        element.disabled = true;
        
        // 添加30秒超时控制
        const controller = new AbortController();
        const timeoutId = setTimeout(() => {
            controller.abort();
        }, 30000);
        
        fetch('/admin/servers/' + serverId + '/refresh', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                [getCSRFHeaderName()]: getCSRFToken()
            },
            signal: controller.signal
        }).then(response => {
            clearTimeout(timeoutId);
            if (response.ok) {
                return response.json();
            } else {
                throw new Error('服务器响应错误: ' + response.status);
            }
        }).then(data => {
            // 标记刷新完成
            refreshManager.finishRefresh(serverId, true, '刷新成功');
            
            alert('服务器状态已刷新');
            // 重新加载服务器内容
            loadContent('servers');
        }).catch(error => {
            clearTimeout(timeoutId);
            console.error('刷新服务器状态失败:', error);
            
            let errorMessage = '刷新失败';
            if (error.name === 'AbortError') {
                errorMessage = '刷新超时(30秒)，请检查服务器SSH配置或网络连接';
            } else if (error.message) {
                errorMessage = '刷新失败: ' + error.message;
            }
            
            // 标记刷新失败
            refreshManager.finishRefresh(serverId, false, errorMessage);
            alert(errorMessage);
        }).finally(() => {
            // 清理刷新状态视觉效果
            refreshManager.clearRefreshingState(serverId);
            
            // 恢复按钮状态
            element.innerHTML = originalText;
            element.disabled = false;
        });
    }

    let serverStatusManager = null;
    
    // 备用的服务器状态标签加载函数
    async function loadServerStatusTagsFallback(serverId) {
        try {
            const response = await fetch(`/admin/api/servers/${serverId}/status-tags`);
            const data = await response.json();
            
            if (data.status === 'success' && data.tags) {
                const statusContainer = document.querySelector(`[data-server-id="${serverId}"] .server-status-tags-row`);
                if (statusContainer) {
                    displayServerStatusTags(statusContainer, data.tags);
                }
            }
        } catch (error) {
            console.error(`加载服务器 ${serverId} 状态标签失败:`, error);
            const statusContainer = document.querySelector(`[data-server-id="${serverId}"] .server-status-tags-row`);
            if (statusContainer) {
                statusContainer.innerHTML = '<div class="status-tags-empty">加载失败</div>';
            }
        }
    }

    // 检查服务器名称长度并添加滚动效果
    function initServerNameScrolling() {
        const serverNames = document.querySelectorAll('.server-name');
        
        serverNames.forEach((nameElement, index) => {
            // 首先移除所有可能存在的long-text类
            nameElement.classList.remove('long-text');
            
            // 彻底清理文本内容，移除所有空白字符、换行符等
            let textContent = nameElement.textContent || nameElement.innerText || '';
            const originalLength = textContent.length;
            textContent = textContent.replace(/\s+/g, ' ').trim(); // 将所有连续空白字符替换为单个空格
            
            
            // 检查文本长度是否超过13个字符（在15ch容器中考虑图标占用空间）
            if (textContent.length > 13) {
                nameElement.classList.add('long-text');
            } else {
            }
        });
        
    }

    // ===== 重新生成工作目录功能 =====
    let currentRegenerateServerId = null;

    // 显示重新生成工作目录弹出窗口
    function showRegenerateWorkdirModal(serverId, currentWorkdir) {
        currentRegenerateServerId = serverId;
        
        // 设置当前工作目录
        const workdirInput = document.getElementById('current-workdir-path');
        if (!workdirInput) {
            console.error('找不到输入框: current-workdir-path');
            return;
        }
        workdirInput.value = currentWorkdir || '未设置工作目录';
        
        // 显示弹出窗口
        const modal = document.getElementById('regenerate-workdir-modal');
        if (!modal) {
            console.error('找不到modal: regenerate-workdir-modal');
            return;
        }
        
        modal.style.display = 'flex';
        
        // 添加显示动画
        setTimeout(() => {
            modal.classList.add('show');
        }, 10);
        
        // 阻止页面滚动
        document.body.style.overflow = 'hidden';
    }

    // 关闭重新生成工作目录弹出窗口
    function closeRegenerateWorkdirModal() {
        const modal = document.getElementById('regenerate-workdir-modal');
        
        // 移除显示动画
        modal.classList.remove('show');
        
        // 等待动画完成后隐藏
        setTimeout(() => {
            modal.style.display = 'none';
        }, 300);
        
        // 恢复页面滚动
        document.body.style.overflow = '';
    }

    // 确认重新生成工作目录
    function confirmRegenerateWorkdir() {
        if (!currentRegenerateServerId) {
            console.error('未选择服务器');
            return;
        }
        
        const confirmBtn = document.getElementById('btn-confirm-regenerate');
        const originalHtml = confirmBtn.innerHTML;
        
        // 禁用按钮并显示加载状态
        confirmBtn.disabled = true;
        confirmBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i><span>检查中...</span>';
        
        // 发送请求
        fetch(`/admin/servers/${currentRegenerateServerId}/initialize-working-directory`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                [getCSRFHeaderName()]: getCSRFToken()
            }
        }).then(response => response.json()).then(data => {
            if (data.status === 'success') {
                let alertMessage = '';
                let alertTitle = '';
                
                if (data.created === true) {
                    // 目录是新创建的
                    alertTitle = '✅ 工作目录创建成功';
                    alertMessage = `${data.message}\n\n目录路径: ${data.workingDirectory || '已设置'}`;
                } else if (data.created === false) {
                    // 目录已存在，没有创建新的
                    alertTitle = 'ℹ️ 工作目录检查完成';
                    alertMessage = `${data.message}\n\n目录路径: ${data.workingDirectory || '已设置'}\n\n📝 提示: 目录已存在，无需重新创建`;
                } else {
                    // 其他成功情况
                    alertTitle = '✅ 操作完成';
                    alertMessage = data.message;
                }
                
                alert(`${alertTitle}\n\n${alertMessage}`);
                closeRegenerateWorkdirModal();
                // 重新加载服务器页面以更新状态
                loadContent('servers');
            } else {
                alert('❌ 操作失败\n\n' + (data.message || '未知错误'));
            }
        }).catch(error => {
            console.error('重新生成工作目录失败:', error);
            alert('❌ 网络错误\n\n请检查网络连接或服务器配置。\n错误详情: ' + (error.message || error));
        }).finally(() => {
            confirmBtn.disabled = false;
            confirmBtn.innerHTML = originalHtml;
        });
    }

    // 添加遮罩层和ESC键关闭功能
    document.addEventListener('click', function(e) {
        if (e.target.id === 'regenerate-workdir-modal') {
            closeRegenerateWorkdirModal();
        }
    });

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            closeRegenerateWorkdirModal();
        }
    });

    // 全局样式类
    window.addEventListener('load', function() {
        document.body.classList.add('layout-loaded');
        
        // 初始化服务器状态标签管理器
        if (typeof ServerStatusManager !== 'undefined') {
            serverStatusManager = new ServerStatusManager();
        } else {
            console.warn('ServerStatusManager类未找到，状态标签功能不可用');
        }
    });
</script>

<script>
    // 新的系统风格服务器详情模态框函数
    function showSystemServerDetailModal(serverId, serverName) {
        console.log('显示系统风格服务器详情模态框:', { serverId, serverName });
        
        const modal = document.getElementById('systemServerDetailModal');
        if (!modal) {
            console.error('找不到模态框元素');
            return;
        }
        
        // 更新模态框标题
        const titleElement = document.getElementById('systemModalServerName');
        if (titleElement) {
            titleElement.textContent = (serverName || 'Server-' + serverId) + ' 详情';
        }
        
        // 显示模态框
        modal.classList.add('show');
        document.body.style.overflow = 'hidden';
        
        // 加载服务器数据
        loadSystemServerData(serverId);
    }

    function hideSystemServerDetailModal() {
        const modal = document.getElementById('systemServerDetailModal');
        if (modal) {
            modal.classList.remove('show');
            document.body.style.overflow = 'auto';
        }
    }

    function loadSystemServerData(serverId) {
        console.log('加载服务器数据:', serverId);
        
        // 显示加载状态
        document.getElementById('systemHostname').textContent = '加载中...';
        document.getElementById('systemIpAddress').textContent = '加载中...';
        document.getElementById('systemUptime').textContent = '加载中...';
        document.getElementById('systemOperatingSystem').textContent = '加载中...';
        document.getElementById('systemWorkDirectory').textContent = '加载中...';
        document.getElementById('systemConnectionStatus').textContent = '检查中...';
        
        // 调用真实API获取服务器详情
        fetch(`/admin/api/servers/${serverId}/details`, {
            method: 'GET',
            headers: {
                'Content-Type': 'application/json',
                'X-Requested-With': 'XMLHttpRequest'
            }
        })
        .then(response => response.json())
        .then(data => {
            console.log('服务器详情API响应:', data);
            
            if (data.success) {
                // 更新服务器基本信息
                const basicInfo = data.basicInfo;
                document.getElementById('systemHostname').textContent = basicInfo.hostname || '未知';
                document.getElementById('systemIpAddress').textContent = basicInfo.ipAddress || '未知';
                document.getElementById('systemUptime').textContent = basicInfo.uptime || '未知';
                document.getElementById('systemOperatingSystem').textContent = basicInfo.operatingSystem || 'Linux';
                document.getElementById('systemWorkDirectory').textContent = basicInfo.workDirectory || '/opt/apps';
                
                // 更新连接状态
                const statusText = basicInfo.connectionStatus === 'CONNECTED' ? '在线' : 
                                  basicInfo.connectionStatus === 'MONITORING' ? '监控中' : '离线';
                document.getElementById('systemConnectionStatus').textContent = `${statusText} ${basicInfo.lastCheck}`;
                
                // 加载应用列表和操作日志
                loadSystemApplications(data.applications);
                loadSystemOperationLogs(serverId);
            } else {
                // 处理错误情况
                console.error('获取服务器详情失败:', data.error);
                document.getElementById('systemHostname').textContent = '获取失败';
                document.getElementById('systemIpAddress').textContent = data.error || '未知错误';
                document.getElementById('systemUptime').textContent = '';
                document.getElementById('systemOperatingSystem').textContent = '';
                document.getElementById('systemWorkDirectory').textContent = '';
                document.getElementById('systemConnectionStatus').textContent = '无法连接';
                
                // 显示错误的应用和日志
                loadSystemApplications([]);
                loadSystemOperationLogs(null);
            }
        })
        .catch(error => {
            console.error('服务器详情API调用失败:', error);
            document.getElementById('systemHostname').textContent = '网络错误';
            document.getElementById('systemIpAddress').textContent = '请检查网络连接';
            document.getElementById('systemUptime').textContent = '';
            document.getElementById('systemOperatingSystem').textContent = '';
            document.getElementById('systemWorkDirectory').textContent = '';
            document.getElementById('systemConnectionStatus').textContent = '连接失败';
            
            // 显示空的应用和日志
            loadSystemApplications([]);
            loadSystemOperationLogs(null);
        });
    }

    function loadSystemApplications(applications) {
        const container = document.getElementById('systemApplicationsList');
        
        if (!applications || applications.length === 0) {
            container.innerHTML = `
                <div class="system-app-card system-fade-in" style="text-align: center; padding: 40px;">
                    <div style="font-size: 1.2rem; color: #6b7280; margin-bottom: 10px;">📱</div>
                    <div style="color: #6b7280;">暂无应用部署</div>
                    <div style="font-size: 0.875rem; color: #9ca3af; margin-top: 5px;">
                        该服务器上暂时没有部署的应用
                    </div>
                </div>
            `;
            return;
        }
        
        let html = '';
        applications.forEach(app => {
            // 处理应用状态
            const status = app.status ? app.status.toLowerCase() : 'unknown';
            const statusClass = status === 'running' ? 'running' : 
                               status === 'stopped' ? 'stopped' : 
                               status === 'error' ? 'stopped' : 'starting';
            const statusText = status === 'running' ? '运行中' :
                              status === 'stopped' ? '已停止' :
                              status === 'error' ? '错误' : '未知';
            
            // 构建应用卡片
            html += `
                <div class="system-app-card ${statusClass} system-fade-in">
                    <div class="system-app-header">
                        <h3 class="system-app-name">${app.name || '未知应用'}</h3>
                        <span class="system-app-status ${statusClass}">${statusText}</span>
                    </div>
                    <div class="system-app-metrics">
                        ${app.owner ? `<div class="system-app-metric">所有者: ${app.owner}</div>` : ''}
                        ${app.port ? `<div class="system-app-metric">端口: ${app.port}</div>` : ''}
                        ${app.debugPort ? `<div class="system-app-metric">调试: ${app.debugPort}</div>` : ''}
                        ${app.uptime && app.uptime !== '未运行' ? `<div class="system-app-metric">运行: ${app.uptime}</div>` : ''}
                        ${app.jarFileName ? `<div class="system-app-metric">文件: ${app.jarFileName}</div>` : ''}
                        ${app.processId ? `<div class="system-app-metric">PID: ${app.processId}</div>` : ''}
                        ${app.error ? `<div class="system-app-metric" style="color: #dc3545;">错误: ${app.error}</div>` : ''}
                    </div>
                </div>
            `;
        });
        
        // 计算统计信息
        const runningCount = applications.filter(a => a.status && a.status.toLowerCase() === 'running').length;
        const stoppedCount = applications.filter(a => a.status && a.status.toLowerCase() === 'stopped').length;
        const errorCount = applications.filter(a => a.status && a.status.toLowerCase() === 'error').length;
        
        html += `
            <div class="system-app-summary">
                💻 总计: ${applications.length}个应用 • 
                ${runningCount > 0 ? `${runningCount}个运行中` : ''} 
                ${runningCount > 0 && (stoppedCount > 0 || errorCount > 0) ? ' • ' : ''}
                ${stoppedCount > 0 ? `${stoppedCount}个已停止` : ''} 
                ${stoppedCount > 0 && errorCount > 0 ? ' • ' : ''}
                ${errorCount > 0 ? `${errorCount}个错误` : ''}
                ${runningCount === 0 && stoppedCount === 0 && errorCount === 0 ? '0个运行中' : ''}
            </div>
        `;
        
        container.innerHTML = html;
    }

    function loadSystemOperationLogs(serverId) {
        const container = document.getElementById('systemOperationLogs');
        
        // 显示加载状态
        container.innerHTML = `
            <div style="text-align: center; padding: 40px; color: var(--color-text-secondary);">
                <i class="fas fa-spinner fa-spin" style="font-size: 2rem; margin-bottom: 1rem;"></i>
                <div>正在加载用户操作详情...</div>
            </div>
        `;
        
        // 如果没有serverId,显示空状态
        if (!serverId) {
            console.log('loadSystemOperationLogs called with empty serverId, showing empty state');
            container.innerHTML = `
                <div style="text-align: center; padding: 40px; color: var(--color-text-secondary);">
                    <i class="fas fa-user-slash" style="font-size: 2rem; margin-bottom: 1rem;"></i>
                    <div>暂无用户操作记录</div>
                    <div style="font-size: 0.875rem; color: #9ca3af; margin-top: 5px;">
                        该服务器上暂时没有用户操作记录
                    </div>
                </div>
            `;
            return;
        }
        
        console.log('调用用户操作详情API，serverId:', serverId);
        
        // 构建查询参数
        const queryDto = {
            serverId: parseInt(serverId),
            page: 0,
            size: 10,
            sortBy: 'lastActivity',
            sortDirection: 'DESC'
        };
        
        // 调用实际的用户操作详情API
        fetch('/user-operations/api/search', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-Requested-With': 'XMLHttpRequest'
            },
            body: JSON.stringify(queryDto)
        })
        .then(response => response.json())
        .then(data => {
            console.log('用户操作详情API响应:', data);
            
            if (data.content && Array.isArray(data.content)) {
                renderUserOperations(data.content, data.totalElements);
            } else if (data.error) {
                console.error('获取用户操作详情失败:', data.error);
                container.innerHTML = `
                    <div style="text-align: center; padding: 40px; color: var(--color-danger);">
                        <i class="fas fa-exclamation-triangle" style="font-size: 2rem; margin-bottom: 1rem;"></i>
                        <div>加载用户操作详情失败</div>
                        <div style="font-size: 0.875rem; margin-top: 5px;">${data.error}</div>
                    </div>
                `;
            } else {
                // 空数据
                container.innerHTML = `
                    <div style="text-align: center; padding: 40px; color: var(--color-text-secondary);">
                        <i class="fas fa-user-slash" style="font-size: 2rem; margin-bottom: 1rem;"></i>
                        <div>暂无用户操作记录</div>
                        <div style="font-size: 0.875rem; color: #9ca3af; margin-top: 5px;">
                            该服务器上暂时没有用户操作记录
                        </div>
                    </div>
                `;
            }
        })
        .catch(error => {
            console.error('用户操作详情API调用失败:', error);
            container.innerHTML = `
                <div style="text-align: center; padding: 40px; color: var(--color-danger);">
                    <i class="fas fa-network-wired" style="font-size: 2rem; margin-bottom: 1rem;"></i>
                    <div>网络连接失败</div>
                    <div style="font-size: 0.875rem; margin-top: 5px;">请检查网络连接后重试</div>
                </div>
            `;
        });
    }
    
    function renderUserOperations(operations, totalElements) {
        const container = document.getElementById('systemOperationLogs');
        
        if (!operations || operations.length === 0) {
            container.innerHTML = `
                <div style="text-align: center; padding: 40px; color: var(--color-text-secondary);">
                    <i class="fas fa-user-slash" style="font-size: 2rem; margin-bottom: 1rem;"></i>
                    <div>暂无用户操作记录</div>
                    <div style="font-size: 0.875rem; color: #9ca3af; margin-top: 5px;">
                        该服务器上暂时没有用户操作记录
                    </div>
                </div>
            `;
            return;
        }
        
        let html = '';
        operations.forEach((operation, index) => {
            const formatTime = operation.lastActivity ? 
                new Date(operation.lastActivity).toLocaleTimeString('zh-CN', { 
                    hour12: false,
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                }) : '未知时间';
            
            const activityIcon = getActivityIcon(operation.activityType);
            const riskColor = getRiskColor(operation.riskLevel);
            
            html += `
                <div class="system-log-card system-fade-in" style="animation-delay: ${index * 0.1}s">
                    <div class="system-log-header">
                        <div class="system-log-time">${formatTime}</div>
                        <div class="system-log-user">
                            <i class="fas fa-user"></i>
                            ${operation.username || '未知用户'}${operation.remoteIp ? ' @' + operation.remoteIp : ''}
                        </div>
                    </div>
                    <div class="system-log-content">
                        <h3 class="system-log-action">
                            ${activityIcon} ${operation.operationSummary || operation.activityTypeDescription || '未知操作'}
                        </h3>
                        <div class="system-log-details">
                            ${operation.activityDetails ? `
                                <div class="system-detail-row">
                                    <span class="system-detail-label">操作详情:</span>
                                    <span class="system-detail-value">${operation.activityDetails}</span>
                                </div>
                            ` : ''}
                            ${operation.sessionId ? `
                                <div class="system-detail-row">
                                    <span class="system-detail-label">会话ID:</span>
                                    <span class="system-detail-value">${operation.sessionId}</span>
                                </div>
                            ` : ''}
                            ${operation.commandCount && operation.commandCount > 0 ? `
                                <div class="system-detail-row">
                                    <span class="system-detail-label">命令数量:</span>
                                    <span class="system-detail-value">${operation.commandCount}个</span>
                                </div>
                            ` : ''}
                            ${operation.sessionDuration ? `
                                <div class="system-detail-row">
                                    <span class="system-detail-label">会话时长:</span>
                                    <span class="system-detail-value">${operation.sessionDuration}分钟</span>
                                </div>
                            ` : ''}
                            ${operation.riskLevel ? `
                                <div class="system-detail-row">
                                    <span class="system-detail-label">风险等级:</span>
                                    <span class="system-detail-value" style="color: ${riskColor}">
                                        <i class="fas fa-shield-alt"></i>
                                        ${operation.riskLevel}
                                    </span>
                                </div>
                            ` : ''}
                            ${operation.isActive !== null ? `
                                <div class="system-detail-row">
                                    <span class="system-detail-label">会话状态:</span>
                                    <span class="system-detail-value system-status-${operation.isActive ? 'success' : 'error'}">
                                        ${operation.isActive ? '<i class="fas fa-check-circle"></i>活跃' : '<i class="fas fa-times-circle"></i>已结束'}
                                    </span>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                </div>
            `;
        });
        
        // 如果有更多记录，显示加载更多按钮
        const remainingCount = totalElements - operations.length;
        if (remainingCount > 0) {
            html += `
                <button class="system-load-more" onclick="loadMoreUserOperations(${operations[0].serverId})">
                    <i class="fas fa-plus-circle"></i>
                    加载更多操作记录 (还有${remainingCount}条)
                </button>
            `;
        }
        
        container.innerHTML = html;
    }
    
    function getActivityIcon(activityType) {
        const iconMap = {
            'SSH_LOGIN': '🔐',
            'SSH_LOGOUT': '🚪',
            'COMMAND_EXECUTE': '💻',
            'FILE_EDIT': '📝',
            'PROCESS_START': '▶️',
            'PROCESS_STOP': '⏹️',
            'SYSTEM_INFO': '📊',
            'APPLICATION_DEPLOY': '🚀'
        };
        return iconMap[activityType] || '⚙️';
    }
    
    function getRiskColor(riskLevel) {
        const colorMap = {
            '低': '#10b981',  // green
            '中': '#f59e0b',  // amber
            '高': '#ef4444'   // red
        };
        return colorMap[riskLevel] || '#6b7280'; // default gray
    }
    
    function loadMoreUserOperations(serverId) {
        const button = event.target.closest('.system-load-more');
        const originalHTML = button.innerHTML;
        
        button.innerHTML = '<i class="fas fa-spinner fa-spin"></i>加载中...';
        
        // TODO: 实现分页加载更多用户操作记录
        setTimeout(() => {
            button.innerHTML = originalHTML;
            console.log('加载更多用户操作记录:', serverId);
        }, 1500);
    }

    function loadMoreSystemLogs() {
        const button = event.target.closest('.system-load-more');
        const originalHTML = button.innerHTML;
        
        button.innerHTML = '<i class="fas fa-spinner fa-spin"></i>加载中...';
        
        setTimeout(() => {
            button.innerHTML = originalHTML;
            // 这里可以添加更多日志
            console.log('加载更多日志记录');
        }, 1500);
    }

    // 更新现有的showServerLogsModal函数以使用新的模态框
    if (typeof window.originalShowServerLogsModal === 'undefined') {
        const originalShowServerLogsModal = window.showServerLogsModal;
        window.originalShowServerLogsModal = originalShowServerLogsModal; // 存储引用防止重复声明
        window.showServerLogsModal = function(serverId, serverName) {
            // 使用新的系统风格模态框
            showSystemServerDetailModal(serverId, serverName);
        };
    }

    // 关闭模态框的事件处理
    document.addEventListener('click', function(event) {
        const modal = document.getElementById('systemServerDetailModal');
        if (modal && event.target === modal) {
            hideSystemServerDetailModal();
        }
    });

    // ESC键关闭模态框
    document.addEventListener('keydown', function(event) {
        if (event.key === 'Escape') {
            hideSystemServerDetailModal();
        }
    });
</script>

<!-- 现代导航栏集成脚本 -->
<script>
    // 现代导航栏集成初始化
    document.addEventListener('DOMContentLoaded', function() {
        //console.log('🚀 现代导航栏集成初始化开始...');
        
        // 用户菜单切换功能
        window.toggleUserMenu = function() {
            const userMenu = document.getElementById('userDropdownMenu');
            if (userMenu) {
                userMenu.classList.toggle('show');
            }
        };
        
        // 点击外部关闭用户菜单
        document.addEventListener('click', function(e) {
            const userMenu = document.getElementById('userDropdownMenu');
            const userProfile = document.querySelector('.nav-user-profile');
            
            if (userMenu && userProfile && !userProfile.contains(e.target)) {
                userMenu.classList.remove('show');
            }
        });

                modernNavLinks.forEach(l => l.classList.remove('active'));
                // 添加当前活跃状态
                this.classList.add('active');
                
                // 获取页面ID并调用现有的loadContent函数
                const pageId = this.getAttribute('data-page');
                if (pageId && typeof loadContent === 'function') {

                    loadContent(pageId);

                if (typeof toggleTheme === 'function') {

            //console.log('🎯 导航项点击:', e.detail);

            // 详细诊断信息


            const itemId = e.detail.itemId;
            if (itemId) {
                // 移除#号前缀（如果有）
                const page = itemId.replace('#', '');
                //console.log('📍 加载页面:', page);

                // 尝试多种方式调用loadContent函数
                let loadContentFunc = null;

                // 1. 尝试从window对象获取
                if (typeof window.loadContent === 'function') {
                    //console.log('✅ 方法1成功: 从window对象找到loadContent');
                    loadContentFunc = window.loadContent;
                }
                // 2. 尝试从全局作用域获取
                else if (typeof loadContent === 'function') {
                    //console.log('✅ 方法2成功: 从全局作用域找到loadContent');
                    loadContentFunc = loadContent;
                }
                // 3. 等待一下再尝试
                else {
                    //console.log('🔄 loadContent暂时不可用，等待100ms后重试...');
                    setTimeout(() => {
                        //console.log('🔄 重试中，再次检查:');
                        //console.log('  - typeof window.loadContent:', typeof window.loadContent);
                        //console.log('  - typeof loadContent:', typeof loadContent);

                        if (typeof window.loadContent === 'function') {
                            //console.log('✅ 重试成功: window.loadContent可用');
                            window.loadContent(page, true);
                        } else if (typeof loadContent === 'function') {
                            //console.log('✅ 重试成功: loadContent可用');
                            loadContent(page, true);
                        } else {
                            console.error('❌ loadContent函数仍然不可用，使用降级方案');
                            // 作为最后的备选方案，触发页面跳转
                            window.location.hash = page;
                        }
                    }, 100);
                    return;
                }

                if (loadContentFunc) {
                    //console.log('✅ 找到loadContent函数，开始调用');
                    loadContentFunc(page, true, true);
                } else {
                    console.error('❌ loadContent函数不可用');
                }
            }
        });
        
        // 确保主题图标正确显示
        function updateThemeIcon() {
            const themeIcon = document.querySelector('.theme-icon');
            if (themeIcon) {
                const isDark = document.documentElement.classList.contains('theme-dark');
                themeIcon.className = isDark ? 'theme-icon fas fa-sun' : 'theme-icon fas fa-moon';
            }
        }
        
        // 初始化主题图标
        updateThemeIcon();
        
        // 监听主题变化
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.type === 'attributes' && mutation.attributeName === 'class') {
                    updateThemeIcon();
                }
            });
        });
        
        observer.observe(document.documentElement, {
            attributes: true,
            attributeFilter: ['class']
        });
        
        //console.log('✅ 现代导航栏集成初始化完成');
    });
