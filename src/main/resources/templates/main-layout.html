            // 自动刷新图表功能
            function startServerGroupAutoRefresh() {
                // 清除已存在的定时器
                stopServerGroupAutoRefresh();

                console.log('Starting server group auto-refresh (10s interval)...');

                serverGroupAutoRefreshTimer = setInterval(async () => {
                    // 检查是否还在服务器群组管理页面
                    if (!document.querySelector('.server-group-management')) {
                        console.log('Not on server group page, stopping auto-refresh');
                        stopServerGroupAutoRefresh();
                        return;
                    }

                    // 检查是否有服务器
                    if (!serverGroupListCache || serverGroupListCache.length === 0) {
                        console.log('No servers available, skipping auto-refresh');
                        return;
                    }

                    console.log('Auto-refreshing server group charts...');

                    // 异步刷新3个图表，不阻塞UI
                    // 使用Promise.allSettled确保即使某个图表失败也不影响其他图表
                    const healthTrendRange = document.getElementById('healthTrendRange');
                    const hours = healthTrendRange ? parseInt(healthTrendRange.value) : 24;

                    const results = await Promise.allSettled([
                        loadHealthTrendChart(hours),
                        loadLoadDistributionChart(),
                        loadAppDistributionChart()
                    ]);

                    // 记录刷新结果
                    const successCount = results.filter(r => r.status === 'fulfilled').length;
                    const failedCount = results.filter(r => r.status === 'rejected').length;

                    console.log(`Auto-refresh completed: ${successCount} succeeded, ${failedCount} failed`);

                    if (failedCount > 0) {
                        results.forEach((result, index) => {
                            if (result.status === 'rejected') {
                                const chartNames = ['Health Trend', 'Load Distribution', 'App Distribution'];
                                console.error(`Failed to refresh ${chartNames[index]}:`, result.reason);
                            }
                        });
                    }

                    // 更新最后刷新时间
                    updateServerGroupLastUpdateTime();
                }, 10000); // 10秒间隔
            }

            function stopServerGroupAutoRefresh() {
                if (serverGroupAutoRefreshTimer) {

            // 轮询检查服务器指标是否收集完成
            const pollingIntervals = new Map();
            let isPolling = false; // 防止并发轮询

            window.startServerMetricsPolling = function(serverId) {
                console.log('Starting metrics polling for server:', serverId);

                // 如果已有该服务器的轮询，先清除
                if (pollingIntervals.has(serverId)) {
                    clearInterval(pollingIntervals.get(serverId));
                }

                let attemptCount = 0;
                const maxAttempts = 15; // 最多轮询15次（约45秒）

                const intervalId = setInterval(async () => {
                    // 防止并发请求
                    if (isPolling) {
                        console.log('Skipping poll - previous request still in progress');
                        return;
                    }

                    attemptCount++;
                    console.log(`Polling attempt ${attemptCount} for server ${serverId}`);
                    isPolling = true;

                    try {
                        // 只获取服务器列表数据，不触发其他API调用
                        const response = await fetch('/admin/server-groups/api/list');
                        if (!response.ok) throw new Error('Failed to fetch server list');

                        const servers = await response.json();
                        serverGroupListCache = servers;

                        // 静默更新列表（不显示加载状态）
                        renderServerGroupList(servers);

                        // 检查该服务器的指标是否已有数据
                        const server = servers.find(s => s.id === serverId);
                        if (server && server.cpuUsage != null && server.memoryUsage != null && server.diskUsage != null) {
                            console.log('Metrics collected for server:', serverId);
                            clearInterval(intervalId);
                            pollingIntervals.delete(serverId);
                            showSuccessMessage(currentLanguage === 'en' ? 'Server metrics loaded' : '服务器监控数据已加载');
                        } else if (attemptCount >= maxAttempts) {
                            console.warn('Metrics polling timeout for server:', serverId);
                            clearInterval(intervalId);
                            pollingIntervals.delete(serverId);
                            showWarningMessage(currentLanguage === 'en' ? 'Metrics collection timeout' : '监控数据收集超时');
                        }
                    } catch (error) {
                        console.error('Error during metrics polling:', error);
                    } finally {
                        isPolling = false;
                    }
                }, 3000); // 每3秒轮询一次（降低频率）

                pollingIntervals.set(serverId, intervalId);
            };

            function formatTime(timestamp) {
                if (!timestamp) return '--';
                const date = new Date(timestamp);
                const now = new Date();
                const diff = now - date;
                const minutes = Math.floor(diff / 60000);
                const hours = Math.floor(diff / 3600000);
                const days = Math.floor(diff / 86400000);

                if (minutes < 1) return '刚刚';
                if (minutes < 60) return `${minutes}分钟前`;
                if (hours < 24) return `${hours}小时前`;
                if (days < 7) return `${days}天前`;
                return date.toLocaleDateString('zh-CN');
            }

            }

            function updateDelta(id, delta) {
                const element = document.getElementById(id);
                if (!element) {
                    return;
                }

                const suffix = element.dataset.suffix || '%';
                const precisionAttr = element.dataset.precision;
                const precision = precisionAttr ? parseInt(precisionAttr, 10) : 1;

                if (delta === undefined || delta === null || delta === '') {
                    element.textContent = '--';
                    element.dataset.trend = 'neutral';
                    return;
                }

                const numeric = typeof delta === 'number' ? delta : Number(delta);
                if (!Number.isNaN(numeric)) {
                    const formatted = `${numeric > 0 ? '+' : ''}${numeric.toFixed(precision)}${suffix}`;
                    element.textContent = formatted;
                    if (numeric > 0) {
                        element.dataset.trend = 'up';
                    } else if (numeric < 0) {
                        element.dataset.trend = 'down';
                    } else {
                        element.dataset.trend = 'neutral';
                    }
                } else {
                    element.textContent = delta;
                    element.dataset.trend = 'neutral';
                }
            }

            function updateTimestamp(id, timestamp) {
                const element = document.getElementById(id);
                if (!element) {
                    return;
                }

                const label = currentLanguage === 'en' ? 'Last updated' : '更新于';
                const locale = currentLanguage === 'en' ? 'en-US' : 'zh-CN';

                if (!timestamp) {
                    element.textContent = `${label} --`;
                    return;
                }

                const date = new Date(timestamp);
                if (Number.isNaN(date.getTime())) {
                    element.textContent = `${label} ${timestamp}`;
                    return;
                }

                const formatted = date.toLocaleString(locale, { hour12: false });
                element.textContent = `${label} ${formatted}`;
            }

            function formatPercent(value, fractionDigits = 1) {
                if (value === undefined || value === null || value === '') {
                    return '--%';

                const numeric = typeof value === 'number' ? value : Number(value);
                if (Number.isNaN(numeric)) {
                    return `${value}`;
                }
                const percent = Math.abs(numeric) <= 1 ? numeric * 100 : numeric;
                return `${percent.toFixed(fractionDigits)}%`;
            }

            // 🎯 [仪表板键盘快捷键] 功能
            function initDashboardKeyboardShortcuts() {
                // 仪表板键盘快捷键处理器
                function handleDashboardKeyboard(event) {
                    // 只在仪表板页面生效
                    if (!document.querySelector('.content-framework.admin-theme')) {
                        return;
                    }

                    // 避免在输入框中触发快捷键
                    const activeElement = document.activeElement;
                    if (activeElement && (activeElement.tagName === 'INPUT' || activeElement.tagName === 'TEXTAREA')) {
                        return;
                    }

                    // Ctrl/Cmd + 组合键
                    if (event.ctrlKey || event.metaKey) {
                        switch (event.key.toLowerCase()) {
                            case 'r':
                                // Ctrl+R: 刷新概览数据
                                event.preventDefault();
                                loadDashboardOverview();
                                showShortcutTip('刷新概览数据');
                                break;

                            case 's':
                                // Ctrl+S: 刷新服务器数据
                                event.preventDefault();
                                loadServerMonitoring();
                                showShortcutTip('刷新服务器数据');
                                break;

                            case 'n':
                                // Ctrl+N: 新建服务器
                                event.preventDefault();
                                emit('spa:navigate', { route: 'servers' });
                                showShortcutTip('跳转到服务器管理');
                                break;
                        }
                    }

                    // 单键快捷键
                    switch (event.key.toLowerCase()) {
                        case 'g': {
                            // G: 切换到网格视图
                            const gridBtn = document.getElementById('serverGridView');
                            const listBtn = document.getElementById('serverListView');
                            if (gridBtn && listBtn) {
                                setServerViewMode('grid');
                                showShortcutTip('切换到网格视图');
                            }
                            break;
                        }

                        case 'l': {
                            // L: 切换到列表视图
                            const gridBtn = document.getElementById('serverGridView');
                            const listBtn = document.getElementById('serverListView');
                            if (gridBtn && listBtn) {
                                setServerViewMode('list');
                                showShortcutTip('切换到列表视图');
                            }
                            break;
                        }

                        case 'c':
                            // C: 切换资源图表视图
                            const barBtn = document.getElementById('resourceBarView');
                            const chartBtn = document.getElementById('resourceChartView');
                            if (barBtn && chartBtn) {
                                // 判断当前状态并切换
                                if (barBtn.classList.contains('active')) {
                                    toggleResourceView('chart', barBtn, chartBtn);
                                    showShortcutTip('切换到饼图视图');
                                } else {
                                    toggleResourceView('bar', barBtn, chartBtn);
                                    showShortcutTip('切换到条形图视图');
                                }
                            }
                            break;

                        case '?':
                        case 'h':
                            // ?: 显示快捷键帮助
                            showKeyboardShortcutsHelp();
                            break;
                    }
                }

                // 添加键盘事件监听
                document.addEventListener('keydown', handleDashboardKeyboard);

                // 清理函数，当离开仪表板时移除监听器
                const originalRemove = document.removeEventListener;

            loadPreferences();

        // ======================================================================
        // 用户添加弹窗逻辑 - User Add Modal Logic
        // ======================================================================
        (function() {
            // DOM 元素引用
            let modalOverlay, userAddForm, addUsernameInput, addEmailInput, addPasswordInput,
                addConfirmPasswordInput, addUsernameStatus, addEmailStatus, addPasswordStatus,
                addRoleMatrix, addServerGrid, addDefaultServer, addAdvancedPanel,
                addAdvancedToggleText, submitUserAddBtn;

            // 状态管理
            const selectedRoles = new Set(['USER']); // 默认选中USER角色
            const selectedServers = new Set();
            let availableServers = [];

            // 工具函数
            function delay(ms) {
                return new Promise(resolve => setTimeout(resolve, ms));
            }

            function updateValidation(element, message, status) {
                if (!element) return;
                const span = element.querySelector('span') || element;
                span.textContent = message;
                element.classList.remove('success', 'error');
                if (status) {
                    element.classList.add(status);
                }
            }

            function showToast(message, type = 'info') {
                // 使用平台现有的通知系统
                if (window.AppShell && window.AppShell.emit) {
                    window.AppShell.emit('notification:show', {
                        message: message,
                        type: type
                    });
                } else {
                    console.log(`[Toast ${type}] ${message}`);
                }
            }

            // 初始化DOM元素引用
            function initDomReferences() {
                modalOverlay = document.getElementById('userAddModalOverlay');
                userAddForm = document.getElementById('userAddForm');
                addUsernameInput = document.getElementById('addUsername');
                addEmailInput = document.getElementById('addEmail');
                addPasswordInput = document.getElementById('addPassword');
                addConfirmPasswordInput = document.getElementById('addConfirmPassword');
                addUsernameStatus = document.getElementById('addUsernameStatus');
                addEmailStatus = document.getElementById('addEmailStatus');
                addPasswordStatus = document.getElementById('addPasswordStatus');
                addRoleMatrix = document.getElementById('addRoleMatrix');
                addServerGrid = document.getElementById('addServerGrid');
                addDefaultServer = document.getElementById('addDefaultServer');
                addAdvancedPanel = document.getElementById('addAdvancedPanel');
                addAdvancedToggleText = document.getElementById('addAdvancedToggleText');
                submitUserAddBtn = document.getElementById('submitUserAddBtn');
            }

            // 打开弹窗
            function openUserAddModal() {
                // 每次打开时重新获取DOM引用（确保动态加载的内容被正确引用）
                initDomReferences();

                if (!modalOverlay) {
                    console.error('[UserAddModal] 未找到弹窗元素，可能页面尚未加载');
                    return;
                }

                modalOverlay.classList.add('show');
                document.body.style.overflow = 'hidden';

                // 加载服务器列表
                loadAvailableServers();

                // 聚焦用户名输入框
                if (addUsernameInput) {
                    setTimeout(() => addUsernameInput.focus(), 100);
                }
            }

            // 关闭弹窗
            function closeUserAddModal() {
                // 重新获取modalOverlay引用以防DOM已更新
                const overlay = document.getElementById('userAddModalOverlay');
                if (!overlay) {
                    console.warn('[UserAddModal] 关闭弹窗时未找到弹窗元素');
                    return;
                }

                overlay.classList.remove('show');
                document.body.style.overflow = '';
                resetForm();
            }

            // 重置表单
            function resetForm() {
                if (!userAddForm) return;

                userAddForm.reset();
                selectedRoles.clear();
                selectedRoles.add('USER');
                selectedServers.clear();

                updateValidation(addUsernameStatus, '用于登录及工作目录名称,需唯一。');
                updateValidation(addEmailStatus, '用于接收通知及重置密码,需唯一。');
                updateValidation(addPasswordStatus, '确保两次输入一致。');

                renderRoleChips();
                renderServerOptions();

                // 关闭高级选项
                if (addAdvancedPanel) {
                    addAdvancedPanel.classList.remove('show');
                    if (addAdvancedToggleText) {
                        addAdvancedToggleText.textContent = '展开';
                    }
                }
            }

            // 检查用户名唯一性
            async function checkUsernameAvailability(username) {
                if (!username || username.trim() === '') {
                    return {
                        status: 'idle',
                        message: '用于登录及工作目录名称,需唯一。'
                    };
                }

                try {
                    const response = await fetch(`/admin/api/users/check-username?username=${encodeURIComponent(username.trim())}`);
                    const data = await response.json();

                    return {
                        status: data.available ? 'success' : 'error',
                        message: data.message || (data.available ? '用户名可用。' : '该用户名已存在,请更换。')
                    };
                } catch (error) {
                    console.error('[UserAddModal] 检查用户名失败:', error);
                    return {
                        status: 'error',
                        message: '检查用户名时出错,请稍后重试。'
                    };
                }
            }

            // 检查邮箱唯一性
            async function checkEmailAvailability(email) {
                if (!email || email.trim() === '') {
                    return {
                        status: 'idle',
                        message: '用于接收通知及重置密码,需唯一。'
                    };
                }

                try {
                    const response = await fetch(`/admin/api/users/check-email?email=${encodeURIComponent(email.trim())}`);
                    const data = await response.json();

                    return {
                        status: data.available ? 'success' : 'error',
                        message: data.message || (data.available ? '邮箱可用。' : '该邮箱已存在,请更换。')
                    };
                } catch (error) {
                    console.error('[UserAddModal] 检查邮箱失败:', error);
                    return {
                        status: 'error',
                        message: '检查邮箱时出错,请稍后重试。'
                    };
                }
            }

            // 渲染角色按钮
            function renderRoleChips() {
                if (!addRoleMatrix) return;

                const roleChips = addRoleMatrix.querySelectorAll('.role-chip');
                roleChips.forEach(chip => {
                    const role = chip.dataset.role;
                    if (selectedRoles.has(role)) {
                        chip.classList.add('active');
                    } else {
                        chip.classList.remove('active');
                    }
                });
            }

            // 加载可用服务器列表
            async function loadAvailableServers() {
                try {
                    const response = await fetch('/admin/api/servers/available');
                    if (!response.ok) {
                        throw new Error('获取服务器列表失败');
                    }
                    availableServers = await response.json();
                    renderServerOptions();
                } catch (error) {
                    console.error('[UserAddModal] 加载服务器列表失败:', error);
                    showToast('加载服务器列表失败', 'error');
                }
            }

            // 渲染服务器选项
            function renderServerOptions() {
                if (!addServerGrid) return;

                addServerGrid.innerHTML = '';

                availableServers.forEach(server => {
                    const label = document.createElement('label');
                    label.className = 'checkbox-tile';

                    const isSelected = selectedServers.has(server.id);
                    const statusClass = server.connectionStatus === 'CONNECTED' || server.connectionStatus === 'MONITORING' ? 'active' : 'pending';

                    label.innerHTML = `
                        <header>
                            <div style="display:flex; align-items:center; gap: 8px;">
                                <input type="checkbox" value="${server.id}" ${isSelected ? 'checked' : ''}>
                                <span style="font-weight:600;">${server.name}</span>
                            </div>
                            <span class="status-pill ${statusClass}" style="font-size:11px;">
                                ${server.connectionStatus || 'UNKNOWN'}
                            </span>
                        </header>
                        <div class="tile-meta">${server.hostname}</div>
                    `;

                    const checkbox = label.querySelector('input[type="checkbox"]');
                    checkbox.addEventListener('change', function() {
                        const serverId = parseInt(this.value);
                        if (this.checked) {
                            selectedServers.add(serverId);
                        } else {
                            selectedServers.delete(serverId);
                        }
                        renderDefaultServerOptions();
                    });

                    addServerGrid.appendChild(label);
                });

                renderDefaultServerOptions();
            }

            // 渲染默认服务器下拉选项
            function renderDefaultServerOptions() {
                if (!addDefaultServer) return;

                const selected = Array.from(selectedServers);
                addDefaultServer.innerHTML = '';

                if (selected.length === 0) {
                    addDefaultServer.disabled = true;
                    const option = document.createElement('option');
                    option.value = '';
                    option.textContent = '尚未勾选服务器';
                    addDefaultServer.appendChild(option);
                    return;
                }

                addDefaultServer.disabled = false;
                selected.forEach(id => {
                    const server = availableServers.find(s => s.id === id);
                    if (server) {
                        const option = document.createElement('option');
                        option.value = server.id;
                        option.textContent = `${server.name} · ${server.hostname}`;
                        addDefaultServer.appendChild(option);
                    }
                });
            }

            // 构建请求payload
            function buildPayload() {
                const formData = new FormData(userAddForm);
                const accountEnabled = document.getElementById('addAccountEnabled');
                const forceReset = document.getElementById('addForceReset');
                const sendWelcome = document.getElementById('addSendWelcome');

                const payload = {
                    username: (formData.get('username') || '').trim(),
                    email: (formData.get('email') || '').trim(),
                    fullName: (formData.get('fullName') || '').trim() || null,
                    department: (formData.get('department') || '').trim() || null,
                    password: formData.get('password'),
                    enabled: accountEnabled ? accountEnabled.checked : true,
                    enforcePasswordReset: forceReset ? forceReset.checked : false,
                    roles: Array.from(selectedRoles),
                    serverIds: Array.from(selectedServers),
                    defaultServerId: addDefaultServer.value ? parseInt(addDefaultServer.value) : null,
                    workDirectory: (formData.get('workspacePath') || '').trim() || null,
                    sendWelcomeMail: sendWelcome ? sendWelcome.checked : false
                };

                return payload;
            }

            // 提交表单
            async function handleSubmit(event) {
                event.preventDefault();

                const password = addPasswordInput.value;
                const confirmPassword = addConfirmPasswordInput.value;

                // 验证密码
                if (!password || password.length < 8) {
                    showToast('❌ 密码至少 8 位且需包含字母与数字', 'error');
                    return;
                }

                if (password !== confirmPassword) {
                    showToast('❌ 两次密码输入不一致', 'error');
                    return;
                }

                // 验证角色
                if (selectedRoles.size === 0) {
                    showToast('❌ 请至少选择一个角色', 'error');
                    return;
                }

                // 验证必填项
                if (!addUsernameInput.value || !addEmailInput.value) {
                    showToast('❌ 请补全必填信息', 'error');
                    return;
                }

                // 显示加载状态
                submitUserAddBtn.classList.add('is-loading');
                submitUserAddBtn.disabled = true;

                try {
                    const payload = buildPayload();
                    console.log('[UserAddModal] 提交用户数据:', payload);

                    // 获取CSRF token
                    const csrfToken = document.querySelector('meta[name="_csrf"]')?.content;
                    const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.content;

                    const headers = {
                        'Content-Type': 'application/json'
                    };

                    // 添加CSRF header
                    if (csrfToken && csrfHeader) {
                        headers[csrfHeader] = csrfToken;
                    }

                    const response = await fetch('/admin/api/users', {
                        method: 'POST',
                        headers: headers,
                        body: JSON.stringify(payload)
                    });

                    const result = await response.json();

                    if (!response.ok) {
                        throw new Error(result.message || '创建用户失败');
                    }

                    showToast('✅ ' + (result.message || '用户创建成功'), 'success');
                    closeUserAddModal();

                    // 刷新用户列表
                    if (window.AppShell && window.AppShell.emit) {
                        window.AppShell.emit('user:created', result.user);
                    }

                    // 如果当前在用户权限管理页面,刷新列表
                    if (typeof refreshUserList === 'function') {
                        refreshUserList();
                    }
                } catch (error) {
                    console.error('[UserAddModal] 创建用户失败:', error);
                    showToast('❌ ' + error.message, 'error');
                } finally {
                    submitUserAddBtn.classList.remove('is-loading');
                    submitUserAddBtn.disabled = false;
                }
            }

            // 初始化事件监听器
            function initEventListeners() {
                // 等待DOM加载完成
                if (document.readyState === 'loading') {
                    document.addEventListener('DOMContentLoaded', () => {
                        initDomReferences();
                        attachEventListeners();
                        setupPageUnloadCleanup();
                    });
                } else {
                    initDomReferences();
                    attachEventListeners();
                    setupPageUnloadCleanup();
                }
            }

            // 设置页面卸载清理
            function setupPageUnloadCleanup() {
                window.addEventListener('beforeunload', () => {
                    // 清理服务器群组管理的定时器
                    stopServerGroupAutoRefresh();
                });
            }

            function attachEventListeners() {
                // 打开弹窗按钮 (使用事件委托)
                document.addEventListener('click', function(e) {
                    if (e.target && (e.target.id === 'addUserBtn' || e.target.closest('#addUserBtn'))) {
                        e.preventDefault();
                        openUserAddModal();
                    }

                    // 关闭弹窗按钮 (使用事件委托)
                    if (e.target && (e.target.id === 'closeUserAddModal' || e.target.closest('#closeUserAddModal'))) {
                        e.preventDefault();
                        closeUserAddModal();
                    }

                    // 取消按钮 (使用事件委托)
                    if (e.target && (e.target.id === 'cancelUserAddBtn' || e.target.closest('#cancelUserAddBtn'))) {
                        e.preventDefault();
                        closeUserAddModal();
                    }

                    // 点击遮罩层关闭 (使用事件委托)
                    if (e.target && e.target.id === 'userAddModalOverlay' && e.target.classList.contains('modal-overlay')) {
                        closeUserAddModal();
                    }

                    // 密码显示/隐藏切换
                    if (e.target && e.target.id === 'addPasswordToggle') {
                        const passwordInput = document.getElementById('addPassword');
                        if (passwordInput) {
                            const type = passwordInput.type === 'password' ? 'text' : 'password';
                            passwordInput.type = type;
                            e.target.textContent = type === 'password' ? '👁️' : '👁️‍🗨️';
                        }
                    }
                });

                // ESC键关闭
                document.addEventListener('keydown', function(e) {
                    const overlay = document.getElementById('userAddModalOverlay');
                    if (e.key === 'Escape' && overlay && overlay.classList.contains('show')) {
                        closeUserAddModal();
                    }
                });

                // 表单提交 (使用事件委托)
                document.addEventListener('submit', function(e) {
                    if (e.target && e.target.id === 'userAddForm') {
                        handleSubmit(e);
                    }
                });

                // 使用事件委托处理输入验证
                document.addEventListener('blur', async function(e) {
                    // 用户名唯一性检查
                    if (e.target && e.target.id === 'addUsername') {
                        const result = await checkUsernameAvailability(e.target.value);
                        const statusElement = document.getElementById('addUsernameStatus');
                        updateValidation(
                            statusElement,
                            result.message,
                            result.status === 'success' ? 'success' : result.status === 'error' ? 'error' : undefined
                        );
                    }

                    // 邮箱唯一性检查
                    if (e.target && e.target.id === 'addEmail') {
                        const result = await checkEmailAvailability(e.target.value);
                        const statusElement = document.getElementById('addEmailStatus');
                        updateValidation(
                            statusElement,
                            result.message,
                            result.status === 'success' ? 'success' : result.status === 'error' ? 'error' : undefined
                        );
                    }
                }, true); // 使用捕获阶段

                // 使用事件委托处理输入事件
                document.addEventListener('input', function(e) {
                    // 密码一致性检查
                    if (e.target && e.target.id === 'addConfirmPassword') {
                        const passwordInput = document.getElementById('addPassword');
                        const statusElement = document.getElementById('addPasswordStatus');
                        if (!e.target.value) {
                            updateValidation(statusElement, '确保两次输入一致。');
                            return;
                        }
                        if (e.target.value === passwordInput.value) {
                            updateValidation(statusElement, '两次输入一致。', 'success');
                        } else {
                            updateValidation(statusElement, '密码不一致,请重新确认。', 'error');
                        }
                    }
                });

                // 角色选择 (使用事件委托)
                document.addEventListener('click', function(e) {
                    const chip = e.target.closest('.role-chip');
                    const roleMatrix = document.getElementById('addRoleMatrix');
                    if (chip && roleMatrix && roleMatrix.contains(chip)) {
                        const role = chip.dataset.role;
                        if (selectedRoles.has(role)) {
                            selectedRoles.delete(role);
                        } else {
                            selectedRoles.add(role);
                        }

                        // 至少保留一个角色
                        if (selectedRoles.size === 0) {
                            selectedRoles.add('USER');
                            showToast('⚠️ 至少保留一个角色', 'warning');
                        }

                        renderRoleChips();
                    }

                    // 高级选项切换
                    if (e.target && (e.target.id === 'addAdvancedToggle' || e.target.closest('#addAdvancedToggle'))) {
                        const panel = document.getElementById('addAdvancedPanel');
                        const toggleText = document.getElementById('addAdvancedToggleText');
                        if (panel && toggleText) {
                            const isShown = panel.classList.toggle('show');
                            toggleText.textContent = isShown ? '收起' : '展开';
                        }
                    }
                });
            }

            // 初始化
            initEventListeners();

            // 暴露API
            window.UserAddModal = {
                open: openUserAddModal,
                close: closeUserAddModal
            };
        })();
    </script>
</body>
</html>
