<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/springsecurity" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:utext="${appName != null ? appName : 'Dev Debug Platform &#x63A7;&#x5236;&#x53F0;'}">Dev Debug Platform &#x63A7;&#x5236;&#x53F0;</title>
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />

    <link rel="preload" href="/vendor/fontawesome/webfonts/fa-solid-900.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/vendor/fontawesome/webfonts/fa-regular-400.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/css/design-tokens.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/components/navigation.css">
    <link rel="stylesheet" href="/css/components/buttons.css">
    <link rel="stylesheet" href="/css/components/cards.css">
    <link rel="stylesheet" href="/css/fontawesome-local.css">
    <link rel="stylesheet" href="/css/icon-components.css">
    <link rel="stylesheet" href="/css/brand-icons.css">
    <link rel="stylesheet" href="/css/responsive.css">
    <link rel="stylesheet" href="/css/content-framework.css">
    <link rel="stylesheet" href="/css/admin-dashboard.css">
    <link rel="stylesheet" th:href="@{/admin-dashboard/stat-cards.css}">
    <link rel="stylesheet" href="/css/server-group-management.css">
    <link rel="stylesheet" href="/css/user-permission-management.css">
    <link rel="stylesheet" href="/css/server-modal.css">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/svg+xml" sizes="16x16" href="/favicon-16x16.svg">
    <link rel="icon" type="image/svg+xml" sizes="32x32" href="/favicon-32x32.svg">
    <link rel="icon" type="image/png" href="/favicon.png">

    <style>
        *:focus-visible {
            outline: 2px solid var(--focus-outline-color, var(--primary-color, #2F9BFF));
            outline-offset: 2px;
            border-radius: 4px;
        }

        *:focus:not(:focus-visible) {
            outline: none;
        }

        button:focus-visible,
        a:focus-visible,
        .btn:focus-visible {
            outline: 2px solid var(--focus-outline-color, var(--primary-color, #2F9BFF));
            outline-offset: 2px;
            box-shadow: 0 0 0 4px rgba(47, 155, 255, 0.15);
            border-radius: 6px;
        }

        :root {
            color-scheme: light dark;
            --shell-header-height: 64px;
            --shell-sidebar-width: 240px;
            --shell-sidebar-width-collapsed: 72px;
            --shell-background: var(--background-color, #F4F5FB);
            --shell-surface: var(--surface-color, rgba(255,255,255,0.92));
            --shell-glass: rgba(255,255,255,0.78);
            --shell-border: rgba(255,255,255,0.6);
            --shell-border-dark: rgba(15,23,42,0.18);
            --shell-text-primary: var(--text-color, #0F172A);
            --shell-text-secondary: rgba(15,23,42,0.8);
            --shell-accent: linear-gradient(135deg, #2F9BFF, #3BC6B8);
            --shell-accent-dev: linear-gradient(135deg, #6C63FF, #3D8BFF);
            --shell-scrollbar: rgba(15,23,42,0.18);
        }

        /* 使用data-theme属性作为主题切换的标准 */
        [data-theme="dark"] {
            --shell-background: #111827;
            --shell-surface: rgba(30,41,59,0.92);
            --shell-glass: rgba(30,41,59,0.82);
            --shell-border: rgba(148,163,184,0.32);
            --shell-border-dark: rgba(15,23,42,0.36);
            --shell-text-primary: #F9FAFB;
            --shell-text-secondary: rgba(226,232,240,0.72);
            --shell-scrollbar: rgba(148,163,184,0.35);
        }
        
        /* 为了向后兼容，保留shell-theme-dark类，但内容与data-theme="dark"保持一致 */
        .shell-theme-dark {
            --shell-background: #111827;
            --shell-surface: rgba(30,41,59,0.92);
            --shell-glass: rgba(30,41,59,0.82);
            --shell-border: rgba(148,163,184,0.32);
            --shell-border-dark: rgba(15,23,42,0.36);
            --shell-text-primary: #F9FAFB;
            --shell-text-secondary: rgba(226,232,240,0.72);
            --shell-scrollbar: rgba(148,163,184,0.35);
        }

        body.layout-shell {
            margin: 0;
            height: 100vh;
            overflow: hidden; /* 防止body滚动 */
            background: var(--shell-background);
            color: var(--shell-text-primary);
            font-family: "Inter", "Segoe UI", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", sans-serif;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .shell-grid {
            display: grid;
            grid-template-columns: var(--shell-sidebar-width) 1fr;
            grid-template-rows: var(--shell-header-height) 1fr;
            height: 100vh;
            overflow: hidden; /* 防止整个页面滚动 */
            grid-template-areas: "sidebar header" "sidebar content";
        }

        .shell-grid[data-sidebar-state="collapsed"] {
            grid-template-columns: var(--shell-sidebar-width-collapsed) 1fr;
            grid-template-areas: "sidebar header" "sidebar content";
        }

        .shell-header {
            grid-area: header;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 16px;
            padding: 0 24px;
            height: var(--shell-header-height);
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
            color: #f8fafc;
            border-bottom: 1px solid rgba(59, 130, 246, 0.3);
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px rgba(15, 23, 42, 0.15);
            position: sticky;
            top: 0;
            z-index: 4;
        }

        .shell-header::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, #3b82f6, #06b6d4, #8b5cf6);
            background-size: 300% 100%;
            animation: techGlow 3s linear infinite;
        }

        @keyframes techGlow {
            0% { background-position: 0% 0%; }
            100% { background-position: 300% 0%; }
        }

        .shell-header[data-variant="dev"] .brand-logo {
            background: var(--shell-accent-dev);
        }

        .brand-area {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .brand-logo {
            width: 32px;
            height: 32px;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            color: #FFFFFF;
            background: var(--shell-accent);
        }


        .shell-search {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 10px 18px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: clamp(220px, 24vw, 320px);
            flex-shrink: 0;
            transition: border 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            backdrop-filter: blur(10px);
        }

        .shell-search:hover,
        .shell-search:focus-within {
            border-color: rgba(59, 130, 246, 0.5);
            box-shadow: 0 12px 32px rgba(59, 130, 246, 0.18);
            background: rgba(59, 130, 246, 0.1);
        }

        .shell-search-icon {
            width: 24px;
            height: 24px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            opacity: 0.8;
            color: rgba(248, 250, 252, 0.8);
        }

        .shell-search-placeholder {
            flex: 1;
            min-width: 0;
            font-size: 14px;
            color: rgba(248, 250, 252, 0.7);
        }

        .shell-search-shortcut {
            font-size: 12px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 999px;
            background: rgba(59, 130, 246, 0.2);
            color: rgba(59, 130, 246, 0.9);
            letter-spacing: 0.6px;
        }

        .shell-toolbar {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 12px;
            flex-wrap: wrap;
        }

        .toolbar-btn,
        .toolbar-toggle {
            width: 36px;
            height: 36px;
            border-radius: 12px;
            border: 1px solid rgba(59, 130, 246, 0.3);
            background: rgba(59, 130, 246, 0.1);
            box-shadow: 0 3px 10px rgba(15,23,42,0.16);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border 0.2s ease;
            color: #f8fafc;
            backdrop-filter: blur(10px);
        }

        .toolbar-toggle {
            width: auto;
            min-width: 36px;
            padding: 0 12px;
            gap: 6px;
        }

        .theme-label {
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
        }

        .toolbar-btn:hover,
        .toolbar-toggle:hover {
            transform: translateY(-1px);
            background: rgba(59, 130, 246, 0.2);
            box-shadow: 0 6px 18px rgba(59, 130, 246, 0.3);
            border-color: rgba(59, 130, 246, 0.5);
        }

        .toolbar-btn:focus,
        .toolbar-btn:focus-visible,
        .toolbar-toggle:focus,
        .toolbar-toggle:focus-visible {
            outline: none;
            box-shadow: none;
        }

        .toolbar-toggle[data-state="on"] .toggle-indicator {
            opacity: 1;
        }

        .language-switcher {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 12px;
            height: 36px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.65);
            background: rgba(255,255,255,0.7);
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.6px;
            cursor: pointer;
        }

        .toolbar-divider {
            width: 1px;
            height: 28px;
            background: rgba(15,23,42,0.12);
        }

        .sidebar {
            grid-area: sidebar;
            background: linear-gradient(180deg, #374151 0%, #4b5563 100%);
            color: #f3f4f6;
            border-right: 1px solid #6b7280;
            box-shadow: 8px 0 24px rgba(15, 23, 42, 0.12);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            overflow-x: hidden;
            transition: all var(--transition-slow);
            position: relative;
            z-index: 2;
        }

        .sidebar-content {
            flex: 1;
            padding: 18px 16px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .sidebar-brand {
            margin-bottom: 24px;
        }

        .sidebar-brand .brand-area {
            width: 100%;
            padding: 14px 16px;
            border-radius: 18px;
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid rgba(59, 130, 246, 0.4);
            backdrop-filter: blur(8px);
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(59, 130, 246, 0.15);
        }

        .sidebar-brand .brand-area:focus-visible {
            outline: none;
            box-shadow: 0 0 0 2px rgba(47, 155, 255, 0.28);
        }

        .sidebar[data-state="collapsed"] .sidebar-brand {
            margin-bottom: 12px;
        }

        .sidebar[data-state="collapsed"] .sidebar-brand .brand-area {
            justify-content: center;
            padding: 12px;
            border: none;
            background: transparent;
        }

        .sidebar[data-state="collapsed"] .sidebar-brand .brand-meta {
            display: none;
        }

        .sidebar[data-state="collapsed"] .sidebar-brand .brand-icon-container {
            margin: 0;
        }

        .sidebar[data-variant="admin"] .brand-icon-container {
            background: linear-gradient(135deg, #3b82f6, #06b6d4);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }

        .sidebar[data-variant="developer"] .brand-icon-container {
            background: linear-gradient(135deg, #3b82f6, #06b6d4);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }

        .sidebar-content::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar-content::-webkit-scrollbar-thumb {
            background: rgba(15, 23, 42, 0.2);
            border-radius: 3px;
        }

        .sidebar-content::-webkit-scrollbar-track {
            background: transparent;
        }

        /* 折叠状态下隐藏滚动条 */
        .sidebar[data-state="collapsed"] .sidebar-content::-webkit-scrollbar {
            width: 0;
        }

        /* 响应式断点调整 */
        @media (max-width: 1024px) {
            .shell-grid {
                grid-template-columns: 1fr;
                grid-template-rows: var(--shell-header-height) 1fr;
                grid-template-areas: "header" "content";
            }

            .sidebar {
                position: fixed;
                top: var(--shell-header-height);
                left: 0;
                height: calc(100vh - var(--shell-header-height));
                z-index: 2;
                transform: translateX(-100%);
                transition: transform 0.3s ease;
            }

            .sidebar[data-state="expanded"] {
                transform: translateX(0);
            }

            .content {
                grid-column: 1 / -1;
                grid-row: 2 / -1;
            }
        }

        @media (max-width: 768px) {
            .shell-grid {
                grid-template-columns: 1fr;
                grid-template-areas: "header" "content";
            }

            .shell-header {
                grid-area: header;
                padding: 0 16px;
            }

            .brand-area {
                min-width: 200px;
            }

            .shell-search {
                width: 100%;
            }

            /* 移动端内容区域样式 - 与content-framework完全一致 */
            .content {
                --content-padding: 16px;
                --section-gap: 16px;
            }

            /* 移动端直接使用content的样式变量 */
        }

        /* ================================================
           内容区域 - 与content-framework完全一致
           ================================================ */
        .content {
            grid-area: content;
            padding: var(--content-padding, 24px 32px);
            background: var(--content-bg, rgba(248, 250, 255, 0.72));
            min-height: 100%;
            display: flex;
            flex-direction: column;
            gap: var(--section-gap, 24px);
            overflow-y: auto;
            overflow-x: hidden;
            transition: padding var(--transition-slow, 0.3s ease);
        }

        /* content-framework样式直接应用到content */

        /* 根据用户角色定义全局主题变量 */
        .layout-shell[data-variant="admin"] {
            --primary-gradient: linear-gradient(135deg, #2F9BFF, #3BC6B8);
            /* admin-dashboard.css 兼容变量 */
            --shell-background: rgba(248, 250, 255, 0.72);
            --shell-surface: rgba(255, 255, 255, 0.92);
            --shell-border: rgba(226, 232, 240, 0.8);
            --shell-text-primary: #0F172A;
            --shell-text-secondary: #64748B;
            --accent-color: #2F9BFF;
            --secondary-color: #3BC6B8;
        }
        .layout-shell[data-variant="developer"] {
            --primary-gradient: linear-gradient(135deg, #6C63FF, #3D8BFF);
            /* admin-dashboard.css 兼容变量 */
            --shell-background: rgba(240, 242, 255, 0.75);
            --shell-surface: rgba(255, 255, 255, 0.94);
            --shell-border: rgba(199, 210, 254, 0.7);
            --shell-text-primary: #1E1B4B;
            --shell-text-secondary: #6366F1;
            --accent-color: #6C63FF;
            --secondary-color: #3D8BFF;
        }

        /* 管理员主题 - 与content-framework完全一致 */
        .layout-shell .content.admin-theme {
            --primary-gradient: linear-gradient(135deg, #2F9BFF, #3BC6B8);
            --primary-color: #2F9BFF;
            --primary-hover: #1E88E5;
            --secondary-color: #3BC6B8;
            --success-color: #22C55E;
            --warning-color: #F59E0B;
            --error-color: #EF4444;
            --info-color: #3B82F6;

            --content-bg: rgba(248, 250, 255, 0.72);
            --card-bg: rgba(255, 255, 255, 0.92);
            --toolbar-bg: rgba(255, 255, 255, 0.8);
            --border-color: rgba(226, 232, 240, 0.8);

            --text-primary: #0F172A;
            --text-secondary: #64748B;
            --text-muted: #94A3B8;
            --text-inverse: #FFFFFF;

            /* 内容区域间距 */
            --content-padding: 24px 32px;
            --section-gap: 24px;
            --card-gap: 16px;
            --component-gap: 12px;

            /* 边框圆角规范 */
            --border-radius-sm: 8px;
            --border-radius: 12px;
            --border-radius-lg: 16px;
            --border-radius-xl: 20px;

            /* 阴影规范 */
            --shadow-xs: 0 1px 2px rgba(15, 23, 42, 0.05);
            --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.1), 0 1px 2px rgba(15, 23, 42, 0.06);
            --shadow: 0 1px 3px rgba(15, 23, 42, 0.1), 0 1px 2px rgba(15, 23, 42, 0.06);
            --shadow-md: 0 4px 6px rgba(15, 23, 42, 0.07), 0 2px 4px rgba(15, 23, 42, 0.06);
            --shadow-lg: 0 10px 15px rgba(15, 23, 42, 0.1), 0 4px 6px rgba(15, 23, 42, 0.05);
            --shadow-hover: 0 8px 20px rgba(15, 23, 42, 0.12), 0 3px 8px rgba(15, 23, 42, 0.08);

            /* 过渡动画 */
            --transition-fast: 0.15s ease;
            --transition-normal: 0.2s ease;
            --transition-slow: 0.3s ease;

            background: var(--content-bg);
        }

        /* 开发者主题 - 与content-framework完全一致 */
        .layout-shell .content.developer-theme {
            --primary-gradient: linear-gradient(135deg, #6C63FF, #3D8BFF);
            --primary-color: #6C63FF;
            --primary-hover: #5B54D8;
            --secondary-color: #3D8BFF;
            --success-color: #10B981;
            --warning-color: #F59E0B;
            --error-color: #EF4444;
            --info-color: #8B5CF6;

            --content-bg: rgba(240, 242, 255, 0.75);
            --card-bg: rgba(255, 255, 255, 0.94);
            --toolbar-bg: rgba(248, 250, 255, 0.85);
            --border-color: rgba(199, 210, 254, 0.7);

            --text-primary: #1E1B4B;
            --text-secondary: #6366F1;
            --text-muted: #A5B4FC;
            --text-inverse: #FFFFFF;

            background: var(--content-bg);
        }

        /* Demo页面中的内容元素样式 */
        .content .caption {
            font-size: 12px;
            color: rgba(15,23,42,0.55);
        }

        .content .placeholder {
            height: 180px;
            border-radius: 18px;
            background: repeating-linear-gradient(135deg, rgba(59,130,246,0.12), rgba(59,130,246,0.12) 12px, rgba(59,130,246,0.04) 12px, rgba(59,130,246,0.04) 24px);
        }


        .spa-placeholder {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px dashed rgba(37,99,235,0.2);
            border-radius: 20px;
            color: var(--shell-text-secondary);
            background: rgba(37,99,235,0.06);
        }

        .sidebar-backdrop {
            display: none;
        }

        @media (max-width: 1280px) {
            .shell-search {
                width: 100%;
            }
        }

        @media (max-width: 1024px) {
            .shell-grid {
                grid-template-columns: 1fr;
            }

            .sidebar {
                position: fixed;
                inset: var(--shell-header-height) auto 0 0;
                transform: translateX(-100%);
                max-width: var(--shell-sidebar-width);
                width: calc(100vw - 64px);
                box-shadow: 12px 0 32px rgba(15,23,42,0.32);
            }

            .sidebar[data-state="expanded"] {
                transform: translateX(0);
            }

            .content {
                grid-column: 1 / -1;
            }

            .sidebar-backdrop {
                display: block;
                position: fixed;
                inset: var(--shell-header-height) 0 0 0;
                background: rgba(15,23,42,0.45);
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.3s ease;
                z-index: 3;
            }

            .sidebar-backdrop[data-state="visible"] {
                opacity: 1;
                pointer-events: auto;
            }
        }

        .user-menu {
            position: relative;
            display: flex;
            align-items: center;
        }

        .user-menu__toggle {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 6px 12px;
            border: 1px solid rgba(15,23,42,0.12);
            border-radius: 999px;
            background: transparent;
            color: inherit;
            font: inherit;
            cursor: pointer;
            transition: background 0.2s ease, border-color 0.2s ease;
        }

        .user-menu__toggle:hover,
        .user-menu[data-open="true"] .user-menu__toggle {
            background: rgba(59,130,246,0.08);
            border-color: rgba(59,130,246,0.24);
        }

        .user-menu__avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            background: linear-gradient(135deg, #6366F1, #3B82F6);
            color: #FFFFFF;
        }

        .user-menu__meta {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            line-height: 1.1;
        }

        .user-menu__name {
            font-size: 14px;
            font-weight: 600;
        }

        .user-menu__role {
            font-size: 12px;
            color: var(--shell-text-secondary);
        }

        .user-menu__caret {
            font-size: 12px;
            opacity: 0.6;
        }

        .user-menu__dropdown {
            position: absolute;
            top: calc(100% + 12px);
            right: 0;
            min-width: 220px;
            display: none;
            flex-direction: column;
            gap: 12px;
            padding: 16px;
            border-radius: 16px;
            background: var(--shell-surface);
            box-shadow: 0 20px 48px rgba(15,23,42,0.18);
            border: 1px solid var(--shell-border);
            z-index: 10;
        }

        .user-menu[data-open="true"] .user-menu__dropdown {
            display: flex;
        }

        .user-menu__header {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .user-menu__header-name {
            font-size: 15px;
            font-weight: 600;
            color: var(--shell-text-primary);
        }

        .user-menu__header-role {
            font-size: 12px;
            color: var(--shell-text-secondary);
        }

        /* 深色主题下的用户菜单样式 */
        .shell-theme-dark .user-menu__role,
        [data-theme="dark"] .user-menu__role {
            color: #ffffff !important;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
            font-weight: 600;
        }

        .shell-theme-dark .user-menu__header-role,
        [data-theme="dark"] .user-menu__header-role {
            color: rgba(226,232,240,0.8) !important;
        }

        .shell-theme-dark .user-menu__header-name,
        [data-theme="dark"] .user-menu__header-name {
            color: #F9FAFB !important;
        }

        .shell-theme-dark .user-menu__option,
        [data-theme="dark"] .user-menu__option {
            color: #F9FAFB !important;
        }

        .user-menu__options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .user-menu__option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            border-radius: 10px;
            color: var(--shell-text-primary);
            text-decoration: none;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .user-menu__option i {
            width: 16px;
            text-align: center;
        }

        .user-menu__option:hover {
            background: rgba(59,130,246,0.1);
            color: #1D4ED8;
        }

        .user-menu__option--danger {
            width: 100%;
            border: none;
            background: transparent;
            font: inherit;
            text-align: left;
            cursor: pointer;
        }

        .user-menu__option--danger:hover {
            background: rgba(248,113,113,0.12);
            color: #DC2626;
        }

        .user-menu__footer form {
            margin: 0;
        }

        @media (max-width: 768px) {
            .user-menu__meta {
                display: none;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                transition: none !important;
                animation: none !important;
            }
            .toolbar-btn,
            .toolbar-toggle {
                transition: none;
            }
        }

        /* 极简终端背景样式 */
        .minimal-terminal-bg {
            position: absolute;
            inset: 0;
            opacity: 0.06;
            overflow: hidden;
            pointer-events: none;
        }

        /* 简洁的代码行 */
        .code-snippet {
            position: absolute;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: #64748b;
            white-space: nowrap;
            opacity: 0;
            animation: codeReveal 8s ease-in-out infinite;
        }

        @keyframes codeReveal {
            0%, 20% {
                opacity: 0;
                transform: translateX(-30px);
            }
            25%, 75% {
                opacity: 0.4;
                transform: translateX(0);
            }
            80%, 100% {
                opacity: 0;
                transform: translateX(30px);
            }
        }

        /* 简约的连接线 */
        .connection-lines {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .connect-line {
            position: absolute;
            background: linear-gradient(90deg, transparent, #64748b, transparent);
            height: 1px;
            opacity: 0;
            animation: lineAppear 6s ease-in-out infinite;
        }

        @keyframes lineAppear {
            0%, 40% {
                opacity: 0;
                transform: scaleX(0);
                transform-origin: left;
            }
            50%, 90% {
                opacity: 0.3;
                transform: scaleX(1);
            }
            100% {
                opacity: 0;
                transform: scaleX(0);
                transform-origin: right;
            }
        }

        /* 极简状态点 */
        .status-dots {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 8px;
            opacity: 0.2;
            pointer-events: none;
        }

        .status-dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            animation: dotPulse 4s ease-in-out infinite;
        }

        @keyframes dotPulse {
            0%, 70% {
                opacity: 0.2;
                transform: scale(1);
            }
            35% {
                opacity: 0.8;
                transform: scale(1.5);
            }
        }

        /* 极简命令行光标 */
        .terminal-cursor {
            position: absolute;
            bottom: 30px;
            left: 20px;
            width: 2px;
            height: 16px;
            background: #64748b;
            opacity: 0.3;
            animation: cursorBlink 2s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes cursorBlink {
            0%, 50% {
                opacity: 0.3;
            }
            25% {
                opacity: 0.8;
            }
        }

        /* 简约版本号 */
        .version-display {
            position: absolute;
            bottom: 15px;
            right: 15px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 9px;
            color: #64748b;
            opacity: 0.2;
            animation: versionFade 5s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes versionFade {
            0%, 80% {
                opacity: 0.1;
            }
            40% {
                opacity: 0.4;
            }
        }

        /* 进度条指示器 */
        .progress-indicators {
            position: absolute;
            left: 8px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 20px;
            opacity: 0.15;
            pointer-events: none;
        }

        .progress-bar {
            width: 3px;
            height: 30px;
            background: rgba(100, 116, 139, 0.2);
            border-radius: 2px;
            position: relative;
            overflow: hidden;
        }

        .progress-fill {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(0deg, #22c55e, #3b82f6);
            border-radius: 2px;
            animation: progressGrow 4s ease-in-out infinite;
        }

        @keyframes progressGrow {
            0%, 20% {
                height: 0%;
                opacity: 0.3;
            }
            60% {
                height: 80%;
                opacity: 0.8;
            }
            100% {
                height: 0%;
                opacity: 0.3;
            }
        }

        /* 确保侧边栏内容在背景之上 */
        .sidebar-content {
            position: relative;
            z-index: 10;
        }
    </style>
</head>

    <!-- Chart.js CDN -->
    <script src="/vendor/chartjs/chart.min.js"></script>
    <script src="/js/server-modal.js"></script>

    <script>
        (function () {
            const root = document.documentElement;
            const body = document.body;
            const shellRoot = document.querySelector('[data-shell-root]');
            const sidebar = document.querySelector('[data-role="shell-sidebar"]');
            const backdrop = document.querySelector('[data-role="sidebar-backdrop"]');
            const THEME_KEY = 'app-shell-theme';
            const SIDEBAR_KEY = 'app-shell-sidebar-state';
            const LANGUAGE_KEY = 'app-shell-language';
            const eventBus = new EventTarget();
            const SERVER_VIEW_MODE_KEY = 'admin-dashboard-server-view-mode';

            if (!shellRoot) {
                console.warn('[AppShell] 未找到布局根节点，停止初始化。');
                return;
            }

            let currentTheme = 'light';
            let currentLanguage = 'zh';
            let sidebarState = shellRoot.dataset.sidebarState || 'expanded';
            let serverPanelCache = [];
            let userTrendPoints = [];

            // 全局国际化配置对象
            const i18n = {
                en: {
                    // 图表相关
                    chart: {
                        // 负载分布图表
                        cpu: 'CPU Average Load',
                        memory: 'Memory Average Usage',
                        disk: 'Disk Average Usage',
                        //network: 'Network Average Traffic',
                        // 应用分布图表
                        total: 'Total Applications',
                        // 图表轴标签
                        healthScore: 'Health Score',
                        time: 'Time',
                        usagePercent: 'Usage (%)',
                        applicationCount: 'Application Count'
                    }
                },
                zh: {
                    // 图表相关
                    chart: {
                        // 负载分布图表
                        cpu: 'CPU平均负载',
                        memory: '内存平均使用率',
                        disk: '磁盘平均使用率',
                        //network: '网络平均流量',
                        // 应用分布图表
                        total: '应用总数',
                        // 图表轴标签
                        healthScore: '健康分数',
                        time: '时间',
                        usagePercent: '使用率 (%)',
                        applicationCount: '应用数量'
                    }
                }
            };

            // 国际化辅助函数
            function t(key, category = 'chart') {
                try {
                    return i18n[currentLanguage][category][key] || key;
                } catch (e) {
                    console.warn(`[i18n] Translation not found: ${category}.${key}`);
                    return key;
                }
            }

            function persist(key, value) {
                try {
                    localStorage.setItem(key, value);
                } catch (error) {
                    console.warn('[AppShell] 无法写入本地存储:', error);
                }
            }

            function load(key) {
                try {
                    return localStorage.getItem(key);
                } catch (error) {
                    console.warn('[AppShell] 无法读取本地存储:', error);
                    return null;
                }
            }

            function applyTheme(theme, persistPref = true) {
                currentTheme = theme === 'dark' ? 'dark' : 'light';
                root.dataset.theme = currentTheme;
                
                // 移除旧的主题类，统一使用data-theme属性
                root.classList.remove('shell-theme-light', 'shell-theme-dark');
                
                // 为了兼容旧组件，仍然保留dark-mode类
                body.classList.toggle('dark-mode', currentTheme === 'dark');

                const toggle = document.querySelector('[data-action="toggle-theme"]');
                if (toggle) {
                    toggle.setAttribute('aria-pressed', String(currentTheme === 'dark'));

                    // 更新图标和文字
                    const icon = toggle.querySelector('span[aria-hidden="true"]:first-child');
                    const label = toggle.querySelector('.theme-label');

                    if (currentTheme === 'dark') {
                        if (icon) icon.innerHTML = '🌙'; // 月亮图标
                        if (label) label.innerHTML = '暗色';
                    } else {
                        if (icon) icon.innerHTML = '☀️'; // 太阳图标
                        if (label) label.innerHTML = '浅色';
                    }
                }

                if (persistPref) {
                    persist(THEME_KEY, currentTheme);
                }

                emit('theme:changed', { theme: currentTheme });
            }

            function applyLanguage(lang, persistPref = true, emitEvent = true) {
                const normalized = (typeof lang === 'string' && lang.toLowerCase() === 'en') ? 'en' : 'zh';
                currentLanguage = normalized;

                document.documentElement.setAttribute('lang', currentLanguage === 'en' ? 'en' : 'zh-CN');

                const languageToggleButton = document.querySelector('[data-action="toggle-language"]');
                if (languageToggleButton) {
                    const label = languageToggleButton.querySelector('span');
                    if (label) {
                        label.textContent = currentLanguage === 'en' ? 'EN' : 'ZH';
                    }
                    languageToggleButton.setAttribute('aria-pressed', String(currentLanguage === 'en'));
                }

                // 更新标题栏元素
                updateHeaderLanguage(currentLanguage);

                // 更新侧边栏元素
                updateSidebarLanguage(currentLanguage);

                const translatable = document.querySelectorAll('[data-i18n-zh]');
                translatable.forEach((element) => {
                    const zh = element.getAttribute('data-i18n-zh');
                    const en = element.getAttribute('data-i18n-en');
                    const value = currentLanguage === 'en'
                        ? (en !== null && en !== undefined ? en : zh)
                        : (zh !== null && zh !== undefined ? zh : en);

                    if (value === null || value === undefined) {
                        return;
                    }

                    if (element.tagName === 'INPUT' || element.tagName === 'TEXTAREA') {
                        if (element.hasAttribute('placeholder')) {
                            element.setAttribute('placeholder', value);
                        } else {
                            element.value = value;
                        }
                    } else {
                        element.textContent = value;
                    }
                });

                // 只有在emitEvent为true时才触发事件，避免循环调用
                if (emitEvent) {
                    emit('language:changed', { language: currentLanguage });
                }

                if (persistPref) {
                    persist(LANGUAGE_KEY, currentLanguage);
                }
            }

            // 更新标题栏语言
            function updateHeaderLanguage(lang) {
                const isEn = lang === 'en';
                const workspaceRole = document.querySelector('[data-role="shell-header"]')?.dataset?.variant || 'developer';

                // 更新搜索框占位文本
                const searchPlaceholder = document.querySelector('.shell-search-placeholder');
                if (searchPlaceholder) {
                    if (workspaceRole === 'admin') {
                        searchPlaceholder.textContent = isEn ? 'Search servers, tasks, or commands' : '搜索服务器、任务或命令';
                    } else {
                        searchPlaceholder.textContent = isEn ? 'Search apps, services, or commands' : '搜索应用、服务或命令';
                    }
                }

                // 更新按钮标题
                const toggleSidebarBtn = document.querySelector('[data-action="toggle-sidebar"]');
                if (toggleSidebarBtn) {
                    toggleSidebarBtn.title = isEn ? 'Toggle sidebar' : '展开/收起侧边栏';
                }

                const notificationBtn = document.querySelector('[data-action="open-notifications"]');
                if (notificationBtn) {
                    notificationBtn.title = isEn ? 'Notifications' : '通知中心';
                }

                const themeBtn = document.querySelector('[data-action="toggle-theme"]');
                if (themeBtn) {
                    themeBtn.title = isEn ? 'Toggle theme' : '切换主题';
                    const themeLabel = themeBtn.querySelector('.theme-label');
                    if (themeLabel) {
                        const isDark = currentTheme === 'dark';
                        themeLabel.textContent = isEn ? (isDark ? 'Dark' : 'Light') : (isDark ? '暗色' : '浅色');
                    }
                }

                // 更新用户菜单
                const userRoleLabel = document.querySelector('.user-menu__header-role');
                if (userRoleLabel) {
                    userRoleLabel.textContent = isEn
                        ? (workspaceRole === 'admin' ? 'Platform Admin' : 'Developer')
                        : (workspaceRole === 'admin' ? '平台管理员' : '研发成员');
                }

                sidebarState = state === 'collapsed' ? 'collapsed' : 'expanded';

                if (sidebar) {
                    sidebar.setAttribute('data-state', sidebarState);
                    // 添加动画类以确保平滑过渡
                    sidebar.classList.add('sidebar-transitioning');

                    // 在动画完成后移除过渡类
                    setTimeout(() => {
                        sidebar.classList.remove('sidebar-transitioning');
                    }, 300);
                }

                if (backdrop) {
                    const shouldShow = sidebarState === 'expanded' && window.innerWidth <= 1024;
                    backdrop.setAttribute('data-state', shouldShow ? 'visible' : 'hidden');
                }

                const toggle = document.querySelector('[data-action="toggle-sidebar"]');
                if (toggle) {
                    toggle.setAttribute('aria-expanded', String(sidebarState === 'expanded'));
                    // 更新按钮图标
                    const isCollapsed = sidebarState === 'collapsed';
                    toggle.innerHTML = isCollapsed ? '&#9776;' : '&#10005;';
                    toggle.setAttribute('title', isCollapsed ? '展开侧边栏' : '收起侧边栏');
                }

                if (persistPref) {
                    persist(SIDEBAR_KEY, sidebarState);
                }

                emit('sidebar:state-changed', { state: sidebarState });
            }

            function emit(name, detail) {
                eventBus.dispatchEvent(new CustomEvent(name, { detail }));
            }

            function on(name, handler) {
                const listener = (event) => handler(event.detail, event);
                eventBus.addEventListener(name, listener);
                return () => eventBus.removeEventListener(name, listener);
            }

            function initHeader() {
                const header = document.querySelector('[data-role="shell-header"]');
                if (!header) {

                const navHome = header.querySelector('[data-action="navigate-home"]');
                if (navHome) {
                    const navigate = () => emit('header:navigate', { route: '/' });
                    navHome.addEventListener('click', navigate);

                            navigate();

                        emit('header:toggle-sidebar', { state: sidebarState });
                    });
                }

                const toggleThemeBtn = header.querySelector('[data-action="toggle-theme"]');
                if (toggleThemeBtn) {
                    toggleThemeBtn.addEventListener('click', () => {
                        applyTheme(currentTheme === 'dark' ? 'light' : 'dark');

                const languageToggleBtn = header.querySelector('[data-action="toggle-language"]');
                if (languageToggleBtn) {
                    languageToggleBtn.addEventListener('click', () => {
                        applyLanguage(currentLanguage === 'en' ? 'zh' : 'en');
                    });
                }

                const commandPalette = header.querySelector('[data-action="open-command-palette"]');
                if (commandPalette) {
                    const openPalette = () => {
                        commandPalette.setAttribute('aria-expanded', 'true');
                        emit('header:command-palette', { show: true });
                    };
                    commandPalette.addEventListener('click', openPalette);
                    commandPalette.addEventListener('keydown', (event) => {
                        if (event.key === 'Enter' || event.key === ' ') {
                            event.preventDefault();
                            openPalette();
                        }
                    });
                }

                const userMenu = header.querySelector('[data-role="user-menu"]');
                if (userMenu) {
                    const toggle = userMenu.querySelector('[data-action="toggle-user-menu"]');
                    const dropdown = userMenu.querySelector('[data-role="user-dropdown"]');

                    const closeMenu = () => {
                        userMenu.dataset.open = 'false';
                        if (dropdown) {
                            dropdown.setAttribute('aria-hidden', 'true');
                        }
                        if (toggle) {
                            toggle.setAttribute('aria-expanded', 'false');
                        }
                    };

                    const openMenu = () => {
                        userMenu.dataset.open = 'true';
                        if (dropdown) {
                            dropdown.setAttribute('aria-hidden', 'false');
                        }
                        if (toggle) {
                            toggle.setAttribute('aria-expanded', 'true');
                        }
                    };

                    if (toggle && dropdown) {
                        closeMenu();
                        toggle.addEventListener('click', (event) => {
                            event.stopPropagation();
                            if (userMenu.dataset.open === 'true') {
                                closeMenu();
                            } else {
                                openMenu();
                            }
                        });

                        dropdown.addEventListener('click', (event) => {
                            event.stopPropagation();
                        });

                        document.addEventListener('click', (event) => {
                            if (!userMenu.contains(event.target)) {
                                closeMenu();
                            }
                        });

                        document.addEventListener('keydown', (event) => {
                            if (event.key === 'Escape') {
                                closeMenu();
                            }
                        });
                    }
                }
                window.addEventListener('keydown', (event) => {
                    const isMac = /Mac|iPod|iPhone|iPad/.test(navigator.platform);
                    const metaKey = isMac ? event.metaKey : event.ctrlKey;
                    if (metaKey && event.key.toLowerCase() === 'k') {
                        event.preventDefault();
                        emit('header:command-palette', { show: true, source: 'shortcut' });
                    }
                });
            }

            function initSidebar() {
                if (!sidebar) {
                    return;
                }

                const navItems = Array.from(sidebar.querySelectorAll('[data-route]'));

                const activateNav = (route) => {
                    if (!route) {
                        return;
                    }
                    navItems.forEach((item) => {
                        const isActive = item.getAttribute('data-route') === route;
                        if (isActive) {
                            item.classList.add('selected');
                            item.setAttribute('aria-current', 'page');
                        } else {
                            item.classList.remove('selected');
                            item.removeAttribute('aria-current');
                        }
                    });
                };

                if (navItems.length > 0) {
                    const preset = navItems.find((item) => item.classList.contains('selected')) || navItems[0];
                    if (preset) {
                        activateNav(preset.getAttribute('data-route'));
                    }
                }

                navItems.forEach((item) => {
                    item.addEventListener('click', () => {
                        const route = item.getAttribute('data-route');
                        if (!route) {
                            return;
                        }
                        activateNav(route);
                        emit('sidebar:navigate', { route });
                        emit('spa:navigate', { route });
                        if (window.innerWidth <= 1024) {
                            applySidebarState('collapsed', false);
                        }
                    });
                });

                on('spa:navigate', ({ route }) => {
                    if (!route) {
                        return;
                    }
                    activateNav(route);
                });

                if (backdrop) {
                    backdrop.addEventListener('click', () => {
                        applySidebarState('collapsed', false);
                        emit('sidebar:collapsed-by-overlay');
                    });
                }
            }

            function initSpaOutlet() {
                const outlet = document.querySelector('[data-role="spa-outlet"]');
                if (!outlet) {
                    return;
                }

                // 简化后不需要复杂的类名管理

                const loadContent = async (route) => {
                    if (!route) {
                        return;
                    }

                    outlet.innerHTML = '<div class="spa-placeholder" data-i18n-zh="正在加载..." data-i18n-en="Loading...">正在加载...</div>';

                    try {
                        let apiUrl = '';
                        switch (route) {
                            case 'overview':
                            case 'admin-dashboard':
                                apiUrl = '/admin/dashboard/content';
                                break;
                            case 'servers':
                                apiUrl = '/admin/api/servers-content';
                                break;
                            case 'server-groups':
                                apiUrl = '/admin/server-groups/content';
                                break;
                            case 'users':
                                apiUrl = '/admin/api/users-content';
                                break;
                            case 'settings':
                                outlet.innerHTML = '<div class="spa-placeholder" data-i18n-zh="系统设置功能开发中..." data-i18n-en="System settings coming soon...">系统设置功能开发中...</div>';
                                return;
                            default:
                                outlet.innerHTML = '<div class="spa-placeholder" data-i18n-zh="页面不存在" data-i18n-en="Page not found">页面不存在</div>';
                                return;
                        }

                        const response = await fetch(apiUrl);
                        if (response.ok) {
                            const content = await response.text();
                            outlet.innerHTML = content;
                            applyLanguage(currentLanguage, false);
                        } else {
                            outlet.innerHTML = '<div class="spa-placeholder" data-i18n-zh="加载失败，请重试" data-i18n-en="Failed to load, please retry">加载失败，请重试</div>';
                            applyLanguage(currentLanguage, false);
                        }
                    } catch (error) {
                        console.error('加载内容失败:', error);
                        outlet.innerHTML = '<div class="spa-placeholder" data-i18n-zh="网络错误，请重试" data-i18n-en="Network error, please retry">网络错误，请重试</div>';
                        applyLanguage(currentLanguage, false);
                    }
                };

                on('spa:navigate', ({ route }) => {
                    outlet.dataset.route = route;
                    emit('spa:loading', { route });

                    // 路由切换前清理上一个页面的资源
                    const previousRoute = outlet.dataset.previousRoute;
                    if (previousRoute === 'server-groups') {
                        cleanupServerGroupManagement();
                    }

                    outlet.dataset.previousRoute = route;

                    loadContent(route).then(() => {
                        // 路由加载完成后，初始化对应页面的逻辑
                        if (route === 'admin-dashboard' || route === 'overview') {
                            initAdminDashboard();
                        } else if (route === 'server-groups') {
                            initServerGroupManagement();
                        } else if (route === 'users') {
                            initUserPermissionManagement();
                        }
                    });
                });

                // 初始加载默认内容
                const initialRoute = outlet.dataset.route || 'overview';
                emit('spa:navigate', { route: initialRoute });
            }

            function renderDashboardOverview(data) {
                if (!data) {
                    return;
                }

                const coalesce = (...values) => {
                    for (const value of values) {
                        if (value !== undefined && value !== null) {
                            return value;
                        }
                    }
                    return undefined;
                };

                // 服务器统计
                const serverStats = data.serverStats || {};
                const serversOnline = coalesce(serverStats.online, serverStats.active, data.activeServers, data.onlineServers);
                const serversTotal = coalesce(serverStats.total, data.totalServers);
                const serversMaintaining = coalesce(serverStats.maintaining, serverStats.warning, data.monitoringServers);
                const serversOffline = coalesce(serverStats.offline, data.inactiveServers, data.offlineServers);
                const serversUpdatedAt = coalesce(serverStats.updatedAt, data.serverUpdatedAt, data.updatedAt);

                updateElement('dashboardServersOnline', serversOnline ?? 0);
                updateElement('dashboardServersTotal', serversTotal ?? 0);
                updateElement('dashboardServersMaintaining', serversMaintaining ?? 0);
                updateElement('dashboardServersOffline', serversOffline ?? 0);

                const serverRate = serversTotal ? ((serversOnline || 0) / serversTotal) * 100 : 0;
                updateElement('dashboardServersRate', `${serverRate.toFixed(1)}%`);
                updateTimestamp('dashboardServersUpdatedAt', serversUpdatedAt);

                // 用户统计
                const userStats = data.userStats || {};
                const activeToday = coalesce(userStats.activeToday, data.todayActiveUsers, data.activeUsers);
                const activeYesterday = coalesce(userStats.activeYesterday, data.yesterdayActiveUsers);
                const activeThreeDays = coalesce(userStats.activeThreeDaysAgo, data.threeDaysAgoActiveUsers);
                const usersTotal = coalesce(userStats.total, data.totalUsers);
                const usersDelta = coalesce(userStats.delta, data.userDelta);
                const usersConversion = coalesce(userStats.conversionRate, data.conversionRate);
                const usersUpdatedAt = coalesce(userStats.updatedAt, data.usersUpdatedAt, data.updatedAt);

                updateElement('dashboardUsersActiveToday', activeToday ?? 0);
                updateElement('dashboardUsersYesterday', activeYesterday ?? 0);
                updateElement('dashboardUsersThreeDays', activeThreeDays ?? 0);
                updateElement('dashboardUsersTotal', usersTotal ?? 0);
                updateDelta('dashboardUsersDelta', usersDelta);
                const usersConversionElement = document.getElementById('dashboardUsersConversion');
                if (usersConversionElement) {
                    if (usersConversion !== undefined && usersConversion !== null) {
                        usersConversionElement.textContent = formatPercent(usersConversion);
                    } else {
                        usersConversionElement.textContent = '--';
                    }
                }
                updateTimestamp('dashboardUsersUpdatedAt', usersUpdatedAt);

                // 告警统计
                const alertStats = data.alertStats || {};
                const unresolved = coalesce(alertStats.unresolved, data.totalAlerts);
                const critical = coalesce(alertStats.critical, data.criticalAlerts);
                const warning = coalesce(alertStats.warning, data.warningAlerts);
                const rules = coalesce(alertStats.rules, data.activeThresholds);
                const alertDelta = coalesce(alertStats.delta, data.alertDelta);
                const alertSla = coalesce(alertStats.slaStatus, data.alertSlaStatus);
                const alertsUpdatedAt = coalesce(alertStats.updatedAt, data.alertsUpdatedAt, data.updatedAt);

                updateElement('dashboardAlertsUnresolved', unresolved ?? 0);
                updateElement('dashboardAlertsCritical', critical ?? 0);
                updateElement('dashboardAlertsWarning', warning ?? 0);
                updateElement('dashboardAlertsRules', rules ?? 0);
                updateDelta('dashboardAlertsDelta', alertDelta);
                const alertsSlaElement = document.getElementById('dashboardAlertsSla');
                if (alertsSlaElement) {
                    alertsSlaElement.textContent = alertSla || 'SLA 正常';
                }
                updateTimestamp('dashboardAlertsUpdatedAt', alertsUpdatedAt);

                updateElement('dashboardUnresolvedTotal', unresolved ?? 0);
                updateElement('dashboardUnresolvedCritical', critical ?? 0);
                updateElement('dashboardUnresolvedWarning', warning ?? 0);
                updateElement('dashboardUnresolvedRules', rules ?? 0);
                updateDelta('dashboardUnresolvedDelta', alertDelta);
                updateStatusText('dashboardUnresolvedSla', alertSla, 'SLA 正常');
                updateTimestamp('dashboardUnresolvedUpdatedAt', alertsUpdatedAt);
            }

            function renderServerMonitoring(servers) {
                const container = document.getElementById('serverStatusContainer');
                if (!container) {
                    return;
                }

                const list = Array.isArray(servers) ? servers : [];

                updateServerAggregatedMetrics(list);

                if (list.length === 0) {
                    container.innerHTML = '<div class="empty-state server-alert-placeholder" data-i18n-zh="当前所有监控服务器运行正常。" data-i18n-en="All monitored servers look healthy right now.">当前所有监控服务器运行正常。</div>';
                    container.classList.add('server-empty');
                    applyLanguage(currentLanguage, false);
                    return;
                }

                container.classList.remove('server-empty');

                let mode = container.dataset.viewMode;
                if (mode !== 'list' && mode !== 'grid') {
                    const savedMode = load(SERVER_VIEW_MODE_KEY);
                    mode = savedMode === 'list' ? 'list' : 'grid';
                }

                container.dataset.viewMode = mode;
                container.classList.toggle('list-view', mode === 'list');
                container.classList.toggle('grid-view', mode === 'grid');

                const cardsHtml = list.map((server) => buildServerCard(server)).join('');
                container.innerHTML = cardsHtml;

                setServerViewMode(mode, { persist: false });
                applyLanguage(currentLanguage, false);
            }

            function updateServerAggregatedMetrics(servers) {
                const avgCpu = calculateAverageMetric(servers, 'cpuUsage');
                const avgMemory = calculateAverageMetric(servers, 'memoryUsage');
                const avgDisk = calculateAverageMetric(servers, 'diskUsage');

                updateElement('avgCpuUsage', avgCpu !== null ? Math.round(avgCpu) : '--');
                updateElement('avgMemoryUsage', avgMemory !== null ? Math.round(avgMemory) : '--');
                updateElement('avgDiskUsage', avgDisk !== null ? Math.round(avgDisk) : '--');

                updateProgressBar('cpuProgressBar', avgCpu ?? 0);
                updateProgressBar('memoryProgressBar', avgMemory ?? 0);
                updateProgressBar('diskProgressBar', avgDisk ?? 0);
            }

            function calculateAverageMetric(servers, key) {
                const values = servers
                    .map((server) => {
                        if (!server || server[key] === undefined || server[key] === null) {
                            return null;
                        }
                        const value = Number(server[key]);
                        return Number.isFinite(value) ? value : null;
                    })
                    .filter((value) => value !== null);

                if (values.length === 0) {
                    return null;
                }

                const total = values.reduce((sum, value) => sum + value, 0);
                return total / values.length;
            }

            function buildServerCard(server) {
                const status = normalizeServerStatus(server && server.status);
                const statusZh = getStatusText(status, 'zh');
                const statusEn = getStatusText(status, 'en');

                const name = server && server.name ? server.name : 'Unknown';
                const host = server && (server.host || server.hostname) ? (server.host || server.hostname) : 'N/A';
                const portValue = server && server.port !== undefined && server.port !== null ? server.port : '';
                const cpu = formatUsage(server ? server.cpuUsage : null);
                const memory = formatUsage(server ? server.memoryUsage : null);
                const disk = formatUsage(server ? server.diskUsage : null);
                const searchTokens = [name, host, portValue, status].filter(Boolean).join(' ').toLowerCase();
                const serverId = server && server.id !== undefined ? server.id : 'null';

                return `
                    <article class="server-card" data-role="server-card" data-status="${escapeHtml(status)}" data-search="${escapeHtml(searchTokens)}">
                        <div class="server-card__header">
                            <div class="server-card__identity">
                                <div class="server-card__name">${escapeHtml(name)}</div>
                                <div class="server-card__meta">${escapeHtml(host)}${portValue !== '' ? `:${escapeHtml(portValue)}` : ''}</div>
                            </div>
                            <span class="server-card__status server-card__status--${escapeHtml(status)}" data-i18n-zh="${escapeHtml(statusZh)}" data-i18n-en="${escapeHtml(statusEn)}">
                                <span class="server-card__status-dot server-card__status-dot--${escapeHtml(status)}"></span>
                                ${escapeHtml(getStatusText(status))}
                            </span>
                        </div>
                        <dl class="server-card__metrics">
                            <div class="server-card__metric">
                                <dt data-i18n-zh="CPU" data-i18n-en="CPU">CPU</dt>
                                <dd>${escapeHtml(cpu)}</dd>
                            </div>
                            <div class="server-card__metric">
                                <dt data-i18n-zh="内存" data-i18n-en="Memory">内存</dt>
                                <dd>${escapeHtml(memory)}</dd>
                            </div>
                            <div class="server-card__metric">
                                <dt data-i18n-zh="磁盘" data-i18n-en="Disk">磁盘</dt>
                                <dd>${escapeHtml(disk)}</dd>
                            </div>
                        </dl>
                        <div class="server-card__actions">
                            <button class="btn btn-link" type="button" onclick="viewServerDetail(${serverId})">
                                <span data-i18n-zh="查看详情" data-i18n-en="View details">查看详情</span>
                            </button>
                            <button class="btn btn-link" type="button" onclick="connectToServer(${serverId})">
                                <span data-i18n-zh="SSH 连接" data-i18n-en="SSH Connect">SSH 连接</span>
                            </button>
                        </div>
                    </article>`;
            }

            function normalizeServerStatus(status) {
                const normalized = (status || '').toString().toLowerCase();
                if (normalized === 'online') {
                    return 'online';
                }
                if (normalized === 'warning' || normalized === 'maintaining') {
                    return 'warning';
                }
                if (normalized === 'error') {
                    return 'error';
                }
                if (normalized === 'offline') {
                    return 'offline';
                }
                return 'offline';
            }

            function formatUsage(value) {
                const numeric = Number(value);
                if (!Number.isFinite(numeric)) {
                    return '--%';
                }
                return `${Math.round(numeric)}%`;
            }

            function setServerViewMode(mode, options = {}) {
                const persistPref = options.persist !== false;
                const container = document.getElementById('serverStatusContainer');
                const gridBtn = document.getElementById('serverGridView');
                const listBtn = document.getElementById('serverListView');

                const normalized = mode === 'list' ? 'list' : 'grid';

                if (container) {
                    container.dataset.viewMode = normalized;
                    container.classList.toggle('list-view', normalized === 'list');
                    container.classList.toggle('grid-view', normalized === 'grid');
                }

                if (gridBtn) {
                    gridBtn.classList.toggle('active', normalized === 'grid');
                }

                if (listBtn) {
                    listBtn.classList.toggle('active', normalized === 'list');
                }

                if (persistPref) {
                    persist(SERVER_VIEW_MODE_KEY, normalized);
                }
            }

            function showServerPanelError() {
                const container = document.getElementById('serverStatusContainer');
                if (!container) {
                    return;
                }

                container.innerHTML = '<div class="empty-state server-alert-placeholder" data-i18n-zh="暂时无法加载服务器告警信息，请稍后重试。" data-i18n-en="Server alert information is unavailable at the moment. Please retry later.">暂时无法加载服务器告警信息，请稍后重试。</div>';
                container.classList.add('server-empty');
                applyLanguage(currentLanguage, false);
            }

            function escapeHtml(value) {
                if (value === null || value === undefined) {
                    return '';
                }

                return String(value)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#x27;')
                    .replace(/\//g, '&#x2F;')
                    .replace(/\\/g, '&#x5C;')
                    .replace(/`/g, '&#96;');
            }

            function renderUserPanel(data) {
                if (!data) {
                    showUserPanelError();
                    return;
                }

                const userStats = data.userStats || {};

                const activeToday = userStats.activeToday ?? data.todayActiveUsers ?? 0;
                const activeYesterday = userStats.activeYesterday ?? data.yesterdayActiveUsers ?? 0;
                const conversionRate = userStats.conversionRate ?? data.conversionRate ?? null;

                updateElement('userActiveToday', activeToday ?? 0);
                updateElement('userActiveYesterday', activeYesterday ?? 0);
                updateElement('userConversionRate', conversionRate !== null && conversionRate !== undefined ? formatPercent(conversionRate) : '--');

                const trendPoints = buildUserTrendPoints(data);
                userTrendPoints = trendPoints;
                updateUserTrendChart(userTrendPoints);

                const activities = Array.isArray(data.recentActivities) ? data.recentActivities : [];
                renderUserEvents(activities);

                applyLanguage(currentLanguage, false);
            }

            function buildUserTrendPoints(data) {
                const stats = data && data.userStats ? data.userStats : {};

                return [
                    {
                        labelZh: '前日',
                        labelEn: '2 Days Ago',
                        value: stats.activeThreeDaysAgo ?? data.threeDaysAgoActiveUsers ?? 0
                    },
                    {
                        labelZh: '昨日',
                        labelEn: 'Yesterday',
                        value: stats.activeYesterday ?? data.yesterdayActiveUsers ?? 0
                    },
                    {
                        labelZh: '今日',
                        labelEn: 'Today',
                        value: stats.activeToday ?? data.todayActiveUsers ?? 0
                    }
                ];
            }

            function updateUserTrendChart(points) {
                const canvas = document.getElementById('userTrendChart');
                const placeholder = document.getElementById('userTrendPlaceholder');
                const hasData = Array.isArray(points) && points.some((point) => {
                    if (!point) {
                        return false;
                    }
                    const value = Number(point.value);
                    return Number.isFinite(value) && value > 0;
                });
                if (!canvas) {
                    if (placeholder) {
                        placeholder.hidden = hasData;
                    }
                    return;
                }

                const targetHeight = 220;
                canvas.setAttribute('height', String(targetHeight));
                canvas.style.height = `${targetHeight}px`;

                if (!hasData) {
                    if (userTrendChart) {
                        userTrendChart.destroy();
                        userTrendChart = null;
                    }
                    canvas.classList.add('is-hidden');
                    if (placeholder) {
                        placeholder.hidden = false;
                    }
                    return;
                }

                if (typeof Chart === 'undefined') {
                    canvas.classList.add('is-hidden');
                    if (placeholder) {
                        placeholder.hidden = false;
                    }
                    return;
                }

                canvas.classList.remove('is-hidden');
                if (placeholder) {
                    placeholder.hidden = true;
                }

                const labels = points.map((point) => {
                    return currentLanguage === 'en' ? point.labelEn : point.labelZh;
                });
                const values = points.map((point) => {
                    const numeric = Number(point.value);
                    return Number.isFinite(numeric) ? numeric : 0;
                });

                try {
                    if (!userTrendChart) {
                        userTrendChart = new Chart(canvas, {
                            type: 'line',
                            data: {
                                labels,
                                datasets: [{
                                    label: currentLanguage === 'en' ? 'Active users' : '活跃用户',
                                    data: values,
                                    borderColor: 'rgba(47, 155, 255, 1)',
                                    backgroundColor: 'rgba(47, 155, 255, 0.12)',
                                    borderWidth: 2,
                                    tension: 0.4,
                                    fill: true,
                                    pointRadius: 3,
                                    pointHoverRadius: 5
                                }]
                            },
                            options: {
                                responsive: true,
                                maintainAspectRatio: false,
                                plugins: {
                                    legend: {
                                        display: false
                                    },
                                    tooltip: {
                                        mode: 'index',
                                        intersect: false
                                    }
                                },
                                scales: {
                                    x: {
                                        grid: {
                                            display: false
                                        }
                                    },
                                    y: {
                                        beginAtZero: true,
                                        ticks: {
                                            precision: 0
                                        }
                                    }
                                },
                                animation: {
                                    duration: 400
                                }
                            }
                        });
                        userTrendChart.resize(undefined, targetHeight);
                    } else {
                        userTrendChart.data.labels = labels;
                        userTrendChart.data.datasets[0].label = currentLanguage === 'en' ? 'Active users' : '活跃用户';
                        userTrendChart.data.datasets[0].data = values;
                        userTrendChart.update('none');
                        userTrendChart.resize(undefined, targetHeight);
                    }
                } catch (error) {
                    console.error('Failed to render user trend chart', error);
                    if (userTrendChart) {
                        userTrendChart.destroy();
                        userTrendChart = null;
                    }
                    canvas.classList.add('is-hidden');
                    if (placeholder) {
                        placeholder.hidden = false;
                    }
                }
            }

            function renderUserEvents(events) {
                const eventStream = document.getElementById('userEventStream');
                if (!eventStream) {
                    return;
                }

                if (!Array.isArray(events) || events.length === 0) {
                    eventStream.innerHTML = '<li class="empty-state" data-i18n-zh="暂无用户活动" data-i18n-en="No recent activity">暂无用户活动</li>';

                const items = events.slice(0, 10).map((event) => {
                    const type = event && event.type ? event.type : '';
                    const description = event && event.description ? event.description : '';
                    const timestamp = event && event.timestamp ? event.timestamp : '--';

                    const hasUser = event && event.user;
                    const fallbackUserZh = '未知用户';
                    const fallbackUserEn = 'Unknown user';
                    const userDisplay = hasUser ? event.user : (currentLanguage === 'en' ? fallbackUserEn : fallbackUserZh);
                    const userI18nAttr = hasUser ? '' : ` data-i18n-zh="${escapeHtml(fallbackUserZh)}" data-i18n-en="${escapeHtml(fallbackUserEn)}"`;

                    return `
                        <li class="user-event" data-role="user-event">
                            <div class="user-event__header">
                                <span class="user-event__type">${escapeHtml(type)}</span>
                                <span class="user-event__time">${escapeHtml(timestamp)}</span>
                            </div>
                            <div class="user-event__body">
                                <span class="user-event__user"${userI18nAttr}>${escapeHtml(userDisplay)}</span>
                                <span class="user-event__description">${escapeHtml(description)}</span>
                            </div>
                        </li>`;
                }).join('');

                eventStream.innerHTML = items;
                applyLanguage(currentLanguage, false);
            }

            function getUsageClass(value) {
                if (!value) return 'usage-fill--low';
                if (value < 50) return 'usage-fill--low';
                if (value < 70) return 'usage-fill--medium';
                if (value < 85) return 'usage-fill--high';
                return 'usage-fill--critical';
            }

            function getChartColor(index, alpha = 1) {
                const colors = [
                    [99, 102, 241],
                    [16, 185, 129],
                    [245, 158, 11],
                    [239, 68, 68],
                    [59, 130, 246],
                    [139, 92, 246]
                ];
                const color = colors[index % colors.length];
                return `rgba(${color[0]}, ${color[1]}, ${color[2]}, ${alpha})`;
            }

            function filterServerList() {
                const searchValue = document.getElementById('serverSearchInput')?.value.toLowerCase() || '';
                const statusValue = document.getElementById('serverStatusFilter')?.value || 'all';
                const healthValue = document.getElementById('serverHealthFilter')?.value || 'all';

                const filtered = serverGroupListCache.filter(server => {
                    const matchSearch = !searchValue ||
                        server.name.toLowerCase().includes(searchValue) ||
                        server.address.toLowerCase().includes(searchValue);

                    const matchStatus = statusValue === 'all' || server.status === statusValue;

                    let matchHealth = true;
                    if (healthValue !== 'all') {
                        const score = server.healthScore;
                        matchHealth =
                            (healthValue === 'excellent' && score >= 90) ||
                            (healthValue === 'good' && score >= 75 && score < 90) ||
                            (healthValue === 'fair' && score >= 60 && score < 75) ||
                            (healthValue === 'poor' && score < 60);
                    }

                    return matchSearch && matchStatus && matchHealth;
                });

                renderServerGroupList(filtered);
            }
