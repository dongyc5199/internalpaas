<div xmlns:th="http://www.thymeleaf.org"
     th:fragment="statsCard(iconClass, title, actionLabel, actionHandler, extraClass, cardId)"
     class="stats-card"
     th:classappend=" ${extraClass}"
     th:id="${cardId}"
     role="group">
    <header class="stats-card__header">
        <div class="stats-card__heading">
            <div class="stats-card__icon" aria-hidden="true">
                <i th:class="${iconClass}"></i>
            </div>
            <div class="stats-card__label">
                <span class="stats-card__title" th:text="${title}">统计标题</span>
            </div>
        </div>
        <div class="stats-card__actions"
             th:if="${actionLabel != null and !#strings.isEmpty(actionLabel)}">
            <button class="btn btn-link" type="button"
                    th:text="${actionLabel}"
                    th:attr="onclick=${actionHandler}">操作</button>
        </div>
    </header>
    <div class="stats-card__body">
        <th:block th:insert="~{::body}"></th:block>
    </div>
</div>
