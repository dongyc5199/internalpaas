<header th:fragment="modern-top-nav" class="modern-nav" id="topNav">
    <div class="nav-brand-section">
        <button class="nav-sidebar-toggle" id="sidebarToggle" type="button" aria-label="收起或展开侧边栏">
            <span class="toggle-icon" aria-hidden="true"></span>
        </button>
        <div class="brand-content">
            <div class="brand-icon" aria-hidden="true">
                <span class="brand-initials">DDP</span>
            </div>
            <div class="brand-meta">
                <h1 class="brand-title">Dev Debug Platform</h1>
                <p class="brand-subtitle">内部调试与运维控制中心</p>
            </div>
        </div>
    </div>

    <div class="nav-metrics">
        <div class="metric-item">
            <span class="metric-label">今日部署</span>
            <span class="metric-value" th:text="${deployCount ?: 0}">0</span>
        </div>
        <div class="metric-item">
            <span class="metric-label">在线节点</span>
            <span class="metric-value" th:text="${onlineServers ?: 0}">0</span>
        </div>
        <div class="metric-item">
            <span class="metric-label">待办工单</span>
            <span class="metric-value" th:text="${pendingTasks ?: 0}">0</span>
        </div>
    </div>

    <div class="nav-actions-section">
        <div class="nav-search" role="search">
            <i class="fas fa-search" aria-hidden="true"></i>
            <input type="text" class="search-input" placeholder="搜索服务器、应用或用户">
        </div>

        <button class="nav-action-btn notification-btn"
                data-tooltip="通知"
                aria-label="查看通知">
            <i class="fas fa-bell" aria-hidden="true"></i>
            <span class="notification-indicator" aria-hidden="true"></span>
        </button>

        <button class="nav-action-btn theme-switcher theme-toggle-btn"
                data-tooltip="切换主题"
                aria-label="切换主题">
            <i class="fas fa-circle-half-stroke theme-icon" aria-hidden="true"></i>
        </button>

        <div class="user-menu">
            <button class="user-avatar"
                    id="userMenuToggle"
                    aria-haspopup="true"
                    aria-expanded="false"
                    aria-label="打开用户菜单">
                <span class="avatar-initial" th:text="${#strings.substring(username ?: 'A', 0, 1).toUpperCase()}">U</span>
            </button>

            <div class="dropdown-menu" id="userDropdown" role="menu">
                <div class="dropdown-header">
                    <span class="dropdown-user" th:text="${username ?: 'Guest'}">Guest</span>
                    <span class="dropdown-role" th:text="${userRole ?: 'Developer'}">Developer</span>
                </div>
                <div class="dropdown-divider"></div>
                <a href="/profile" class="dropdown-item" role="menuitem">
                    <i class="fas fa-user" aria-hidden="true"></i>
                    <span>个人资料</span>
                </a>
                <a href="/settings" class="dropdown-item" role="menuitem">
                    <i class="fas fa-sliders-h" aria-hidden="true"></i>
                    <span>偏好设置</span>
                </a>
                <a href="/admin" class="dropdown-item" role="menuitem" sec:authorize="hasRole('ADMIN')">
                    <i class="fas fa-shield-alt" aria-hidden="true"></i>
                    <span>管理面板</span>
                </a>
                <div class="dropdown-divider"></div>
                <a href="/help" class="dropdown-item" role="menuitem">
                    <i class="fas fa-life-ring" aria-hidden="true"></i>
                    <span>帮助中心</span>
                </a>
                <form th:action="@{/logout}" method="post" class="dropdown-form" role="none">
                    <button type="submit" class="dropdown-item" role="menuitem">
                        <i class="fas fa-sign-out-alt" aria-hidden="true"></i>
                        <span>退出登录</span>
                    </button>
                </form>
            </div>
        </div>
    </div>
</header>

<aside th:fragment="modern-sidebar" class="modern-sidebar" id="modernSidebar">
    <div class="sidebar-header">
        <div class="sidebar-title">工作台导航</div>
        <div class="sidebar-caption">快速抵达关键功能</div>
    </div>

    <nav class="sidebar-nav" th:with="role=${userType != null ? userType : 'developer'}">
        <a href="#dashboard"
           class="nav-item modern-nav-link"
           data-nav-id="dashboard"
           data-page="dashboard"
           th:classappend="${currentPage == 'dashboard'} ? 'active' : ''">
            <i class="nav-item-icon fas fa-gauge" aria-hidden="true"></i>
            <span class="nav-item-text" th:text="${role == 'admin'} ? '管理员工作台' : '开发者工作台'">工作台</span>
        </a>

        <a href="#servers"
           class="nav-item modern-nav-link"
           data-nav-id="servers"
           data-page="servers"
           th:if="${role == 'admin'}"
           th:classappend="${currentPage == 'servers'} ? 'active' : ''">
            <i class="nav-item-icon fas fa-server" aria-hidden="true"></i>
            <span class="nav-item-text">服务器</span>
            <span class="nav-item-chip warning" th:if="${offlineServers > 0}" th:text="${offlineServers}">1</span>
        </a>

        <a href="#applications"
           class="nav-item modern-nav-link"
           data-nav-id="applications"
           data-page="applications"
           th:if="${role != 'admin'}"
           th:classappend="${currentPage == 'applications'} ? 'active' : ''">
            <i class="nav-item-icon fas fa-cubes" aria-hidden="true"></i>
            <span class="nav-item-text">应用中心</span>
        </a>

        <a href="#users"
           class="nav-item modern-nav-link"
           data-nav-id="users"
           data-page="users"
           th:if="${role == 'admin'}"
           th:classappend="${currentPage == 'users'} ? 'active' : ''">
            <i class="nav-item-icon fas fa-users" aria-hidden="true"></i>
            <span class="nav-item-text">用户与权限</span>
        </a>

        <a href="#monitoring"
           class="nav-item modern-nav-link"
           data-nav-id="monitoring"
           data-page="monitoring"
           th:if="${role == 'admin'}"
           th:classappend="${currentPage == 'monitoring'} ? 'active' : ''">
            <i class="nav-item-icon fas fa-chart-line" aria-hidden="true"></i>
            <span class="nav-item-text">监控视图</span>
        </a>

        <a href="#terminal"
           class="nav-item modern-nav-link"
           data-nav-id="terminal"
           data-page="terminal"
           th:if="${role == 'admin'}"
           th:classappend="${currentPage == 'terminal'} ? 'active' : ''">
            <i class="nav-item-icon fas fa-terminal" aria-hidden="true"></i>
            <span class="nav-item-text">远程终端</span>
        </a>

        <a href="#settings"
           class="nav-item modern-nav-link"
           data-nav-id="settings"
           data-page="settings"
           th:if="${role == 'admin'}"
           th:classappend="${currentPage == 'settings'} ? 'active' : ''">
            <i class="nav-item-icon fas fa-gear" aria-hidden="true"></i>
            <span class="nav-item-text">系统设置</span>
        </a>
    </nav>

    <div class="sidebar-footer">
        <div class="footer-card">
            <div class="footer-title">平台运行状态</div>
            <div class="footer-meta">
                <span>在线节点</span>
                <strong th:text="${onlineServers ?: 0}">0</strong>
            </div>
            <div class="footer-meta">
                <span>离线节点</span>
                <strong class="warning" th:text="${offlineServers ?: 0}">0</strong>
            </div>
        </div>
        <a href="/docs" class="footer-link">查看操作手册</a>
    </div>
</aside>

<main th:fragment="modern-content-area" class="modern-content-area" id="modernContentArea">
    <div class="loading-overlay" id="loadingSpinner" role="status" aria-live="polite" aria-hidden="true">
        <div class="loading-indicator"></div>
        <span class="loading-text">正在加载内容...</span>
    </div>

    <div class="content-wrapper" id="contentWrapper"></div>
</main>
