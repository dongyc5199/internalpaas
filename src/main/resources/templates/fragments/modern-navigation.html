<!DOCTYPE html>

<!-- 🎯 现代化顶部导航栏 -->

                    data-bs-placement="bottom"

                    <span class="hamburger-line"></span>

            </button>

                    </li>

                            <span>帮助中心</span>

                <!-- 用户管理 -->

                       th:classappend="${currentPage == 'users'} ? 'active' : ''">
                        <div class="modern-nav-icon">

                    </a>

<!-- 🎨 样式增强 -->
<style th:fragment="modern-nav-styles">
/* 用户下拉菜单增强 */
.user-dropdown-menu {
    margin-top: 8px !important;
    border-radius: 12px !important;
    box-shadow: var(--nav-shadow-medium) !important;
    border: 1px solid var(--nav-border) !important;
    background: var(--nav-background) !important;
    backdrop-filter: blur(12px) !important;
    min-width: 220px !important;
}

.user-dropdown-menu .dropdown-item {
    padding: 12px 20px !important;
    border-radius: 8px !important;
    margin: 4px 8px !important;
    display: flex !important;
    align-items: center !important;
    gap: 12px !important;
    color: var(--nav-text) !important;
    transition: all 0.2s ease !important;
}

.user-dropdown-menu .dropdown-item:hover {
    background: var(--nav-surface-hover) !important;
    color: var(--nav-primary) !important;
    transform: translateY(-1px) !important;
}

.user-dropdown-menu .dropdown-item i {
    width: 16px !important;
    text-align: center !important;
    flex-shrink: 0 !important;
}

.user-dropdown-menu .dropdown-divider {
    margin: 8px 0 !important;
    border-top: 1px solid var(--nav-border) !important;
}

/* 通知徽章样式 */
.nav-badge {
    position: absolute !important;
    top: -2px !important;
    right: -2px !important;
    background: var(--nav-primary) !important;
    color: white !important;
    font-size: 10px !important;
    font-weight: 700 !important;
    padding: 2px 6px !important;
    border-radius: 10px !important;
    min-width: 16px !important;
    height: 16px !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    border: 2px solid var(--nav-background) !important;
    z-index: 1 !important;
}

/* 外部链接图标 */
.external-icon {
    position: absolute !important;
    top: 8px !important;
    right: 20px !important;
    font-size: 11px !important;
    opacity: 0.6 !important;
    transition: all 0.2s ease !important;
}

.modern-nav-link:hover .external-icon {
    opacity: 1 !important;
    transform: translateY(-1px) !important;
}

/* 下拉箭头动画 */
.dropdown-arrow {
    transition: transform 0.2s ease !important;
    font-size: 12px !important;
    opacity: 0.7 !important;
}

.dropdown-toggle[aria-expanded="true"] .dropdown-arrow {
    transform: rotate(180deg) !important;
}

/* 活跃导航项增强 */
.modern-nav-link.active {
    background: var(--nav-primary-light) !important;
    color: var(--nav-primary) !important;
    box-shadow: inset 4px 0 0 var(--nav-primary) !important;
}

.modern-nav-link.active .modern-nav-icon {
    color: var(--nav-primary) !important;
    transform: scale(1.1) !important;
}

/* 品牌内容布局 */
.brand-content {
    display: flex !important;
    flex-direction: column !important;
    align-items: flex-start !important;
}

/* 加载状态 */
.nav-loading .modern-nav-icon i {
    animation: spin 1s linear infinite !important;
}

@keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

/* 通知闪烁效果 */
.notification-btn.has-notification .nav-badge {
    animation: pulse 2s ease-in-out infinite !important;
}

@keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); }
}
</style>

<!-- 🔧 JavaScript集成脚本 -->
<script th:fragment="modern-nav-integration">
// 现代导航与现有平台集成
document.addEventListener('DOMContentLoaded', function() {
    // 集成现有的内容加载系统
    if (typeof loadContent === 'function') {
        // 监听现代导航点击事件
        document.addEventListener('modernNav:navigationItemClick', function(e) {
            const { element, itemId } = e.detail;
            const href = element.getAttribute('href');
            
            // 如果是内部链接，使用现有的内容加载系统
            if (href && href.startsWith('/') && !href.includes('#') && !element.hasAttribute('target')) {
                e.preventDefault();
                
                // 提取页面标识
                const pageId = itemId || href.split('/').pop() || 'dashboard';
                
                // 使用现有的loadContent函数
                if (typeof loadContent === 'function') {
                    loadContent(pageId);
                }
            }
        });
    }
    
    // 同步当前页面状态
    if (typeof currentPage !== 'undefined' && window.modernNavController) {
        // 根据当前页面设置活跃导航项
        const activeLink = document.querySelector(`.modern-nav-link[data-nav-id="${currentPage}"]`);
        if (activeLink) {
            // 移除其他活跃状态
            document.querySelectorAll('.modern-nav-link.active').forEach(link => {
                link.classList.remove('active');
            });
            
            // 添加活跃状态
            activeLink.classList.add('active');
        }
    }
    
    // 键盘快捷键集成
    document.addEventListener('keydown', function(e) {
        // Ctrl/Cmd + K 打开搜索
        if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
            e.preventDefault();
            const searchBtn = document.querySelector('.search-btn');
            if (searchBtn) {
                searchBtn.click();
                // 这里可以集成搜索功能
                console.log('🔍 搜索功能待实现');
            }
        }
    });
    
    // 集成Bootstrap Tooltip（如果存在）
    if (typeof bootstrap !== 'undefined' && bootstrap.Tooltip) {
        const tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
        tooltipTriggerList.map(function(tooltipTriggerEl) {
            return new bootstrap.Tooltip(tooltipTriggerEl, {
                delay: { show: 500, hide: 100 }
            });
        });
    }
    
    console.log('✅ 现代导航集成完成');
});
</script>

</html>
