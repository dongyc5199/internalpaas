<header th:fragment="modern-top-nav"
        th:with="rawRole=${userType != null ? userType : userRole},
                 workspaceRole=${rawRole != null and #strings.equalsIgnoreCase(rawRole, 'ADMIN') ? 'admin' : 'developer'}"
        class="modern-nav workspace-nav"
        th:classappend="${workspaceRole == 'admin'} ? ' workspace-nav--admin' : ' workspace-nav--developer'"
        th:data-role="${workspaceRole}">
    <div class="workspace-nav__left">
        <button class="nav-sidebar-toggle" id="sidebarToggle" type="button" aria-label="收起或展开侧边栏">
            <span class="toggle-icon" aria-hidden="true"></span>
        </button>
        <div class="workspace-nav__brand">
            <div class="brand-logo" aria-hidden="true">
                <span class="brand-logo__mark">DDP</span>
            </div>
            <div class="brand-text">
                <span class="brand-title">Dev Debug Platform</span>
                <span class="brand-role"
                      th:text="${workspaceRole == 'admin'} ? 'Admin Workspace' : 'Developer Workspace'">Admin Workspace</span>
            </div>
        </div>
    </div>

    <div class="workspace-nav__center">
        <label class="nav-search" role="search">
            <i class="fas fa-search search-icon" aria-hidden="true"></i>
            <input type="search"
                   class="search-input"
                   th:attr="placeholder=${workspaceRole == 'admin'} ? '搜索服务器 / 快捷键 Cmd/Ctrl+K' : '搜索应用 / Cmd/Ctrl+K'"
                   aria-label="工作台搜索">
            <span class="search-shortcut" aria-hidden="true">
                <span class="shortcut-key">Cmd</span>
                <span class="shortcut-divider">/</span>
                <span class="shortcut-key">Ctrl</span>
                <span class="shortcut-plus">+</span>
                <span class="shortcut-key">K</span>
            </span>
        </label>
    </div>

    <div class="workspace-nav__right">
        <button class="nav-action-btn notification-btn" type="button" data-tooltip="通知" aria-label="查看通知">
            <i class="fas fa-bell" aria-hidden="true"></i>
            <span class="notification-indicator" aria-hidden="true"></span>
        </button>
        <button class="nav-action-btn theme-toggle-btn" type="button" data-tooltip="切换主题" aria-label="切换主题">
            <i class="fas fa-circle-half-stroke theme-icon" aria-hidden="true"></i>
        </button>
        <button class="language-switcher" type="button" aria-label="切换语言">
            <span class="language-code" th:text="${#strings.toUpperCase(#locale.language)}">ZH</span>
        </button>
        <span class="nav-divider" aria-hidden="true"></span>
        <div class="user-menu">
            <button class="user-avatar" id="userMenuToggle" aria-haspopup="true" aria-expanded="false" aria-label="打开用户菜单">
                <span class="avatar-initial" th:text="${#strings.substring((username != null ? username : 'U'), 0, 1).toUpperCase()}">U</span>
            </button>
            <div class="user-dropdown" id="userDropdown" role="menu">
                <div class="dropdown-header">
                    <span class="dropdown-user" th:text="${username != null ? username : 'Guest'}">Guest</span>
                    <span class="dropdown-role" th:text="${workspaceRole == 'admin'} ? '平台管理员' : '研发成员'">平台管理员</span>
                </div>
                <div class="dropdown-divider"></div>
                <a href="/profile" class="dropdown-item" role="menuitem">
                    <i class="fas fa-user" aria-hidden="true"></i>
                    <span>个人资料</span>
                </a>
                <a href="/settings" class="dropdown-item" role="menuitem">
                    <i class="fas fa-sliders-h" aria-hidden="true"></i>
                    <span>偏好设置</span>
                </a>
                <a href="/admin" class="dropdown-item" role="menuitem" sec:authorize="hasRole('ADMIN')">
                    <i class="fas fa-shield-alt" aria-hidden="true"></i>
                    <span>管理面板</span>
                </a>
                <div class="dropdown-divider"></div>
                <a href="/help" class="dropdown-item" role="menuitem">
                    <i class="fas fa-life-ring" aria-hidden="true"></i>
                    <span>帮助中心</span>
                </a>
                <form th:action="@{/logout}" method="post" class="dropdown-form" role="none">
                    <button type="submit" class="dropdown-item" role="menuitem">
                        <i class="fas fa-sign-out-alt" aria-hidden="true"></i>
                        <span>退出登录</span>
                    </button>
                </form>
            </div>
        </div>
    </div>
</header>

<aside th:fragment="modern-sidebar"
       th:with="rawRole=${userType != null ? userType : userRole},
                workspaceRole=${rawRole != null and #strings.equalsIgnoreCase(rawRole, 'ADMIN') ? 'admin' : 'developer'}"
       class="modern-sidebar workspace-sidebar"
       th:classappend="${workspaceRole == 'admin'} ? ' workspace-sidebar--admin' : ' workspace-sidebar--developer'"
       th:data-role="${workspaceRole}"
       id="modernSidebar">
    <div class="workspace-sidebar__header">
        <div class="sidebar-profile sidebar-profile--admin" th:if="${workspaceRole == 'admin'}">
            <div class="profile-avatar" aria-hidden="true">
                <span class="avatar-initial" th:text="${#strings.substring((username != null ? username : 'U'), 0, 1).toUpperCase()}">U</span>
            </div>
            <div class="profile-meta">
                <span class="profile-name" th:text="${username != null ? username : 'Admin'}">Admin</span>
                <span class="profile-role">平台管理员</span>
            </div>
        </div>
        <div class="sidebar-profile sidebar-profile--developer" th:if="${workspaceRole != 'admin'}">
            <div class="profile-meta">
                <span class="profile-label">所属团队</span>
                <span class="profile-name">Core Dev Squad</span>
                <span class="profile-role">交付效率提升计划</span>
            </div>
        </div>
    </div>

    <nav class="workspace-sidebar__nav">
        <a href="#dashboard"
           class="workspace-nav-item modern-nav-link"
           data-nav-id="dashboard"
           data-page="dashboard"
           th:classappend="${currentPage == 'dashboard'} ? ' active' : ''">
            <span class="nav-item__indicator" aria-hidden="true"></span>
            <i class="nav-item__icon fas fa-gauge" aria-hidden="true"></i>
            <div class="nav-item__texts">
                <span class="nav-item__title">控制台概览</span>
                <span class="nav-item__desc">全局状态一览</span>
            </div>
        </a>

        <a href="#servers"
           class="workspace-nav-item modern-nav-link"
           data-nav-id="servers"
           data-page="servers"
           th:if="${workspaceRole == 'admin'}"
           th:classappend="${currentPage == 'servers'} ? ' active' : ''">
            <span class="nav-item__indicator" aria-hidden="true"></span>
            <i class="nav-item__icon fas fa-server" aria-hidden="true"></i>
            <div class="nav-item__texts">
                <span class="nav-item__title">服务器管理</span>
                <span class="nav-item__desc">节点状态与批量任务</span>
            </div>
            <span class="nav-item__badge" th:if="${offlineServers != null and offlineServers > 0}" th:text="${offlineServers}">0</span>
        </a>

        <a href="#users"
           class="workspace-nav-item modern-nav-link"
           data-nav-id="users"
           data-page="users"
           th:if="${workspaceRole == 'admin'}"
           th:classappend="${currentPage == 'users'} ? ' active' : ''">
            <span class="nav-item__indicator" aria-hidden="true"></span>
            <i class="nav-item__icon fas fa-users" aria-hidden="true"></i>
            <div class="nav-item__texts">
                <span class="nav-item__title">用户权限</span>
                <span class="nav-item__desc">角色与操作审计</span>
            </div>
        </a>

        <a href="#audit"
           class="workspace-nav-item modern-nav-link"
           data-nav-id="audit"
           data-page="audit"
           th:if="${workspaceRole == 'admin'}"
           th:classappend="${currentPage == 'audit'} ? ' active' : ''">
            <span class="nav-item__indicator" aria-hidden="true"></span>
            <i class="nav-item__icon fas fa-clipboard-list" aria-hidden="true"></i>
            <div class="nav-item__texts">
                <span class="nav-item__title">审计记录</span>
                <span class="nav-item__desc">操作留痕与导出</span>
            </div>
        </a>

        <a href="#alerts"
           class="workspace-nav-item modern-nav-link"
           data-nav-id="alerts"
           data-page="alerts"
           th:if="${workspaceRole == 'admin'}"
           th:classappend="${currentPage == 'alerts'} ? ' active' : ''">
            <span class="nav-item__indicator" aria-hidden="true"></span>
            <i class="nav-item__icon fas fa-triangle-exclamation" aria-hidden="true"></i>
            <div class="nav-item__texts">
                <span class="nav-item__title">告警配置</span>
                <span class="nav-item__desc">策略阈值与通知</span>
            </div>
        </a>

        <a href="#settings"
           class="workspace-nav-item modern-nav-link"
           data-nav-id="settings"
           data-page="settings"
           th:if="${workspaceRole == 'admin'}"
           th:classappend="${currentPage == 'settings'} ? ' active' : ''">
            <span class="nav-item__indicator" aria-hidden="true"></span>
            <i class="nav-item__icon fas fa-sliders-h" aria-hidden="true"></i>
            <div class="nav-item__texts">
                <span class="nav-item__title">系统配置</span>
                <span class="nav-item__desc">平台参数与选项</span>
            </div>
        </a>

        <a href="#applications"
           class="workspace-nav-item modern-nav-link"
           data-nav-id="applications"
           data-page="applications"
           th:if="${workspaceRole != 'admin'}"
           th:classappend="${currentPage == 'applications'} ? ' active' : ''">
            <span class="nav-item__indicator" aria-hidden="true"></span>
            <i class="nav-item__icon fas fa-cubes" aria-hidden="true"></i>
            <div class="nav-item__texts">
                <span class="nav-item__title">应用管理</span>
                <span class="nav-item__desc">版本、调试与发布</span>
            </div>
        </a>

        <a href="#deployments"
           class="workspace-nav-item modern-nav-link"
           data-nav-id="deployments"
           data-page="deployments"
           th:if="${workspaceRole != 'admin'}"
           th:classappend="${currentPage == 'deployments'} ? ' active' : ''">
            <span class="nav-item__indicator" aria-hidden="true"></span>
            <i class="nav-item__icon fas fa-rocket" aria-hidden="true"></i>
            <div class="nav-item__texts">
                <span class="nav-item__title">部署任务</span>
                <span class="nav-item__desc">管道与进度追踪</span>
            </div>
        </a>

        <a href="#profile"
           class="workspace-nav-item modern-nav-link"
           data-nav-id="profile"
           data-page="profile"
           th:if="${workspaceRole != 'admin'}"
           th:classappend="${currentPage == 'profile'} ? ' active' : ''">
            <span class="nav-item__indicator" aria-hidden="true"></span>
            <i class="nav-item__icon fas fa-id-card" aria-hidden="true"></i>
            <div class="nav-item__texts">
                <span class="nav-item__title">个人设置</span>
                <span class="nav-item__desc">密钥与偏好</span>
            </div>
        </a>
    </nav>

    <div class="workspace-sidebar__footer" th:if="${workspaceRole == 'admin'}">
        <a href="/docs" class="footer-link">
            <i class="fas fa-book" aria-hidden="true"></i>
            <span>操作手册</span>
        </a>
        <a href="/support" class="footer-link">
            <i class="fas fa-comments" aria-hidden="true"></i>
            <span>反馈与支持</span>
        </a>
        <div class="footer-meta">
            <span class="meta-label">当前环境</span>
            <span class="meta-value">DEV</span>
        </div>
        <div class="footer-meta">
            <span class="meta-label">系统版本</span>
            <span class="meta-value">v2.1.0</span>
        </div>
    </div>

    <div class="workspace-sidebar__footer" th:if="${workspaceRole != 'admin'}">
        <a href="/docs/api" class="footer-link">
            <i class="fas fa-code" aria-hidden="true"></i>
            <span>API 文档</span>
        </a>
        <a href="/feedback" class="footer-link">
            <i class="fas fa-comment-dots" aria-hidden="true"></i>
            <span>问题反馈</span>
        </a>
        <a href="/ci-status" class="footer-link">
            <i class="fas fa-circle-nodes" aria-hidden="true"></i>
            <span>CI 状态</span>
        </a>
    </div>
</aside>

<main th:fragment="modern-content-area" class="workspace-content" id="modernContentArea">
    <div class="workspace-loading" id="loadingSpinner" role="status" aria-live="polite" hidden>
        <div class="loading-indicator"></div>
        <span class="loading-text">正在加载内容...</span>
    </div>
    <div class="workspace-content__inner" id="contentWrapper" role="region" aria-live="polite"></div>
</main>
