<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - Dev Debug Platform</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <h1>Dev Debug Platform</h1>
        <h2>用户注册</h2>
        
        <!-- 错误信息显示 -->
        <div th:if="${errorMessage}" class="error-message" style="color: red; margin-bottom: 15px; padding: 10px; background-color: #ffe6e6; border-radius: 4px;">
            <span th:text="${errorMessage}"></span>
        </div>
        
        <!-- 成功信息显示 -->
        <div th:if="${successMessage}" class="success-message" style="color: green; margin-bottom: 15px; padding: 10px; background-color: #e6ffe6; border-radius: 4px;">
            <span th:text="${successMessage}"></span>
        </div>
        
        <form th:action="@{/register}" method="post">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="email">邮箱</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" required minlength="6">
            </div>
            <div class="form-group">
                <label for="confirmPassword">确认密码</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required minlength="6">
            </div>
            <div class="form-group">
                <button type="submit" class="btn-primary">注册</button>
            </div>
        </form>
        <p>已有账号？<a th:href="@{/login}">立即登录</a></p>
    </div>
</body>
</html>
