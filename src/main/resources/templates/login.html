<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - Dev Debug Platform</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/login.css">
</head>
<body class="login-body">
    <div class="login-background">
        <div class="login-particles">
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
        </div>
    </div>
    
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo">
                    <div class="logo-icon">🚀</div>
                    <h1>Dev Debug Platform</h1>
                </div>
                <p class="login-subtitle">欢迎回来，开发者！</p>
            </div>
            
            <!-- 错误信息显示 -->
            <div th:if="${param.error}" class="alert-message error-message">
                <div class="alert-icon">⚠️</div>
                <div class="alert-content">
                    <strong>登录失败</strong>
                    <p>用户名或密码错误，请检查后重试</p>
                </div>
            </div>
            
            <!-- 成功信息显示 -->
            <div th:if="${param.logout}" class="alert-message success-message">
                <div class="alert-icon">✅</div>
                <div class="alert-content">
                    <strong>退出成功</strong>
                    <p>您已安全退出系统</p>
                </div>
            </div>
            
            <!-- 会话过期信息显示 -->
            <div th:if="${param.expired}" class="alert-message warning-message">
                <div class="alert-icon">⏰</div>
                <div class="alert-content">
                    <strong>会话已过期</strong>
                    <p>长时间未操作，请重新登录</p>
                </div>
            </div>
            
            <form class="login-form" th:action="@{/login}" method="post">
                <div class="form-group">
                    <label for="username">
                        <span class="label-icon">👤</span>
                        用户名
                    </label>
                    <div class="input-wrapper">
                        <input type="text" 
                               id="username" 
                               name="username" 
                               placeholder="请输入您的用户名" 
                               required 
                               autocomplete="username">
                        <div class="input-border"></div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="password">
                        <span class="label-icon">🔒</span>
                        密码
                    </label>
                    <div class="input-wrapper">
                        <input type="password" 
                               id="password" 
                               name="password" 
                               placeholder="请输入您的密码" 
                               required 
                               autocomplete="current-password">
                        <div class="input-border"></div>
                        <button type="button" class="toggle-password" onclick="togglePassword()">
                            <span id="toggle-icon">👁️</span>
                        </button>
                    </div>
                </div>
                
                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" name="remember-me">
                        <span class="checkbox-custom"></span>
                        记住我
                    </label>
                    <a href="#" class="forgot-password">忘记密码？</a>
                </div>
                
                <button type="submit" class="login-btn">
                    <span class="btn-text">登录</span>
                    <div class="btn-loading">
                        <div class="loading-spinner"></div>
                    </div>
                </button>
            </form>
            
            <div class="login-footer">
                <p>还没有账号？
                    <a th:href="@{/register}" class="register-link">立即注册</a>
                </p>
                <div class="footer-links">
                    <a href="#" class="footer-link">关于我们</a>
                    <span class="separator">|</span>
                    <a href="#" class="footer-link">帮助中心</a>
                    <span class="separator">|</span>
                    <a href="#" class="footer-link">隐私政策</a>
                </div>
            </div>
        </div>
        
        <div class="system-info">
            <div class="info-item">
                <span class="info-icon">🌐</span>
                <span>安全连接</span>
            </div>
            <div class="info-item">
                <span class="info-icon">🔐</span>
                <span>数据加密</span>
            </div>
            <div class="info-item">
                <span class="info-icon">⚡</span>
                <span>快速响应</span>
            </div>
        </div>
    </div>
    
    <script>
        // 密码显示/隐藏切换
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('toggle-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.textContent = '🙈';
            } else {
                passwordInput.type = 'password';
                toggleIcon.textContent = '👁️';
            }
        }
        
        // 表单提交动画
        document.querySelector('.login-form').addEventListener('submit', function(e) {
            const submitBtn = document.querySelector('.login-btn');
            submitBtn.classList.add('loading');
        });
        
        // 输入框聚焦效果
        document.querySelectorAll('.input-wrapper input').forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.classList.add('focused');
            });
            
            input.addEventListener('blur', function() {
                if (!this.value) {
                    this.parentElement.classList.remove('focused');
                }
            });
            
            // 初始化已有值的输入框
            if (input.value) {
                input.parentElement.classList.add('focused');
            }
        });
        
        // 粒子动画
        function createParticle() {
            const particles = document.querySelectorAll('.particle');
            particles.forEach(particle => {
                const delay = Math.random() * 20;
                const duration = 20 + Math.random() * 10;
                particle.style.animationDelay = delay + 's';
                particle.style.animationDuration = duration + 's';
            });
        }
        
        createParticle();
    </script>
</body>
</html>
