<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/springsecurity" class="theme-light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev Debug Platform - 统一管理平台</title>
    <!-- CSRF Meta Tags -->
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>

    <!-- 更强的防闪烁策略 - 立即执行 -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.documentElement.classList.remove('theme-light');
                document.documentElement.classList.add('theme-dark');
                document.documentElement.style.setProperty('--background-color', '#121212');
                document.documentElement.style.setProperty('--background-light', '#1e1e1e');
                document.documentElement.style.setProperty('--text-color', '#e0e0e0');
                // 监听body可用时立即应用
                function applyToBody() {
                    if (document.body) {
                        document.body.classList.add('dark-theme');
                    } else {
                        setTimeout(applyToBody, 1);
                    }
                }
                applyToBody();
            }
        })();
    </script>

    <style>
        /* 预设暗色主题样式避免闪烁 */
        .theme-dark {
            background-color: #121212 !important;
            color: #e0e0e0 !important;
        }
        .theme-dark * {
            transition: none !important;
        }
    </style>

    <!-- 预加载关键字体 -->
    <link rel="preload" href="/vendor/fontawesome/webfonts/fa-solid-900.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/vendor/fontawesome/webfonts/fa-regular-400.woff2" as="font" type="font/woff2" crossorigin>

    <link rel="stylesheet" href="/css/fontawesome-local.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/common-dashboard.css">
    <link rel="stylesheet" href="/css/dashboard-theme.css">
    <link rel="stylesheet" href="/css/drawer.css">
    <link rel="stylesheet" href="/css/server-status-tags.css">
    <link rel="stylesheet" href="/css/server-detail-modal.css">
    <!-- 现代化开发者工作台样式 -->
    <link rel="stylesheet" href="/css/modern-developer-dashboard.css">
    <link rel="stylesheet" href="/css/modern-dashboard-stats.css">
    <link rel="stylesheet" href="/css/modern-app-cards.css">
    <link rel="stylesheet" href="/css/modern-upload-modal.css">
    <link rel="stylesheet" href="/css/batch-operations.css">
    <!-- 现代化管理员页面样式 -->
    <link rel="stylesheet" href="/css/modern-admin-pages.css">
    <link rel="stylesheet" href="/css/modern-sidebar.css">
    <!-- 现代化导航栏样式 -->
    <link rel="stylesheet" href="/css/modern-navigation.css">

    <!-- 引入现代化导航片段样式 -->
    <div th:replace="~{fragments/modern-navigation :: modern-nav-styles}"></div>

    <!-- WebSocket依赖库 -->
    <script src="/vendor/sockjs/sockjs.min.js"></script>
    <script src="/vendor/sockjs/stomp.min.js"></script>
    <script src="/js/server-status-tags.js"></script>
</head>
<body class="dashboard-body admin-theme theme-body has-modern-nav">
    <!-- 现代化顶部导航栏 (使用片段) -->
    <div th:replace="~{fragments/modern-navigation :: modern-top-nav}"></div>

    <!-- 现代化侧边栏 (使用片段) -->
    <div th:replace="~{fragments/modern-navigation :: modern-sidebar}"></div>

    <!-- 移动端遮罩层 (使用片段) -->
    <div th:replace="~{fragments/modern-navigation :: mobile-overlay}"></div>

    <!-- 现代化内容区域 (使用片段) -->
    <main th:replace="~{fragments/modern-navigation :: modern-content-area}" id="modernContentArea">
        <!-- 加载动画 -->
        <div class="loading-spinner" id="loadingSpinner">
            <div class="spinner"></div>
        </div>

        <!-- 内容容器 -->
        <div class="content-wrapper" id="contentWrapper">
            <!-- 默认加载工作台内容 -->
            <div id="content-dashboard" class="content-section active">
                <div class="content-header">
                    <div class="page-title-group">
                        <h1 class="page-title">管理员工作台</h1>
                    </div>
                </div>

                <!-- 这里将加载工作台的具体内容 -->
            </div>
        </div>
    </main>

    <!-- 移动端遮罩 -->
    <div class="mobile-overlay" id="mobileOverlay" onclick="closeMobileMenu()"></div>

    <!-- 引入现代化导航片段集成脚本 -->
    <div th:replace="~{fragments/modern-navigation :: modern-nav-integration}"></div>

    <!-- 保持原有的JavaScript逻辑不变 -->
    <script>
        // 全局变量
        let currentPage = '';
        let isLoading = false;

        // CSRF Token Helper Functions
        function getCSRFToken() {
            const csrfToken = document.querySelector('meta[name="_csrf"]');
            return csrfToken ? csrfToken.getAttribute('content') : null;
        }

        function getCSRFHeaderName() {
            const csrfHeader = document.querySelector('meta[name="_csrf_header"]');
            return csrfHeader ? csrfHeader.getAttribute('content') : 'X-CSRF-TOKEN';
        }

        // 保持原有SPA的所有JavaScript逻辑 - 此处省略，但需要完整复制
        // [原有的SPA JavaScript代码将在这里保持不变]
    </script>
</body>
</html>
