<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户操作详情 - Dev Debug Platform</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" th:href="@{/css/fontawesome-local.css}">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/server-detail-modal.css}">
    
    <style>
        .search-filters {
            background: rgba(248, 249, 250, 0.8);
            backdrop-filter: blur(4px);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            border: 1px solid #dee2e6;
        }
        
        .filter-row {
            margin-bottom: 16px;
        }
        
        .filter-row:last-child {
            margin-bottom: 0;
        }
        
        .operation-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            border-radius: 12px;
            border: 1px solid #dee2e6;
            margin-bottom: 16px;
            transition: all 0.3s ease;
            overflow: hidden;
        }
        
        .operation-card:hover {
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            transform: translateY(-2px);
        }
        
        .operation-header {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 16px 20px;
            border-bottom: 1px solid #dee2e6;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .operation-type {
            font-weight: 600;
            color: #495057;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .operation-time {
            font-size: 0.875rem;
            color: #6c757d;
            font-family: monospace;
        }
        
        .operation-content {
            padding: 20px;
        }
        
        .operation-details {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 16px;
            margin-top: 16px;
            font-size: 0.875rem;
        }
        
        .risk-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .risk-low {
            background: linear-gradient(135deg, #d4edda, #c3e6cb);
            color: #155724;
        }
        
        .risk-medium {
            background: linear-gradient(135deg, #fff3cd, #ffeaa7);
            color: #856404;
        }
        
        .risk-high {
            background: linear-gradient(135deg, #f8d7da, #f5c6cb);
            color: #721c24;
        }
        
        .pagination-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            margin: 32px 0;
        }
        
        .export-buttons {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        
        .stats-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        
        .stats-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            border: 1px solid #dee2e6;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }
        
        .stats-number {
            font-size: 2rem;
            font-weight: 700;
            color: #0d6efd;
            display: block;
            margin-bottom: 8px;
        }
        
        .stats-label {
            color: #6c757d;
            font-size: 0.875rem;
        }
        
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            backdrop-filter: blur(4px);
        }
        
        .loading-spinner {
            background: white;
            padding: 24px;
            border-radius: 12px;
            text-align: center;
        }
        
        .no-data {
            text-align: center;
            padding: 60px 20px;
            color: #6c757d;
        }
        
        .no-data i {
            font-size: 4rem;
            margin-bottom: 16px;
            opacity: 0.5;
        }
    </style>
</head>

<body>
    <div class="container-fluid py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 mb-0">
                <i class="fas fa-user-clock me-2"></i>
                用户操作详情
            </h1>
            <div class="export-buttons">
                <button type="button" class="btn btn-outline-primary btn-sm" onclick="refreshData()">
                    <i class="fas fa-refresh me-1"></i>刷新
                </button>
                <button type="button" class="btn btn-success btn-sm" onclick="exportData('csv')">
                    <i class="fas fa-file-csv me-1"></i>导出CSV
                </button>
                <button type="button" class="btn btn-info btn-sm" onclick="exportData('json')">
                    <i class="fas fa-file-code me-1"></i>导出JSON
                </button>
            </div>
        </div>
        
        <!-- 统计卡片 -->
        <div class="stats-cards" id="statsCards">
            <div class="stats-card">
                <span class="stats-number" id="totalActivities">-</span>
                <span class="stats-label">总操作数</span>
            </div>
            <div class="stats-card">
                <span class="stats-number" id="totalActiveUsers">-</span>
                <span class="stats-label">活跃用户数</span>
            </div>
            <div class="stats-card">
                <span class="stats-number" id="dangerousOperations">-</span>
                <span class="stats-label">高风险操作</span>
            </div>
            <div class="stats-card">
                <span class="stats-number" id="todayActivities">-</span>
                <span class="stats-label">今日操作</span>
            </div>
        </div>
        
        <!-- 搜索过滤器 -->
        <div class="search-filters">
            <form id="searchForm">
                <div class="row filter-row">
                    <div class="col-md-3">
                        <label class="form-label">服务器</label>
                        <select class="form-select" name="serverId">
                            <option value="">全部服务器</option>
                            <option th:each="server : ${servers}" 
                                    th:value="${server.id}" 
                                    th:text="${server.name}"></option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">用户名</label>
                        <input type="text" class="form-control" name="username" placeholder="输入用户名">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">活动类型</label>
                        <select class="form-select" name="activityType">
                            <option value="">全部类型</option>
                            <option th:each="type : ${activityTypes}" 
                                    th:value="${type}" 
                                    th:text="${type.description}"></option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">状态</label>
                        <select class="form-select" name="isActive">
                            <option value="">全部状态</option>
                            <option value="true">活跃</option>
                            <option value="false">已结束</option>
                        </select>
                    </div>
                </div>
                
                <div class="row filter-row">
                    <div class="col-md-3">
                        <label class="form-label">开始时间</label>
                        <input type="datetime-local" class="form-control" name="startTime">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">结束时间</label>
                        <input type="datetime-local" class="form-control" name="endTime">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">远程IP</label>
                        <input type="text" class="form-control" name="remoteIp" placeholder="输入IP地址">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">关键词搜索</label>
                        <input type="text" class="form-control" name="keyword" placeholder="在操作详情中搜索">
                    </div>
                </div>
                
                <div class="row filter-row">
                    <div class="col-md-12">
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-search me-1"></i>搜索
                            </button>
                            <button type="button" class="btn btn-outline-secondary" onclick="clearFilters()">
                                <i class="fas fa-times me-1"></i>清空
                            </button>
                        </div>
                    </div>
                </div>
            </form>
        </div>
        
        <!-- 操作列表 -->
        <div id="operationsList" class="operations-list">
            <!-- 动态加载内容 -->
        </div>
        
        <!-- 分页 -->
        <div class="pagination-wrapper">
            <nav aria-label="操作分页">
                <ul class="pagination" id="pagination">
                    <!-- 动态生成分页 -->
                </ul>
            </nav>
            <div class="d-flex align-items-center gap-2">
                <span class="text-muted">每页显示</span>
                <select class="form-select form-select-sm" id="pageSize" style="width: auto;">
                    <option value="10">10</option>
                    <option value="20" selected>20</option>
                    <option value="50">50</option>
                    <option value="100">100</option>
                </select>
                <span class="text-muted">条记录</span>
            </div>
        </div>
    </div>
    
    <!-- 加载遮罩 -->
    <div class="loading-overlay" id="loadingOverlay" style="display: none;">
        <div class="loading-spinner">
            <div class="spinner-border text-primary mb-3" role="status">
                <span class="visually-hidden">加载中...</span>
            </div>
            <div>正在加载数据...</div>
        </div>
    </div>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        let currentPage = 0;
        let currentPageSize = 20;
        let totalPages = 0;
        let currentQuery = {};
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            loadStatistics();
            loadOperations();
            
            // 绑定搜索表单事件
            document.getElementById('searchForm').addEventListener('submit', function(e) {
                e.preventDefault();
                currentPage = 0;
                loadOperations();
            });
            
            // 绑定页面大小变化事件
            document.getElementById('pageSize').addEventListener('change', function() {
                currentPageSize = parseInt(this.value);
                currentPage = 0;
                loadOperations();
            });
        });
        
        // 加载统计信息
        function loadStatistics() {
            fetch('/user-operations/api/statistics')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('totalActivities').textContent = data.totalActivities || 0;
                    document.getElementById('totalActiveUsers').textContent = data.totalActiveUsers || 0;
                    document.getElementById('dangerousOperations').textContent = data.dangerousOperations || 0;
                    document.getElementById('todayActivities').textContent = data.rangeActivities || 0;
                })
                .catch(error => {
                    console.error('加载统计信息失败:', error);
                });
        }
        
        // 加载操作列表
        function loadOperations() {
            showLoading();
            
            // 构建查询参数
            const formData = new FormData(document.getElementById('searchForm'));
            const query = {
                page: currentPage,
                size: currentPageSize,
                sortBy: 'createdAt',
                sortDirection: 'desc'
            };
            
            // 添加过滤条件
            for (let [key, value] of formData.entries()) {
                if (value) {
                    query[key] = value;
                }
            }
            
            currentQuery = query;
            
            fetch('/user-operations/api/search', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(query)
            })
            .then(response => response.json())
            .then(data => {
                hideLoading();
                
                if (data.error) {
                    showError(data.error);
                    return;
                }
                
                renderOperations(data.content);
                renderPagination(data);
                totalPages = data.totalPages;
            })
            .catch(error => {
                hideLoading();
                console.error('加载操作列表失败:', error);
                showError('加载数据失败，请稍后重试');
            });
        }
        
        // 渲染操作列表
        function renderOperations(operations) {
            const container = document.getElementById('operationsList');
            
            if (!operations || operations.length === 0) {
                container.innerHTML = `
                    <div class="no-data">
                        <i class="fas fa-search"></i>
                        <h5>暂无数据</h5>
                        <p class="text-muted">没有找到符合条件的操作记录</p>
                    </div>
                `;
                return;
            }
            
            const html = operations.map(op => `
                <div class="operation-card" data-id="${op.id}">
                    <div class="operation-header">
                        <div class="operation-type">
                            <i class="fas fa-${getActivityIcon(op.activityType)} me-2"></i>
                            ${op.activityTypeDescription || op.activityType}
                            <span class="risk-badge risk-${(op.riskLevel || '').toLowerCase()}">${op.riskLevel || '未知'}</span>
                        </div>
                        <div class="operation-time">
                            ${formatDateTime(op.createdAt)}
                        </div>
                    </div>
                    <div class="operation-content">
                        <div class="row">
                            <div class="col-md-6">
                                <strong>用户:</strong> ${op.username || '-'}<br>
                                <strong>服务器:</strong> ${op.serverName || '-'}<br>
                                <strong>会话ID:</strong> <code>${op.sessionId || '-'}</code>
                            </div>
                            <div class="col-md-6">
                                <strong>远程IP:</strong> ${op.remoteIp || '-'}<br>
                                <strong>命令数量:</strong> ${op.commandCount || 0}<br>
                                <strong>会话时长:</strong> ${op.sessionDuration ? op.sessionDuration + '分钟' : '-'}
                            </div>
                        </div>
                        
                        ${op.operationSummary ? `
                            <div class="operation-details">
                                <strong>操作摘要:</strong> ${op.operationSummary}
                            </div>
                        ` : ''}
                        
                        ${op.activityDetails ? `
                            <div class="operation-details">
                                <strong>详细信息:</strong><br>
                                <code>${escapeHtml(op.activityDetails)}</code>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `).join('');
            
            container.innerHTML = html;
        }
        
        // 渲染分页
        function renderPagination(data) {
            const container = document.getElementById('pagination');
            const { currentPage: page, totalPages, hasNext, hasPrevious } = data;
            
            let html = '';
            
            // 上一页
            html += `
                <li class="page-item ${!hasPrevious ? 'disabled' : ''}">
                    <a class="page-link" href="#" onclick="changePage(${page - 1})" tabindex="-1">上一页</a>
                </li>
            `;
            
            // 页码
            const startPage = Math.max(0, page - 2);
            const endPage = Math.min(totalPages - 1, page + 2);
            
            if (startPage > 0) {
                html += `<li class="page-item"><a class="page-link" href="#" onclick="changePage(0)">1</a></li>`;
                if (startPage > 1) {
                    html += `<li class="page-item disabled"><span class="page-link">...</span></li>`;
                }
            }
            
            for (let i = startPage; i <= endPage; i++) {
                html += `
                    <li class="page-item ${i === page ? 'active' : ''}">
                        <a class="page-link" href="#" onclick="changePage(${i})">${i + 1}</a>
                    </li>
                `;
            }
            
            if (endPage < totalPages - 1) {
                if (endPage < totalPages - 2) {
                    html += `<li class="page-item disabled"><span class="page-link">...</span></li>`;
                }
                html += `<li class="page-item"><a class="page-link" href="#" onclick="changePage(${totalPages - 1})">${totalPages}</a></li>`;
            }
            
            // 下一页
            html += `
                <li class="page-item ${!hasNext ? 'disabled' : ''}">
                    <a class="page-link" href="#" onclick="changePage(${page + 1})">下一页</a>
                </li>
            `;
            
            container.innerHTML = html;
        }
        
        // 切换页面
        function changePage(page) {
            if (page < 0 || page >= totalPages) return;
            currentPage = page;
            loadOperations();
        }
        
        // 刷新数据
        function refreshData() {
            loadStatistics();
            loadOperations();
        }
        
        // 清空过滤器
        function clearFilters() {
            document.getElementById('searchForm').reset();
            currentPage = 0;
            loadOperations();
        }
        
        // 导出数据
        function exportData(format) {
            const query = { ...currentQuery, exportFormat: format };
            
            // 创建表单并提交
            const form = document.createElement('form');
            form.method = 'POST';
            form.action = '/user-operations/api/export';
            form.target = '_blank';
            
            const input = document.createElement('input');
            input.type = 'hidden';
            input.name = 'queryData';
            input.value = JSON.stringify(query);
            form.appendChild(input);
            
            document.body.appendChild(form);
            form.submit();
            document.body.removeChild(form);
        }
        
        // 显示加载遮罩
        function showLoading() {
            document.getElementById('loadingOverlay').style.display = 'flex';
        }
        
        // 隐藏加载遮罩
        function hideLoading() {
            document.getElementById('loadingOverlay').style.display = 'none';
        }
        
        // 显示错误信息
        function showError(message) {
            alert('错误: ' + message);
        }
        
        // 获取活动类型图标
        function getActivityIcon(activityType) {
            const icons = {
                'LOGIN': 'sign-in-alt',
                'LOGOUT': 'sign-out-alt',
                'COMMAND_EXECUTE': 'terminal',
                'FILE_TRANSFER': 'file-export',
                'PROCESS_START': 'play',
                'PROCESS_STOP': 'stop',
                'DIRECTORY_CHANGE': 'folder-open',
                'FILE_EDIT': 'edit',
                'SYSTEM_INFO': 'info-circle'
            };
            return icons[activityType] || 'question-circle';
        }
        
        // 格式化日期时间
        function formatDateTime(dateTime) {
            if (!dateTime) return '-';
            return new Date(dateTime).toLocaleString('zh-CN');
        }
        
        // HTML转义
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
