# ========================================
# PostgreSQL企业级配置 (可选,适合大型团队)
# ========================================
# 使用场景:
# - 大型团队(50+人)
# - 需要高可用部署
# - 多实例负载均衡
# - 数据量 > 10GB
# - 需要数据库审计/备份策略
#
# 启用方式:
# 方式1: 启动参数
#   ./mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=enterprise
# 
# 方式2: 环境变量
#   set SPRING_PROFILES_ACTIVE=enterprise
#   set DB_HOST=your-postgres-host
#   set DB_PORT=5432
#   set DB_NAME=internalpaas
#   set DB_USER=your-username
#   set DB_PASSWORD=your-password
#   ./mvnw.cmd spring-boot:run
#
# 方式3: JAR启动
#   java -jar -Dspring.profiles.active=enterprise \
#        -Ddb.host=localhost -Ddb.port=5432 \
#        target/internalpaas.jar
#

# 注意: 轻量级原则权衡
# ⚠️ 需要外部PostgreSQL服务 (违背零依赖原则)
# ⚠️ 部署复杂度增加 (需要配置数据库)
# ✅ 支持大数据量 (> 10GB)
# ✅ 支持高可用部署
# ✅ 企业级数据安全

# PostgreSQL数据库配置
# 使用环境变量以避免敏感信息硬编码
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:internalpaas}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:changeme}

# HikariCP连接池配置 (企业级优化)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# 连接测试配置
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=5000

# JPA配置 (生产环境)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# PostgreSQL方言
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# PostgreSQL性能优化
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.jdbc.fetch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true

# 二级缓存配置 (可选,需要Ehcache等缓存实现)
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false

# 关闭open-in-view以提高性能
spring.jpa.open-in-view=false

# 禁用H2 Console (企业级部署不需要)
spring.h2.console.enabled=false

# PostgreSQL特定优化
# - 使用prepared statement缓存
# - 启用服务器端prepared statement
spring.datasource.hikari.data-source-properties.prepStmtCacheSize=250
spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=2048
spring.datasource.hikari.data-source-properties.cachePrepStmts=true
spring.datasource.hikari.data-source-properties.useServerPrepStmts=true

# 企业级部署前置条件:
# 1. PostgreSQL 12+ 数据库已安装
# 2. 创建数据库: CREATE DATABASE internalpaas;
# 3. 创建用户并授权:
#    CREATE USER internalpaas_user WITH PASSWORD 'your_password';
#    GRANT ALL PRIVILEGES ON DATABASE internalpaas TO internalpaas_user;
# 4. 配置环境变量 (见上方"启用方式")
# 5. 首次启动前执行Schema初始化 (可选使用Flyway/Liquibase)

# 数据库Schema管理建议:
# - 生产环境使用 ddl-auto=validate (不自动修改表结构)
# - 使用Flyway或Liquibase进行版本化Schema管理
# - 添加以下依赖启用Flyway:
#   <dependency>
#     <groupId>org.flywaydb</groupId>
#     <artifactId>flyway-core</artifactId>
#   </dependency>

# PostgreSQL vs H2 对比:
# 
# PostgreSQL优势:
# ✅ 支持大数据量 (TB级)
# ✅ 高可用/主从复制
# ✅ 丰富的企业特性
# ✅ 强大的查询优化器
# ✅ 完整的ACID保证
#
# H2优势:
# ✅ 零外部依赖
# ✅ 部署极简单
# ✅ 适合小团队
# ✅ 完全轻量级

# 何时选择PostgreSQL:
# - 用户数 > 50
# - 服务器数 > 100
# - 数据量 > 10GB
# - 需要高可用
# - 多实例部署

# 何时坚持H2:
# - 小团队 (5-20人)
# - 单机部署
# - 快速启动需求
# - 轻量级优先
