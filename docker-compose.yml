version: '3.8'

services:
  # ========================================
  # 数据库服务
  # ========================================
  postgres:
    image: postgres:15-alpine
    container_name: codehub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: codehub
      POSTGRES_USER: codehub
      POSTGRES_PASSWORD: ${DB_PASSWORD:-codehub123}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    networks:
      - codehub-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codehub"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========================================
  # 缓存服务
  # ========================================
  redis:
    image: redis:7-alpine
    container_name: codehub-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123}
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - codehub-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========================================
  # 代码管理 - Gitea
  # ========================================
  gitea:
    image: gitea/gitea:1.21
    container_name: codehub-gitea
    restart: unless-stopped
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=postgres:5432
      - GITEA__database__NAME=gitea
      - GITEA__database__USER=codehub
      - GITEA__database__PASSWD=${DB_PASSWORD:-codehub123}
      - GITEA__server__DOMAIN=localhost
      - GITEA__server__HTTP_PORT=3000
      - GITEA__server__ROOT_URL=http://localhost:3000/
      - GITEA__server__SSH_PORT=2222
      - GITEA__security__INSTALL_LOCK=true
      - GITEA__service__DISABLE_REGISTRATION=true
      - GITEA__webhook__ALLOWED_HOST_LIST=*
    volumes:
      - gitea-data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3000:3000"
      - "2222:2222"
    networks:
      - codehub-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ========================================
  # CI/CD引擎 - Drone Server
  # ========================================
  drone-server:
    image: drone/drone:2.20
    container_name: codehub-drone-server
    restart: unless-stopped
    environment:
      - DRONE_GITEA_SERVER=http://gitea:3000
      - DRONE_GITEA_CLIENT_ID=${GITEA_OAUTH_CLIENT_ID}
      - DRONE_GITEA_CLIENT_SECRET=${GITEA_OAUTH_CLIENT_SECRET}
      - DRONE_RPC_SECRET=${DRONE_RPC_SECRET:-drone_rpc_secret_12345}
      - DRONE_SERVER_HOST=localhost:8000
      - DRONE_SERVER_PROTO=http
      - DRONE_USER_CREATE=username:admin,admin:true
      - DRONE_DATABASE_DRIVER=postgres
      - DRONE_DATABASE_DATASOURCE=postgres://codehub:${DB_PASSWORD:-codehub123}@postgres:5432/drone?sslmode=disable
    volumes:
      - drone-data:/data
    ports:
      - "8000:80"
    networks:
      - codehub-network
    depends_on:
      gitea:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # ========================================
  # CI/CD引擎 - Drone Runner (Docker)
  # ========================================
  drone-runner-docker:
    image: drone/drone-runner-docker:1.8
    container_name: codehub-drone-runner
    restart: unless-stopped
    environment:
      - DRONE_RPC_PROTO=http
      - DRONE_RPC_HOST=drone-server:80
      - DRONE_RPC_SECRET=${DRONE_RPC_SECRET:-drone_rpc_secret_12345}
      - DRONE_RUNNER_CAPACITY=10
      - DRONE_RUNNER_NAME=docker-runner-1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - codehub-network
    depends_on:
      - drone-server

  # ========================================
  # 代码质量 - SonarQube
  # ========================================
  sonarqube:
    image: sonarqube:10.3-community
    container_name: codehub-sonarqube
    restart: unless-stopped
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://postgres:5432/sonarqube
      - SONAR_JDBC_USERNAME=codehub
      - SONAR_JDBC_PASSWORD=${DB_PASSWORD:-codehub123}
      - SONAR_WEB_CONTEXT=/sonarqube
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs
    ports:
      - "9000:9000"
    networks:
      - codehub-network
    depends_on:
      postgres:
        condition: service_healthy
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  # ========================================
  # 制品库 - Nexus Repository
  # ========================================
  nexus:
    image: sonatype/nexus3:3.63.0
    container_name: codehub-nexus
    restart: unless-stopped
    environment:
      - INSTALL4J_ADD_VM_PARAMS=-Xms1g -Xmx2g -XX:MaxDirectMemorySize=2g
    volumes:
      - nexus-data:/nexus-data
    ports:
      - "8081:8081"  # Web UI
      - "8082:8082"  # Docker Registry
      - "8083:8083"  # Docker Registry (group)
    networks:
      - codehub-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/service/rest/v1/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # ========================================
  # 对象存储 - MinIO
  # ========================================
  minio:
    image: minio/minio:latest
    container_name: codehub-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minio123456}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Console
    networks:
      - codehub-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ========================================
  # CodeHub 后端服务
  # ========================================
  codehub-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GO_VERSION: 1.22.0
    container_name: codehub-server
    restart: unless-stopped
    environment:
      - SERVER_PORT=8880
      - SERVER_MODE=release
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=codehub
      - DB_PASSWORD=${DB_PASSWORD:-codehub123}
      - DB_DATABASE=codehub
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis123}
      - GITEA_URL=http://gitea:3000
      - GITEA_ADMIN_TOKEN=${GITEA_ADMIN_TOKEN}
      - DRONE_SERVER_URL=http://drone-server:80
      - DRONE_ADMIN_TOKEN=${DRONE_ADMIN_TOKEN}
      - SONARQUBE_URL=http://sonarqube:9000
      - SONARQUBE_ADMIN_TOKEN=${SONARQUBE_ADMIN_TOKEN}
      - NEXUS_URL=http://nexus:8081
      - NEXUS_ADMIN_PASSWORD=${NEXUS_ADMIN_PASSWORD}
      - JWT_SECRET=${JWT_SECRET:-jwt_secret_key_change_in_production}
    ports:
      - "8880:8880"
    networks:
      - codehub-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      gitea:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8880/health"]
      interval: 30s
      timeout: 10s
      retries: 3

# ========================================
# 网络配置
# ========================================
networks:
  codehub-network:
    driver: bridge

# ========================================
# 数据卷配置
# ========================================
volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  gitea-data:
    driver: local
  drone-data:
    driver: local
  sonarqube-data:
    driver: local
  sonarqube-extensions:
    driver: local
  sonarqube-logs:
    driver: local
  nexus-data:
    driver: local
  minio-data:
    driver: local
