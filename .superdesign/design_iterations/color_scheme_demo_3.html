<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>配色方案演示 - 自然中性</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        /* 方案3：自然中性 - 中性Header + 暖色Sidebar + 浅色Content */
        .color-scheme-3 {
            display: grid;
            grid-template-columns: 240px 1fr;
            grid-template-rows: 64px 1fr;
            grid-template-areas: "sidebar header" "sidebar content";
            height: 100vh;
        }

        .header-3 {
            grid-area: header;
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            color: #1e293b;
            display: flex;
            align-items: center;
            padding: 0 24px;
            box-shadow: 0 2px 16px rgba(15, 23, 42, 0.08);
            border-bottom: 2px solid #e2e8f0;
        }

        .sidebar-3 {
            grid-area: sidebar;
            background: linear-gradient(180deg, #fef7ed 0%, #fed7aa 100%);
            color: #9a3412;
            border-right: 2px solid #fdba74;
            box-shadow: 4px 0 16px rgba(251, 146, 60, 0.15);
            display: flex;
            flex-direction: column;
            padding: 20px 16px;
        }

        .content-3 {
            grid-area: content;
            background: linear-gradient(135deg, #ffffff 0%, #fefbff 100%);
            color: #0f172a;
            padding: 32px;
            overflow-y: auto;
        }

        /* 品牌区域 */
        .brand-area-3 {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
            border-radius: 16px;
            margin-bottom: 24px;
            background: rgba(251, 146, 60, 0.1);
            border: 2px solid rgba(251, 146, 60, 0.2);
        }

        .brand-icon-3 {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #f97316, #ea580c);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 18px;
            box-shadow: 0 4px 16px rgba(249, 115, 22, 0.3);
        }

        /* 导航项目 */
        .nav-item-3 {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            border-radius: 12px;
            margin-bottom: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }

        .nav-item-3:hover {
            background: rgba(251, 146, 60, 0.15);
            border-color: rgba(251, 146, 60, 0.3);
            transform: scale(1.02);
            color: #ea580c;
        }

        .nav-item-3.active {
            background: linear-gradient(135deg, #f97316, #ea580c);
            color: white;
            box-shadow: 0 6px 20px rgba(249, 115, 22, 0.4);
            transform: scale(1.02);
        }

        /* Header 工具栏 */
        .header-toolbar-3 {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-left: auto;
        }

        .header-btn-3 {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            color: #374151;
            padding: 10px 14px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .header-btn-3:hover {
            background: #f9fafb;
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
            border-color: #f97316;
        }

        /* 内容区域示例 */
        .content-card-3 {
            background: linear-gradient(135deg, #ffffff 0%, #fffbf5 100%);
            border: 1px solid #f3f4f6;
            border-radius: 16px;
            padding: 28px;
            margin-bottom: 24px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
            transition: all 0.3s ease;
            border-left: 4px solid #fdba74;
        }

        .content-card-3:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            border-left-color: #f97316;
        }

        .scheme-title {
            position: fixed;
            top: 10px;
            right: 10px;
            background: linear-gradient(135deg, #f97316, #ea580c);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 1000;
            box-shadow: 0 4px 16px rgba(249, 115, 22, 0.3);
        }

        /* 搜索栏样式 */
        .search-bar {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 8px 16px;
            margin-left: 20px;
            min-width: 200px;
            color: #6b7280;
            backdrop-filter: blur(8px);
        }

        .search-bar:focus {
            outline: none;
            border-color: #f97316;
            box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.1);
        }
    </style>
</head>
<body>
    <div class="scheme-title">方案3：自然中性</div>
    <div class="color-scheme-3">
        <header class="header-3">
            <div style="display: flex; align-items: center; gap: 12px;">
                <span style="font-size: 18px; color: #f97316;">☰</span>
                <span style="font-weight: 600;">Dev Debug Platform</span>
            </div>
            <input type="text" class="search-bar" placeholder="搜索应用、服务或命令...">
            <div class="header-toolbar-3">
                <button class="header-btn-3">🔔</button>
                <button class="header-btn-3">👤</button>
                <button class="header-btn-3">⚙️</button>
            </div>
        </header>

        <aside class="sidebar-3">
            <div class="brand-area-3">
                <div class="brand-icon-3">DD</div>
                <div>
                    <div style="font-weight: 600; font-size: 14px;">开发调试平台</div>
                    <div style="font-size: 12px; color: #c2410c;">v2.1.0</div>
                </div>
            </div>

            <nav>
                <div class="nav-item-3 active">
                    <span>📊</span>
                    <span>工作区概览</span>
                </div>
                <div class="nav-item-3">
                    <span>🚀</span>
                    <span>应用管理</span>
                </div>
                <div class="nav-item-3">
                    <span>🖥️</span>
                    <span>服务器管理</span>
                </div>
                <div class="nav-item-3">
                    <span>📈</span>
                    <span>监控中心</span>
                </div>
                <div class="nav-item-3">
                    <span>⚡</span>
                    <span>SSH终端</span>
                </div>
            </nav>
        </aside>

        <main class="content-3">
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 32px;">
                <h1 style="color: #111827;">工作区概览</h1>
                <div style="display: flex; gap: 12px;">
                    <span style="background: #22c55e; color: white; padding: 4px 12px; border-radius: 20px; font-size: 12px;">已连接</span>
                    <span style="background: #f97316; color: white; padding: 4px 12px; border-radius: 20px; font-size: 12px;">5个活跃应用</span>
                </div>
            </div>

            <div class="content-card-3">
                <h3 style="margin-bottom: 12px; color: #1f2937; display: flex; align-items: center; gap: 8px;">
                    <span style="color: #22c55e;">●</span>
                    系统状态
                </h3>
                <p style="color: #6b7280;">所有服务运行正常，最后更新：2分钟前</p>
            </div>

            <div class="content-card-3">
                <h3 style="margin-bottom: 12px; color: #1f2937; display: flex; align-items: center; gap: 8px;">
                    <span style="color: #3b82f6;">●</span>
                    活跃应用
                </h3>
                <p style="color: #6b7280;">当前有 5 个应用正在运行</p>
            </div>

            <div class="content-card-3">
                <h3 style="margin-bottom: 12px; color: #1f2937; display: flex; align-items: center; gap: 8px;">
                    <span style="color: #f59e0b;">●</span>
                    资源使用
                </h3>
                <p style="color: #6b7280;">CPU: 45% | 内存: 67% | 磁盘: 32%</p>
                <div style="margin-top: 12px; display: flex; gap: 8px;">
                    <div style="background: #ddd6fe; height: 8px; border-radius: 4px; flex: 45;"></div>
                    <div style="background: #fef3c7; height: 8px; border-radius: 4px; flex: 22;"></div>
                    <div style="background: #f3f4f6; height: 8px; border-radius: 4px; flex: 33;"></div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
