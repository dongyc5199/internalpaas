<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>配色方案演示 - 轻奢蓝调</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        /* 方案2：轻奢蓝调 - 蓝色Header + 深灰Sidebar + 白色Content */
        .color-scheme-2 {
            display: grid;
            grid-template-columns: 240px 1fr;
            grid-template-rows: 64px 1fr;
            grid-template-areas: "sidebar header" "sidebar content";
            height: 100vh;
        }

        .header-2 {
            grid-area: header;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
            color: #f8fafc;
            display: flex;
            align-items: center;
            padding: 0 24px;
            box-shadow: 0 8px 32px rgba(15, 23, 42, 0.15);
            border-bottom: 1px solid rgba(59, 130, 246, 0.3);
            position: relative;
        }

        .header-2::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, #3b82f6, #06b6d4, #8b5cf6);
        }

        .sidebar-2 {
            grid-area: sidebar;
            background: linear-gradient(180deg, #374151 0%, #4b5563 100%);
            color: #f3f4f6;
            border-right: 1px solid #6b7280;
            box-shadow: 8px 0 24px rgba(15, 23, 42, 0.12);
            display: flex;
            flex-direction: column;
            padding: 20px 16px;
        }

        .content-2 {
            grid-area: content;
            background: #ffffff;
            color: #111827;
            padding: 32px;
            overflow-y: auto;
        }

        /* 品牌区域 */
        .brand-area-2 {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 24px;
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.3);
            backdrop-filter: blur(8px);
        }

        .brand-icon-2 {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #3b82f6, #06b6d4);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 18px;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }

        /* 导航项目 */
        .nav-item-2 {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }

        .nav-item-2:hover {
            background: rgba(59, 130, 246, 0.15);
            border-color: rgba(59, 130, 246, 0.3);
            transform: translateX(4px);
        }

        .nav-item-2.active {
            background: linear-gradient(135deg, #3b82f6, #06b6d4);
            color: white;
            box-shadow: 0 4px 16px rgba(59, 130, 246, 0.4);
            transform: translateX(4px);
        }

        /* Header 工具栏 */
        .header-toolbar-2 {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-left: auto;
        }

        .header-btn-2 {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #f8fafc;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(8px);
        }

        .header-btn-2:hover {
            background: rgba(59, 130, 246, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        /* 内容区域示例 */
        .content-card-2 {
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
        }

        .content-card-2:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .scheme-title {
            position: fixed;
            top: 10px;
            right: 10px;
            background: linear-gradient(135deg, #3b82f6, #06b6d4);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 1000;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }
    </style>
</head>
<body>
    <div class="scheme-title">方案2：轻奢蓝调</div>
    <div class="color-scheme-2">
        <header class="header-2">
            <div style="display: flex; align-items: center; gap: 12px;">
                <span style="font-size: 18px;">☰</span>
                <span style="font-weight: 600;">Dev Debug Platform</span>
            </div>
            <div class="header-toolbar-2">
                <button class="header-btn-2">🔔</button>
                <button class="header-btn-2">👤</button>
                <button class="header-btn-2">⚙️</button>
            </div>
        </header>

        <aside class="sidebar-2">
            <div class="brand-area-2">
                <div class="brand-icon-2">DD</div>
                <div>
                    <div style="font-weight: 600; font-size: 14px;">开发调试平台</div>
                    <div style="font-size: 12px; color: #d1d5db;">v2.1.0</div>
                </div>
            </div>

            <nav>
                <div class="nav-item-2 active">
                    <span>📊</span>
                    <span>工作区概览</span>
                </div>
                <div class="nav-item-2">
                    <span>🚀</span>
                    <span>应用管理</span>
                </div>
                <div class="nav-item-2">
                    <span>🖥️</span>
                    <span>服务器管理</span>
                </div>
                <div class="nav-item-2">
                    <span>📈</span>
                    <span>监控中心</span>
                </div>
                <div class="nav-item-2">
                    <span>⚡</span>
                    <span>SSH终端</span>
                </div>
            </nav>
        </aside>

        <main class="content-2">
            <h1 style="margin-bottom: 24px; color: #111827;">工作区概览</h1>

            <div class="content-card-2">
                <h3 style="margin-bottom: 12px; color: #1f2937;">系统状态</h3>
                <p style="color: #6b7280;">所有服务运行正常，最后更新：2分钟前</p>
            </div>

            <div class="content-card-2">
                <h3 style="margin-bottom: 12px; color: #1f2937;">活跃应用</h3>
                <p style="color: #6b7280;">当前有 5 个应用正在运行</p>
            </div>

            <div class="content-card-2">
                <h3 style="margin-bottom: 12px; color: #1f2937;">资源使用</h3>
                <p style="color: #6b7280;">CPU: 45% | 内存: 67% | 磁盘: 32%</p>
            </div>
        </main>
    </div>
</body>
</html>
