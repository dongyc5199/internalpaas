<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>配色方案演示 - 现代深色系</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        /* 方案1：现代深色系 - 深色Header + 中性Sidebar + 浅色Content */
        .color-scheme-1 {
            display: grid;
            grid-template-columns: 240px 1fr;
            grid-template-rows: 64px 1fr;
            grid-template-areas: "sidebar header" "sidebar content";
            height: 100vh;
        }

        .header-1 {
            grid-area: header;
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            color: #f8fafc;
            display: flex;
            align-items: center;
            padding: 0 24px;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15);
            border-bottom: 1px solid rgba(71, 85, 105, 0.3);
        }

        .sidebar-1 {
            grid-area: sidebar;
            background: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
            color: #1e293b;
            border-right: 1px solid #e2e8f0;
            box-shadow: 4px 0 12px rgba(15, 23, 42, 0.08);
            display: flex;
            flex-direction: column;
            padding: 20px 16px;
        }

        .content-1 {
            grid-area: content;
            background: #ffffff;
            color: #0f172a;
            padding: 32px;
            overflow-y: auto;
        }

        /* 品牌区域 */
        .brand-area {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 24px;
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.2);
        }

        .brand-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 18px;
        }

        /* 导航项目 */
        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-item:hover {
            background: rgba(59, 130, 246, 0.1);
            color: #1d4ed8;
        }

        .nav-item.active {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.3);
        }

        /* Header 工具栏 */
        .header-toolbar {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-left: auto;
        }

        .header-btn {
            background: rgba(248, 250, 252, 0.1);
            border: 1px solid rgba(248, 250, 252, 0.2);
            color: #f8fafc;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .header-btn:hover {
            background: rgba(248, 250, 252, 0.2);
            transform: translateY(-1px);
        }

        /* 内容区域示例 */
        .content-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 1px 3px rgba(15, 23, 42, 0.1);
        }

        .scheme-title {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div class="scheme-title">方案1：现代深色系</div>
    <div class="color-scheme-1">
        <header class="header-1">
            <div style="display: flex; align-items: center; gap: 12px;">
                <span style="font-size: 18px;">☰</span>
                <span style="font-weight: 600;">Dev Debug Platform</span>
            </div>
            <div class="header-toolbar">
                <button class="header-btn">🔔</button>
                <button class="header-btn">👤</button>
                <button class="header-btn">⚙️</button>
            </div>
        </header>

        <aside class="sidebar-1">
            <div class="brand-area">
                <div class="brand-icon">DD</div>
                <div>
                    <div style="font-weight: 600; font-size: 14px;">开发调试平台</div>
                    <div style="font-size: 12px; color: #64748b;">v2.1.0</div>
                </div>
            </div>

            <nav>
                <div class="nav-item active">
                    <span>📊</span>
                    <span>工作区概览</span>
                </div>
                <div class="nav-item">
                    <span>🚀</span>
                    <span>应用管理</span>
                </div>
                <div class="nav-item">
                    <span>🖥️</span>
                    <span>服务器管理</span>
                </div>
                <div class="nav-item">
                    <span>📈</span>
                    <span>监控中心</span>
                </div>
                <div class="nav-item">
                    <span>⚡</span>
                    <span>SSH终端</span>
                </div>
            </nav>
        </aside>

        <main class="content-1">
            <h1 style="margin-bottom: 24px; color: #0f172a;">工作区概览</h1>

            <div class="content-card">
                <h3 style="margin-bottom: 12px; color: #1e293b;">系统状态</h3>
                <p style="color: #64748b;">所有服务运行正常，最后更新：2分钟前</p>
            </div>

            <div class="content-card">
                <h3 style="margin-bottom: 12px; color: #1e293b;">活跃应用</h3>
                <p style="color: #64748b;">当前有 5 个应用正在运行</p>
            </div>

            <div class="content-card">
                <h3 style="margin-bottom: 12px; color: #1e293b;">资源使用</h3>
                <p style="color: #64748b;">CPU: 45% | 内存: 67% | 磁盘: 32%</p>
            </div>
        </main>
    </div>
</body>
</html>
