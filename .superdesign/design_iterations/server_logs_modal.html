<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>服务器日志查看弹窗</title>
    
    <!-- 引入Font Awesome图标 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- 引入主题样式 -->
    <style>
        /* 服务器日志弹窗主题 - 与现有系统兼容 */

/* 继承现有系统的颜色变量 */
:root {
  /* 现有系统颜色兼容 */
  --modal-primary: #0d6efd;
  --modal-success: #198754;
  --modal-warning: #ffc107;
  --modal-danger: #dc3545;
  --modal-info: #0dcaf0;
  
  /* 文本颜色 */
  --modal-text-primary: #212529;
  --modal-text-secondary: #6c757d;
  --modal-text-tertiary: #adb5bd;
  
  /* 背景颜色 */
  --modal-bg-light: #f8f9fa;
  --modal-bg-dark: #212529;
  
  /* 边框和阴影 */
  --modal-border: #dee2e6;
  --modal-shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
  --modal-shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
  --modal-shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
  
  /* 过渡动画 */
  --modal-transition-fast: 0.15s ease;
  --modal-transition-normal: 0.3s ease;
  
  /* 圆角 */
  --modal-radius-sm: 4px;
  --modal-radius-md: 8px;
  --modal-radius-lg: 12px;
  
  /* 专用弹窗变量 */
  --modal-overlay-bg: rgba(0, 0, 0, 0.6);
  --modal-backdrop-blur: 4px;
  --modal-max-width: 90vw;
  --modal-max-height: 85vh;
  
  /* 时间轴专用颜色 */
  --timeline-line-color: var(--modal-border);
  --timeline-dot-color: var(--modal-primary);
  --timeline-hover-bg: rgba(13, 110, 253, 0.05);
  
  /* 操作类型颜色 */
  --op-command: #6366f1;
  --op-file: #10b981;
  --op-app: #8b5cf6;
  --op-log: #f59e0b;
  --op-ssh: #f97316;
  --op-system: #6b7280;
  --op-error: var(--modal-danger);
  --op-monitor: #06b6d4;
}

/* 页面基础样式 */
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  margin: 0;
  padding: 2rem;
  background: #f8f9fa;
  min-height: 100vh;
}

.demo-container {
  text-align: center;
}

.demo-title {
  font-size: 2rem;
  font-weight: 600;
  color: var(--modal-text-primary);
  margin-bottom: 1rem;
}

.demo-subtitle {
  font-size: 1rem;
  color: var(--modal-text-secondary);
  margin-bottom: 2rem;
}

.demo-btn {
  padding: 1rem 2rem;
  background: var(--modal-primary);
  color: white;
  border: none;
  border-radius: var(--modal-radius-md);
  font-size: 1rem;
  font-weight: 500;
  cursor: pointer;
  transition: all var(--modal-transition-fast);
  box-shadow: var(--modal-shadow-md);
}

.demo-btn:hover {
  background: #0b5ed7;
  transform: translateY(-2px);
  box-shadow: var(--modal-shadow-lg);
}

/* 弹窗遮罩层 */
.logs-modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--modal-overlay-bg);
  backdrop-filter: blur(var(--modal-backdrop-blur));
  z-index: 10000;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  visibility: hidden;
  transition: all var(--modal-transition-normal);
}

.logs-modal-overlay.show {
  opacity: 1;
  visibility: visible;
}

/* 主弹窗容器 */
.logs-modal {
  background: white;
  border-radius: var(--modal-radius-lg);
  box-shadow: var(--modal-shadow-lg);
  border: 1px solid var(--modal-border);
  max-width: var(--modal-max-width);
  max-height: var(--modal-max-height);
  width: 1200px;
  height: 800px;
  display: flex;
  flex-direction: column;
  transform: scale(0.9) translateY(20px);
  transition: transform var(--modal-transition-normal);
  overflow: hidden;
}

.logs-modal-overlay.show .logs-modal {
  transform: scale(1) translateY(0);
}

/* 弹窗头部 */
.logs-modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1.5rem 2rem;
  border-bottom: 2px solid var(--modal-border);
  background: linear-gradient(135deg, var(--modal-bg-light) 0%, #ffffff 100%);
  position: relative;
}

.logs-modal-header::after {
  content: '';
  position: absolute;
  bottom: -2px;
  left: 0;
  width: 100px;
  height: 2px;
  background: linear-gradient(45deg, #667eea, #764ba2);
}

.server-info-header {
  display: flex;
  align-items: center;
  gap: 1rem;
}

.server-status-indicator {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--modal-success);
  animation: pulse 2s infinite;
}

.server-status-indicator.offline {
  background: var(--modal-danger);
  animation: none;
}

.server-name-title {
  font-size: 1.5rem;
  font-weight: 600;
  color: var(--modal-text-primary);
  margin: 0;
}

.time-range-selector {
  display: flex;
  gap: 0.5rem;
  background: var(--modal-bg-light);
  border-radius: var(--modal-radius-md);
  padding: 0.25rem;
  border: 1px solid var(--modal-border);
}

.time-range-btn {
  padding: 0.5rem 1rem;
  border: none;
  background: transparent;
  color: var(--modal-text-secondary);
  border-radius: var(--modal-radius-sm);
  cursor: pointer;
  transition: all var(--modal-transition-fast);
  font-size: 0.875rem;
  font-weight: 500;
}

.time-range-btn.active {
  background: var(--modal-primary);
  color: white;
  box-shadow: var(--modal-shadow-sm);
}

.time-range-btn:hover:not(.active) {
  background: rgba(13, 110, 253, 0.1);
  color: var(--modal-primary);
}

.modal-close-btn {
  width: 40px;
  height: 40px;
  border: none;
  background: var(--modal-bg-light);
  border-radius: 50%;
  color: var(--modal-text-secondary);
  cursor: pointer;
  transition: all var(--modal-transition-fast);
  font-size: 1.25rem;
  display: flex;
  align-items: center;
  justify-content: center;
}

.modal-close-btn:hover {
  background: var(--modal-danger);
  color: white;
  transform: scale(1.1);
}

/* 弹窗主体内容 */
.logs-modal-body {
  flex: 1;
  display: flex;
  overflow: hidden;
}

/* 左侧时间轴区域 */
.timeline-panel {
  width: 35%;
  background: var(--modal-bg-light);
  border-right: 1px solid var(--modal-border);
  display: flex;
  flex-direction: column;
}

.timeline-header {
  padding: 1rem 1.5rem;
  border-bottom: 1px solid var(--modal-border);
  background: white;
}

.timeline-title {
  font-size: 1.125rem;
  font-weight: 600;
  color: var(--modal-text-primary);
  margin: 0 0 0.5rem 0;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.activity-summary {
  display: flex;
  gap: 1rem;
  margin-top: 0.5rem;
}

.summary-item {
  font-size: 0.75rem;
  color: var(--modal-text-secondary);
}

.summary-value {
  font-weight: 600;
  color: var(--modal-text-primary);
}

/* 时间轴内容 */
.timeline-content {
  flex: 1;
  overflow-y: auto;
  padding: 1rem;
}

/* 自定义滚动条 */
.timeline-content::-webkit-scrollbar {
  width: 6px;
}

.timeline-content::-webkit-scrollbar-track {
  background: var(--modal-bg-light);
}

.timeline-content::-webkit-scrollbar-thumb {
  background: var(--modal-border);
  border-radius: 3px;
}

.timeline-content::-webkit-scrollbar-thumb:hover {
  background: var(--modal-text-tertiary);
}

/* 日期分组 */
.date-group {
  margin-bottom: 2rem;
}

.date-header {
  font-size: 0.875rem;
  font-weight: 600;
  color: var(--modal-text-secondary);
  margin-bottom: 1rem;
  padding: 0.5rem 1rem;
  background: white;
  border-radius: var(--modal-radius-md);
  border: 1px solid var(--modal-border);
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.date-stats {
  margin-left: auto;
  font-size: 0.75rem;
  color: var(--modal-text-tertiary);
}

/* 时间轴项目 */
.timeline-items {
  position: relative;
  padding-left: 2rem;
}

.timeline-items::before {
  content: '';
  position: absolute;
  left: 0.75rem;
  top: 0;
  bottom: 0;
  width: 2px;
  background: var(--timeline-line-color);
}

.timeline-item {
  position: relative;
  margin-bottom: 1.5rem;
  background: white;
  border-radius: var(--modal-radius-md);
  border: 1px solid var(--modal-border);
  transition: all var(--modal-transition-fast);
  cursor: pointer;
  animation: slideInUp 0.3s ease-out;
}

.timeline-item::before {
  content: '';
  position: absolute;
  left: -2.25rem;
  top: 1rem;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: white;
  border: 3px solid var(--timeline-dot-color);
  z-index: 1;
}

.timeline-item:hover {
  transform: translateX(4px);
  box-shadow: var(--modal-shadow-md);
  border-color: var(--modal-primary);
  background: var(--timeline-hover-bg);
}

.timeline-item.active {
  border-color: var(--modal-primary);
  background: rgba(13, 110, 253, 0.05);
  box-shadow: var(--modal-shadow-sm);
}

.timeline-item.active::before {
  border-color: var(--modal-primary);
  background: var(--modal-primary);
  box-shadow: 0 0 0 4px rgba(13, 110, 253, 0.1);
}

/* 操作类型图标颜色 */
.timeline-item.type-command::before { border-color: var(--op-command); }
.timeline-item.type-file::before { border-color: var(--op-file); }
.timeline-item.type-app::before { border-color: var(--op-app); }
.timeline-item.type-log::before { border-color: var(--op-log); }
.timeline-item.type-ssh::before { border-color: var(--op-ssh); }
.timeline-item.type-system::before { border-color: var(--op-system); }
.timeline-item.type-error::before { border-color: var(--op-error); }
.timeline-item.type-monitor::before { border-color: var(--op-monitor); }

.item-content {
  padding: 1rem;
}

.item-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 0.5rem;
}

.user-info {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.user-avatar {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--modal-primary);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.75rem;
  font-weight: 600;
}

.username {
  font-weight: 600;
  color: var(--modal-text-primary);
  font-size: 0.875rem;
}

.timestamp {
  font-size: 0.75rem;
  color: var(--modal-text-tertiary);
  background: var(--modal-bg-light);
  padding: 0.25rem 0.5rem;
  border-radius: var(--modal-radius-sm);
}

.operation-info {
  margin-bottom: 0.75rem;
}

.operation-type {
  display: inline-flex;
  align-items: center;
  gap: 0.375rem;
  padding: 0.25rem 0.75rem;
  border-radius: var(--modal-radius-sm);
  font-size: 0.75rem;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.025em;
  margin-bottom: 0.5rem;
}

.operation-type.command { background: rgba(99, 102, 241, 0.1); color: var(--op-command); }
.operation-type.file { background: rgba(16, 185, 129, 0.1); color: var(--op-file); }
.operation-type.app { background: rgba(139, 92, 246, 0.1); color: var(--op-app); }
.operation-type.log { background: rgba(245, 158, 11, 0.1); color: var(--op-log); }
.operation-type.ssh { background: rgba(249, 115, 22, 0.1); color: var(--op-ssh); }
.operation-type.system { background: rgba(107, 114, 128, 0.1); color: var(--op-system); }
.operation-type.error { background: rgba(239, 68, 68, 0.1); color: var(--op-error); }
.operation-type.monitor { background: rgba(6, 182, 212, 0.1); color: var(--op-monitor); }

.operation-desc {
  font-size: 0.875rem;
  color: var(--modal-text-primary);
  font-weight: 500;
  font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', 'Courier New', monospace;
  background: var(--modal-bg-light);
  padding: 0.5rem;
  border-radius: var(--modal-radius-sm);
  border-left: 3px solid var(--modal-primary);
}

.status-indicator {
  display: flex;
  align-items: center;
  gap: 0.375rem;
  font-size: 0.75rem;
  font-weight: 500;
}

.status-indicator.success { color: var(--modal-success); }
.status-indicator.warning { color: var(--modal-warning); }
.status-indicator.error { color: var(--modal-danger); }

/* 右侧详情面板 */
.details-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: white;
}

.details-header {
  padding: 1rem 2rem;
  border-bottom: 1px solid var(--modal-border);
  background: var(--modal-bg-light);
}

.details-title {
  font-size: 1.125rem;
  font-weight: 600;
  color: var(--modal-text-primary);
  margin: 0;
}

.details-content {
  flex: 1;
  overflow-y: auto;
  padding: 2rem;
}

/* 详情卡片 */
.detail-card {
  background: var(--modal-bg-light);
  border-radius: var(--modal-radius-md);
  border: 1px solid var(--modal-border);
  margin-bottom: 1.5rem;
  overflow: hidden;
}

.card-header {
  padding: 1rem 1.5rem;
  background: white;
  border-bottom: 1px solid var(--modal-border);
  font-weight: 600;
  color: var(--modal-text-primary);
  font-size: 0.875rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.card-content {
  padding: 1.5rem;
}

/* 命令输出区域 */
.command-output {
  background: var(--modal-bg-dark);
  color: #f8f9fa;
  font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', 'Courier New', monospace;
  font-size: 0.875rem;
  line-height: 1.5;
  padding: 1rem;
  border-radius: var(--modal-radius-sm);
  overflow-x: auto;
  white-space: pre-wrap;
  max-height: 300px;
  overflow-y: auto;
}

.command-output::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}

.command-output::-webkit-scrollbar-track {
  background: #343a40;
}

.command-output::-webkit-scrollbar-thumb {
  background: #6c757d;
  border-radius: 4px;
}

/* 系统资源指标 */
.resource-metrics {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 1rem;
}

.metric-item {
  text-align: center;
}

.metric-label {
  font-size: 0.75rem;
  color: var(--modal-text-secondary);
  margin-bottom: 0.5rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.metric-value {
  font-size: 1.125rem;
  font-weight: 600;
  color: var(--modal-text-primary);
  margin-bottom: 0.5rem;
}

.metric-bar {
  height: 6px;
  background: var(--modal-border);
  border-radius: 3px;
  overflow: hidden;
  position: relative;
}

.metric-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--modal-success), var(--modal-info));
  border-radius: 3px;
  transition: width 0.5s ease;
}

.metric-fill.high {
  background: linear-gradient(90deg, var(--modal-warning), var(--modal-danger));
}

/* 底部工具栏 */
.logs-modal-footer {
  padding: 1rem 2rem;
  border-top: 1px solid var(--modal-border);
  background: var(--modal-bg-light);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.search-controls {
  display: flex;
  align-items: center;
  gap: 1rem;
}

.search-input {
  padding: 0.5rem 1rem;
  border: 1px solid var(--modal-border);
  border-radius: var(--modal-radius-md);
  font-size: 0.875rem;
  width: 300px;
  transition: border-color var(--modal-transition-fast);
}

.search-input:focus {
  outline: none;
  border-color: var(--modal-primary);
  box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.1);
}

.filter-btn {
  padding: 0.5rem 1rem;
  border: 1px solid var(--modal-border);
  background: white;
  border-radius: var(--modal-radius-md);
  cursor: pointer;
  transition: all var(--modal-transition-fast);
  font-size: 0.875rem;
}

.filter-btn:hover {
  border-color: var(--modal-primary);
  color: var(--modal-primary);
}

.filter-btn.active {
  background: var(--modal-primary);
  color: white;
  border-color: var(--modal-primary);
}

.action-controls {
  display: flex;
  align-items: center;
  gap: 1rem;
}

.export-btn, .refresh-btn {
  padding: 0.5rem 1rem;
  border: none;
  border-radius: var(--modal-radius-md);
  cursor: pointer;
  transition: all var(--modal-transition-fast);
  font-size: 0.875rem;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.export-btn {
  background: var(--modal-info);
  color: white;
}

.export-btn:hover {
  background: #0dcaf0;
  transform: translateY(-1px);
  box-shadow: var(--modal-shadow-sm);
}

.refresh-btn {
  background: var(--modal-success);
  color: white;
}

.refresh-btn:hover {
  background: #198754;
  transform: translateY(-1px);
  box-shadow: var(--modal-shadow-sm);
}

.pagination {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.875rem;
  color: var(--modal-text-secondary);
}

.page-btn {
  width: 32px;
  height: 32px;
  border: 1px solid var(--modal-border);
  background: white;
  border-radius: var(--modal-radius-sm);
  cursor: pointer;
  transition: all var(--modal-transition-fast);
  display: flex;
  align-items: center;
  justify-content: center;
}

.page-btn:hover {
  border-color: var(--modal-primary);
  color: var(--modal-primary);
}

.page-btn.active {
  background: var(--modal-primary);
  color: white;
  border-color: var(--modal-primary);
}

/* 空状态 */
.empty-timeline {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  text-align: center;
  color: var(--modal-text-secondary);
}

.empty-icon {
  font-size: 3rem;
  margin-bottom: 1rem;
  opacity: 0.5;
}

.empty-title {
  font-size: 1.25rem;
  font-weight: 600;
  color: var(--modal-text-primary);
  margin-bottom: 0.5rem;
}

.empty-desc {
  font-size: 0.875rem;
  margin-bottom: 1.5rem;
}

/* 响应式设计 */
@media (max-width: 768px) {
  .logs-modal {
    width: 95vw;
    height: 90vh;
  }
  
  .logs-modal-body {
    flex-direction: column;
  }
  
  .timeline-panel {
    width: 100%;
    height: 40%;
    border-right: none;
    border-bottom: 1px solid var(--modal-border);
  }
  
  .details-panel {
    height: 60%;
  }
  
  .search-input {
    width: 200px;
  }
  
  .resource-metrics {
    grid-template-columns: 1fr;
  }
  
  .logs-modal-footer {
    flex-direction: column;
    gap: 1rem;
    align-items: stretch;
  }
  
  .search-controls {
    justify-content: center;
  }
  
  .action-controls {
    justify-content: center;
  }
}

/* 动画 */
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

@keyframes slideInUp {
  from {
    transform: translateY(20px);
    opacity: 0;
  }
  to {
    transform: translateY(0);
    opacity: 1;
  }
}

@keyframes fadeInContent {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.details-content.updating {
  opacity: 0.7;
  pointer-events: none;
}

.details-content.updated {
  animation: fadeInContent 0.3s ease-out;
}

/* 加载状态 */
.loading-spinner {
  display: inline-block;
  width: 20px;
  height: 20px;
  border: 3px solid rgba(255,255,255,.3);
  border-radius: 50%;
  border-top-color: #fff;
  animation: spin 1s ease-in-out infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* 工具提示 */
.tooltip {
  position: relative;
  cursor: help;
}

.tooltip:hover::after {
  content: attr(data-tooltip);
  position: absolute;
  bottom: 100%;
  left: 50%;
  transform: translateX(-50%);
  background: var(--modal-bg-dark);
  color: white;
  padding: 0.5rem;
  border-radius: var(--modal-radius-sm);
  font-size: 0.75rem;
  white-space: nowrap;
  z-index: 1000;
  opacity: 0;
  animation: fadeIn 0.2s ease forwards;
}

@keyframes fadeIn {
  to { opacity: 1; }
}
    </style>
</head>
<body>
    <!-- 演示页面 -->
    <div class="demo-container">
        <h1 class="demo-title">服务器日志查看弹窗</h1>
        <p class="demo-subtitle">点击按钮体验完整的服务器日志查看界面，包含时间轴展示、详情查看和交互功能</p>
        <button class="demo-btn" id="showModalBtn">
            <i class="fas fa-server"></i>&nbsp;查看服务器日志
        </button>
    </div>

    <!-- 日志查看弹窗 -->
    <div class="logs-modal-overlay" id="logsModal">
        <div class="logs-modal">
            <!-- 弹窗头部 -->
            <div class="logs-modal-header">
                <div class="server-info-header">
                    <div class="server-status-indicator" id="serverStatus"></div>
                    <h2 class="server-name-title">Server-Production-01</h2>
                </div>
                
                <div class="time-range-selector">
                    <button class="time-range-btn active" data-range="1day">最近1天</button>
                    <button class="time-range-btn" data-range="7days">最近7天</button>
                    <button class="time-range-btn" data-range="30days">最近30天</button>
                </div>
                
                <button class="modal-close-btn" id="closeModalBtn">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <!-- 弹窗主体 -->
            <div class="logs-modal-body">
                <!-- 左侧时间轴 -->
                <div class="timeline-panel">
                    <div class="timeline-header">
                        <h3 class="timeline-title">
                            <i class="fas fa-clock"></i>
                            用户操作时间轴
                        </h3>
                        <div class="activity-summary">
                            <div class="summary-item">
                                今日操作: <span class="summary-value">127次</span>
                            </div>
                            <div class="summary-item">
                                活跃用户: <span class="summary-value">8人</span>
                            </div>
                            <div class="summary-item">
                                错误次数: <span class="summary-value">3次</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="timeline-content" id="timelineContent">
                        <!-- 时间轴内容将通过JavaScript动态加载 -->
                    </div>
                </div>

                <!-- 右侧详情面板 -->
                <div class="details-panel">
                    <div class="details-header">
                        <h3 class="details-title">操作详情</h3>
                    </div>
                    
                    <div class="details-content" id="detailsContent">
                        <div class="empty-timeline">
                            <div class="empty-icon">
                                <i class="fas fa-mouse-pointer"></i>
                            </div>
                            <h4 class="empty-title">选择操作查看详情</h4>
                            <p class="empty-desc">点击左侧时间轴中的任意操作项目查看详细信息</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 底部工具栏 -->
            <div class="logs-modal-footer">
                <div class="search-controls">
                    <input type="text" class="search-input" placeholder="搜索用户名、操作类型或关键词..." id="searchInput">
                    <button class="filter-btn" data-filter="all">全部</button>
                    <button class="filter-btn" data-filter="command">命令</button>
                    <button class="filter-btn" data-filter="error">错误</button>
                </div>
                
                <div class="action-controls">
                    <button class="export-btn" id="exportBtn">
                        <i class="fas fa-download"></i>
                        导出日志
                    </button>
                    <button class="refresh-btn" id="refreshBtn">
                        <i class="fas fa-sync-alt"></i>
                        刷新
                    </button>
                </div>
                
                <div class="pagination">
                    <button class="page-btn" id="prevPageBtn">
                        <i class="fas fa-chevron-left"></i>
                    </button>
                    <span>1 / 5</span>
                    <button class="page-btn" id="nextPageBtn">
                        <i class="fas fa-chevron-right"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 模拟数据
        const mockLogData = [
            {
                id: 1,
                user: 'zhangsan',
                username: '张三',
                timestamp: '2024-09-11 15:42:35',
                type: 'command',
                operation: 'systemctl status nginx',
                status: 'success',
                duration: '0.3s',
                output: `● nginx.service - A high performance web server and a reverse proxy server
   Loaded: loaded (/lib/systemd/system/nginx.service; enabled; vendor preset: enabled)
   Active: active (running) since Mon 2024-09-11 10:30:15 UTC; 5h 12min ago
     Docs: man:nginx(8)
  Process: 1234 ExecStartPre=/usr/sbin/nginx -t -q -g daemon on; master_process on; (code=exited, status=0/SUCCESS)
  Process: 1235 ExecStart=/usr/sbin/nginx -g daemon on; master_process on; (code=exited, status=0/SUCCESS)
 Main PID: 1236 (nginx)
    Tasks: 5 (limit: 4915)
   Memory: 12.4M
   CGroup: /system.slice/nginx.service
           ├─1236 nginx: master process /usr/sbin/nginx -g daemon on; master_process on;
           ├─1237 nginx: worker process
           ├─1238 nginx: worker process
           ├─1239 nginx: worker process
           └─1240 nginx: worker process

Sep 11 10:30:15 server systemd[1]: Starting A high performance web server and a reverse proxy server...
Sep 11 10:30:15 server systemd[1]: Started A high performance web server and a reverse proxy server.`,
                metrics: {
                    cpu: { value: 80, label: 'CPU' },
                    memory: { value: 45, label: '内存' },
                    disk: { value: 30, label: '磁盘' }
                }
            },
            {
                id: 2,
                user: 'lisi',
                username: '李四',
                timestamp: '2024-09-11 15:38:21',
                type: 'file',
                operation: '上传文件: /opt/deploy/app.jar',
                status: 'success',
                duration: '25.6MB',
                output: '文件上传成功\n大小: 25.6MB\n校验和: d4f5e6a7b8c9d0e1f2a3b4c5d6e7f8a9\n权限: -rw-r--r--\n所有者: deploy:deploy',
                metrics: {
                    disk: { value: 75, label: '磁盘使用' },
                    network: { value: 60, label: '网络' },
                    io: { value: 45, label: 'I/O' }
                }
            },
            {
                id: 3,
                user: 'wangwu',
                username: '王五',
                timestamp: '2024-09-11 15:35:12',
                type: 'app',
                operation: '重启应用: SpringBoot-Demo',
                status: 'error',
                duration: '失败',
                output: `Error: Failed to restart application
java.net.BindException: Address already in use: bind
        at java.net.PlainSocketImpl.socketBind(Native Method)
        at java.net.AbstractPlainSocketImpl.bind(AbstractPlainSocketImpl.java:387)
        at java.net.ServerSocket.bind(ServerSocket.java:375)
        at org.apache.catalina.core.StandardServer.await(StandardServer.java:427)
        at org.apache.catalina.startup.Catalina.start(Catalina.java:628)
        
Port 8080 is already in use by another process.
Please check running processes: netstat -tulpn | grep :8080`,
                metrics: {
                    cpu: { value: 95, label: 'CPU' },
                    memory: { value: 85, label: '内存' },
                    error: { value: 1, label: '错误数' }
                }
            },
            {
                id: 4,
                user: 'zhaoliu',
                username: '赵六',
                timestamp: '2024-09-11 15:20:45',
                type: 'log',
                operation: '查看日志: application.log',
                status: 'success',
                duration: '100行',
                output: `2024-09-11 15:20:45.123 INFO  [main] com.example.Application - Starting Application
2024-09-11 15:20:45.456 INFO  [main] com.example.Application - No active profile set, falling back to default profiles: default
2024-09-11 15:20:46.789 INFO  [main] o.s.b.w.embedded.tomcat.TomcatWebServer - Tomcat initialized with port(s): 8080 (http)
2024-09-11 15:20:47.012 INFO  [main] o.apache.catalina.core.StandardService - Starting service [Tomcat]
2024-09-11 15:20:47.345 INFO  [main] org.apache.catalina.core.StandardEngine - Starting Servlet engine: [Apache Tomcat/9.0.65]
2024-09-11 15:20:47.678 INFO  [main] o.a.c.c.C.[Tomcat].[localhost].[/] - Initializing Spring embedded WebApplicationContext
2024-09-11 15:20:47.901 INFO  [main] w.s.c.ServletWebServerApplicationContext - Root WebApplicationContext: initialization completed in 2445 ms
2024-09-11 15:20:48.234 INFO  [main] o.s.b.w.embedded.tomcat.TomcatWebServer - Tomcat started on port(s): 8080 (http) with context path ''
2024-09-11 15:20:48.567 INFO  [main] com.example.Application - Started Application in 3.444 seconds (JVM running for 4.123)`,
                metrics: {
                    io: { value: 65, label: 'I/O读取' },
                    disk: { value: 40, label: '磁盘' },
                    network: { value: 20, label: '网络' }
                }
            },
            {
                id: 5,
                user: 'zhangsan',
                username: '张三',
                timestamp: '2024-09-11 15:10:30',
                type: 'ssh',
                operation: 'SSH登录',
                status: 'success',
                duration: '连接成功',
                output: `SSH connection established successfully
Client IP: 192.168.1.100
User Agent: OpenSSH_8.9p1
Encryption: aes256-ctr
MAC: hmac-sha2-256
Login time: 2024-09-11 15:10:30 UTC
Session duration: 32 minutes (active)
Commands executed: 15
Last activity: 2024-09-11 15:42:35 UTC`,
                metrics: {
                    network: { value: 30, label: '网络' },
                    security: { value: 100, label: '安全' },
                    session: { value: 1, label: '会话数' }
                }
            }
        ];

        let currentLogData = mockLogData;
        let selectedLogId = null;

        // 显示弹窗
        function showLogsModal() {
            const modal = document.getElementById('logsModal');
            modal.classList.add('show');
            loadTimelineData();
        }

        // 隐藏弹窗
        function hideLogsModal() {
            const modal = document.getElementById('logsModal');
            modal.classList.remove('show');
        }

        // 加载时间轴数据
        function loadTimelineData() {
            const container = document.getElementById('timelineContent');
            
            // 按日期分组
            const groupedData = {};
            currentLogData.forEach(log => {
                const date = log.timestamp.split(' ')[0];
                if (!groupedData[date]) {
                    groupedData[date] = [];
                }
                groupedData[date].push(log);
            });

            let html = '';
            Object.keys(groupedData).forEach(date => {
                const logs = groupedData[date];
                const dateObj = new Date(date);
                const today = new Date().toISOString().split('T')[0];
                const yesterday = new Date(Date.now() - 86400000).toISOString().split('T')[0];
                
                let dateLabel = date;
                if (date === today) dateLabel = '今天 ' + date;
                else if (date === yesterday) dateLabel = '昨天 ' + date;

                html += `
                    <div class="date-group">
                        <div class="date-header">
                            <i class="fas fa-calendar-day"></i>
                            ${dateLabel}
                            <span class="date-stats">${logs.length} 次操作</span>
                        </div>
                        <div class="timeline-items">
                `;

                logs.forEach(log => {
                    const typeClass = `type-${log.type}`;
                    const statusClass = log.status;
                    
                    html += `
                        <div class="timeline-item ${typeClass}" data-log-id="${log.id}" onclick="selectLog(${log.id})">
                            <div class="item-content">
                                <div class="item-header">
                                    <div class="user-info">
                                        <div class="user-avatar">${log.username.charAt(0)}</div>
                                        <span class="username">${log.username}</span>
                                    </div>
                                    <span class="timestamp">${log.timestamp.split(' ')[1]}</span>
                                </div>
                                
                                <div class="operation-info">
                                    <div class="operation-type ${log.type}">
                                        <i class="fas fa-${getTypeIcon(log.type)}"></i>
                                        ${getTypeLabel(log.type)}
                                    </div>
                                    <div class="operation-desc">${log.operation}</div>
                                </div>
                                
                                <div class="status-indicator ${statusClass}">
                                    <i class="fas fa-${getStatusIcon(log.status)}"></i>
                                    ${getStatusLabel(log.status)} - ${log.duration}
                                </div>
                            </div>
                        </div>
                    `;
                });

                html += '</div></div>';
            });

            container.innerHTML = html;
            
            // 为时间轴项目添加点击事件监听器
            document.querySelectorAll('.timeline-item').forEach(item => {
                item.addEventListener('click', function() {
                    const logId = parseInt(this.dataset.logId);
                    selectLog(logId);
                });
            });
        }

        // 选择日志项
        function selectLog(logId) {
            selectedLogId = logId;
            
            // 更新时间轴选中状态
            document.querySelectorAll('.timeline-item').forEach(item => {
                item.classList.remove('active');
            });
            document.querySelector(`[data-log-id="${logId}"]`).classList.add('active');
            
            // 加载详情内容
            loadLogDetails(logId);
        }

        // 加载日志详情
        function loadLogDetails(logId) {
            const log = currentLogData.find(l => l.id === logId);
            if (!log) return;

            const container = document.getElementById('detailsContent');
            container.classList.add('updating');

            setTimeout(() => {
                const html = `
                    <div class="detail-card">
                        <div class="card-header">
                            <i class="fas fa-info-circle"></i>
                            基本信息
                        </div>
                        <div class="card-content">
                            <div class="info-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                                <div><strong>用户:</strong> ${log.username} (${log.user})</div>
                                <div><strong>时间:</strong> ${log.timestamp}</div>
                                <div><strong>操作:</strong> ${log.operation}</div>
                                <div><strong>状态:</strong> <span class="status-indicator ${log.status}">
                                    <i class="fas fa-${getStatusIcon(log.status)}"></i>
                                    ${getStatusLabel(log.status)}
                                </span></div>
                                <div><strong>持续时间:</strong> ${log.duration}</div>
                                <div><strong>类型:</strong> ${getTypeLabel(log.type)}</div>
                            </div>
                        </div>
                    </div>

                    <div class="detail-card">
                        <div class="card-header">
                            <i class="fas fa-terminal"></i>
                            执行结果
                        </div>
                        <div class="card-content">
                            <div class="command-output">${log.output}</div>
                        </div>
                    </div>

                    <div class="detail-card">
                        <div class="card-header">
                            <i class="fas fa-chart-line"></i>
                            系统影响
                        </div>
                        <div class="card-content">
                            <div class="resource-metrics">
                                ${Object.entries(log.metrics).map(([key, metric]) => `
                                    <div class="metric-item">
                                        <div class="metric-label">${metric.label}</div>
                                        <div class="metric-value">${metric.value}${key === 'error' || key === 'session' ? '' : '%'}</div>
                                        <div class="metric-bar">
                                            <div class="metric-fill ${metric.value > 80 ? 'high' : ''}" 
                                                 style="width: ${Math.min(metric.value, 100)}%"></div>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;

                container.innerHTML = html;
                container.classList.remove('updating');
                container.classList.add('updated');
                
                setTimeout(() => container.classList.remove('updated'), 300);
            }, 150);
        }

        // 获取类型图标
        function getTypeIcon(type) {
            const icons = {
                command: 'terminal',
                file: 'file-upload',
                app: 'rocket',
                log: 'file-alt',
                ssh: 'key',
                system: 'cogs',
                error: 'exclamation-triangle',
                monitor: 'chart-bar'
            };
            return icons[type] || 'circle';
        }

        // 获取类型标签
        function getTypeLabel(type) {
            const labels = {
                command: '命令执行',
                file: '文件操作',
                app: '应用管理',
                log: '日志查看',
                ssh: '登录认证',
                system: '系统维护',
                error: '错误异常',
                monitor: '监控查询'
            };
            return labels[type] || type;
        }

        // 获取状态图标
        function getStatusIcon(status) {
            const icons = {
                success: 'check-circle',
                warning: 'exclamation-triangle',
                error: 'times-circle'
            };
            return icons[status] || 'circle';
        }

        // 获取状态标签
        function getStatusLabel(status) {
            const labels = {
                success: '成功',
                warning: '警告',
                error: '错误'
            };
            return labels[status] || status;
        }

        // 时间范围切换
        document.querySelectorAll('.time-range-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.time-range-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                
                // 这里可以根据选择的时间范围重新加载数据
                loadTimelineData();
            });
        });

        // 搜索功能
        document.getElementById('searchInput').addEventListener('input', function() {
            const searchTerm = this.value.toLowerCase();
            const items = document.querySelectorAll('.timeline-item');
            
            items.forEach(item => {
                const text = item.textContent.toLowerCase();
                if (text.includes(searchTerm)) {
                    item.style.display = 'block';
                    item.style.opacity = '1';
                } else {
                    item.style.opacity = '0.3';
                }
            });
        });

        // 过滤功能
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                
                const filter = this.dataset.filter;
                const items = document.querySelectorAll('.timeline-item');
                
                items.forEach(item => {
                    if (filter === 'all' || item.classList.contains(`type-${filter}`)) {
                        item.style.display = 'block';
                    } else {
                        item.style.display = 'none';
                    }
                });
            });
        });

        // 导出日志
        function exportLogs() {
            // 模拟导出功能
            const btn = document.querySelector('.export-btn');
            const originalText = btn.innerHTML;
            
            btn.innerHTML = '<div class="loading-spinner"></div> 导出中...';
            btn.disabled = true;
            
            setTimeout(() => {
                btn.innerHTML = '<i class="fas fa-check"></i> 导出完成';
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }, 1500);
            }, 2000);
        }

        // 刷新日志
        function refreshLogs() {
            const btn = document.querySelector('.refresh-btn');
            const originalText = btn.innerHTML;
            
            btn.innerHTML = '<div class="loading-spinner"></div> 刷新中...';
            btn.disabled = true;
            
            setTimeout(() => {
                loadTimelineData();
                btn.innerHTML = '<i class="fas fa-check"></i> 刷新完成';
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }, 1000);
            }, 1500);
        }

        // 分页功能
        function prevPage() {
            console.log('Previous page');
        }

        function nextPage() {
            console.log('Next page');
        }

        // 点击遮罩关闭弹窗
        document.getElementById('logsModal').addEventListener('click', function(e) {
            if (e.target === this) {
                hideLogsModal();
            }
        });

        // ESC键关闭弹窗
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                hideLogsModal();
            }
        });

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 设置服务器状态
            const statusIndicator = document.getElementById('serverStatus');
            statusIndicator.classList.add('online'); // 可以是 'online' 或 'offline'
            
            // 绑定事件监听器
            document.getElementById('showModalBtn').addEventListener('click', showLogsModal);
            document.getElementById('closeModalBtn').addEventListener('click', hideLogsModal);
            document.getElementById('exportBtn').addEventListener('click', exportLogs);
            document.getElementById('refreshBtn').addEventListener('click', refreshLogs);
            document.getElementById('prevPageBtn').addEventListener('click', prevPage);
            document.getElementById('nextPageBtn').addEventListener('click', nextPage);
        });
    </script>
</body>
</html>
