<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>科技感配色方案 - 未来主义</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "SF Pro Display", "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
            height: 100vh;
            overflow: hidden;
            background: #000;
        }

        /* 方案5：未来主义风格 - 极简科技 + 动态效果 */
        .tech-scheme-2 {
            display: grid;
            grid-template-columns: 240px 1fr;
            grid-template-rows: 64px 1fr;
            grid-template-areas: "sidebar header" "sidebar content";
            height: 100vh;
        }

        .tech-header-2 {
            grid-area: header;
            background: linear-gradient(135deg, #000000 0%, #1a1a1a 100%);
            color: #ffffff;
            display: flex;
            align-items: center;
            padding: 0 24px;
            border-bottom: 1px solid #333;
            position: relative;
            backdrop-filter: blur(20px);
        }

        .tech-header-2::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg,
                transparent,
                #4f46e5,
                #06b6d4,
                #10b981,
                #f59e0b,
                #ef4444,
                transparent
            );
            background-size: 200% 100%;
            animation: techFlow 8s linear infinite;
        }

        @keyframes techFlow {
            0% { background-position: -200% 0%; }
            100% { background-position: 200% 0%; }
        }

        .tech-sidebar-2 {
            grid-area: sidebar;
            background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
            color: #f1f5f9;
            border-right: 1px solid #334155;
            display: flex;
            flex-direction: column;
            padding: 20px 16px;
            position: relative;
            backdrop-filter: blur(20px);
        }

        .tech-sidebar-2::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 1px;
            height: 100%;
            background: linear-gradient(180deg,
                transparent,
                #4f46e5,
                #06b6d4,
                #10b981,
                #f59e0b,
                #ef4444,
                transparent
            );
            background-size: 100% 200%;
            animation: sidebarFlow 10s linear infinite;
        }

        @keyframes sidebarFlow {
            0% { background-position: 0% -200%; }
            100% { background-position: 0% 200%; }
        }

        .tech-content-2 {
            grid-area: content;
            background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
            color: #0f172a;
            padding: 32px;
            overflow-y: auto;
            position: relative;
        }

        .tech-content-2::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 25% 25%, rgba(79, 70, 229, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 75% 75%, rgba(6, 182, 212, 0.03) 0%, transparent 50%);
            pointer-events: none;
        }

        /* 品牌区域 */
        .tech-brand-2 {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
            border-radius: 16px;
            margin-bottom: 24px;
            background: rgba(79, 70, 229, 0.1);
            border: 1px solid rgba(79, 70, 229, 0.2);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .tech-brand-2::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(79, 70, 229, 0.1), transparent);
            animation: brandRotate 8s linear infinite;
        }

        @keyframes brandRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .tech-brand-icon-2 {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #4f46e5, #06b6d4);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 18px;
            box-shadow:
                0 8px 32px rgba(79, 70, 229, 0.3),
                0 0 0 1px rgba(255, 255, 255, 0.1);
            position: relative;
            z-index: 1;
        }

        /* 导航项目 */
        .tech-nav-2 {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            border-radius: 12px;
            margin-bottom: 6px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            border: 1px solid transparent;
            overflow: hidden;
        }

        .tech-nav-2::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent, rgba(79, 70, 229, 0.1), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .tech-nav-2:hover {
            transform: translateX(8px) scale(1.02);
            border-color: rgba(79, 70, 229, 0.3);
            color: #4f46e5;
        }

        .tech-nav-2:hover::before {
            opacity: 1;
        }

        .tech-nav-2.active {
            background: linear-gradient(135deg, rgba(79, 70, 229, 0.15), rgba(6, 182, 212, 0.1));
            border-color: rgba(79, 70, 229, 0.4);
            color: #4f46e5;
            transform: translateX(8px) scale(1.02);
            box-shadow:
                0 8px 32px rgba(79, 70, 229, 0.2),
                0 0 0 1px rgba(79, 70, 229, 0.1);
        }

        /* Header 工具栏 */
        .tech-toolbar-2 {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-left: auto;
        }

        .tech-btn-2 {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
            padding: 10px 16px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .tech-btn-2::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.5s ease;
        }

        .tech-btn-2:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .tech-btn-2:hover::before {
            left: 100%;
        }

        /* 搜索栏 */
        .tech-search {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 8px 20px;
            margin-left: 20px;
            min-width: 240px;
            color: #ffffff;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .tech-search:focus {
            outline: none;
            border-color: rgba(79, 70, 229, 0.5);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
            background: rgba(79, 70, 229, 0.1);
        }

        .tech-search::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        /* 内容区域卡片 */
        .tech-card-2 {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(15, 23, 42, 0.08);
            border-radius: 20px;
            padding: 28px;
            margin-bottom: 24px;
            backdrop-filter: blur(20px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .tech-card-2::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(79, 70, 229, 0.3), transparent);
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .tech-card-2:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.1),
                0 0 0 1px rgba(79, 70, 229, 0.1);
            border-color: rgba(79, 70, 229, 0.2);
        }

        .tech-card-2:hover::before {
            transform: scaleX(1);
        }

        .scheme-title {
            position: fixed;
            top: 10px;
            right: 10px;
            background: linear-gradient(135deg, #4f46e5, #06b6d4);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            z-index: 1000;
            box-shadow:
                0 8px 32px rgba(79, 70, 229, 0.3),
                0 0 0 1px rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
        }

        /* 状态指示器 */
        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 8px;
            animation: statusPulse 2s ease-in-out infinite;
        }

        .status-online { background: #10b981; }
        .status-warning { background: #f59e0b; }
        .status-active { background: #4f46e5; }

        @keyframes statusPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.8; }
        }

        /* 进度条 */
        .progress-bar {
            height: 6px;
            border-radius: 3px;
            background: #f1f5f9;
            overflow: hidden;
            margin-top: 12px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4f46e5, #06b6d4, #10b981);
            border-radius: 3px;
            transition: width 1s ease-out;
        }
    </style>
</head>
<body>
    <div class="scheme-title">科技方案2：未来主义</div>

    <div class="tech-scheme-2">
        <header class="tech-header-2">
            <div style="display: flex; align-items: center; gap: 12px;">
                <span style="font-size: 20px;">◆</span>
                <span style="font-weight: 600; letter-spacing: 1px;">Dev Debug Platform</span>
            </div>
            <input type="text" class="tech-search" placeholder="搜索应用、服务或命令...">
            <div class="tech-toolbar-2">
                <button class="tech-btn-2">🔔</button>
                <button class="tech-btn-2">👤</button>
                <button class="tech-btn-2">⚙️</button>
            </div>
        </header>

        <aside class="tech-sidebar-2">
            <div class="tech-brand-2">
                <div class="tech-brand-icon-2">DD</div>
                <div style="position: relative; z-index: 1;">
                    <div style="font-weight: 600; font-size: 14px;">开发调试平台</div>
                    <div style="font-size: 12px; color: #94a3b8;">v2.1.0</div>
                </div>
            </div>

            <nav>
                <div class="tech-nav-2 active">
                    <span>📊</span>
                    <span>工作区概览</span>
                </div>
                <div class="tech-nav-2">
                    <span>🚀</span>
                    <span>应用管理</span>
                </div>
                <div class="tech-nav-2">
                    <span>🖥️</span>
                    <span>服务器管理</span>
                </div>
                <div class="tech-nav-2">
                    <span>📈</span>
                    <span>监控中心</span>
                </div>
                <div class="tech-nav-2">
                    <span>⚡</span>
                    <span>SSH终端</span>
                </div>
            </nav>
        </aside>

        <main class="tech-content-2">
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 32px;">
                <h1 style="color: #0f172a; font-weight: 700; font-size: 28px;">工作区概览</h1>
                <div style="display: flex; gap: 12px; align-items: center;">
                    <span style="background: linear-gradient(135deg, #10b981, #059669); color: white; padding: 6px 16px; border-radius: 20px; font-size: 12px; font-weight: 600;">
                        <span class="status-indicator status-online"></span>已连接
                    </span>
                    <span style="background: linear-gradient(135deg, #4f46e5, #4338ca); color: white; padding: 6px 16px; border-radius: 20px; font-size: 12px; font-weight: 600;">
                        <span class="status-indicator status-active"></span>5个活跃应用
                    </span>
                </div>
            </div>

            <div class="tech-card-2">
                <h3 style="margin-bottom: 16px; color: #1f2937; display: flex; align-items: center; font-weight: 600;">
                    <span class="status-indicator status-online"></span>
                    系统状态
                </h3>
                <p style="color: #6b7280; margin-bottom: 16px;">所有服务运行正常，最后更新：2分钟前</p>
                <div style="display: flex; gap: 16px; font-size: 14px;">
                    <span style="color: #10b981;">✓ 核心服务</span>
                    <span style="color: #10b981;">✓ 数据库</span>
                    <span style="color: #10b981;">✓ 网络连接</span>
                </div>
            </div>

            <div class="tech-card-2">
                <h3 style="margin-bottom: 16px; color: #1f2937; display: flex; align-items: center; font-weight: 600;">
                    <span class="status-indicator status-active"></span>
                    活跃应用
                </h3>
                <p style="color: #6b7280; margin-bottom: 16px;">当前有 5 个应用正在运行</p>
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px;">
                    <div style="background: #f8fafc; padding: 12px; border-radius: 8px; text-align: center;">
                        <div style="font-weight: 600; color: #4f46e5;">App-1</div>
                        <div style="font-size: 12px; color: #10b981;">运行中</div>
                    </div>
                    <div style="background: #f8fafc; padding: 12px; border-radius: 8px; text-align: center;">
                        <div style="font-weight: 600; color: #4f46e5;">App-2</div>
                        <div style="font-size: 12px; color: #10b981;">运行中</div>
                    </div>
                </div>
            </div>

            <div class="tech-card-2">
                <h3 style="margin-bottom: 16px; color: #1f2937; display: flex; align-items: center; font-weight: 600;">
                    <span class="status-indicator status-warning"></span>
                    资源使用
                </h3>
                <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;">
                    <div>
                        <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                            <span style="color: #6b7280; font-size: 14px;">CPU</span>
                            <span style="color: #4f46e5; font-weight: 600;">45%</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: 45%;"></div>
                        </div>
                    </div>
                    <div>
                        <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                            <span style="color: #6b7280; font-size: 14px;">内存</span>
                            <span style="color: #f59e0b; font-weight: 600;">67%</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: 67%;"></div>
                        </div>
                    </div>
                    <div>
                        <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                            <span style="color: #6b7280; font-size: 14px;">磁盘</span>
                            <span style="color: #10b981; font-weight: 600;">32%</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: 32%;"></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
