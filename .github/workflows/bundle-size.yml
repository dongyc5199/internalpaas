name: Bundle Size Check

on:
  pull_request:
    branches: [ master, dev ]
    paths:
      - 'src/main/frontend/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'

jobs:
  bundle-size:
    name: Check Bundle Size
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build PR branch
        run: npm run build

      - name: Get PR bundle size
        id: pr-size
        run: |
          MAIN_JS_SIZE=$(stat -c%s src/main/resources/static/dist/assets/main.js)
          MAIN_CSS_SIZE=$(stat -c%s src/main/resources/static/dist/assets/main.css)
          MAIN_JS_KB=$((MAIN_JS_SIZE / 1024))
          MAIN_CSS_KB=$((MAIN_CSS_SIZE / 1024))
          echo "js=$MAIN_JS_KB" >> $GITHUB_OUTPUT
          echo "css=$MAIN_CSS_KB" >> $GITHUB_OUTPUT

      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}

      - name: Install base dependencies
        run: npm ci

      - name: Build base branch
        run: npm run build

      - name: Get base bundle size
        id: base-size
        run: |
          MAIN_JS_SIZE=$(stat -c%s src/main/resources/static/dist/assets/main.js)
          MAIN_CSS_SIZE=$(stat -c%s src/main/resources/static/dist/assets/main.css)
          MAIN_JS_KB=$((MAIN_JS_SIZE / 1024))
          MAIN_CSS_KB=$((MAIN_CSS_SIZE / 1024))
          echo "js=$MAIN_JS_KB" >> $GITHUB_OUTPUT
          echo "css=$MAIN_CSS_KB" >> $GITHUB_OUTPUT

      - name: Calculate diff and comment
        uses: actions/github-script@v7
        with:
          script: |
            const prJs = ${{ steps.pr-size.outputs.js }};
            const prCss = ${{ steps.pr-size.outputs.css }};
            const baseJs = ${{ steps.base-size.outputs.js }};
            const baseCss = ${{ steps.base-size.outputs.css }};

            const jsDiff = prJs - baseJs;
            const cssDiff = prCss - baseCss;
            const jsPercent = ((jsDiff / baseJs) * 100).toFixed(2);
            const cssPercent = ((cssDiff / baseCss) * 100).toFixed(2);

            const jsEmoji = jsDiff > 0 ? '📈' : jsDiff < 0 ? '📉' : '➡️';
            const cssEmoji = cssDiff > 0 ? '📈' : cssDiff < 0 ? '📉' : '➡️';

            // 判断是否超过阈值（+10%警告，+20%失败）
            const jsWarning = Math.abs(jsPercent) > 10;
            const jsFail = Math.abs(jsPercent) > 20;

            let status = '✅';
            let message = 'Bundle size is acceptable';
            if (jsFail) {
              status = '❌';
              message = 'Bundle size increased significantly! Please review.';
            } else if (jsWarning) {
              status = '⚠️';
              message = 'Bundle size increased noticeably.';
            }

            const output = `
            ## ${status} Bundle Size Report

            ${message}

            | File | Base | PR | Diff | Change |
            |------|------|----|----|--------|
            | main.js | ${baseJs} KB | ${prJs} KB | ${jsDiff > 0 ? '+' : ''}${jsDiff} KB | ${jsEmoji} ${jsPercent}% |
            | main.css | ${baseCss} KB | ${prCss} KB | ${cssDiff > 0 ? '+' : ''}${cssDiff} KB | ${cssEmoji} ${cssPercent}% |

            ### Thresholds
            - ⚠️ Warning: +10% increase
            - ❌ Fail: +20% increase

            ### Recommendations
            ${jsDiff > 50 ? '- Consider code splitting or lazy loading for large modules' : ''}
            ${jsDiff > 20 ? '- Review imported dependencies - are they all necessary?' : ''}
            ${jsDiff < 0 ? '- Great job reducing bundle size! 🎉' : ''}
            `;

            // 查找并更新已有评论
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Bundle Size Report')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: output
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: output
              });
            }

            // 如果bundle增加超过20%，失败CI
            if (jsFail) {
              core.setFailed('Bundle size increased by more than 20%');
            }
