name: Security & Dependency Check

on:
  schedule:
    # 每周一凌晨2点运行
    - cron: '0 2 * * 1'
  workflow_dispatch:  # 允许手动触发

jobs:
  dependency-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Run npm audit
        run: |
          npm audit --audit-level=moderate || true
          npm audit --json > audit-report.json || true

      - name: Check for high/critical vulnerabilities
        run: |
          HIGH_VULN=$(cat audit-report.json | jq '.metadata.vulnerabilities.high // 0')
          CRITICAL_VULN=$(cat audit-report.json | jq '.metadata.vulnerabilities.critical // 0')

          echo "High vulnerabilities: $HIGH_VULN"
          echo "Critical vulnerabilities: $CRITICAL_VULN"

          if [ "$CRITICAL_VULN" -gt 0 ]; then
            echo "❌ Found $CRITICAL_VULN critical vulnerabilities!"
            exit 1
          fi

          if [ "$HIGH_VULN" -gt 0 ]; then
            echo "⚠️ Found $HIGH_VULN high vulnerabilities"
            exit 1
          fi

          echo "✅ No high or critical vulnerabilities found"

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit-report
          path: audit-report.json
          retention-days: 30

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate

  outdated-dependencies:
    name: Check Outdated Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Check outdated packages
        run: |
          npm outdated > outdated.txt || true
          cat outdated.txt

      - name: Create issue if major updates available
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const outdated = fs.readFileSync('outdated.txt', 'utf8');

            if (outdated.trim()) {
              const issueBody = `
              ## 📦 Outdated Dependencies Detected

              The following npm packages have available updates:

              \`\`\`
              ${outdated}
              \`\`\`

              ### Recommendations
              - Review the changelog of each package before updating
              - Update dependencies in a separate PR
              - Run full test suite after updating

              ### Update Command
              \`\`\`bash
              npm update
              npm audit fix
              \`\`\`

              ---
              *This issue was automatically created by the Security & Dependency Check workflow*
              `;

              // 检查是否已存在相同issue
              const { data: issues } = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                labels: 'dependencies'
              });

              const existingIssue = issues.find(issue =>
                issue.title.includes('Outdated Dependencies')
              );

              if (!existingIssue) {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: '📦 Outdated Dependencies Detected',
                  body: issueBody,
                  labels: ['dependencies', 'maintenance']
                });
              }
            }
