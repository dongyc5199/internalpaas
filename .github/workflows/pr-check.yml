name: PR Quality Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  pr-check:
    name: PR Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史用于diff

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint changed files
        run: |
          # 获取变更的文件列表
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          echo "Changed files:"
          echo "$CHANGED_FILES"

          # 仅对变更的TypeScript文件运行lint
          TS_FILES=$(echo "$CHANGED_FILES" | grep -E '\.(ts|tsx)$' || true)
          if [ -n "$TS_FILES" ]; then
            echo "Running ESLint on changed TypeScript files..."
            npx eslint $TS_FILES
          fi

          # 仅对变更的CSS文件运行stylelint
          CSS_FILES=$(echo "$CHANGED_FILES" | grep -E '\.(css|scss)$' || true)
          if [ -n "$CSS_FILES" ]; then
            echo "Running Stylelint on changed CSS files..."
            npx stylelint $CSS_FILES
          fi

      - name: Run affected tests
        run: npm run test:run

      - name: Comment PR with results
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('🤖 PR Quality Check')
            );

            const output = `
            🤖 PR Quality Check Results

            ✅ Code linting passed
            ✅ Tests passed
            ✅ Build successful

            📊 Coverage Report: See artifacts for detailed coverage
            `;

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: output
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: output
              });
            }
