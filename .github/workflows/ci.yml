name: CI Pipeline

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]

jobs:
  # Job 1: 前端代码质量检查
  frontend-quality:
    name: Frontend Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Stylelint
        run: npm run lint:style

      - name: Check code formatting
        run: npm run format -- --check

  # Job 2: 前端测试和覆盖率
  frontend-test:
    name: Frontend Test & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:run

      - name: Check coverage threshold
        run: |
          # 提取覆盖率数据
          COVERAGE=$(npm run test:run 2>&1 | grep "All files" | awk '{print $4}')
          echo "Current coverage: $COVERAGE%"

          # 设置最低覆盖率要求（当前设为40%，逐步提升到80%）
          MIN_COVERAGE=40
          if (( $(echo "$COVERAGE < $MIN_COVERAGE" | bc -l) )); then
            echo "Coverage $COVERAGE% is below minimum threshold $MIN_COVERAGE%"
            exit 1
          fi

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/coverage-final.json
          flags: frontend
          name: frontend-coverage
        continue-on-error: true

  # Job 3: 前端构建
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Check bundle size
        run: |
          echo "📦 Bundle Size Report"
          echo "===================="
          ls -lh src/main/resources/static/dist/assets/*.js src/main/resources/static/dist/assets/*.css

          # 获取main.js大小（KB）
          MAIN_JS_SIZE=$(stat -f%z src/main/resources/static/dist/assets/main.js 2>/dev/null || stat -c%s src/main/resources/static/dist/assets/main.js)
          MAIN_JS_KB=$((MAIN_JS_SIZE / 1024))
          echo "main.js: ${MAIN_JS_KB}KB"

          # 设置bundle大小上限（300KB）
          MAX_SIZE_KB=300
          if [ $MAIN_JS_KB -gt $MAX_SIZE_KB ]; then
            echo "❌ main.js size (${MAIN_JS_KB}KB) exceeds maximum threshold (${MAX_SIZE_KB}KB)"
            exit 1
          fi
          echo "✅ Bundle size check passed"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: src/main/resources/static/dist/
          retention-days: 7

  # Job 4: 后端测试和构建
  backend-build:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'maven'

      - name: Setup Node.js (for frontend build)
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Make mvnw executable
        run: chmod +x ./mvnw

      - name: Build with Maven
        run: ./mvnw clean verify -Dbuild.frontend=true

      - name: Upload Maven artifacts
        uses: actions/upload-artifact@v4
        with:
          name: maven-artifacts
          path: target/*.jar
          retention-days: 7

  # Job 5: 质量汇总报告
  quality-summary:
    name: Quality Summary
    runs-on: ubuntu-latest
    needs: [frontend-quality, frontend-test, frontend-build, backend-build]
    if: always()

    steps:
      - name: Check job results
        run: |
          echo "🎯 Quality Summary"
          echo "=================="
          echo "Frontend Quality: ${{ needs.frontend-quality.result }}"
          echo "Frontend Test: ${{ needs.frontend-test.result }}"
          echo "Frontend Build: ${{ needs.frontend-build.result }}"
          echo "Backend Build: ${{ needs.backend-build.result }}"

          # 如果任何job失败，整体失败
          if [ "${{ needs.frontend-quality.result }}" != "success" ] || \
             [ "${{ needs.frontend-test.result }}" != "success" ] || \
             [ "${{ needs.frontend-build.result }}" != "success" ] || \
             [ "${{ needs.backend-build.result }}" != "success" ]; then
            echo "❌ CI Pipeline Failed"
            exit 1
          fi
          echo "✅ All checks passed!"
