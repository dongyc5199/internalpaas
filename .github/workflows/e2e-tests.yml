name: E2E Tests

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:

jobs:
  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium] # 可以添加 firefox, webkit

    steps:
      - name: Checkout代码
        uses: actions/checkout@v4

      - name: 设置Java环境
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'maven'

      - name: 设置Node.js环境
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 安装Playwright浏览器
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: 编译前端资源
        run: npm run build

      - name: 编译Spring Boot应用
        run: mvn clean package -DskipTests

      - name: 启动Spring Boot应用
        run: |
          java -jar target/*.jar --spring.profiles.active=test &
          echo $! > app.pid
        env:
          SERVER_PORT: 8080
          SPRING_DATASOURCE_URL: jdbc:h2:mem:testdb

      - name: 等待应用启动
        run: |
          echo "等待应用启动..."
          timeout 120 bash -c 'until curl -f http://localhost:8080/actuator/health 2>/dev/null || curl -f http://localhost:8080/ 2>/dev/null; do sleep 2; done'
          echo "应用已启动"

      - name: 运行E2E测试
        run: npm run test:e2e
        env:
          BASE_URL: http://localhost:8080
          TEST_ADMIN_USERNAME: admin
          TEST_ADMIN_PASSWORD: admin
          TEST_DEV_USERNAME: developer
          TEST_DEV_PASSWORD: developer

      - name: 停止Spring Boot应用
        if: always()
        run: |
          if [ -f app.pid ]; then
            kill $(cat app.pid) || true
          fi

      - name: 上传Playwright报告
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 30

      - name: 上传测试截图
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-screenshots-${{ matrix.browser }}
          path: |
            test-results/
            screenshots/
          retention-days: 7

      - name: 评论PR（如果有）
        if: github.event_name == 'pull_request' && always()
        uses: daun/playwright-report-comment@v3
        with:
          report-path: playwright-report/results.json
